<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>501 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>501 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

/* === Part 1: 課前字彙 & P3 詩作註解 & L1 ~ L65 課文講解 === */
const h1 = '<h2 id="p1">課前字彙、P3 詩作註解 ＆ L1 ~ L65 課文講解</h2>' +
  passage("Thinking Ahead 課前字彙與填空練習", [[
    ["字彙表：1. wrinkle-prone (adj. 容易起皺摺的) ｜ 2. nooks and crannies (n. 狹小的空間/洞/縫等) ｜ 3. bond (v. 聯繫；建立關係) ｜ 4. luggage (n. 行李 [U]) ｜ 5. knack (n. 技巧) ｜ 6. text (v. 傳訊息) ｜ 7. funeral (n. 葬禮) ｜ 8. wasted (adj. 被浪費的)", "課前核心字彙整理。"],
    ["I am an exhibition organizer. I have to travel all over Taiwan all year to design hundreds of exhibitions. It is important for me to pack my [[1|luggage]] efficiently.", "我是一名展覽策劃人。我必須全年走遍全台灣設計數百場展覽。對我來說，有效率地打包行李是很重要的。"],
    ["There is a [[2|knack]] to arranging everything in a small suitcase. For example, [[3|wrinkle-prone]] shirts must be placed on top of cotton things.", "把所有東西安排進一個小行李箱裡是有技巧（訣竅）的。例如，容易起皺摺的襯衫必須放在棉質衣物上方。"],
    ["Rolled socks can be tucked into [[4|nooks and crannies]]. In this way, there is no [[5|wasted]] space in my suitcase.", "捲起來的襪子可以塞進邊邊角角的狹小縫隙裡。如此一來，我的行李箱裡就不會有被浪費的空間。"]
  ]]) +
  passage("P3 原詩註解與例句 (左L4 ~ 右L13)", [[
    ["1. 左L4 make allowance for 將…列入考慮：My calculations make allowance for two paid employees.", "我的計算考慮了兩名帶薪僱員的費用。"],
    ["2. 左L6 deal in = be involved in / be interested in：As a scientist, I do not deal in speculation. / Lawrence is not a man who deals in rumors.", "作為一名科學家，我不從事猜測。／勞倫斯不是一個散佈謠言的人。"],
    ["3. 左L12 impostor n. 冒名頂替的人：He felt like an impostor among all those intelligent people, as if he had no right to be there.", "在那些聰明人當中，他覺得自己像個冒名頂替者，彷彿自己沒有權利待在那裡。"],
    ["4. 左L14 knave n. 騙子 (古字)", "原詩字彙註解。"],
    ["5. 左L16 stoop vi. 彎腰 vs. squat vi. 蹲：He stooped (down) to pick his wallet up. / He's beginning to stoop with age. / He squatted down beside the little girl.", "他彎腰撿起皮夾。／他年事漸高，背也開始變駝了。／他蹲在小女孩旁。"],
    ["6. 右L2 pitch-and-toss：一種玩家向某個標記投擲硬幣的遊戲，硬幣擊中最接近標記的人將所有硬幣拋向空中，並贏得所有正面朝下的硬幣。", "原詩文化背景註解。"],
    ["7. 右L5 nerve n. 勇氣；神經 ＆ 8. 右L5 sinew 肌腱：It takes a lot of nerve to report a colleague for sexual harassment.", "檢舉同事性騷擾需要很大的勇氣。"],
    ["9. 右L6 serve one’s turn 盡義務；完成任務：In a team project, each member has to serve their turn. For example, one person might be responsible for conducting research, another for creating the presentation, and another for coordinating the team's efforts.", "在團隊專案中，每個成員都必須盡自己的任務。例如，一個人可能負責進行研究，另一個人負責製作簡報，還有一個人負責協調團隊的工作。"],
    ["10. 右L10 common touch n. 平易近人的態度：He's made it to the top without losing the common touch.", "他爬到了顛峰，卻沒有失去平易近人的態度。"],
    ["11. 右L12 count with 對…很重要：You really count with me.", "你對我來說真的很重要。"],
    ["12. 右L13 unforgiving adj. 艱困的：The island is an unforgiving place in winter.", "這座島嶼在冬天是個嚴酷艱困的地方。"]
  ]]) + [
  card("L1", ["翻譯挑戰", "succeed in + V-ing"], "參考譯文",
    '<div class="stem"><div class="zh" style="color:inherit">14. 請翻譯這個句子：她已瘦身成功。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|She (has) succeeded in losing weight. / She (has) lost weight successfully.]]")+'</div></div>' +
    clue("注意：(X) <code>She succeeded to lose weight.</code>（<code>succeed</code> 必須搭配 <code>in + N / V-ing</code>，不可接不定詞 to VR！）。") +
    passage("14. L1 課文句子", [[
      ["Poems have the power to move us, inspire us, and guide us to do great things. “If—” succeeds in doing all three.", "詩歌有力量感動我們、激勵我們，並引導我們做出偉大的事。《如果——》成功做到了這三點。"]
    ]])
  ),

  card("L3", ["介系詞搭配", "advice on + 主題"], "D",
    st("Written by Rudyard Kipling, British Nobel Laureate in Literature, and first published in 1910, the poem contains advice from a father to his son [[L3|on]] living a good life.", "這首詩由英國諾貝爾文學獎得主魯德亞德・吉卜林所寫，並於 1910 年首次發表，內容包含一位父親給兒子關於過美好生活的忠告。") +
    clue("• <code>Written by...</code>（分詞構句 1，修飾 poem）與 <code>first published in 1910</code>（分詞構句 2，修飾 poem）。<br>• <code>advice ... on + N / V-ing</code>：介系詞 <code>on</code> 表「關於…主題」。") +
    ops([
      ["with", "7%", "和…一起。"],
      ["by", "6%", "藉著。"],
      ["for", "57%", "為了 + N / V-ing（常見誤答，表「關於某主題的建議」搭配 on）。"],
      ["on", "34%", "表主題（<code>advice on living a good life</code>）。"]
    ], "D") +
    passage("15. L3 & 16. L5 補充例句", [[
      ["I just attended an international conference on global warming.", "我剛參加了一場關於全球暖化的國際會議。"],
      ["16. L5 live/lead a(n) + adj. + life 過著⋯⋯的生活（常搭配 comfortable、good、simple、busy 等形容詞）", "課文片語整理。"]
    ]])
  ),

  card("L6", ["泛指代名詞", "one 一個人/任何人"], "D",
    st("The speaker brings up common circumstances [[L6|one]] may encounter in life and explains the best way to confront each of them.", "說話者提出了人在一生中可能會遭遇的常見境遇，並解釋面對每一種情況的最佳方式。") +
    clue("結構剖析：<code>common circumstances [(that/which) <b>one</b> may encounter in life]</code>。<br>關係代名詞受詞 <code>that/which</code> 已省略，後方關係子句缺的是「主詞」<code>one</code>（一個人／任何人，文雅用法）。") +
    ops([
      ["that", "61%", "常見誤答！若填關代受詞 that，後方的 <code>may encounter</code> 就沒有主詞了！"],
      ["those", "9%", "複數代名詞，语意不合。"],
      ["what", "12%", "前已有先行詞 circumstances，不可用 what。"],
      ["one", "18%", "泛指「一個人／任何人」，作關係子句 <code>(that/which) one may encounter</code> 的主詞。"]
    ], "D") +
    passage("18. L6 補充例句", [[
      ["brings up 提出 = raise, bring forth, put forth, put forward：The reporter raised some embarrassing questions that the singer refused to answer.", "記者提出了一些令那位歌手拒絕回答的尷尬問題。"]
    ]])
  ),

  card("L9", ["時間片語與時態搭配", "to this day 直到今天"], "A",
    st("“If—” was one of the twentieth century’s most beloved poems, and its words of wisdom remain relevant [[L9|to this day]].", "《如果——》是二十世紀最受喜愛的詩作之一，其智慧話語直到今天依然切合實際。") +
    clue("• <code>to this day</code> 直到現在（= until and including now，<b>常搭配現在簡單式</b>，如本句的 <code>remain</code>）。<br>• <code>so far = thus far, to date, up to now, (up) until now</code> 到目前為止（★概念：止 = 完成，<b>常搭配現在完成式</b>）。") +
    ops([
      ["to this day", "79%", "直到今天（搭配現在簡單式 remain）。"],
      ["so far", "9%", "到目前為止（常搭配現在完成式）。"],
      ["up to now", "11%", "到目前為止（常搭配現在完成式）。"],
      ["to date", "2%", "到目前為止（常搭配現在完成式）。"]
    ], "A") +
    passage("19. L9 & 20. L10 補充例句", [[
      ["To this day I don't know exactly what started the fight. / To this day, he denies any involvement in the crime.", "直到今天我仍不確切知道是什麼引發了那場爭吵。／直到今天，他仍否認涉入該起犯罪。"],
      ["To date, we have not received any replies.", "到目前為止，我們尚未收到任何回覆。"],
      ["20. L10 remain / retain / maintain / sustain 教學影片：https://youtu.be/O3CG1ua6Xl8", "四個「保持／維持」動詞辨析影片連結。"]
    ]])
  ),

  card("L11", ["保留連接詞之分詞構句", "when facing"], "A",
    st("The poem begins with advice regarding how to behave righteously [[L11|when facing]] unrighteousness.", "這首詩以關於在面對不義時應如何行為端正的建議作為開端。") +
    clue("• <code>when facing = when you face = (when) (you are) faced with = (when) (you are) in the face of</code><br>*主詞相同時可省略「連接詞 + 主詞 + be」；連接詞在語意有需要時可選擇保留。<br>• 勇敢面對問題：<code>face (up to) a problem</code><br>• 碰到問題：<code>[be faced with / face] a problem</code>（被動必須有 <code>with</code>！）<br>• 面對某人：<code>face sb</code>") +
    ops([
      ["when facing", "78%", "主動分詞片語 <code>when facing unrighteousness</code>。"],
      ["when faced", "5%", "缺少介系詞 <code>with</code>（應為 <code>when faced with</code>）。"],
      ["when you faced", "13%", "全段說明詩中普世建議用現在式，不用過去式 faced。"],
      ["faced", "3%", "缺少介系詞 <code>with</code>。"]
    ], "A") +
    passage("21. L11 ~ 24. L13 補充例句", [[
      ["I have grown up now and I have to face (up to) my responsibilities.", "我現在長大了，必須勇敢面對自己的責任。"],
      ["I was faced with the awful job of breaking the news to the girl's family.", "我面臨向女孩家人宣布這個壞消息的艱難工作。"],
      ["I don't know how I'm going to face her after what happened.", "事發之後我不知道該如何面對她。"],
      ["22. L11 regarding (介) 關於 = with/in regard to = considering = about：I asked the librarian for some tips regarding how to find the books that I was searching for.", "我向圖書館員詢問一些關於如何找到我正在尋找的書籍的訣竅。"],
      ["23. L13 steady = composed = poised 沉穩的", "同義字整理。"],
      ["24. L13 have faith in sb 對某人有信心 = have confidence in sb：The coach had faith in Roger and believed that he would finish first in the race.", "教練對羅傑有信心，相信他會在比賽中獲得第一名。"]
    ]])
  ),

  card("L12", ["形容詞字彙辨析", "constructive criticism 建設性的批評"], "B",
    st("When people are hostile toward you, remain calm and steady. Have faith in yourself when others blame or doubt you, but be receptive to [[L12|constructive]] criticism.", "當人們對你懷有敵意時，保持冷靜與沉穩。當別人責備或懷疑你時，要對自己有信心，但也要樂於接受具建設性的批評。") +
    clue("26. L15：<code>receptive = open</code>（願意接受的）。對於別人的責備或懷疑要有自信，但對於「有建設性的批評（constructive criticism）」則應開放接受。") +
    ops([
      ["bitter", "2%", "嚴厲的、尖酸刻薄的批評（bitter criticism）。"],
      ["constructive", "86%", "建設性的批評（constructive criticism）。"],
      ["hostile", "13%", "有敵意的批評（hostile criticism）。"],
      ["widespread", "0%", "廣泛的批評（widespread criticism）。"]
    ], "B") +
    passage("25. L12 選項補充例句", [[
      ["(A) The author's latest novel received bitter criticism from literary critics for its lack of originality.", "這位作家的最新小說因缺乏原創性而受到文學評論家的嚴厲批評。"],
      ["(B) The teacher provided constructive criticism to help the students improve their writing skills.", "老師提供了建設性的批評，幫助學生提升他們的寫作技巧。"],
      ["(C) The politician's proposal was met with hostile criticism from the opposing party, leading to a heated debate.", "這位政治家的提案遭到對立黨派有敵意的批評，引發了一場激烈的辯論。"],
      ["(D) The government's new policy faced widespread criticism from various sectors of society.", "政府的新政策受到社會各界的廣泛批評。"]
    ]])
  ),

  card("L15", ["對等連接詞與表語倒裝", "for 因為（補充說明理由）"], "C",
    st("No less important is the quality of patience, [[L15|for]] without it, the fruits of your labor may be lost.", "同樣重要的是耐心的特質，因為要是沒有耐心，你辛勤勞動的成果可能會付諸東流。") +
    clue("• 前半句為表語倒裝句，可還原為：<code>The quality of patience (S) is no less important (SC) …</code>。<br>• L16：<code>for</code>（對等連接詞） vs. <code>because, since, as</code>（從屬連接詞）：<br>【同】都指「因為」<br>【異】<code>for</code> 所引導的對等子句只能放在另一子句後面當作補充說明，且必須用逗號隔開。") +
    ops([

    passage("50. L45 選項補充例句", [[
      ["(A) Despite the challenges, she decided to stick with her original plan and pursue her dreams. / Despite the criticisms, the team decided to stick with their innovative approach and proved its effectiveness.", "儘管面臨挑戰，她決定堅持最初的計畫。／儘管受到批評，團隊決定堅持其創新做法並證明其有效性。"],
      ["(B) The book deals with complex social issues and offers insightful perspectives. / These ideas are dealt with more fully in Chapter Four.", "這本書探討了複雜的社會問題並提供深入觀點。／這些概念在第四章中會有更完整的探討。"],
      ["(C) All employees are required to comply with the company's code of conduct and ethical guidelines. / The building was designed to comply with the latest safety regulations and standards.", "所有員工都必須遵守公司的行為準則與道德規範。／這座建築的設計符合最新的安全法規與標準。"],
      ["(D) The small town had to contend with a sudden influx of tourists during the holiday season. / As a working parent, she constantly contends with the challenge of balancing her career and family responsibilities.", "小鎮在假期間不得不應付突然湧入的遊客。／身為職業父母，她經常得面對平衡事業與家庭責任的挑戰。"]
    ]])
  ),

  card("L46", ["字彙與動詞辨析", "common people / retain + O"], "A, A",
    st("As the speaker says, associate with people from all walks of life, from kings to [[L46-1|common]] people, but [[L46-2|retain]] a balanced world view in all your interactions.", "正如說話者所言，要與各行各業的人交往，從國王到平民百姓，但在所有互動中都要保持平衡的世界觀。") +
    clue("• 第 1 空：與貴族國王（kings）相對的「平民、庶民（非貴族）」稱為 <code>common people / commoners</code>（呼應原詩的 <i>lose the common touch</i>）。<br>• 第 2 空：空格後有受詞名詞片語 <code>a balanced world view</code>！<br><code>remain</code> 是連綴動詞（Vi.），後接形容詞補語；<code>retain</code> 才是及物動詞（Vt.），後接名詞受詞！") +
    ops([
      ["(1) common / (2) retain", "40% / 53%", "<code>common people</code> 平民（非貴族）；<code>retain + O</code> 保有、保持（平衡的世界觀）。"],
      ["(1) ordinary / (2) remain", "27% / 43%", "ordinary people 指平凡人（無特殊能力者）；remain 為不及物連綴動詞，不可直接接 a balanced world view 作受詞。"],
      ["(1) normal / (2) restrain", "20% / 3%", "normal people 指正常人（無異常或畸形）；restrain 表限制、制止。"],
      ["(1) average / (2) refrain", "13% / 0%", "the average person/people 指一般水準的人；refrain 表克制不做（搭配 from）。"]
    ], "A") +
    passage("53. & 54. L46 補充例句", [[
      ["(A) retain (保留/保持)：It is important to retain important documents for future reference. / The company implemented strategies to retain its top talent and reduce employee turnover.", "保留重要文件供日後參考是很重要的。／公司實施策略以留住頂尖人才並降低員工流失率。"],
      ["(B) remain (保持/繼續)：Despite the challenges, she remained determined to achieve her goals. / The company remained competitive in the market by continuously innovating its products.", "儘管面臨挑戰，她依然堅定追求目標。／公司透過持續創新產品在市場上保持競爭力。"],
      ["(C) restrain (限制/抑制)：The police officer used handcuffs to restrain the suspect and prevent escape.", "警官使用手銬來制伏嫌犯並防止逃跑。"],
      ["(D) refrain (避免/克制)：Please refrain from using your cell phones during the movie. / He refrained from making any comments until he had more information.", "請避免在電影放映期間使用手機。／在獲得更多資訊之前，他克制住不發表任何評論。"],
      ["54. L46 associate with sb. 和…結交、來往：Most of the people whom Kevin associates with are celebrities or politicians.", "凱文交往的對象大多是名人或政客。"]
    ]])
  ),

  card("L49", ["不定代名詞辨析", "not ... by either (兩者任一)"], "D",
    st("You will unavoidably encounter both friends and foes in life, but avoid being overly hurt or influenced by [[L49|either]].", "你在人生中難免會遇到朋友與敵人，但要避免受到這兩者中任何一方的過度傷害或影響。") +
    clue("前面提到「朋友與敵人（both friends and foes）」共兩方，且動詞 <code>avoid</code> 本身已帶有否定意味（「避免被…影響」），故用 <code>either</code>（= either friends or foes，兩者中的任何一方）。") +
    ops([
      ["that", "0%", "單數代名詞，不合語意。"],
      ["those", "47%", "常見誤答！those 作代名詞時後面通常必須接修飾語（關係子句、介片或分詞），不能單獨放在句尾代替 friends and foes。"],
      ["neither", "7%", "avoid 已有否定意思，若再用 neither 會造成雙重否定。"],
      ["either", "47%", "指 <code>friends and foes</code> 兩者中的任何一方。"]
    ], "D")
  ),

  card("L52", ["否定對等連接詞倒裝", ", nor does it... 也不…"], "D",
    st("In addition, keep in mind that time is precious. It doesn’t wait for anyone, [[L52|nor]] does it give anyone a second chance.", "此外，要謹記時間是寶貴的。它不等待任何人，也不會給任何人第二次機會。") +
    clue("前句為否定句 <code>It doesn't wait for anyone</code>，逗號後接倒裝結構 <code>___ does it give...</code>，唯一能當連接詞直接連接兩句並觸發後方否定倒裝的是對等連接詞 <code>nor</code>（也不…）。") +
    ops([
      ["or", "13%", "or 後方不倒裝。"],
      ["not until", "3%", "直到…才…（語意不合且非對等連接詞）。"],
      ["only", "6%", "副詞，無法連接兩個獨立子句。"],
      ["nor", "78%", "對等連接詞「也不…」，後接倒裝句 <code>nor does it give...</code>。"]
    ], "D") +
    passage("56. L52 ~ 58. L55 課文與補充例句", [[
      ["Norman doesn’t like going shopping with his girlfriend, nor does Jack.", "諾曼不喜歡陪女朋友逛街，傑克也是。"],
      ["ambiguous adj. 語意模糊的（雙關歧義句）：He killed the man with a cane.", "他用拐杖殺了那個男人 ／ 他殺了那個拿拐杖的男人。"],
      ["57. L54 All of this advice, from the poem’s start to its finish, is presented in the form of conditions, or “ifs.”", "從這首詩的開頭到結尾，所有這些忠告都是以條件句（亦即「如果」）的形式呈現。"],
      ["advise vt. 建議 vs. advice n. [U] 建議（不可數）：Evans advised him to leave London. / Let me give you a piece/word of advice. Wear a blue suit to the interview. / He [[|took / followed]] my advice and sold the house. ((X) listen to / accept)", "伊凡斯建議他離開倫敦。／讓我給你一個忠告：穿藍色西裝去面試。／他採納了我的建議把房子賣了。"],
      ["58. L55 in the form of... 以…的形式：The witch appeared in the form of a beautiful woman, trying to seduce the prince.", "女巫以美女的模樣出現，試圖誘惑王子。"]
    ]])
  ),

  card("L56", ["句型搭配", "not ... until 直到…才…"], "B",
    st("The poet doesn’t mention the result of following these conditions [[L56|until]] the final two lines, revealing that if you fulfill all of these conditions, you will become a man and the world will be in your hands.", "詩人直到最後兩行才提到遵循這些條件的結果，揭示了如果你達成所有這些條件，你就會成為一個真正的男人，而且整個世界都將掌握在你手中。") +
    clue("與前面的否定動詞 <code>doesn’t mention</code> 構成 <code>not … until …</code>（直到最後兩行才提到…）。") +
    ops([
      ["despite", "8%", "儘管。"],
      ["until", "81%", "<code>not ... until</code> 直到…才…。"],
      ["regardless of", "11%", "不管；不顧。"],
      ["due to", "0%", "因為。"]
    ], "B") +
    passage("60. L61 補充例句", [[
      ["the key to + N / V-ing（某事的關鍵，注意 to 為介系詞！）：Working well as a team is the key to success. / The missing guy probably holds the key to solving the crime.", "良好的團隊合作是成功的關鍵。／那名失蹤男子可能握有破案的關鍵。"]
    ]])
  ),

  card("L61", ["字彙與複合關代", "celebrated (被歌頌的) / what (所重視的)"], "D, C",
    st("In “If—,” Kipling lays out all of the qualities that are key to living a successful life. Instead of the qualities that are typically [[L61-1|celebrated]] in society—power, wealth, fame, and physical strength, [[L61-2|what]] Kipling values are virtues such as integrity, composure, humility, perseverance, and moderation.", "在《如果——》中，吉卜林列出了過成功生活所需的關鍵特質。吉卜林所重視的不是社會上通常歌頌推崇的特質——權力、財富、名聲與體力，而是正直、沉著、謙遜、毅力與中庸節制等美德。") +
    clue("• 第 1 空：權力、財富、名聲是社會上通常被「歌頌、推崇、讚揚（celebrated）」的特質。<br>• 第 2 空：前半部 <code>Instead of the qualities...</code> 只是介系詞片語（不能當主詞！），逗號後面才是主要子句，主要動詞是 <code>are</code>，故需要複合關係代名詞 <code>what</code>（= the things/qualities that）引導名詞子句 <code>what Kipling values</code> 當整句的主詞，同時當及物動詞 <code>values</code> 的受詞！") +
    ops([
      ["(1) distributed / (2) which", "0% / 23%", "distributed 分配；若選 which 會變成形容詞子句，導致整句話沒有主詞！"],
      ["(1) committed / (2) those", "18% / 18%", "committed 犯（罪）；those 不是連接詞，後面不能直接接 Kipling values（除非寫 those which Kipling values）。"],
      ["(1) generated / (2) in which", "39% / 7%", "generated 產生；in which 後接完整子句，但 values 缺受詞。"],
      ["(1) celebrated / (2) what", "18% / 52%", "<code>celebrated</code>（被歌頌讚揚的，如 <i>His songs celebrate the joys of love.</i>）；<code>what Kipling values</code>（吉卜林所重視的事物）。"]
    ], "DC")
  ),

  card("L65", ["複合關係代名詞與被動搭配", "whoever / though / regarded as"], "C, B, B",
    st("These values reveal why “If—” resonates with [[L65-1|whoever]] reads it and, [[L65-2|though]] over a century old, is [[L65-3|regarded]] as timeless to this day.", "這些價值觀揭示了為什麼《如果——》能與任何閱讀它的人產生共鳴，而且儘管已超過一個世紀之久，直到今天仍被視為永恆不朽。") +
    clue("• 第 1 空：主格或受格的判斷是看「後方子句結構」，而非空格前的介系詞 <code>with</code>！因為後方動詞 <code>reads it</code> 缺「主詞」，故必須用主格的 <code>whoever</code>（= anyone who reads it）。<br>• 第 2 空：原句為 <code>though (the poem is) over a century old</code>，省略主詞與 be 動詞後留下形容詞片語，連接詞用 <code>though</code>（介系詞 despite 後只能接名詞，不能接形容詞 old！）。<br>• 第 3 空：空格後有介系詞 <code>as</code>（<code>is ___ as timeless</code>），四個選項中直接搭配 <code>as</code> 的是 <code>regarded as</code>（considered 不加 as；thought 須加 of as；looked 須加 on/upon as）。") +
    ops([
      ["(1) whatever / (2) despite / (3) considered", "7% / 45% / 42%", "whatever 指事物；despite 為介系詞不可接形容詞 old；considered 不搭配 as。"],
      ["(1) whomever / (2) though / (3) regarded", "26% / 45% / 42%", "(1) whomever 為受格，不能當 reads 的主詞；(2) though 與 (3) regarded (as) 正確。"],
      ["(1) whoever / (2) thus / (3) thought", "63% / 9% / 8%", "(1) whoever（正確）；thus 為副詞；thought 少 of。"],
      ["(1) whichever / (2) however / (3) looked", "4% / 2% / 8%", "whichever 用於特定範圍選擇；looked 少 on/upon。"]
    ], "CBB")
  )
].join('');

/* === Part 2: 句型與翻譯練習 === */
const h2 = '<h2 id="p2">課本句型與翻譯練習 (Whoever / Whatever / Whichever)</h2>' +
  passage("句型觀念：複合關係代名詞引導「名詞子句」vs.「讓步副詞子句」", [[
    ["【名詞子句】Whoever (= Anyone who) violates the traffic regulation will be fined.", "任何違反交通規則的人都將被罰款。"],
    ["【名詞子句】Mia doesn’t believe whatever (= anything that) the politician says.", "米婭不相信那個政客說的任何話。"],
    ["【名詞子句】Choose whichever of the T-shirts (= any of the T-shirts that) suits you best. They come in several sizes.", "選擇這些 T 恤中最適合你的任何一件。它們有好幾種尺寸。（whichever 用於前有先提到特定範圍的多個人事物）"],
    ["【名詞子句】Rachel: Do you want tea or coffee? Monica: I don't mind. Whichever one you're making is fine.", "瑞秋：妳要茶還是咖啡？ 莫妮卡：我不介意，妳泡哪一種都可以。"],
    ["【比較：讓步副詞子句 (Wh-ever = No matter wh-)】Whatever (= No matter what) happens, I’ll always stand by your side.", "無論發生什麼事，我都會一直站在你這邊。"],
    ["【讓步副詞子句】Whoever (= No matter who) wins a gold medal in the Olympics, he or she will be regarded as the pride of his/her own country.", "無論是誰在奧運中贏得金牌，他或她都會被視為自己國家的驕傲。"]
  ]]) + [
  card("句型-1", ["複合關代", "Whoever (= Anyone who)"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">1. 任何沒有入境簽證的人都不被允許造訪這個國家。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Whoever has no entry visa is not allowed to visit this country.]]")+'</div></div>' + clue("<code>Whoever</code> 引導名詞子句當整句主詞，視為單數，搭配單數動詞 <code>has</code> 與 <code>is</code>。")),
  card("句型-2", ["複合關代", "whatever / what is on one's mind"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">2. Tina 會告訴她最好的朋友她心裡所想的任何事。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Tina tells her best friend whatever / what is on her mind.]]")+'</div></div>' + clue("<code>whatever / what is on her mind</code> 作 <code>tells</code> 的直接受詞。")),
  card("句型-3", ["複合關代", "Whichever + N"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">3. 你走的任何一條路都會帶你到中央車站。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Whichever road you take will lead you to the central station.]]")+'</div></div>' + clue("<code>Whichever road you take</code> 引導名詞子句當 <code>will lead</code> 的主詞。")),
  card("句型-4", ["複合關代", "eat whatever she wants"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">4. Lucy 不能想吃什麼就吃什麼，因為她正在節食。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Lucy can’t just eat whatever she wants, for she is on a diet.]]")+'</div></div>' + clue("<code>whatever she wants</code>（= anything that she wants）作 <code>eat</code> 的受詞。")),
  card("句型-5", ["複合關代", "Whichever country"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">5. 任何率先引爆原子彈的國家都將引發另一場世界大戰。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Whichever country explodes an atomic bomb first will trigger another world war.]]")+'</div></div>' + clue("在眾多國家之中「無論哪一個率先引爆原子彈的國家」，用 <code>Whichever country...</code> 當主詞。")),
  card("句型-6", ["複合關代", "Whoever wants to apply for..."], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">6. 任何想應徵這份工作的人都應該至少擁有碩士學位。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Whoever wants to apply for this job should have at least a master’s degree.]]")+'</div></div>' + clue("<code>Whoever</code>（= Anyone who）當主詞，接單數動詞 <code>wants</code>。")),
  card("句型-7", ["複合關代", "whatever + N + S + V"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">7. 那位勤奮的學生竭盡所能完成老師交派給他的任何作業。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|The diligent student did everything he could to finish whatever assignment the teacher gave him.]]")+'</div></div>' + clue("<code>whatever assignment the teacher gave him</code>（= any assignment that the teacher gave him）。"))
].join('');

document.getElementById('app').innerHTML = h1 + h2;
const secs=[['p1','P3 註解 & L1~L65 課文講解'],['p2','句型與翻譯練習']];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){open=!open;document.querySelectorAll('details.q').forEach(d=>d.open=open);this.textContent=open?'全部收合':'全部展開';};
</script>
