<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>

<body>
<div class="top">
  <h1>空中美語 英文字彙字識+ Levels 3&4 複習卷 (第二十四回) Chapter 8-3</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 第一大題：I. Multiple Choice (40%) ===
const sec1 = [
  [
    "I-1",
    ["考點：複合名詞搭配＋生日禮物情境", "詞性需求：單數名詞（作定語修飾 necklace）"],
    "(B) pearl",
    ["For her birthday, Mr. Smith gave his wife a beautiful [[1|pearl]] necklace.", "為了慶祝她的生日，史密斯先生送給他太太一條美麗的珍珠項鍊。"],
    "空格位於形容詞 <b>beautiful</b> 與核心名詞 <b>necklace</b>（項鍊）之間，需填入能作為飾品材質的名詞來構成複合名詞。結合前文「送給太太的生日禮物（For her birthday, Mr. Smith gave his wife...）」，只有 <b>pearl</b>（珍珠）能與 necklace 搭配成合理的珠寶首飾「pearl necklace（珍珠項鍊）」。",
    [
      ["hydrogen", "n. [U] 氫", "語意不合。氫是無色無味的化學氣體，無法用來串成實體項鍊。<br><b>何時才對：</b>討論化學元素、水分子結構或潔淨能源時，例如：<i>Water is composed of hydrogen and oxygen.</i>（水是由氫和氧組成的。）"],
      ["pearl", "n. [C] 珍珠", "語意與搭配完全正確。<b>a pearl necklace</b> 為常見複合名詞，指「珍珠項鍊」，符合生日贈禮的語境。"],
      ["oxygen", "n. [U] 氧氣", "語意不合。氧氣為維持生命的氣體，不能作為珠寶首飾的材質。<br><b>何時才對：</b>描述呼吸、醫療急救或大氣成分時，例如：<i>Climbers on Mount Everest often need to carry oxygen tanks.</i>（聖母峰的登山客通常需要攜帶氧氣筒。）"],
      ["pest", "n. [C] 害蟲；討厭的人", "語意矛盾。害蟲令人厭惡，不可能做成「美麗的項鍊（a beautiful necklace）」當作生日禮物。<br><b>何時才對：</b>描述農作物蟲害或居家害蟲時，例如：<i>Farmers use natural methods to get rid of garden pests.</i>（農夫使用自然方法來消滅菜園裡的害蟲。）"]
    ]
  ],
  [
    "I-2",
    ["考點：名詞字義辨析＋因果關係推理", "詞性需求：單數可數名詞"],
    "(D) pest",
    ["If Philip doesn't stop being such a [[2|pest]], I believe his sister is going to hit him.", "如果菲利普再不停止當個這麼討人厭的傢伙，我相信他姊姊就要揍他了。"],
    "主要子句指出「他姊姊就要揍他了（his sister is going to hit him）」，且條件子句使用結構 <b>stop being such a + 單數名詞</b>，代表 Philip 的行為舉止非常煩人、令人惱火。<b>pest</b> 除了指「害蟲」，在日常口語中常指「胡鬧、愛糾纏、討厭的人（尤指愛煩人的小孩）」，完全契合把姊姊惹毛的語境。",
    [
      ["plum", "n. [C] 李子；梅子", "語意不合。李子是水果，無法用來形容一個人惹人生氣的煩人行徑。<br><b>何時才對：</b>描述食用水果或製作果醬時，例如：<i>She picked a ripe, juicy plum from the tree.</i>（她從樹上摘了一顆成熟多汁的李子。）"],
      ["pea", "n. [C] 豌豆", "語意不合。豌豆是蔬菜豆類，不能代入「being such a...」來解釋為何姊姊想揍他。<br><b>何時才對：</b>描述食材或使用慣用語「as like as two peas in a pod（一模一樣）」時，例如：<i>The twin brothers are like two peas in a pod.</i>（這對雙胞胎兄弟長得一模一樣。）"],
      ["pine", "n. [C] 松樹", "語意不合。松樹為植物名稱，人不可能「表現得像一棵松樹」而招致挨打。<br><b>何時才對：</b>描述森林植被或針葉樹時，例如：<i>The mountain trail is surrounded by tall pine trees.</i>（這條山間步道被高大的松樹環繞。）"],
      ["pest", "n. [C] 討厭的人；害蟲", "語意正確。口語中 <b>be a pest</b> 指「表現得很煩人、愛搗蛋惹事」，正好構成姊姊想揍他的合理原因。"]
    ]
  ],
  [
    "I-3",
    ["考點：動物身體部位詞彙＋比喻線索", "詞性需求：複數可數名詞"],
    "(A) paws",
    ["Linda trained her dog to hold out its [[3|paws]]; it almost looks like the dog wants to shake her hand.", "琳達訓練她的狗伸出腳掌；看起來簡直就像狗狗想跟她握手一樣。"],
    "題幹主詞與受詞為 <b>her dog</b>（她的狗），動作為 <b>hold out its ___</b>（伸出牠的……），分號後更直接給出具體畫面：「看起來簡直就像想跟她握手（wants to shake her hand）」。有爪墊的四足動物（如狗、貓、熊）的「腳掌、爪子」稱為 <b>paw</b>。",
    [
      ["paws", "n. [C] （動物的）腳掌、爪子（複數）", "語意完全正確。狗伸出前腳掌（hold out its paws）正是訓練狗狗「握手（shake hands）」的招牌動作。"],
      ["stems", "n. [C] （植物）莖、梗（複數）", "語意不合。stem 是植物構造，小狗身上沒有莖。<br><b>何時才對：</b>描述花草的莖部時，例如：<i>She cut the rose stems at an angle before putting them in the vase.</i>（她在把玫瑰放進花瓶前，先將花莖斜剪。）"],
      ["twigs", "n. [C] 細枝、嫩枝（複數）", "語意不合。twig 是樹木末端的細小樹枝，並非狗的身體部位。<br><b>何時才對：</b>描述鳥類築巢或撿拾柴火時，例如：<i>The birds gathered dry twigs to build their nest.</i>（鳥兒收集乾細枝來築巢。）"],
      ["sparks", "n. [C] 火花、火星（複數）", "語意不合。狗不會從身上伸出「火花」來跟人握手。<br><b>何時才對：</b>描述火苗、電流或摩擦產生的火花時，例如：<i>Bright sparks flew from the campfire into the night sky.</i>（明亮的火花從營火中飛向夜空。）"]
    ]
  ],
  [
    "I-4",
    ["考點：動物習性與特徵辨析", "詞性需求：複數可數名詞"],
    "(C) swans",
    ["As we rowed the boat on the pond, we saw beautiful white [[4|swans]] swimming all around us.", "當我們在池塘上划船時，我們看見美麗的白天鵝在我們四周游水。"],
    "句中提供三個關鍵環境與動作線索：地點在 <b>on the pond</b>（在池塘上），外觀特徵是 <b>beautiful white</b>（美麗潔白的），且正在進行的動作是分詞 <b>swimming all around us</b>（在我們四周游水）。四個選項中只有水禽類的「天鵝（swans）」具備潔白羽毛且會在池塘水面優雅游動。",
    [
      ["parrots", "n. [C] 鸚鵡（複數）", "語意不合。鸚鵡通常是色彩鮮豔的熱帶陸禽，棲息於樹上且不會在池塘裡游泳。<br><b>何時才對：</b>描述羽毛鮮豔或會模仿人類說話的鳥類時，例如：<i>The colorful parrot can mimic human speech.</i>（這隻五彩繽紛的鸚鵡會模仿人類說話。）"],
      ["pigeons", "n. [C] 鴿子（複數）", "語意不合。鴿子屬於陸禽，常出現在廣場或屋頂覓食，不會在水面上游泳。<br><b>何時才對：</b>描述公園廣場上的鳥群或信鴿時，例如：<i>People were feeding crumbs to the pigeons in the city square.</i>（人們在城市廣場上拿麵包屑餵鴿子。）"],
      ["swans", "n. [C] 天鵝（複數）", "語意正確。天鵝為大型白色水鳥，常棲息於池塘或湖泊中游水，完全符合 pond、white 與 swimming 的描述。"],
      ["squirrels", "n. [C] 松鼠（複數）", "語意不合。松鼠是樹棲哺乳動物，多為棕灰色，主要在樹林間跳躍並收集堅果，不會成群在池塘游水。<br><b>何時才對：</b>描述在樹上攀爬或儲藏橡實的小動物時，例如：<i>Squirrels hide acorns in the ground to prepare for winter.</i>（松鼠把橡實藏在地底下以準備過冬。）"]
    ]
  ],
  [
    "I-5",
    ["考點：自然與園藝詞彙＋因果推論", "詞性需求：複數名詞"],
    "(B) weeds",
    ["Tom hasn't been looking after his garden, and now it's full of [[5|weeds]].", "湯姆一直沒有照料他的花園，現在裡面長滿了雜草。"],
    "前半句指出原因「Tom 一直沒有照料他的花園（hasn't been looking after his garden）」，後半句 <b>now it's full of ___</b>（現在裡面充滿了……）即為疏於整理花園的自然結果。花園無人除草照料時，必然會「長滿雜草（full of weeds）」。",
    [
      ["slopes", "n. [C] 斜坡、山坡（複數）", "語意不合。斜坡是地形特徵，不會因為沒照顧花園就自己「長滿斜坡」。<br><b>何時才對：</b>描述滑雪道或山坡地形時，例如：<i>The skiers glided smoothly down the snowy slopes.</i>（滑雪者順暢地滑下白雪皚皚的斜坡。）"],
      ["weeds", "n. [C] 雜草、野草（複數）", "語意完全正確。花園荒廢未整理時，野生雜草便會叢生，<b>be full of weeds</b>（長滿雜草）為極道地的園藝描述。"],
      ["pines", "n. [C] 松樹（複數）", "語意不合。松樹是大型喬木，需要漫長歲月生長，不可能因為一陣子沒整理花園就突然長滿松樹。<br><b>何時才對：</b>描述高山針葉林景觀時，例如：<i>The cabin is hidden deep among the tall pines.</i>（小木屋隱身在高聳的松樹林深處。）"],
      ["twigs", "n. [C] 細枝（複數）", "語意不精確。疏於照料花園最典型的狀態是野草叢生（weeds），而非無故長滿細枝。<br><b>何時才對：</b>描述暴風雨過後地面散落枯枝，或撿樹枝生火時，例如：<i>We collected dry twigs to start a fire.</i>（我們收集乾樹枝來生火。）"]
    ]
  ],
  [
    "I-6",
    ["考點：科學與自然名詞辨析", "詞性需求：單數可數名詞"],
    "(C) phenomenon",
    ["Some scientists say that climate change is just a natural [[6|phenomenon]].", "有些科學家說氣候變遷只是一種自然現象。"],
    "名詞子句的主詞是 <b>climate change</b>（氣候變遷），連綴動詞 <b>is</b> 後方接補語 <b>a natural ___</b>（一種自然的……）。能用來歸類「氣候變遷」這類宏觀環境變化的上位概念名詞，即為 <b>phenomenon</b>（現象），構成固定搭配 <b>a natural phenomenon</b>（自然現象）。",
    [
      ["trunk", "n. [C] 樹幹；象鼻；後車廂", "語意不合。氣候變遷是宏觀氣候趨勢，不是一棵樹的樹幹。<br><b>何時才對：</b>描述大樹的主幹、大象鼻子或汽車行李廂時，例如：<i>The trunk of this ancient oak tree is hollow inside.</i>（這棵古老橡樹的樹幹內部是中空的。）"],
      ["waterfall", "n. [C] 瀑布", "語意不合。氣候變遷並非具體的瀑布地貌。<br><b>何時才對：</b>描述溪流從高處傾瀉而下的自然景觀時，例如：<i>We hiked through the forest to see the famous waterfall.</i>（我們健行穿過森林去看那座著名的瀑布。）"],
      ["phenomenon", "n. [C] 現象（複數為 phenomena）", "語意與搭配完全正確。<b>a natural phenomenon</b> 指「自然現象」，常用於科學語境中描述氣候、天文或物理變化。"],
      ["reflection", "n. [C] 倒影；反射；深思", "語意不合。氣候變遷不是水面或鏡子裡的「倒影」。<br><b>何時才對：</b>描述水面映照出的影像或內心省思時，例如：<i>The dog barked at its own reflection in the mirror.</i>（那隻狗對著鏡子裡自己的倒影吠叫。）"]
    ]
  ],
  [
    "I-7",
    ["考點：海洋生物語境＋單複數同形名詞", "詞性需求：複數可數名詞（受 several new 修飾）"],
