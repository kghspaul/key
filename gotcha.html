<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nice Try!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 20px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }
    .avatar {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #f0f0f0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 1.8rem;
      color: #2c3e50;
      margin-bottom: 12px;
      font-weight: 800;
    }
    p {
      color: #666;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background-color: #3498db;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 50px;
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background-color: #2980b9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="caught.png" alt="What do you think you're doing?" class="avatar" />
    <h1>What do you think you're doing? 🤔</h1>
    <p>
      The exam hasn't started yet!<br>
      No peeking at the answer key. Go back and study!
    </p>
    <button class="btn" onclick="history.back()">Go Back</button>
  </div>
</body>
</html>
