<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>407 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>407 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}
const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'&lt;/div&gt;&lt;div class=&quot;zh&quot;&gt;'+zh+'&lt;/div&gt;&lt;/div&gt;';

let h = '';

h += '<h2 id="p1">課文與重點解析</h2>';

h += card("挑戰題1", ["複合形容詞", "N-adj. / N-p.p."], "B",
  '<div class="stem"><div class="en">Iceland is a small island nation known for its breathtaking landscapes, boiling mud pools, and stunning views of the northern lights. But how many people know that this country, with fewer than 400,000 people, is also home to the world’s most '+fx("[[挑戰題1|gender-balanced]]")+' society?</div><div class="zh">冰島是一個以令人嘆為觀止的風景、沸騰的泥漿池和迷人的北極光景色而聞名的小島國。但是有多少人知道，這個人口不到四十萬的國家，也是世界上性別最平權（均衡）社會的所在地？</div></div>' +
  clue('gender-balanced society = society (which is) balanced between genders<br>N-p.p. = p.p. + 介 + N / N-adj. = adj. + 介 + N<br>balanced adj. 均衡的；平衡的<br>be balanced between 在…之間是保持平衡的<br>① To achieve greatness, one must be balanced between ambition that drives us forward and contentment that allows us to appreciate the journey.<br>balance (Vi.) between 在…之間取得平衡 = strike a balance (N.) between<br>② Don’t let stress overwhelm you; strike a balance between studying hard and making time for things that light up your soul.<br>例句參考翻譯<br>①要達到卓越，我們必須在推動我們前進的雄心與讓我們欣賞旅程的滿足感之間取得平衡。<br>②別讓壓力擊垮你，在認真讀書與留時間給讓心靈發光的事物之間找到平衡吧！') +
  ops([
    ["gender-balancing", "34%", ""],
    ["gender-balanced", "62%", ""],
    ["balance-gendered", "2%", ""],
    ["balancing-gender", "1%", ""]
  ], "B")
);

h += passage("L1-補充", [
  [["be known for 以⋯⋯聞名 = be famous/well-known/noted/celebrated/renowned for", "Germany is known for advanced technology.<br>*known for...lights為形容詞子句which is known for...lights簡化而來的過去分詞片語，修飾a small island nation。"]]
]);

h += passage("L4-補充", [
  [["be home to 是…的所在地", "The village is home to a well-known World Heritage Site."]]
]);

h += card("L5", ["介系詞", "for + 一段時間"], "C",
  '<div class="stem"><div class="en">'+fx("[[L5|For]]")+' the last decade, Iceland has ranked number one on the World Economic Forum\'s Global Gender Gap Index.</div><div class="zh">過去十年來，冰島在世界經濟論壇的「全球性別差距指數」中一直排名第一。</div></div>' +
  clue('for + (the last/past) + 一段時間 (常與完成式連用)，表「過去一段時間以來」。此處用現在完成式表示冰島在全球性別差距指數上排名第一是10年來「一直持續的狀態」。<br>Smartphones have advanced at a stunning pace for the past few years.<br>be ranked/rank number one, two, etc. 排行第…<br>ranked vi. / vt. 排名') +
  ops([
    ["Within", "24%", ""],
    ["By", "20%", ""],
    ["For", "52%", ""],
    ["Upon", "4%", ""]
  ], "C")
);

h += passage("數據素養與批判性思考", [
  [["Taiwan ranked 27th in 2025 World Happiness Report.", "排名27，你覺得台灣人算是快樂的嗎？"]],
  [["Taiwan ranked 27th in 2025 World Happiness Report. This made it the third-happiest place in Asia ...", "猜猜看亞洲最快樂的兩個國家是？"]],
  [["Taiwan ranked 27th in 2025 World Happiness Report. This made it the third-happiest place in Asia, following Israel at No. 8 and the United Arab Emirates at No. 21.", "看到這個數據你想到的是……？"]],
  [["Taiwan ranked 27th in 2025 World Happiness Report. This made it the third-happiest place in Asia, coming first in East Asia, surpassing Singapore, Japan, South Korea and China.", "再重想一次，你覺得台灣人算是快樂的嗎？"]],
  [["數據素養：同樣的數據可以有多種解讀方式，關鍵在於提供什麼樣的背景和比較基準。", "批判性思考：學習質疑資料的呈現方式，思考「作者的意圖是中立，還是想帶風向？」<br>排名27，台灣根本是鬼島，活在這裡太痛苦了😫<br>東亞排名第一，勝過新、日、韓、中，台灣人真的好幸福😍"]]
]);

h += card("挑戰題", ["關係副詞"], "C",
  '<div class="stem"><div class="en">The path to equality began on October 24, 1975, '+fx("[[挑戰題|when]]")+' 90% of the female population participated in the “Women’s Day Off” to protest against wage inequality and other gender-related social injustices.</div><div class="zh">通往平權的道路始於 1975 年 10 月 24 日，在這一天，90% 的女性人口參與了「女性休假日」，以抗議薪資不平等和其他與性別相關的社會不公。</div></div>' +
  clue('when (X) 當… (O) 而在這一天 = on which = and/because on this day<br>*關係副詞when引導形容詞子句<br>*補充說明在October 24, 1975這一天發生的事<br>*October 24, 1975是特定時間，故使用非限定用法(須加逗號)') +
  ops([
    ["while", "10%", "而/雖然"],
    ["in which", "15%", "→ on which"],
    ["when", "62%", ""],
    ["as", "13%", "因為/當"]
  ], "C")
);

h += passage("L10-補充", [
  [["protest against 抗議", "The strikers are protesting against an unreasonable pay cut."]],
  [["想想看 gender-related social injustices 可以怎麼改寫：", "gender-related injustices = injustices which are related to gender (N-p.p. = p.p. + 介 + N)"]]
]);

h += card("L11", ["片語辨析", "instead of"], "D",
  '<div class="stem"><div class="en">That day, '+fx("[[L11|instead of]]")+' going to work, cooking meals, looking after children, or doing domestic chores, Icelandic women hoping for change took to the streets in protest.</div><div class="zh">那一天，渴望改變的冰島女性沒有去上班、煮飯、照顧孩子或做家事，而是走上街頭抗議。</div></div>' +
  clue('L13自 hoping for change = who hoped for change (修飾Icelandic women)<br>L14 in protest (at/against…) 為了抗議(…) / 以表達(對…的)抗議。She resigned in protest against the company\'s unfair policies.<br>in + N 常指「作為(某種應對方式)」：in response (to …) 作為(對…的)回應 / in reply (to …) 作為(對…的)回覆 / in return (for …) 作為(對…的)回報 / in exchange (for …) 作為(對…的)交換') +
  ops([
    ["other than", "5%", "= besides / except"],
    ["in addition to", "23%", "= besides (包含)"],
    ["except for", "7%", "≒ except (不包含)"],
    ["instead of", "65%", "沒做…而做…"]
  ], "D")
);

h += card("L14", ["動詞片語", "go on strike 罷工"], "B",
  '<div class="stem"><div class="en">With the majority of women '+fx("[[L14|going on strike]]")+', the country fell into complete chaos.</div><div class="zh">隨著大多數女性罷工，整個國家陷入了完全的混亂。</div></div>' +
  clue('*with + O + OC用來補充額外的資訊，可放句首或句尾<br>*受詞補語可以是V-ing、p.p.、形容詞、介系詞片語。Please do not talk with your mouth full of food.') +
  ops([
    ["going out of business", "17%", "(倒閉) = go under. The small bookstore is going out of business due to the competition from online retailers."],
    ["going on strike", "74%", "(罷工) The factory workers went on strike to protest against the company's decision to cut their wages."],
    ["going with the flow", "3%", "(順其自然/順應時勢) I don't like to make plans. I prefer to just go with the flow and see what happens."],
    ["going beyond expectations", "6%", "(超出預期) The new employee's performance has gone beyond expectations and he has already been promoted to a higher position."]
  ], "B")
);

h += passage("L15-補充", [
  [["be in + N 處於某狀態 / fall into + N 變成某狀態", "be in chaos (處於混亂狀態) The situation was in chaos after the earthquake struck the city.<br>fall into chaos (陷入混亂)(變成混亂狀態) The company fell into chaos after the CEO suddenly resigned.<br>fall into debt (陷入債務) After losing his job, he fell into debt and struggled to make ends meet.<br>be in debt (處於負債狀態) He had been in debt for years and couldn't afford to pay off all his loans.<br>fall into despair (陷入絕望) After failing the exam for the third time, she fell into despair and thought about giving up.<br>be in despair (感到絕望)(處於絕望狀態) She was in despair after her husband passed away and didn't know how to go on with her life."]]
]);

h += card("L16", ["介系詞", "without"], "B",
  '<div class="stem"><div class="en">Banks and factories came to a standstill as many of their employees were women, flights were grounded because there was no one to provide service, and '+fx("[[L16|without]]")+' actresses, theaters had to cancel performances.</div><div class="zh">銀行和工廠因為許多員工是女性而陷入停擺，航班因為沒有人提供服務而停飛，而且因為沒有女演員，劇院也不得不取消演出。</div></div>' +
  clue('stand still 保持靜止的 (vi. + SC (adj.)) / still adj. 靜止不動的<br>come to a standstill Vi. = come to a stop Vi. 停止運作或移動. The car suddenly came to a stop when the traffic light turned red. → bring O to a standstill (Vt.) = bring O to a stop (Vt.) 使…停止運作或移動. The heavy snow brought the city to a standstill, causing traffic chaos.<br>come to an end Vi. 結束 → bring O to an end (Vt.) 使…結束<br>come to light 為人所知(被發現) → bring ... to light 使…為人所知(發現). New evidence came to light during the investigation. The journalist brought the scandal to light.<br>come to terms 達成協議 → bring ... to terms 使…接受協議. They finally came to terms after months of arguing. After a long struggle, we brought them to terms.') +
  ops([
    ["as a result of", "15%", "= because"],
    ["without", "78%", "= 連接詞 + 沒有 → 因為沒有/如果沒有…"],
    ["apart from", "6%", "除…之外"],
    ["in spite of", "2%", "儘管"]
  ], "B")
);

h += passage("L17-補充", [
  [["ground vt. 使…停飛；使…禁足", "All planes were grounded because of the fierce typhoon. 所有的飛機都因為強烈颱風而停飛。<br>I got home at 2 am and Dad grounded me on the spot. 我在凌晨2點回到家，爸爸當場就將我禁足。"]]
]);

h += card("L19", ["分詞", "striking"], "A",
  '<div class="stem"><div class="en">Additionally, mothers '+fx("[[L19|striking]]")+' all day long simply left children in the care of their husbands.</div><div class="zh">此外，整天罷工的母親們乾脆把孩子留給丈夫照顧。</div></div>' +
  clue('mothers striking = who struck(Vi.) 罷工 = who went on strike(N.)<br>strike, struck, struck/stricken<br>be stricken by/with 經歷某壞事(戰爭/天災/悲傷/疾病等) tip: 被非物理力量打擊. He was stricken with grief when he heard the news of his brother\'s death. The town was stricken by a terrible famine that lasted for years. She was stricken with a rare disease that left her paralyzed.<br>struck p.p. (被以物理力量)打擊. Several cars were struck by falling trees. The worker was struck by a falling object and injured his leg. The building was struck by lightning and caught on fire.<br>L20 leave + O + OC (adj. / Ving / p.p. / 介片) (1) 使…(承受不好的結果) (2) 使…(維持原狀態). The explosion has left one worker dead and (left) four (workers) injured. I\'ll just leave the engine running while I go in. Don\'t leave your toys lying around.<br>in the care of 由…照顧、保管. He left his valuables in the care of one of his friends. Grandma\'s old recipe book, now in my care, isn\'t just about cooking—it\'s about keeping our family\'s love alive.') +
  ops([
    ["striking", "51%", ""],
    ["struck", "18%", "p.p. 被打擊"],
    ["stricken", "3%", "p.p. 被打擊"],
    ["gone on strike", "28%", "→ going on strike"]
  ], "A")
);

h += card("L21", ["複合形容詞"], "A",
  '<div class="stem"><div class="en">Since the mainly '+fx("[[L21|female-run]]")+' schools and nurseries were closed, fathers were thus forced to take their children with them to work.</div><div class="zh">由於主要由女性經營運作的學校和托兒所都關門了，父親們因此被迫帶著孩子去上班。</div></div>' +
  clue('female-run schools = schools (which are) run by females (N-p.p. = p.p.+介+N).<br>國營的 government-run / state-run') +
  ops([
    ["female-run", "55%", "由女性經營管理的. The organization hosts a yearly conference to support female-run startups."],
    ["female-focused", "13%", "以女性為中心的 = focused on females. The film festival showcases female-focused films made by women directors."],
    ["female-owned", "19%", "被女性擁有的(老闆是女性的) = owned by females. The bookstore is one of the few female-owned and (female-)operated=female-run businesses in the area."],
    ["female-friendly", "13%", "對女性友善的 = friendly to females. The company offers a female-friendly policy that provides support for working mothers."]
  ], "A")
);

h += card("L23", ["字彙選擇", "entertained"], "C",
  '<div class="stem"><div class="en">Some men bought candy and colored pencils in a desperate effort to keep their children '+fx("[[L23|entertained]]")+', while others offered rewards to their older kids to have them take care of the younger ones.</div><div class="zh">有些男人買了糖果和彩色鉛筆，拼命想讓孩子們保持開心不吵鬧，而其他人則提供獎勵給較大的孩子，要他們照顧年幼的弟妹。</div></div>' +
  clue('*entertain 指的是「招待客人」或「使…開心」。★ entertain沒有下列意思：從事休閒活動(engage in leisure activities) / 放鬆(relax)。<br>你平時的娛樂是什麼？(X) What’s your usual entertainment? cf. entertainment n. 娛樂(為了使人愉悅而做的表演). (O) What do you usually do for fun? 較正經八百的說法：(O) What are your usual hobbies / leisure activities?<br>while others/some offered rewards... others = other men 還有些男人… (表示還有男人有第三種、第四種作法) / the others = 剩下的所有男人都…(這樣做)<br>in an effort to = in an attempt to = in order to try to 為了試著<br>desperate adj. 絕望到什麼都願意做的. Feeling desperate for acceptance, she started to behave in ways that went against her own values, hoping to fit in with the popular crowd.') +
  ops([
