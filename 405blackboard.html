<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>405 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>405 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}
const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

let h = '';

h += '<h2 id="p1">Thinking Ahead ＆ L1 ~ L56 課文講解</h2>';

h += passage("Thinking Ahead 課前字彙與暖身練習", [
  [["字彙表：1. concentration camp (n. 集中營) ｜ 2. survive (v. 倖存) ｜ 3. document (v. 記錄) ｜ 4. break out (phr. 爆發) ｜ 5. bunker (n. 地堡；掩蔽處) ｜ 6. translate (v. 翻譯) ｜ 7. original (n. 原版) ｜ 8. majority (n. 多數)", ""]],
  [["1. In the book Clara’s War, Clara [[|documented]] what happened to her during World War II.", "在《克拉拉的戰爭》一書中，克拉拉記錄了二戰期間發生在她身上的事。"]],
  [["2. The [[|majority]] of students and teachers are against attending school during the summer vacation.", "大多數的師生都反對在暑假期間上學。"]],
  [["3. Mandy used the app to help her [[|translate]] Chinese into English.", "曼蒂使用這個應用程式幫她把中文翻譯成英文。"]],
  [["4. During World War II, the Nazis set up [[|concentration camps]], where many Jews were sent.", "在二戰期間，納粹設立了集中營，許多猶太人被送往那裡。"]],
  [["5. Medical masks were in great demand globally after COVID-19 [[|broke out]].", "在新冠肺炎爆發後，全球對醫療口罩的需求大增。"]],
  [["暖身中翻英：在多年努力後，我終於擁有了我夢想的房子。 → [[|After years of hard work, I finally have my dream home.]]", "☹ After working hard for years, …"]]
]);

h += card("挑戰題1", ["受詞補語移位", "tear open + 長受詞"], "A",
  st("It was the early morning of October 20, 1943, and eleven German Gestapo agents had just burst through the front door of a Polish woman’s apartment. They searched her home from top to bottom, tearing [[挑戰題1|open]] every pillow and mattress.", "那是 1943 年 10 月 20 日的清晨，十一名德國蓋世太保特務剛剛衝破一位波蘭女子公寓的前門。他們徹頭徹尾地搜查她的家，撕開每一個枕頭和床墊。") +
  clue("原句型為 rip/pull/tear + sth(O) + open(OC, adj. 打開的) (將…撕開)。因為受詞 every pillow and mattress 較長，依「短前長後」原則將形容詞補語 open 移至受詞前面：tearing open(OC) every pillow and mattress(O) (類似 She flipped open Chris's diary.)") +
  ops([
    ["open", "36%", "adj. 打開的"],
    ["to open", "39%", "為了打開"],
    ["opened", "15%", "被打開的"],
    ["openly", "9%", "adv. 率直地/開誠佈公地/公然地 (Sarah talked openly about her problems. / He was openly critical of his colleagues.)"]
  ], "A")
);

h += passage("L1-補充", [
  [["20th = twentieth", ""]]
]);

h += passage("L3-補充", [
  [["search N (for N) = 搜查/搜索…(以尋找…)", "例 They searched the whole area (for the suspect)."]],
  [["search for N = (仔細而費力地)尋找(失蹤人口、罪犯、線索等)", "例 They are searching (the forest) for the missing child."]],
  [["look for 指任何情況的尋找，一般情況用 look for 就好", "補充 可搭配 “high and low” 表「到處」尋找 例 We looked/searched high and low for Sandy but couldn't find her."]]
]);

h += card("L5", ["與過去事實相反的假設", "If + S + had p.p., S + would have p.p."], "A",
  st("If they had entered just seconds earlier, they [[L5|would have found]] the precious list before the woman slipped it to her friend.", "如果他們早幾秒鐘進入，就會在這名女子把珍貴的名單塞給朋友之前發現它了。") +
  clue("had entered … would have found … 假設語氣與過去事實相反。") +
  ops([
    ["would have found", "73%", ""],
    ["could find", "15%", "與現在事實相反"],
    ["must have found", "6%", "一定…吧 (推測句型)"],
    ["might find", "6%", "與現在事實相反"]
  ], "A")
);

h += card("L7", ["對等連接與邏輯", "gave up (searching) and arrested"], "D",
  st("After three hours of searching, they gave up [[L7|and arrested]] the woman. Knowing the list was safe, she breathed a sigh of relief.", "經過三個小時的搜索後，他們放棄了（搜索）並逮捕了這名女子。知道名單安全無虞，她鬆了一口氣。") +
  clue("they gave up (searching) and (they) arrested the woman.") +
  ops([
    ["to arrest", "38%", "為了逮捕女人而放棄？"],
    ["when arresting", "6%", "在逮捕女人時放棄？"],
    ["by arresting", "6%", "藉著逮捕女人而放棄？"],
    ["and arrested", "50%", "放棄(尋找清單)並逮捕女人"]
  ], "D")
);


h += card("L12", ["慣用搭配", "seize / take control of"], "C",
  st("The young lady was Irena Sendler, a compassionate social worker who lived in Warsaw, Poland. During World War II, the Nazis [[L12|seized]] control of this city and announced the establishment of the Warsaw Ghetto.", "這位年輕女子是伊蕾娜・森德勒（Irena Sendler），一位住在波蘭華沙、富有同情心的社工。在第二次世界大戰期間，納粹奪取了這座城市的控制權，並宣布建立華沙猶太區。") +
  clue("take/seize control of 得到/搶到…的支配權 【反】lose control of<br>Students are encouraged to take control of their own learning, rather than just depending on the teacher.") +
  ops([
    ["lost", "27%", ""],
    ["made", "15%", ""],
    ["seized", "50%", ""],
    ["remained", "9%", ""]
  ], "C")
);


h += passage("L11-補充", [
  [["英文地名寫法：由小到大，中間以逗點隔開", "Kaohsiung, Taiwan / Qianjin, Kaohsiung(, Taiwan) 高雄市前金區"]]
]);

h += card("L14", ["動詞字彙與語態", "be herded into 被驅趕進"], "B",
  st("Over 400,000 Jews were [[L14|herded]] into this area, and thousands of them were dying from starvation and disease every month.", "超過四十萬名猶太人被像牲畜般驅趕進這個區域，每個月都有數千人死於飢餓和疾病。") +
  clue("herd n. 一群相同的動物 (herds of elephants) / herd vt. 驅趕(牛羊、人群等) I started backpacking after I grew tired of being herded around with a lot of tourists.<br>flood / swarm / flock Vi. = move in large numbers 成群往某方向移動 ( + in / into / to / across / through / around, etc.)<br>swarm n. 一大群蜜蜂或昆蟲 / flock n. 一群鳥類. Refugees are still flooding across the border. Tourists flock to the town to see its medieval buildings.") +
  ops([
    ["flooded", "17%", ""],
    ["herded", "40%", ""],
    ["swarmed", "3%", ""],
    ["flocked", "40%", ""]
  ], "B")
);

h += passage("L15", [
  [["die of / die from 死於(現代用法基本上of / from可通用)", "My grandfather died from/of cancer. / The woman finally died from/of old age."]]
]);

h += passage("L17", [
  [["Horrified by these shocking conditions, Irena decided to join an underground resistance group and began helping to bring in food and medicine to the Jews secretly.", "對這些令人震驚的處境感到恐懼，伊蕾娜決定加入地下反抗組織，並開始秘密協助將食物和藥品帶進來給猶太人。"]]
]);

h += passage("L18", [
  [["bring in food and medicine to the Jews = bring food and medicine in to the Jews", "in = adv. / bring sth in (to …) 將…帶進來(給…)"]],
  [["However, she soon realized this would not be enough, as the ghetto was sealed and the Nazis had already started sending Jews to death camps.", "然而，她很快就意識到這樣還不夠，因為猶太區遭到封鎖，而且納粹已經開始將猶太人送往死亡集中營。"]]
]);

h += passage("L19", [
  [["as (conj.) 因為", ""]]
]);

h += passage("L22", [
  [["Determined to help, Irena recruited her friends and colleagues for a risky mission: sneaking Jewish children out of the ghetto.", "伊蕾娜決心提供幫助，她招募了朋友和同事執行一項冒險的任務：將猶太兒童偷偷帶出猶太區。"]],
  [["determine vt. 判定；A決定B (B直接受A的影響)", "Investigators are still trying to determine the cause of the fire. Our prices are determined by the market. *determine較少用在「決定去做」→ He decided to give up."]],
  [["determined adj. 有決心的", "She was determined to win."]],
  [["determining adj. 決定性的", "Cost was the determining factor."]]
]);

h += passage("L23", [
  [["sneak/smuggle … out of … 將…偷偷帶出", "The secret agent managed to sneak a few confidential documents out of the country."]],
  [["fid- = trust", "confident adj. 有信心的 / fidelity n. 忠貞 / infidel adj. (感情中)不忠的 / infidelity n. (感情中) 的不忠"]]
]);

h += card("L24", ["動詞片語辨析", "manage to VR 設法成功做到"], "C",
  st("To enter the isolated area, they [[L24|managed]] to obtain official passes.", "為了進入這個被封鎖隔離的區域，他們設法取得了官方通行證。") +
  clue("manage to VR (努力之後)成功地做到<br>try to VR 試著去做 (有沒有、會不會成功都不知道)<br>strive 努力(試著做) = try very hard (三態：strive, strove, striven)<br>attempt 試著去做 = try") +
  ops([
    ["tried", "39%", ""],
    ["attempted", "30%", ""],
    ["managed", "27%", ""],
    ["strove", "3%", ""]
  ], "C")
);

h += passage("L24-補充", [
  [["*牛刀小試(答案不重覆)*", "How do you manage to stay so slim? (*stay + SC = remain + SC 維持)<br>Few people knew that she had once attempted suicide. (*attempt sth 試著做 / * try sth/Ving 試試看效果如何/是否喜歡… The cake tastes great--you have to try it. Try rebooting your phone.)<br>I tried everything to lose weight with no success. (*try everything to = try very hard to)<br>The teacher constantly strives for excellence in his teaching. (*strive for 試著得到 / *strive to VR 努力去做… He strove/tried hard to express himself in English.)"]],
  [["isolated p.p. / adj. 被隔絕的；被孤立的；被封鎖的", "That tribe lives in an isolated region and seldom comes into contact with people outside."]]
]);

h += passage("L25", [
  [["pass n. 通行許可", "a backstage pass / a boarding pass / a 3-day pass"]],
  [["Once inside, they faced an even bigger challenge: convincing Jewish parents to hand their children over to strangers.", "一旦進入內部，他們面臨更大的挑戰：說服猶太父母將孩子交給陌生人。"]],
  [["once conj. 一旦", "Once (they were) inside… *once 引導的子句用現在式代替未來式 / Once you start to smoke, it will gradually do damage to your body."]],
  [["sb faces a problem = a problem faces sb = sb is faced with a problem 某人面臨某問題", "They are facing a difficult choice. = A difficult choice is facing them. = They are faced with a difficult choice."]]
]);

h += passage("L27", [
  [["hand A (over) to B 把A交給B", "The robbers finally gave up resistance and handed their weapons over to the police."]]
]);

h += passage("L28", [
  [["In the end, many parents made the heart-wrenching decision in hopes that their children could survive even if they themselves couldn’t.", "最後，許多父母做出了令人心碎的決定，希望即使自己無法活下來，孩子們也能倖存。"]],
  [["in hopes that (較古老，現代英文少見)(字典查無) = in the hope that (較常用)", "He asked her again in the hope that he could persuade her to come."]]
]);

h += passage("L31", [
  [["Hidden in everything from suitcases to flour sacks, the children were smuggled out in various ways. One ambulance driver even hid babies under stretchers and trained his dog to bark in order to drown out their cries. Irena and the other courageous people were risking their own lives.", "孩子們被藏在從行李箱到麵粉袋等各種物品中，以不同方式偷運出去。一名救護車司機甚至將嬰兒藏在擔架下，並訓練他的狗吠叫以蓋過嬰兒的哭聲。伊蕾娜和其他勇敢的人們正冒著生命危險。"]]
]);

h += card("L36", ["萬一假設倒裝", "Should + S + VR"], "A",
  st("[[L36|Should]] they be caught, these compassionate smugglers and their families would certainly face execution.", "萬一他們被捕，這些富有同情心的偷運者及其家人肯定會面臨處決。") +
  clue("Once/If (they were) caught, these compassionate smugglers and their families would certainly face execution. once = if 連接詞若省略，則意思不清楚。Once / If caught = If they should be caught,(萬一) = Should they be caught, = Upon/On arrest/capture, = In the event of their capture/arrest,") +
  ops([
    ["Should", "6%", ""],
    ["Once", "70%", ""],
    ["In the event of", "9%", ""],
    ["In case", "15%", ""]
  ], "A")
);

h += card("L38", ["形容詞片語", "complete with 附有/齊備"], "C",
  st("After successfully escaping, the children were given new identities, [[L38|complete]] with fake birth documents and family records.", "成功逃脫後，孩子們獲得了新的身分，還附有偽造的出生證明和家庭紀錄。") +
  clue("complete adj. 可用來表示強調 He's a complete idiot. She's the complete opposite of me. <br>complete adj. with 有(包含)… ≒ including ≒ inclusive of. The book, (which is) complete with 3 DVD’s, costs $35. <br>come complete with ≒ include. All our machines come complete with our three-year service guarantee. The report comes complete with (= includes) diagrams and color photographs.") +
  ops([
    ["filled", "43%", "充滿？ The island was packed/filled with tourists in summer."],
    ["packed", "15%", "充滿？"],
    ["complete", "17%", "(which were) complete"],
    ["inclusive", "25%", "→ inclusive with(X) inclusive of(O)"]
  ], "C")
);

h += passage("L40", [
  [["Some were taken in by kind and brave Polish families, while others were sent to orphanages or convents.", "有些孩子被善良勇敢的波蘭家庭收留，而其他人則被送到孤兒院或修道院。"]],
  [["while 用來表示兩者之間的對比(而…)，或雖然", "例 Schools in the north tend to be better equipped, while those in the south are relatively poor. 例 While there was no conclusive evidence, most people thought he was guilty."]]
]);

h += card("L42", ["句子主要動詞", "included vs. including"], "D",
