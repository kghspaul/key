<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English 4U 10月 Week 4 (Units 11–12) 週考＆隨堂洞洞卷 完整詳解</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>English 4U 10月 Week 4 (Units 11–12) 週考＆隨堂洞洞卷 完整詳解</h1>
  <p>🎧 <strong>聽力音檔連結：</strong><a href="https://drive.google.com/file/d/1VVSCB9Rd8Ppd9LJMtDtKlAAQ7yPmka9e/view?usp=drive_link" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700;text-decoration:underline">點此開啟聽力測驗音檔</a></p>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let H = '';

// ============================================================================
// PART 1: 週考卷 Listening Test (L1 - L11, 內部編號 101 - 111)
// ============================================================================
H += '<h2 id="sec-listen">一、週考卷：Listening Test 聽力測驗 (Units 11–12)</h2>';

// Part A
H += passage('Part A：看圖辨義 (Q1 聽力稿與圖片情境)', [
  [
    ['[Picture Context] (A) A woman crying sadly while holding her phone. / (B) A woman looking completely amazed and surprised while holding her phone. / (C) A woman looking furious and angry with a phone in hand. / (D) A woman laughing joyfully while talking on the phone.', '【圖片情境】(A) 女子拿著手機傷心哭泣。／(B) 女子拿著手機露出極度驚訝、不可置信的表情。／(C) 女子拿著手機面露憤怒。／(D) 女子講電話時開懷大笑。'],
    ['W: When I heard that my sister was going to have a baby, I was full of emotion.', '女：當我聽說我姊姊（或妹妹）要生寶寶時，我百感交集（充滿情緒）。'],
    ['She had been so sad when doctors told her it was almost impossible.', '當初醫生告訴她這幾乎是不可能的事時，她曾經非常難過。'],
    ['Her husband was angry at the doctor.', '她的丈夫當時對醫生感到很生氣。'],
    ['So, as you can imagine, [[101|I was in complete amazement at the news]].', '所以，正如你能想像的，我聽到這個消息時感到完全不可置信（極度驚訝）。'],
    ['When I called her, her voice was filled with joy.', '當我打電話給她時，她的聲音充滿了喜悅。'],
    ['Q: Which picture best shows the woman when she heard the news?', '問：哪張圖片最能呈現這位女子聽到消息時的反應？']
  ]
], '注意區分「說話女子本人 (I)」、「姊妹 (She)」與「姊夫 (Her husband)」各自的情緒反應。');

H += card('L1', ['考點：人物情緒對應與片語 in amazement', '詞性需求：名詞片語理解'], 'B',
  stem('101') +
  clue('題目問的是 <b>the woman when she heard the news</b>（女子聽到消息時的反應）。聽力稿明確指出 <b>I was in complete amazement at the news</b>（我對這消息感到極度驚訝／驚奇），片語 <b>in amazement</b> 意為「驚愕地、驚奇地」，故對應張大嘴巴、滿臉驚訝的圖 (B)。') +
  ops([
    ['Picture A (A woman crying sadly)', '傷心哭泣的女子', '混淆對象。傷心 (sad) 是她姊妹先前被醫生告知幾乎不可能懷孕時的反應（<i>She had been so sad...</i>）。<b>何時才對：</b>The woman broke down in tears and looked <b>sad</b> when she heard the bad news.'],
    ['Picture B (A woman looking amazed and shocked)', '滿臉驚奇、不可置信的女子', '完全對應 <b>in complete amazement</b>（極度驚訝），為正確圖片。'],
    ['Picture C (A woman looking angry)', '面露憤怒的女子', '混淆對象。生氣 (angry) 是她姊夫對醫生的反應（<i>Her husband was angry at the doctor</i>）。<b>何時才對：</b>She was <b>angry</b> at the rude clerk and shouted into the phone.'],
    ['Picture D (A woman laughing with joy)', '開懷大笑的女子', '混淆對象。充滿喜悅 (filled with joy) 是她打電話過去時「姊妹的聲音」（<i>her voice was filled with joy</i>），而非女子剛聽到消息的表情。<b>何時才對：</b>She laughed with <b>joy</b> while chatting with her best friend.']
  ], 'B')
);

// Part B
H += passage('Part B：問答應對 (Q2–Q4 題幹)', [
  [
    ['2. Welcome to this part of the country. As you\'ll see, [[102|agriculture]] is very important here.', '2. 歡迎來到我們國家的這個地區。如你將會看到的，農業在這裡非常重要。'],
    ['3. I prefer to have my children watch [[103|educational]] TV programs.', '3. 我比較喜歡讓我的孩子觀看具教育意義的電視節目。'],
    ['4. Hello, I\'d like to [[104|reserve a table]] for this Friday and for four people, please.', '4. 您好，我想預訂這週五、四個人的桌位，麻煩您。']
  ]
]);

H += card('L2', ['考點：核心單字 agriculture（農業）', '詞性需求：名詞語意對應'], 'A',
  stem('102') +
  clue('關鍵字為名詞 <b>agriculture</b>（農業）。既然當地以農業為重，最自然的回應是期待參觀「農場 (<b>farms</b>)」。') +
  ops([
    ['Great. I\'d love to see some farms.', '太棒了。我很想看看一些農場。', '<b>farms</b>（農場）直接呼應題幹的 <b>agriculture</b>（農業），語意完全契合。'],
    ['So, there are many tech companies?', '所以，這裡有很多科技公司嗎？', '<b>tech companies</b>（科技公司）屬於科技業，與農業無關。<b>何時才對：</b>The government has invested heavily in the <b>technology industry</b> here.'],
    ['Wow, the cities are big and modern!', '哇，這些城市又大又現代化！', '農業重鎮通常為鄉村或農田景觀，而非大都會。<b>何時才對：</b>This region is famous for its <b>modern skyscrapers and big cities</b>.'],
    ['Oh, I know the focus is on fashion here.', '噢，我知道這裡的重心是時尚產業。', '<b>fashion</b>（時尚）與 <b>agriculture</b>（農業）領域完全不同。<b>何時才對：</b>Milan is a city where the main industry focuses on <b>fashion</b>.']
  ], 'A')
);

H += card('L3', ['考點：核心單字 educational（具教育意義的）', '詞性需求：形容詞語意對應'], 'D',
  stem('103') +
  clue('關鍵字為形容詞 <b>educational</b>（有教育意義的），由動詞 <i>educate</i>（教育）衍生而來，直接對應選項 (D) 的動詞 <b>learn from those shows</b>（從那些節目中學習）。') +
  ops([
    ['Yeah, they aren\'t suitable for kids at all.', '對啊，它們一點也不適合小孩子。', '語意相反。既然家長偏好讓孩子看，代表節目適合孩子。<b>何時才對：</b>I never let my children watch <b>violent</b> TV programs.'],
    ['I let my kids watch sports games, too.', '我也讓我的孩子看體育比賽。', '誤把 <b>educational</b> 當成 <b>sports</b>（體育），句尾的 <i>too</i>（也）毫無依據。<b>何時才對：</b>I like to watch <b>baseball games</b> with my children on weekends.'],
    ['Really? You never let them watch TV?', '真的嗎？你從不讓他們看電視？', '題幹是「偏好讓他們看有教育意義的節目」，並非「完全不准看電視」。<b>何時才對：</b>We decided to ban all screen time and <b>never let our kids watch TV</b>.'],
    ['It\'s good that they can learn from those shows.', '他們能從那些節目中學到東西是很棒的事。', '<b>learn from those shows</b> 精準呼應 <b>educational TV programs</b>。']
  ], 'D')
);

H += card('L4', ['考點：餐廳訂位用語 reserve a table', '詞性需求：動詞片語情境應對'], 'C',
  stem('104') +
  clue('關鍵動詞片語 <b>reserve a table</b>（預訂餐桌／訂位）。餐廳人員最合理的回應是告知是否還有空位，(C) <b>fully booked</b>（訂位已滿）完全符合餐廳訂位情境。') +
  ops([
    ['Sure, we can help move this table.', '當然，我們可以幫忙搬這張桌子。', '一字多義陷阱。此處將 <b>table</b> 當成實體家具搬動，忽略了 <b>reserve</b>（預訂）。<b>何時才對：</b>Could you help me <b>move this heavy table</b> to the corner?'],
    ['Yes, our furniture store sells tables.', '是的，我們家具店有賣桌子。', '將「餐廳訂位」誤解為「去家具店買桌子」。<b>何時才對：</b>Excuse me, am I able to <b>buy a dining table</b> at your store?'],
    ['I\'m sorry. We\'re fully booked then.', '很抱歉，我們那個時段已經訂滿了。', '<b>be fully booked</b>（預約額滿）是回應 <b>reserve a table</b>（訂位）的標準商用英文。'],
    ['No problem. I\'ll cancel that right now.', '沒問題，我馬上幫您取消。', '語意顛倒。顧客是要「預訂 (<b>reserve</b>)」，而非「取消 (<b>cancel</b>)」。<b>何時才對：</b>Hello, I won\'t be able to make it this Friday, so I\'d like to <b>cancel my reservation</b>.']
  ], 'C')
);

// Part C
H += passage('Part C：簡短對話 (Q5 聽力稿)', [
  [
    ['W: What do you need this big, dark cloth for?', '女：你需要這塊又大又黑的布做什麼？'],
    ['M: I\'m going to cover my art project.', '男：我要用它蓋住我的藝術作品。'],
    ['W: Why won\'t you let anyone see it?', '女：你為什麼不讓別人看到它呢？'],
    ['M: [[105|I\'ll reveal it at the end of my talk]].', '男：我會在演講結束時揭曉（掀開展示）它。'],
    ['Q: What will the man do at the end of his talk?', '問：這位男士在演講結束時會做什麼？']
  ]
]);

H += card('L5', ['考點：核心單字 reveal（揭露；展現）', '詞性需求：及物動詞語意轉換'], 'D',
  stem('105') +
  clue('男士先前用黑布蓋住作品（<i>cover my art project</i>），並說演講結束時會 <b>reveal it</b>（將它揭曉／展示出來）。動詞 <b>reveal</b> 在此相當於 <b>remove the cloth to show...</b>（掀開布以展示……）。') +
  ops([
    ['Begin work on his new art project.', '開始製作他的新藝術作品。', '作品已經完成並用布蓋著，並非演講結束才開始做。<b>何時才對：</b>I will <b>start working on</b> my art project after the speech is over.'],
    ['Cover his art project to keep it safe.', '把他的藝術作品蓋起來以策安全。', '蓋住作品 (cover) 是演講「前」現在正要做的動作，演講結束時則是掀開 (reveal)。<b>何時才對：</b>After the exhibition closes, I\'ll <b>cover</b> the statue to protect it from dust.'],
    ['Let people write notes on the cloth.', '讓人們在布上面寫字留言。', '對話中完全未提及在布上寫字。<b>何時才對：</b>Visitors are welcome to <b>sign their names on the cloth</b> after my talk.'],
    ['Remove the cloth to show his art project.', '拿開黑布以展示他的藝術作品。', '精準解釋了 <b>reveal it</b>（掀開布幕公開作品）的具體動作。']
  ], 'D')
);

H += passage('Part C：簡短對話 (Q6–Q7 聽力稿)', [
  [
    ['W: Your farm has been very successful recently. I\'d like to find out more about it for my company\'s news report.', '女：您的農場最近非常成功。我想多了解一些細節，作為我們公司的新聞報導。'],
    ['M: Well, I\'m happy to answer any questions that you have.', '男：好啊，我很樂意回答妳的任何問題。'],
    ['W: First, I see that you have a lot of trucks.', '女：首先，我看到您這裡有很多卡車。'],
    ['M: [[106|We need them to transport all the food waste from other parts of the country]].', '男：我們需要它們把來自全國各地的廚餘（食物廢棄物）運送過來。'],
    ['W: Oh, food waste?', '女：噢，廚餘嗎？'],
    ['M: Yes. It is an important part of our success.', '男：是的，那是我們成功的關鍵之一。'],
    ['W: Do you use it to grow your fruit?', '女：您用它來種植水果嗎？'],
    ['M: [[107|Yes, we\'re completely organic in that way]]. But we also burn it to create heat and power.', '男：對，我們在這方面是完全有機的。但我們也會燃燒廚餘來產生熱能與電力。'],
    ['Q6: What is the purpose of the farm\'s trucks?', '問6：這個農場的卡車用途是什麼？'],
    ['Q7: What does the farmer say about how the fruit is grown?', '問7：關於水果的種植方式，這位農夫怎麼說？']
  ]
]);

H += card('L6', ['考點：動詞 transport（運輸）與介系詞 from', '詞性需求：動詞片語細節理解'], 'D',
  stem('106') +
  clue('農夫說：<b>We need them to transport all the food waste from other parts of the country</b>（我們需要卡車從全國各地運送廚餘過來）。動詞 <b>transport ... from ...</b> 對應選項 (D) 的 <b>bring food waste to the farm</b>。') +
  ops([
    ['They carry away the farm\'s fruit.', '它們用來把農場的水果運走。', '方向與物品皆錯。卡車是從外地運進「廚餘 (food waste)」，而非運出水果。<b>何時才對：</b>These trucks are used to <b>deliver our fresh fruit to supermarkets</b>.'],
    ['They\'re used to keep the farm clean.', '它們被用來保持農場清潔。', '卡車是把外地的廚餘運進農場利用，而非清潔農場的垃圾車。<b>何時才對：</b>We use cleaning trucks to <b>sweep the roads and keep the farm clean</b>.'],
    ['They\'re used to pull machines on the farm.', '它們被用來在農場裡拖曳機器。', '那是曳引機 (tractor) 的功能，對話未提及。<b>何時才對：</b>Heavy tractors are needed to <b>pull farming machines</b> across the field.'],
    ['They bring food waste to the farm.', '它們將廚餘運送到農場來。', '完全同義轉換 <b>transport all the food waste from other parts of the country</b>。']
  ], 'D')
);

function bankR6_13(ans, rightReason, customReasons){
  const items = [
    ['A', 'tunnel', 'n. 隧道（單數可數）', 'The train went through a long, dark <b>tunnel</b> under the mountain.'],
    ['B', 'coal', 'n. 煤炭（不可數名詞）', 'In the past, people burned <b>coal</b> to heat their homes in winter.'],
    ['C', 'at least', 'adv. phr. 至少（修飾數量或時間）', 'You should drink <b>at least</b> eight glasses of water every day.'],
    ['D', 'tracks', 'n. 鐵軌；軌道（複數名詞）', 'Never walk across the railway <b>tracks</b> when a train is coming.'],
    ['E', 'operates', 'v. 營運；運作（第三人稱單數動詞）', 'The shuttle bus <b>operates</b> every 20 minutes from morning till night.'],
    ['F', 'passengers', 'n. 乘客；旅客（複數名詞）', 'All <b>passengers</b> must wear seat belts during the flight.'],
    ['G', 'images', 'n. 圖像；影像（複數名詞）', 'The book is full of colorful <b>images</b> of marine animals.'],
    ['H', 'in advance', 'adv. phr. 事先；預先（修飾動詞）', 'Popular restaurants require you to book a table <b>in advance</b>.']
  ];
  const list = items.map(it => {
    const code = it[0];
    const explain = (code === ans) ? rightReason : (customReasons[code] + ' <b>何時才對：</b>' + it[3]);
    return [it[1], it[2], explain];
  });
  return ops(list, ans, 'ABCDEFGH');
}

    ['G', 'available', 'adj. 可獲得的；有空位的', 'Are there any tickets still <b>available</b> for tonight\'s concert?']
  ];
  const list = items.map(it => {
    const code = it[0];

}

function bankU12A(ans, rightReason, customReasons){
  const items = [

    ['C', 'think of', 'v. phr. 想到；想起（後接名詞受詞）', 'What do you <b>think of</b> when you hear this old song?'],
    ['D', 'lived up to', 'v. phr. 達到（期待）；不負（盛名）（過去式）', 'The five-star hotel truly <b>lived up to</b> its great reputation.'],
    ['E', 'brought in', 'v. phr. 引進；導入（過去式及物片語）', 'The factory <b>brought in</b> modern machines to speed up production.']
  ];
  const list = items.map(it => {
    const code = it[0];
    const explain = (code === ans) ? rightReason : (customReasons[code] + ' <b>何時才對：</b>' + it[3]);

  });
  return ops(list, ans, 'ABCDE');
}

function bankU12B(ans, rightReason, customReasons){
  const items = [
    ['A', 'evolves', 'v. 演進；逐漸發展（第三人稱單數不及物動詞）', 'As technology <b>evolves</b>, smart devices are becoming smaller and faster.'],

    ['C', 'treat', 'v. 把……視為；對待（搭配 treat A as B）', 'The locals <b>treat</b> every visitor as an honored guest.'],
    ['D', 'brews', 'n. 沖泡的茶飲（複數名詞，cold brews 冷泡茶）', 'Iced coffee and cold <b>brews</b> are very popular during hot summers.'],
    ['E', 'praise', 'v. 稱讚；讚美（複數原形及物動詞）', 'Food critics highly <b>praise</b> the chef\'s creative dishes.'],
    ['F', 'branches', 'n. 樹枝；枝枒；分店（複數名詞）', 'The old banyan tree spreads its wide <b>branches</b> over the courtyard.']
  ];
  const list = items.map(it => {
    const code = it[0];
    const explain = (code === ans) ? rightReason : (customReasons[code] + ' <b>何時才對：</b>' + it[3]);
    return [it[1], it[2], explain];
  });
  return ops(list, ans, 'ABCDEF');
}

    ['As a result', 'adv. phr. 結果；因此', '前後並非「因果推導」，有機耕作本身就是「愛護土地的新做法」的一個具體例子。<b>何時才對：</b>Farmers stopped using harmful chemicals. <b>As a result</b>, the soil became much healthier.'],
    ['For instance', 'adv. phr. 舉例來說；例如', '以「部分茶農採用有機農法（<i>some farmers choose organic methods</i>）」作為前句「結合新觀念愛護土地」的具體實例，邏輯完全吻合。'],
    ['In addition', 'adv. phr. 此外；而且', '用於補充另一個不同層面的論點，而非針對前句抽象概念進行具體舉例。<b>何時才對：</b>Organic tea is good for the soil. <b>In addition</b>, it is safer for consumers to drink.']
  ], 'B')
);

H += card('40', ['考點：字首字尾拼字（有機的）', '詞性需求：形容詞 (choose ___ methods, avoiding chemicals)'], 'organic',
  stem('40') +
  clue('空格修飾名詞 <b>methods</b>（方法），後方分詞構句 <b>avoiding chemicals to keep the soil and plants healthy</b>（避免使用化學藥劑）正是「有機的」之定義。結合中文提示與字首 <b>o-</b>、字尾 <b>-c</b>，應填 <b>organic</b>。')
);

H += card('41', ['考點：字首字尾拼字與片語 give ... a modern twist', '詞性需求：單數可數名詞 (giving tea a modern ___)'], 'twist',
  stem('41') +
  clue('固定搭配 <b>give sth a modern ___</b>（賦予某事物現代的新意／轉折），結合中文提示「轉折」及字首 <b>t-</b>、字尾 <b>-t</b>，應填單數名詞 <b>twist</b>。')
);

H += card('42', ['考點：複合名詞 cold brews（冷泡茶）', '詞性需求：複數名詞 (They enjoy cold ___ and innovative tea drinks)'], 'brews',
  stem('42') +
  clue('及物動詞 <b>enjoy</b> 後方接兩個對等的飲品受詞：<b>cold ___ and innovative tea drinks</b>（冷……與創新茶飲）。「冷泡茶」的英文即為 <b>cold brews</b>。') +
  bankU12B('D', '複數名詞 <b>cold brews</b>（冷泡茶）與後方的複數名詞 <b>innovative tea drinks</b> 對等並列作為 <i>enjoy</i> 的受詞。', {
    A: '動詞不可作 <i>enjoy cold</i> 後方的名詞受詞。',
    B: '人們在茶館裡喝的是「冷泡茶（cold brews）」，而非喝「冰冷的香氣（cold fragrance）」。',
    C: '動詞／單數名詞與後方複數飲品不搭配。',
    E: '動詞／不可數名詞「稱讚」不可與 <i>cold</i> 搭配當飲料喝。',
    F: '人們不會在茶館裡享用「冰冷的樹枝（cold branches）」。'
  })
);

H += card('43', ['考點：從屬連接詞辨析 (as soon as / even if / unless)', '詞性需求：從屬連接詞 (引導讓步副詞子句 ___ they\'re busy)'], 'even if',
  stem('43') +
  clue('主要子句說「年輕人喜歡在時髦茶館裡悠閒享用冷泡茶與創新茶飲」，從屬子句說「他們很忙碌（<b>they\'re busy</b>）」。「忙碌」與「去茶館悠閒喝茶放鬆」形成讓步對比（「即使他們很忙，仍然會去茶館喝茶」），故選 <b>even if</b>（即使、縱使）。') +
  ops([
    ['as soon as', 'conj. 一……就……', '「他們一忙碌起來，就去茶館喝茶放鬆」違反常理（通常忙的時候沒空去悠閒喝茶）。<b>何時才對：</b>She headed to her favorite tea café to relax <b>as soon as</b> she finished her busy workday.'],
    ['even if', 'conj. 即使；縱使', '正確表達「<b>即使</b>生活忙碌，年輕人仍會在茶館享受茶飲」的讓步關係。'],
    ['unless', 'conj. 除非', '若填 <i>unless</i> 會變成「除非他們很忙，否則他們會去茶館喝茶」（雖看似通順，但本段強調喝茶已融入年輕人生活，就連忙碌時也會抽空享受，課文原文為 <b>even if</b>）。<b>何時才對：</b>I usually make my own tea at home <b>unless</b> I am meeting friends at a café.']
  ], 'B')
);

H += card('44', ['考點：字首字尾拼字（點心；甜點）', '詞性需求：複數可數名詞 (These places often serve ___)'], 'desserts',
  stem('44') +
  clue('及物動詞 <b>serve</b>（供應）後方無冠詞，結合中文提示「點心（餐後甜點）」及字首 <b>d-</b>、字尾 <b>-s</b>，應填複數名詞 <b>desserts</b>（注意「甜點」中間有兩個 <b>s</b>：<i>de<u>ss</u>erts</i>，切勿拼成只有一個 s 的沙漠 <i>deserts</i>）。')
);

H += card('45', ['考點：讓步連接詞辨析 (Whether / Even though / As long as)', '詞性需求：從屬連接詞 (引導事實讓步子句)'], 'Even though',
  stem('45') +
  clue('從屬子句說「有來自較廉價茶品的強烈競爭（<i>there\'s strong competition from cheaper teas</i>）」，主要子句說「各國餐廳與茶館仍將台灣茶視為奢華首選（<i>luxury picks</i>）」。前後為「儘管有低價競爭，台灣茶依然走高檔路線」的讓步關係，故選 <b>Even though</b>（儘管、雖然）。') +
  ops([
    ['Whether', 'conj. 無論是否（須搭配 or / or not）', '句中沒有 <i>or not</i>，且「有強烈低價競爭」是既定事實而非不確定的假設。<b>何時才對：</b><b>Whether</b> you prefer green tea or black tea, you will love Taiwanese oolong.'],
    ['Even though', 'conj. 儘管；雖然', '引導與主句形成對比的事實讓步子句，完全符合文意。'],
    ['As long as', 'conj. 只要（表條件）', '「只要有廉價茶競爭，餐廳就會把台灣茶當奢華品」條件邏輯不合理。<b>何時才對：</b>Customers are willing to pay more <b>as long as</b> the tea is of top quality.']
  ], 'B')
);

H += card('46', ['考點：核心動詞片語 treat A as B（將 A 視為 B）', '詞性需求：複數現在式及物動詞 (主詞為複數 restaurants and teahouses)'], 'treat',
  stem('46') +
  clue('主詞 <b>restaurants and teahouses in different countries</b> 為複數，後方結構為 <b>___ Taiwanese teas <u>as</u> luxury picks</b>（將台灣茶「視為／當作」奢華首選）。與介系詞 <b>as</b> 構成「把 A 當作／視為 B」的動詞即為 <b>treat</b>。') +
  bankU12B('C', '<b>treat Taiwanese teas as luxury picks</b>（將台灣茶視為奢華首選），<b>treat A as B</b> 為必考固定搭配。', {
    A: '單數動詞與複數主詞 <i>restaurants and teahouses</i> 不合，且不及物動詞不可接 <i>Taiwanese teas as...</i>。',
    B: '名詞不可作主要動詞。',
    D: '複數名詞不可作及物動詞搭配 <i>as</i>。',
    E: '<i>praise A for B</i>（因 B 而稱讚 A），不與 <i>as luxury picks</i> 表「當作高檔選項對待」連用（且 <i>praise</i> 留給下一題 Q47）。',
    F: '名詞不可作主要動詞。'
  })
);

H += card('47', ['考點：及物動詞 praise（讚賞；稱讚）', '詞性需求：複數現在式及物動詞 (主詞為複數 tea drinkers，受詞為 their smooth taste...)'], 'praise',
  stem('47') +
  clue('主詞 <b>tea drinkers</b>（飲茶者，複數）後方缺少及物動詞，受詞為正面特質 <b>their smooth taste and soft aroma</b>（它們滑順的口感與柔和的香氣），故填「讚賞、稱讚（<b>praise</b>）」。') +
  bankU12B('E', '複數原形及物動詞 <b>praise</b>（讚賞、稱讚）完美銜接主詞 <i>tea drinkers</i> 與受詞 <i>their smooth taste and soft aroma</i>。', {
    A: '單數不及物動詞，主詞單複數與及物性皆不符。',
    B: '名詞不可作主要動詞。',
    C: '單純接「滑順口感與柔和香氣」應用「稱讚（praise）」，而非「對待（treat）」。',
    D: '饮茶者不會「沖泡（brew）」口感與香氣。',
    F: '名詞不可作主要動詞。'
  })
);

H += card('48', ['考點：不及物動詞 evolves（演進；發展）', '詞性需求：第三人稱單數現在式不及物動詞 (As the tea world ___)'], 'evolves',
  stem('48') +
  clue('從屬子句 <b>As the tea world ___</b> 中，主詞 <b>the tea world</b> 為第三人稱單數，且空格後方即為逗號（無受詞），需填入第三人稱單數不及物動詞「演進、發展（<b>evolves</b>）」。') +
  bankU12B('A', '字庫中唯一的第三人稱單數不及物動詞，<b>As the tea world evolves</b>（隨著茶的世界不斷演進）文法與語意完全正確。', {
    B: '名詞不可作從屬子句的動詞。',
    C: '原形動詞與單數主詞 <i>the tea world</i> 不一致，且缺受詞。',
    D: '若當動詞「沖泡」與主詞「茶的世界」不搭。',
    E: '原形動詞與單數主詞不一致，且缺受詞。',
    F: '名詞不可作主要動詞。'
  })
);

H += card('49', ['考點：字首字尾拼字與詞性轉換 (steady → steadily)', '詞性需求：副詞 (修飾不定詞動詞 to grow ___)'], 'steadily',
  stem('49') +
  clue('空格位於不及物動詞 <b>to grow</b> 後方至句尾，需用副詞修飾「成長」的方式。結合中文提示「穩定地」及字首 <b>s-</b>、字尾 <b>-ly</b>，將形容詞 <i>steady</i> 去 <b>y</b> 加 <b>-ily</b> 變成副詞 <b>steadily</b>。')
);

H += card('50', ['考點：修辭呼應 old roots ... spreading its branches', '詞性需求：複數名詞 (置於所有格 its 後方作 spreading 的受詞)'], 'branches',
  stem('50') +
  clue('注意整句的植物比喻修辭：前半句說 <b>old <u>roots</u> run deep</b>（老根扎得深），後半句說 <b>Taiwanese tea is spreading its ___ around the world</b>（台灣茶正將它的「枝枒／樹枝」伸展到全世界）。與「根（<i>roots</i>）」呼應並搭配動詞 <i>spread</i> 的必為「樹枝、枝枒（<b>branches</b>）」。') +
  bankU12B('F', '複數名詞 <b>branches</b>（樹枝、枝枒）與前半句的 <b>old roots</b>（老根）形成完美呼應的樹木意象比喻。', {
    A: '動詞不可放在所有格 <i>its</i> 後方。',
    B: '雖為名詞，但無法與前半句的比喻 <i>old roots run deep</i>（根深葉茂／枝幹延伸）形成對應的植物結構比喻，且已用於 Q36。',
    C: '動詞不可放在所有格 <i>its</i> 後方。',
    D: '「將它的冷泡茶伸展到全世界」不如 <i>spreading its branches</i>（開枝散葉）符合諺語修辭。',
    E: '「散播它自己的稱讚」語意不通。'
  })
);

document.getElementById('app').innerHTML = H;

  ['#sec-u12', '🍵 洞洞卷 U12 (19–50)']
