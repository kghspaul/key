<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>304 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>304 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h = '';

// --- 挑戰題 1 ---
h += '<h2 id="p1">挑戰題 1</h2>';
h += card('1', ['文法', '間接問句'], 'D',
  '<div class="stem"><div class="en">Have you ever thought about '+fx("[[1|what it would be like]]")+' to have a deceased loved one return and accompany you to a holiday celebration?</div><div class="zh">你是否曾想過，讓一位已故的摯愛回來陪伴你慶祝節日會是什麼樣子？</div></div>' +
  clue('間接問句：不需倒裝（疑問詞 + S + V）；what 當名詞，how 當副詞。此處需受詞。') +
  ops([
    ['how would it be like', '', '需要倒裝，且 like 後需接名詞 (what)'],
    ['what would it be like', '', '需要倒裝'],
    ['how it would be like', '', 'like 是介系詞，受詞必為名詞，故用 what'],
    ['what it would be like', '', 'what 為 N，作為 like 的受詞；間接問句不倒裝']
  ], 'D')
);

h += passage("使役動詞用法補充", [
  [["You had better have your air conditioner fixed because it is leaking.", "你最好把冷氣修一修，因為它在漏水。(have + O + p.p.)"]],
  [["He's always got the stereo playing full blast.", "他總是把音響開到最大聲。(have + O + Ving)"]]
]);

h += card('2', ['文法', '關係子句'], 'C',
  '<div class="stem"><div class="en">The idea may scare you to death or at least make your hair stand on end, but this is the essential concept behind the Day of the Dead in Mexico '+fx("[[2|, where]]")+' people celebrate death with joy and humor rather than mourn it with sorrow.</div><div class="zh">這個想法可能會把你嚇死，或至少讓你毛骨悚然，但這就是墨西哥亡靈節背後的核心概念，在那裡人們帶著歡樂與幽默慶祝死亡，而不是悲傷地哀悼它。</div></div>' +
  clue('獨一無二的專有名詞 (Mexico) 後方補充說明，需用非限定的關係副詞 ( , where )') +
  ops([
    ['which', '', '非限定子句需有逗點'],
    ['where', '', '非限定子句需有逗點'],
    [', where', '連接詞 + 地方副詞', '用以修飾先行詞 Mexico，後接完整子句'],
    [', which', '', '後須接不完整子句']
  ], 'C')
);

// --- 挑戰題 2 ---
h += '<h2 id="p2">挑戰題 2</h2>';
h += card('3', ['文法', '不定詞時態'], 'A',
  '<div class="stem"><div class="en">The Day of the Dead is thought '+fx("[[3|to have originated]]")+' centuries ago with the Aztecs.</div><div class="zh">亡靈節被認為是幾個世紀前源自阿茲特克人。</div></div>' +
  clue('to have pp 表示這個動作發生的時間比主要子句 (is thought) 中的動詞早。originate (起源) 為不及物動詞。') +
  ops([
    ['to have originated', '', '表示過去已發生的動作'],
    ['to originate', '', '時態不符 (centuries ago)'],
    ['to be originated', '', '語態錯誤 (originate 主動即可)'],
    ['to have been originated', '', '語態錯誤']
  ], 'A')
);

h += card('4', ['文法', '關係副詞'], 'D',
  '<div class="stem"><div class="en">Traditionally, deceased children are honored on Nov. 1, while Nov. 2 is the day '+fx("[[4|when]]")+' departed adults are the main focus.</div><div class="zh">傳統上，死去的兒童會在 11 月 1 日受到尊崇，而 11 月 2 日則是主要關注逝去成人的日子。</div></div>' +
  clue('when = on which (介系詞 + 關代) 修飾先行詞 the day，後接完整子句') +
  ops([
    ['which', '', 'which 後需接不完整子句 (需改為 on which)'],
    ['in which', '', '時間搭配應為 on which'],
    ['that', '', '介系詞 on 不可直接省略改用 that'],
    ['when', '', '關副 = and + on this day']
  ], 'D')
);

h += card('5', ['詞義解析'], 'B',
  '<div class="stem"><div class="en">During these 48 hours, the souls of the dead are believed to return to earth to visit their '+fx("[[5|living]]")+' family members.</div><div class="zh">在這 48 小時內，人們相信死者的靈魂會重返人間，探望他們在世的家人。</div></div>' +
  ops([
    ['alive', '活著的', '不能放在名詞前修飾'],
    ['living', '活著的', '可放名詞前修飾'],
    ['live', '現場的/活的', '通常用在動物或廣播節目上'],
    ['lived', '被居住', '不合語意']
  ], 'B')
);

h += card('6', ['代名詞'], 'C',
  '<div class="stem"><div class="en">Instead of fearing the spirits of '+fx("[[6|those]]")+' they have lost, Mexicans anticipate their arrival and prepare for it.</div><div class="zh">墨西哥人非但不害怕失去親人的靈魂，反而期待他們的到來並為此做準備。</div></div>' +
  clue('those they have lost = those (people) (that/whom) they have lost') +
  ops([
    ['which', '', '缺先行詞'],
    ['what', '', '= the thing which (他們失去之物的靈魂？語意不合)'],
    ['those', '那些人', ''],
    ['that', '', 'that 前不可有介系詞 of']
  ], 'C')
);

h += card('7', ['單字', '小測驗'], 'C',
  '<div class="stem"><div class="en">(At a funeral) My condolences. (請節哀) = I’m sorry for your '+fx("[[7|loss]]")+'.</div><div class="zh">對於您的失去 (親人過世) 我感到很遺憾。</div></div>' +
  ops([
    ['lose', 'Vi./Vt.', '動詞'],
    ['lost', 'p.t./p.p.', '過去式/過去分詞'],
    ['loss', 'n.', '= the death of someone'],
    ['', '', '']
  ], 'C')
);

h += card('8', ['分詞構飾'], 'B',
  '<div class="stem"><div class="en">These include marigolds, candles, “the bread of the dead,” and '+fx("[[8|decorated]]")+' sugar skulls with the names of departed family members written on their foreheads.</div><div class="zh">這些包括金盞花、蠟燭、「死者麵包」，以及額頭上寫著已故家人名字的「裝飾過的」糖骷髏。</div></div>' +
  ops([
    ['decorate', 'vt. 裝飾', ''],
    ['decorated', 'adj. 被裝飾過的', '作為形容詞修飾 sugar skulls'],
    ['decorating', '', '無特殊意義'],
    ['decoration', 'n. 裝飾', '詞性不合']
  ], 'B')
);

// --- 挑戰題 3 ---
h += '<h2 id="p3">挑戰題 3</h2>';
h += card('9', ['分詞構句'], 'B',
  '<div class="stem"><div class="en">On the altars, they place photographs of their deceased loved ones as well as beverages and dishes that those family members had a preference for '+fx("[[9|while]]")+' alive.</div><div class="zh">在祭壇上，他們放置已故親人的照片，以及那些家人「生前」偏好的飲料和菜餚。</div></div>' +
  clue('while alive 為分詞構句 = while (they were) alive') +
  ops([
    ['what’s', '', 'what’s alive = 活著的東西'],
    ['while', '當...時', '主詞相同時省略 (they are)'],
    ['they are', '', 'for 為介系詞，其後不能直接有動詞'],
    ['being', '', 'had a preference for 已有受詞 that，不能再加 N']
  ], 'B')
);

h += card('10', ['關係副詞'], 'D',
  '<div class="stem"><div class="en">After this warm reception for the souls at home, it is usually late in the evening, and families head to the cemetery, '+fx("[[10|where]]")+' they decorate the graves of their loved ones and light one candle for each dead person.</div><div class="zh">在家中為靈魂舉行這場溫馨的接待後，通常已是深夜，家人們會前往墓地，在那裡裝飾親人的墳墓，並為每位死者點燃一根蠟燭。</div></div>' +
  clue('where = in which，修飾 the cemetery，後接完整子句') +
  ops([
    ['which', '', '後需接不完整子句'],
    ['while', '', '語意不合'],
    ['whereas', '', '語意不合'],
    ['where', '', '關係副詞修飾地方']
  ], 'D')
);

h += card('11', ['關係代名詞'], 'A',
  '<div class="stem"><div class="en">They agreed to install a new pedestrian gate to the cemetery, '+fx("[[11|which]]")+' they have done.</div><div class="zh">他們同意在墓地安裝一個新的行人登機門，這件事他們已經完成了。</div></div>' +
  clue('which 代替前面整句話的事實，作為 have done 的受詞 (不完整子句)') +
  ops([
    ['which', '', '關代當受詞，後方子句不完整'],
    ['where', '', '關副後需接完整子句'],
    ['in which', '', '同上'],
    ['when', '', '同上']
  ], 'A')
);

h += card('12', ['代名詞 / 分詞構句'], 'D',
  '<div class="stem"><div class="en">Cheerful and merry, '+fx("[[12|they]]")+' feast with the sacred souls and pray till dawn...</div><div class="zh">歡樂愉快的他們與神聖的靈魂一起享用盛宴，並祈禱到黎明...</div></div>' +
  clue('(As they were) Cheerful and merry, they... 主詞相同時可省略') +
  ops([
    ['who', '', '缺先行詞'],
    ['those', '', '語意不合'],
    ['which', '', '缺先行詞'],
    ['they', '', '代名詞作主詞']
  ], 'D')
);

// --- 挑戰題 4 ---
h += '<h2 id="p4">挑戰題 4</h2>';
h += card('13', ['代名詞'], 'C',
  '<div class="stem"><div class="en">Throughout the festival, colorful, cartoon-like representations of the dead can be seen everywhere. '+fx("[[13|These include]]")+' skeleton and skull cookies, candies, flags, and toys.</div><div class="zh">在整個節日期間，到處都可以看到色彩鮮豔、卡通般的死者代表物。這些包括骷髏和頭骨餅乾、糖果、旗幟和玩具。</div></div>' +
  clue('These 指代前面的 representations (複數名詞)') +
  ops([
    ['It includes', '', '單數，錯誤'],
    ['That includes', '', '單數，錯誤'],
    ['These include', '', '複數代名詞對應複數動詞'],
    ['Including', '', '會導致該句缺乏主要動詞']
  ], 'C')
);

h += card('14', ['不定詞表目的'], 'A',
  '<div class="stem"><div class="en">Many people also dress up in skeleton costumes, paint their faces '+fx("[[14|to resemble]]")+' skulls, and participate in performances and street parades.</div><div class="zh">許多人還會穿上骷髏服裝，把臉畫得像頭骨，並參加表演和街頭遊行。</div></div>' +
  ops([
    ['to resemble', '', '畫臉是「為了」像骷髏頭 (表目的)'],
    ['resembling', '', '分詞構句語意不通'],
    ['that resemble', '', '同上'],
    ['resembled', '', '語態不合']
  ], 'A')
);

h += card('15', ['轉折語'], 'D',
  '<div class="stem"><div class="en">While doing so, Mexicans aren’t mocking death. '+fx("[[15|Instead]]")+', they are recognizing it as an inevitable part of the natural cycle and would rather embrace it than ignore it.</div><div class="zh">在這樣做的同時，墨西哥人並不是在嘲笑死亡。相反地，他們將其視為自然循環中不可避免的一部分，寧願擁抱它也不願忽視它。</div></div>' +
  ops([
    ['On the other hand', '', '另一方面'],
    ['In other words', '', '換句話說'],
    ['In contrast', '', '形成對比的是'],
    ['Instead', '取而代之地', '通常前接否定句，後接肯定句']
  ], 'D')
);

h += card('16', ['字彙'], 'A',
  '<div class="stem"><div class="en">By inviting the dead to return and sharing the pleasures of life with them, Mexicans are '+fx("[[16|celebrating]]")+' the cycle of life itself.</div><div class="zh">藉由邀請死者回歸並與他們分享生活的樂趣，墨西哥人正在讚揚生命本身的循環。</div></div>' +
  ops([
    ['celebrating', '讚揚，歌頌', ''],
    ['completing', '完成', ''],
    ['repeating', '重覆', ''],
    ['devoting', '將…獻給', '']
  ], 'A')
);


// --- 課本句型實例 ---
h += '<h2 id="p5">課本句型實例</h2>';

h += '<div class="stem"><div class="zh" style="color:inherit">1. Taylor Swift is said to be releasing her new album next month. (進行式可表未來)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Taylor Swift is said to be releasing her new album next month.]]")+'</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">2. 據信銀行搶匪們已經捲款潛逃。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The bank robbers are believed to have run away / left with the money.]]")+'</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">3. 據說病毒是起源於一個生物實驗室。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The virus is said to have originated in/from a biology lab.]]")+'</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">4. 據報導這家公司的新車將配備(equip)有自動駕駛系統。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The company’s new car is reported to be equipped with an automated driving system.]]")+'</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">5. Uma寧可獨自一人也不要被打擾。(would)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Uma would rather be (left) alone than (be) disturbed/bothered.]]")+'</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">6. Henry寧可單身也不要結婚。(prefer)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Henry prefers to be/remain/stay single rather than be/get married.]]")+'</div></div>';

document.getElementById('app').innerHTML = h;

const secs=[
  ['p1','挑戰題 1'],
  ['p2','挑戰題 2'],
  ['p3','挑戰題 3'],
  ['p4','挑戰題 4'],
  ['p5','課本句型實例']
];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){
  open=!open;
  document.querySelectorAll('details.q').forEach(d=>d.open=open);
  this.textContent=open?'全部收合':'全部展開';
};
</script>
