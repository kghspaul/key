<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>304 Blackboard 3</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>304 Blackboard 3</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}
const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

let h1 = '';
h1 += '<h2 id="p1">304 Blackboard 3 內容詳解</h2>';

h1 += card("挑戰題1", ["間接問句", "what與how用法"], "D",
  st("Have you ever thought about [[挑戰題1|what it would be like]] to have a deceased loved one return and accompany you to a holiday celebration?", "你是否曾經想過，如果有已故的親人回來陪伴你過節，那會是什麼樣子？") +
  clue(`本題考點1：<br>
what與how的差別：what 為N，而how 為 adv。<br>
例 I don’t know what to do. O<br>
說明：do之後需要受詞，受詞必為N，故用what。<br>
I don’t know how to do my English homework. adv.<br>
說明：不缺S/O時，才可用副詞，故用how。<br><br>
本題考點2：<br>
what it would be like...為間接問句(當名詞子句)，作thought about的受詞。<br><br>
『間接問句』(亦即疑問詞所引導的名詞子句)需注意3點：<br>
1) 不需要倒裝！ 🡺 疑問詞 + S + V<br>
2) 當名詞子句，做主/受/補語用(可用if/whether或任何疑問詞)<br>
3) 時態需配合主要子句<br>
一般問句： What is your name? / Do you want another beer?<br>
間接問句： I asked her what her name was. / I asked her if/whether she wanted another beer.<br>
名詞子句當受詞用`) +
  ops([
    ["how would it be like", "10%", "how為副詞不可作like的受詞，且間接問句不倒裝"],
    ["what would it be like", "9%", "間接問句不倒裝"],
    ["how it would be like", "36%", "how為副詞不可作like的受詞"],
    ["what it would be like", "44%", ""]
  ], "D")
);

h1 += passage("補充：錯誤訂正", [[
  ["(X) She told me [[|how]] her freshman year was like.", "她告訴我她的大一生活是什麼樣子。"],
  ["(O) She told me [[|what]] her freshman year was like.", ""]
], [
  ["(X) Jessica is wondering how [[|can she]] improve her English before she goes to England.", "Jessica想知道去英國前該如何改善英文。"],
  ["(O) Jessica is wondering how [[|she can]] improve her English before she goes to England.", ""]
]]);

h1 += card("L2", ["使役動詞用法"], "N/A",
  st("have 當使役動詞有下面三種用法：<br>have + O + VR (使…做)<br>He had his dog fetch the paper.<br><br>have + O + Ving (使…反覆做)<br>He had his dog fetching the ball in the park.<br><br>have + O + p.p. (使…被…)<br>He had his dog locked in the house.", "have 當使役動詞的用法")
);

h1 += passage("L2 練習解答", [[
  ["You had better have your air conditioner [[|fixed]] because it is leaking.", "你最好找人把冷氣修好，因為它在漏水。"],
  ["He's always got the stereo [[|playing]] full blast (= loudly).", "他總是把音響開到最大聲。"]
]]);

h1 += card("L4", ["關係副詞", "非限定用法"], "C",
  st("The idea may scare you to death or at least make your hair stand on end, but this is the essential concept behind the Day of the Dead in Mexico[[, where| ]]people celebrate death with joy and humor rather than mourn it with sorrow.", "這個想法可能會把你嚇死，或者至少讓你毛骨悚然，但這正是墨西哥亡靈節背後的核心概念，在那裡，人們用歡樂和幽默來慶祝死亡，而不是用悲傷來哀悼它。") +
  clue(`L6 , where ... sorrow = 非限定形容詞子句，用以修飾先行詞Mexico<br><br>
下列情況要用非限定的關係子句或分詞 (前需加逗點)：<br>
(1) 獨一無二(常為專有名詞，但並不限於專有名詞)<br>
Our new car, which we bought last month, seats five people. (我們只有一輛新車 → 獨一無二)<br><br>
(2) 補充資訊(此時關係子句是用來補充額外訊息，而非用來限定前面的名詞)<br>
I was fascinated by the girl, who was so friendly and charming. (非限定子句)<br>
關代 = 連接詞 + N 🡺 此句中 who = because she<br><br>
比較：<br>
I was fascinated by the girl who was so friendly and charming. As for the other girls, I found them proud and stupid. (限定子句)`) +
  ops([
    ["which", "7%", "which後需接不完整子句"],
    ["where", "7%", "無逗點，無法作為非限定補充修飾獨一無二的地名Mexico"],
    [", where", "58%", "後接完整子句，且為非限定用法"],
    [", which", "29%", "which後需接不完整子句"]
  ], "C")
);

h1 += passage("L6 補充", [[
  ["celebrate death with joy and humor", "以歡樂和幽默來慶祝/讚揚/歌頌死亡"]
]]);

h1 += card("L7", ["詞彙辨析: reunite vs reunion"], "N/A",
  st("On this joyous occasion, family members gather for a reunion in honor of those who have moved on to the afterlife.", "在這個歡樂的場合，家人團聚在一起，向那些已故進入來世的人致敬。") +
  clue(`請問本句裡的 gather for a reunion是否可改成 are reunited？<br>
reunite / reunion並非只有詞性不同，意義也有出入：<br>
be reunited 通常指失散已久的人重聚<br>
The children were finally reunited with their families.<br>
The band will reunite for this show only.<br><br>
reunion 則只是因工作、居住地不同，而不常見面的人重聚(同學會、家人團圓)<br>
a family reunion 家人團圓(過節等)<br>
a high-school reunion 高中同學會`)
);

h1 += passage("L7 / L9 補充", [[
  ["on … occasion", "在…場合/時候"],
  ["I've seen Jana with them on several occasions.", "我曾在幾個場合看到Jana和他們在一起。"],
  ["those who = people who", "那些…的人"]
]]);

h1 += card("L10", ["不定詞完成式", "被動語態"], "A",
  st("The Day of the Dead is thought [[L10|to have originated]] centuries ago with the Aztecs.", "亡靈節被認為起源於幾個世紀前的阿茲特克人。") +
  clue(`to have pp 表示這個動作發生的時間比主要子句中的動詞早<br>
I seem to have lost my English textbook.<br>
He is said to have been a successful businessman.<br><br>
originate in some place 起源於(某地)<br>
originate from/with sb 來自(某人、某物)<br>
The style of architecture originated in ancient Greece.<br>
= The style of architecture originated from/with the ancient Greeks.`) +
  ops([
    ["to have originated", "48%", "起源為發生在過去的動作，且originate為不及物動詞不需被動"],
    ["to originate", "7%", "未表達出發生在主要子句動詞之前的過去時間"],
    ["to be originated", "26%", "originate不需被動態"],
    ["to have been originated", "20%", "originate不需被動態"]
  ], "A")
);

h1 += passage("L11-L12 補充", [[
  ["Nowadays, it is celebrated passionately throughout Mexico on November 1 and 2.", "如今，在11月1日和2日，整個墨西哥都在熱烈慶祝它。"],
  ["throughout Mexico", "墨西哥各處"],
  ["throughout + 地方", "遍及某處"],
  ["throughout + 時間", "整個時期"],
  ["African swine fever spread throughout Asia except for Taiwan and Japan.", "非洲豬瘟蔓延整個亞洲，除了台灣和日本。"],
  ["We are open every weekend throughout the year.", "我們全年每個週末都營業。"]
]]);

h1 += card("L13", ["關係副詞", "時間先行詞"], "D",
  st("Traditionally, deceased children are honored on Nov. 1, while Nov. 2 is the day [[L13|when]] departed adults are the main focus.", "傳統上，已故的兒童在11月1日受到紀念，而11月2日則是紀念已故成人的日子。") +
  clue(`when departed … focus 🡺 關係副詞引導的形容詞子句，用以修飾先行詞the day<br>
when (關副) = 連接詞 + 時間副詞 = and + on this day = 介 + 關代 = on + which<br><br>
L13 honor vt. = show respect for 向…表達敬意<br>
He was honored for his bravery. 他因表現英勇而受到表彰<br><br>
L13 deceased = departed = dead<br><br>
L14 while為連接詞，在本句的意思為「而」，表對比。<br>
Frank enjoys milk chocolate, while Matt prefers dark chocolate.`) +
  ops([
    ["which", "11%", "which後需接不完整子句，應改為on which"],
    ["in which", "15%", "介系詞錯誤，應為on which"],
    ["that", "19%", "作為關係副詞時，that前不可加介系詞，且不如when明確"],
    ["when", "55%", "關係副詞，引導完整子句修飾時間名詞the day"]
  ], "D")
);

h1 += card("L15", ["字彙選擇: alive/living/live", "the + adj."], "B",
  st("During these 48 hours, the souls of the dead are believed to return to earth to visit their [[L15|living]] family members.", "在這48小時內，死者的靈魂被認為會返回人間探望他們在世的家人。") +
  clue(`L15 the + adj. = adj. + people<br>
the dead = dead people<br>
the rich = rich people`) +
  ops([
    ["alive", "30%", "adj. 活著的 (不能放名詞前) 例：My grandparents are still alive."],
    ["living", "65%", "adj. 活著的，可放名詞前修飾"],
    ["live", "1%", "adj. / adv. 現場演出的 (如 a live radio show) 或 活的 (只用於名詞前，且通常用在動物上 例：Protesters want to stop experiments on live animals.)"],
    ["lived", "3%", "被居住"]
  ], "B")
);

h1 += card("L17", ["指示代名詞 those", "關係代名詞"], "C",
  st("Instead of fearing the spirits of [[L17|those]] they have lost, Mexicans anticipate their arrival and prepare for it.", "墨西哥人非但不害怕他們失去的親人的靈魂，反而期盼他們的到來並為此做準備。") +
  clue(`those they have lost = those (people) (that/whom) they have lost 他們死去的家人`) +
  ops([
    ["which", "15%", "缺先行詞"],
    ["what", "27%", "= the thing which，the spirits of what they have lost 🡺 他們失去之物的靈魂？語意不通"],
    ["those", "51%", "代表 those people"],
    ["that", "7%", "that前不可有介系詞"]
  ], "C")
);

h1 += card("L17-補充", ["字彙測驗: loss"], "C",
  st("(At a funeral) My condolences. (請節哀) = I’m sorry for your [[L17-補充|loss]].", "（在葬禮上）請節哀。 = 對你的失去我感到很遺憾。") +
  clue("") +
  ops([
    ["lose", "", "Vi./Vt. 動詞"],
    ["lost", "", "p.t. / p.p. 動詞過去式或過去分詞"],
    ["loss", "", "n. = the death of someone 名詞 例：She must be feeling very lonely after the loss (=death) of her husband."]
  ], "C")
);

h1 += card("L19", ["分詞作形容詞", "with + O + OC"], "B",
  st("These include marigolds, candles, “the bread of the dead,” and [[L19|decorated]] sugar skulls with the names of departed family members written on their foreheads.", "這些包括萬壽菊、蠟燭、「亡靈麵包」，以及裝飾過的糖骷髏，上面寫著已故家人的名字。") +
  clue(`邏輯排列： N1, N2, N3, and N4<br>
These include marigolds, candles, “the bread of the dead,” and decorated sugar skulls with the names of departed family members written on their foreheads.<br><br>
本句另一重點：with + O + OC<br>
These include marigolds, candles, “the bread of the dead,” and decorated sugar skulls with(介) the names of departed family members(O) written(OC) on their foreheads.`) +
  ops([
    ["decorate", "25%", "vt. 裝飾 (動詞原形不符語法)"],
    ["decorated", "62%", "adj. 被裝飾過的"],
    ["decorating", "12%", "現在分詞，語意不合"],
    ["decoration", "1%", "n. 裝飾 (語意不合)"]
  ], "B")
);

h1 += passage("L22 混合題", [[
  ["What does the author mean by \"their\" in the previous question?", "前一題中作者的 \"their\" 是什麼意思？"],
  ["Answer: L18: (decorated) sugar skulls’", "答案：裝飾過的糖骷髏的"]
]]);

h1 += passage("L23 補充", [[
  ["They also tidy and restore the graves and cemeteries where their family members are buried.", "他們還清理並修復了埋葬家人的墳墓和墓地。"],
  ["*where 引導形容詞子句，修飾 graves and cemeteries", ""]
]]);

h1 += passage("L25 補充", [[
  ["On the Day of the Dead, families assemble colorful altars in their homes to welcome returning spirits.", "在亡靈節這天，家人會在家中搭建色彩繽紛的祭壇來迎接歸來的靈魂。"]
]]);

h1 += card("L26", ["分詞構句"], "B",
  st("On the altars, they place photographs of their deceased loved ones as well as beverages and dishes that those family members had a preference for [[L26|while]] alive.", "在祭壇上，他們放置了已故親人的照片，以及那些家人在世時偏好的飲料和菜餚。") +
  clue(`while alive為分詞構句 = while (they were) alive<br>
*主詞相同時可省略 “連接詞+主詞+be”<br>
*連接詞在語意有需要時可選擇保留<br>
★此原則請用於閱讀理解，不建議用於寫作<br><br>
L27 loved ones ≒ 至親好友<br><br>
L28 as well as 重點：<br>
1. 用在連接詞性對等的字或片語<br>
2. 通常只用在肯定句<br>
3. 不可用來連接句子。<br>
He was kind as well as sensible.<br>
They sell books as well as newspapers.<br>
4. 動詞需配合as well as前的名詞<br>
Tom as well as his parents is a big fan of the band.<br>
5. 連接動詞時，第2個動詞需改為動名詞<br>
The organization gives help to people in need, as well as raising money for local charities.`) +
  ops([
    ["what’s", "10%", "what's alive 🡺 活著的東西，語意不合"],
    ["while", "41%", "連接詞保留，省略了 they were"],
    ["they are", "3%", "for為介系詞，其後不能直接接子句"],
    ["being", "46%", "had a preference for已有受詞that，不能再加N"]
  ], "B")
);

h1 += card("挑戰題3-2", ["關係副詞 vs 介系詞+關係代名詞"], "D",
