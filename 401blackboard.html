<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>401 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>401 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

/* === Part 1: L1 ~ L49 講解與非題目例句依序呈現 === */
const h1 = '<h2 id="p1">L1 ~ L49 課文講解</h2>' + [
  card("L1", ["地方副詞倒裝", "there + V + S"], "C",
    st("Once upon a time in a faraway, isolated kingdom, [[L1|there]] lived a king who ruled the land with an iron fist.", "從前在一個遙遠、孤立的王國裡，住著一位以鐵腕統治國家的國王。") +
    clue("→ <code>in the kingdom there lived a king …</code>（地 adv. + Vi/Be + S）<br>注意：必須是不及物動詞或 be 動詞才可用此句型，被動和及物動詞不適用。") +
    ops([
      ["where", "25%", "where + 完子（不倒裝），且會使整句缺主要子句。"],
      ["which", "34%", "不合理，lived 為不及物動詞且整句缺主要子句。"],
      ["there", "31%", "引導存在句型 <code>there lived a king...</code>。"],
      ["in which", "10%", "in which + 完子（不倒裝），且會使整句缺主要子句。"]
    ], "C") +
    passage("L1 補充例句", [[
      ["Here comes the bus.", "公車來了。"],
      ["In the classroom were 40 students.", "教室裡有四十名學生。"]
    ]])
  ),

  card("L3", ["介系詞 vs. 連接詞", "表原因"], "B",
    st("This king was considered (to be) unfair and cruel, primarily [[L3|due to]] his “unique” sense of justice.", "這位國王被認為既不公平又殘酷，主要是因為他「獨特」的正義感。") +
    clue("∵ <code>owing to / due to / because of</code> 都是『介系詞』<br>∴ 後面只能有『名詞』不能有『動詞』，此外需有主要子句。<br>• <code>because / since</code> 是連接詞，後面要有『句子』(S + V…)<br>• <code>result from</code> (起因於) / <code>result in</code> (導致) 是動詞片語，前後皆為名詞，分別當主詞和受詞。") +
    ops([
      ["because", "4%", "連接詞，後面要有句子 (S + V…)。"],
      ["due to", "76%", "介系詞片語，後接名詞片語 <code>his “unique” sense of justice</code>。"],
      ["result from", "18%", "動詞片語（起因於），前後皆須為名詞當主詞與受詞。"],
      ["result in", "2%", "動詞片語（導致），前後皆須為名詞當主詞與受詞。"]
    ], "B") +
    passage("L3 補充例句", [[
      ["He retired because of ill health.", "他因為健康不佳而退休。（主要子句 + 介 + 名）"],
      ["= He retired because he was not healthy.", "他因為健康不佳而退休。（連 + S + V…，because 後的 S 和 Be 不可省）"],
      ["= His retirement resulted from his illness.", "他的退休起因於他的疾病。（名詞當主詞 + resulted from + 名詞當受詞）"],
      ["= His illness resulted in his retirement.", "他的疾病導致了他的退休。"]
    ]])
  ),

  card("L4", ["動詞時態", "過去習慣 would", "過去完成式"], "B",
    st("Each time a man was accused of a crime, the king [[L4|would never rely]] on evidence to prove the man’s guilt or innocence.", "每次有人被指控犯罪時，國王從不依賴證據來證明此人的有罪或清白。") +
    clue("*1 <code>each time</code> → 每次 → 習慣：<code>would</code> 可用來表示過去習慣、經常。<br>*2 一個句子有兩個過去時間或動作時，先發生的需用過去完成式。若沒有 2 個過去時間或動作則不可用。<br>*3 含有 <code>time</code> 的片語（省略 when）常可視為連接詞。") +
    ops([
      ["had never relied", "28%", "無兩個過去時間或動作的先後對比，不可用過去完成式。"],
      ["would never rely", "47%", "<code>would + VR</code> 表過去習慣、經常。"],
      ["has never relied", "19%", "現在完成式與過去式背景不合。"],
      ["didn’t rely", "6%", "缺乏 never 語氣與過去習慣的常態感。"]
    ], "B") +
    passage("L4 補充例句", [[
      ["When we worked in the same office, we would have coffee together.", "當我們在同一間辦公室工作時，我們常一起喝咖啡。"],
      ["On summer evenings they would sit out in the garden.", "在夏日的傍晚，他們常坐在花園裡。"],
      ["I fell asleep in Professor Li’s class.", "我在李教授的課堂上睡著了。（只有一個過去動作，故用過去式即可）"],
      ["I had fallen asleep before Professor Li even began his class.", "在李教授開始上課前，我就已經睡著了。（兩個過去動作，先發生者 fall asleep 用過去完成式）"],
      ["1. Every time I see her, she is smiling.", "每次我看到她，她都在微笑。"],
      ["2. By the time we arrived, the movie had already started.", "到我們抵達時，電影已經開始了。"],
      ["3. The next time you come, bring your laptop.", "下次你來時，帶著你的筆電。"],
      ["4. Any time you need help, just call me.", "任何時候你需要幫忙，打給我即可。"],
      ["5. The first time I visited Paris, I fell in love with the city.", "我第一次造訪巴黎時，就愛上了這座城市。"],
      ["6. The last time we met, we discussed the project.", "我們上次見面時，討論了這個專案。"]
    ]])
  ),

  card("L7", ["假設語氣", "要命建堅 + (should) VR"], "C",
    st("Rather, he believed that the gods decided the suspect’s fate and insisted that the suspect [[L7|be put]] on public trial.", "相反地，他相信眾神決定嫌犯的命運，並堅持嫌犯應接受公開審判。") +
    clue("<code>rather = instead</code> 取而代之地 (adv.)；<code>put sb on trial</code> 審判…。<br>有『要命建堅』含意的動詞，後面的子句需用 VR（因省略 should）：<br>• (要求) <code>ask, demand, require, request</code><br>• (命令) <code>order, command, direct</code> + <code>that S (should) VR</code><br>• (建議) <code>suggest, recommend, propose, urge, move</code><br>• (堅持) <code>insist</code>") +
    ops([
      ["put", "28%", "嫌犯是「被審判」，主動錯誤。"],
      ["to put", "3%", "that 子句內不可用不定詞。"],
      ["be put", "28%", "省略 should 的被動原形 <code>(should) be put</code>。"],
      ["to be put", "41%", "不可加 to。"]
    ], "C") +
    passage("L7 補充例句", [[
      ["He urged that the policy be adopted.", "他強烈建議該政策應被採納。"]
    ]])
  ),

  card("L8", ["詞性：the + adj.", "單複數同形"], "D",
    st("The [[L8|accused]] would be brought to the center of an amphitheater filled with people.", "被告會被帶到擠滿群眾的圓形競技場中央。") +
    clue("通常 <code>the + adj. = adj. + people</code> 泛指具有某種特性或特質的人，例如：<code>the poor</code>（窮人）、<code>the rich</code>（富人）、<code>the disadvantaged</code>（弱勢族群），以上通常都視為複數名詞。<br>但有些用語可指單數或複數名詞，應視上下文而定，例如：<code>the accused</code>（被指控者，1 個或多個）、<code>the deceased</code>（死者，1 個或多個）。") +
    ops([
      ["accuses", "22%", "動詞第三人稱單數。"],
      ["accusing", "13%", "現在分詞表主動。"],
      ["accuser", "31%", "原告、指控者。"],
      ["accused", "34%", "<code>the accused</code> 被指控者（被告）。"]
    ], "D")
  ),

  card("L10", ["地方副詞倒裝", "地 adv. + Vi/Be + S"], "A",
    st("Directly opposite the person (who was) on trial [[L10|would be]] two closed doors, (which were) exactly alike and side by side.", "正對著受審者的會是兩扇緊閉的門，完全一模一樣且並排著。") +
    clue("<code>地 adv. + Vi/Be + S</code>：注意必須是不及物動詞或 be 動詞才可用此句型，被動和及物動詞不適用。<br>• <code>close</code> adj./adv. 靠近的／親近的；<code>closely</code> adv. 緊密的／密切的<br>• <code>closed</code> adj. 關閉的；<code>close</code> vt./vi. 關閉（無「靠近」之意）") +
    ops([
      ["would be", "34%", "Be 動詞構成地方副詞倒裝。"],
      ["would be placed", "31%", "被動語態不適用此句型。"],
      ["would have", "6%", "及物動詞不適用此句型。"],
      ["would face", "28%", "及物動詞不適用此句型。"]
    ], "A") +
    passage("L10 補充例句", [[
      ["Here comes the bus.", "公車來了。"],
      ["In the classroom were 40 students.", "教室裡有四十名學生。"],
      ["I don't mind where we go on vacation as long as it's close to a beach.", "只要靠近海灘，我不介意我們去哪裡度假。"],
      ["She kept her eyes tightly closed.", "她緊閉雙眼。"],
      ["We are all working closely with each other.", "我們大家都在彼此密切合作。"],
      ["Beth closed her eyes and tried to sleep.", "貝絲閉上眼睛試著入睡。"]
    ]])
  ),

  card("L12", ["轉折與順序副詞", "上下文邏輯"], "A",
    st("The accused (person) would [[L12|then]] be forced to open one of the two doors.", "接著被告會被迫打開這兩扇門的其中一扇。") +
    clue("依審判流程順序，被告接著（then）被迫打開其中一扇門。") +
    ops([
      ["then", "81%", "然後。"],
      ["therefore", "9%", "因此。"],
      ["however", "3%", "然而。"],
      ["further", "6%", "更進一步。"]
    ], "A")
  ),

  card("L14", ["易混淆動詞", "lie / lay 三態", "讓步倒裝"], "C",
    st("(As) identical as the doors looked, what [[L14|lay]] behind them was very different.", "儘管這兩扇門看起來一模一樣，門後的事物卻截然不同。") +
    clue("*1 <code>(as) + adj./adv. + as + S + V…</code> = 雖然 (adv. conj.)<br>動詞三態與 V-ing：<br>• 躺/位於/存在：<code>lie, lay, lain, lying</code><br>• 說謊：<code>lie, lied, lied, lying</code><br>• 放置：<code>lay, laid, laid, laying</code>") +
    ops([
      ["lied", "24%", "說謊的過去式。"],
      ["laid", "25%", "放置的過去式（若用此字需改為被動 <code>was laid</code>）。"],
      ["lay", "51%", "位於（lie）的過去式。"],
      ["lain", "0%", "過去分詞，不可單獨當動詞。"]
    ], "C") +
    passage("L14 補充例句", [[
      ["(As) much as I respect him, I still have to disagree with him on this.", "儘管我非常尊敬他，在這件事上我仍必須不同意他。"],
      ["(As) strange as it may seem, I never really wanted to be rich.", "儘管這看起來可能很奇怪，但我從未真正想成為有錢人。"]
    ]])
  ),

  card("L15", ["不定代名詞", "one ... the other"], "D",
    st("Behind one door was a fierce, man-eating tiger, and behind [[L15|the other]] was a beautiful young woman.", "一扇門後是一隻兇猛的食人虎，而另一扇門後則是一位美麗的年輕女子。") +
    clue("凡是有明確總數（2 扇門）時，最後一個皆用 <code>the other</code>。<br><code>another</code> 為單數（源自 an + other），故 <code>others</code> 可視為 another 的複數。因此，<code>other</code> 不可單獨出現，一定要加 the 或加 -s。<br>• <code>another (+ 單數N)</code>：額外（明確總數以外）的另一個<br>• <code>the other + N</code> 或 <code>the other</code>：剩下的那一個（通常前文會提到一個明確總數）<br>• <code>the others</code>：剩下的那些人事物（= <code>the other + 複N</code>）<br>• <code>others</code>：其他的人事物（= <code>other + 複N</code>）") +
    ops([
      ["other", "2%", "不可單獨出現。"],
      ["others", "2%", "複數代名詞。"],
      ["another", "24%", "不特定或額外的另一個。"],
      ["the other", "67%", "兩扇門中剩下的那一個。"]
    ], "D") +
    passage("L15 補充例句", [[
      ["I'm going to have another cup of coffee.", "我要再喝一杯咖啡。"],
      ["I just drank two cups of coffee but I think I need another.", "我剛喝了兩杯咖啡，但我想我還需要另一杯。（雖有明確總數 two，但 another 並非包含在明確總數以內）"],
      ["I have two flowers. One is red, and the other (one) is yellow.", "我有兩朵花。一朵是紅的，剩下的那朵是黃的。"],
      ["I parked on the other side of the street.", "我把車停在街道的另一邊。（街道只有兩邊，另一邊 = 剩下的那一邊）"],
      ["We stayed until [the other guests / the others] had left.", "我們一直待到其他剩下的客人離開。"],
      ["(X) We should learn to think for other. → (O) We should learn to think for [other people / others].", "我們應該學會為他人著想。"]
    ]])
  ),

  card("L17", ["轉折詞辨析", "In other words"], "A",
    st("[[L17|In other words]], one door would ultimately lead to death for the accused, while the other would lead to glory.", "換言之，一扇門最終會使被告走向死亡，而另一扇門則通往榮耀。") +
    clue("<code>in/by contrast</code> adv. 形成對比的是（用來比較兩個不同的人事物）。此處句首是重述前一句「一扇門是老虎、一扇門是美女」的結果，故用「換言之（In other words）」。") +
    ops([
      ["In other words", "76%", "換言之。"],
      ["For instance", "6%", "例如。"],
      ["On the other hand", "2%", "在另一方面（≒ however）。"],
      ["In contrast", "16%", "形成對比的是。"]
    ], "A") +
    passage("L17 補充例句", [[

      ["(1) In spite of / (2) frequent","21% / 5%","frequent 頻繁的。"],
      ["(1) In case of / (2) effective","23% / 40%","effective 有效的。"],
      ["(1) In conjunction with / (2) included","36% / 6%","(1) D (In conjunction with) 正確。"]
    ], "D") +
    passage("牛刀小試 ⑩ 補充例句", [[
      ["In view of what you've said, I think we should reconsider our proposed course of action.", "考慮到你剛才所說的，我認為我們應該重新考慮擬訂的行動計劃。"],
      ["There is a team of writers working in conjunction (with each other) on the book.", "有一個作家小組在合作撰寫這部書。"]
    ]])
  )
].join('');

/* === Part 4: 句型練習 === */
const h4 = '<h2 id="p4">句型練習與參考答案</h2>' + [
  card("句1-1", ["句型1", "suggest that S (should) VR"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">1. 醫生建議我們常洗手並且避開人多的地方。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Doctors suggest that we (should) wash our hands regularly and avoid crowded places.]]")+'</div></div>' + clue("對照與修正：<code>Doctors advised that we (should) wash our hands often and avoid <del>(visiting)</del> <del>public</del> crowded places.</code>")),
  card("句1-2", ["句型1", "insist that S (should) VR"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">2. 那位服務生堅持我在進餐廳之前得戴上口罩。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|The waiter insisted that I (should) put on a mask before I entered/went into the restaurant.]]")+'</div></div>' + clue("對照與修正：<code><del>That</del> The waiter insisted that I <del>wear</del> put on <del>the</del> a mask before entering <del>into</del> the restaurant.</code>")),
  card("句1-3", ["句型1", "order that S (should) VR"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">3. 船長命令全體船員棄船 (abandon ship)。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|The captain ordered that the crew (should) abandon ship.]]")+'</div></div>' + clue("對照與修正：<code>The captain ordered all the sailors to abandon ship.</code>（若用 order sb to VR，to 不可省）。")),
  card("句1-4", ["句型1", "demand that S (should) be p.p."], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">4. 有些人要求該布條 (banner) 應撤下。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Some people demanded that the banner (should) be taken down.]]")+'</div></div>' + clue("對照與修正：<code>Some people asked that the banner be <del>moved away</del> removed.</code>")),
  card("句1-5", ["句型1", "propose that S (should) not be p.p."], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">5. 該專家提議這則影片不應公諸於世。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|The expert proposed that the video (should) not be made public.]]")+'</div></div>' + clue("對照與修正：<code>The expert proposed that this video <del>to</del> not be made public.</code>")),
  card("句2-1", ["句型2", "(As) + adj. + as + S + V"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-1：儘管這個房間又小又舊，裡面卻非常舒適溫馨。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|(As) small and old as the room is, it is very cozy inside.]]")+'</div></div>'),
  card("句2-2", ["句型2", "(As) + adv. + as + S + V"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-2：儘管珍妮在圖書館裡講手機已經很小聲了，她還是打擾到了其他人。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|(As) quietly as Jenny spoke on her cell phone, she still disturbed other people in the library.]]")+'</div></div>'),
  card("句2-3", ["句型2", "(As) + adj. + as + S + may seem"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-3：儘管這隻怪獸看起來可能很嚇人，牠卻有一顆善良的心。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|(As) scary as the monster may seem, it has a kind heart.]]")+'</div></div>'),
  card("句2-4", ["句型2", "(As) + adv. + as + S + V"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-4：儘管竊賊已經非常小心地開門了，他還是觸發了防盜警報器。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|(As) carefully as the burglar opened the door, he still triggered the security alarm.]]")+'</div></div>')
].join('');

document.getElementById('app').innerHTML = h1 + h2 + h3 + h4;
const secs=[['p1','L1~L49 課文講解'],['p2','重點1 & 牛刀小試'],['p3','重點2 & 牛刀小試'],['p4','句型練習']];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){open=!open;document.querySelectorAll('details.q').forEach(d=>d.open=open);this.textContent=open?'全部收合':'全部展開';};
</script>
<script src="bookmark.js"></script>
</body>
</html>
