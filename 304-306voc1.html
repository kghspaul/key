let appHtml = '';
let navHtml = '';
let qNum = 1;
let secId = 1;
let currentWord = '';

const lines = rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0 && l !== '|');

for (let i = 0; i < lines.length; i++) {
  let line = lines[i];
  if (line.startsWith('Lesson')) {
    let sId = 'sec' + secId++;
    appHtml += '<h2 id="' + sId + '">' + line + '</h2>';
    navHtml += '<a href="#' + sId + '">' + line + '</a>';
  } else if (!line.startsWith('|')) {
    currentWord = line;
  } else {
    let sentenceData = line.substring(1).trim();
    // 尋找最後一個句點/問號/驚嘆號，並確認其後沒有空格，即可無縫分離中英文
    let zhStart = -1;
    for(let j = 0; j < sentenceData.length - 1; j++){
       if(sentenceData[j] === '.' || sentenceData[j] === '!' || sentenceData[j] === '?'){
           if(sentenceData[j+1] !== ' '){
               zhStart = j + 1;
               break;
           }
       }
    }
    
    let en = sentenceData;
    let zh = '';
    if(zhStart !== -1){
        en = sentenceData.substring(0, zhStart);
        zh = sentenceData.substring(zhStart);
    }
    
    // 把 a____ts 自動轉換為底色挖空填空格式
    en = en.replace(/[a-zA-Z]*_+[a-zA-Z]*/g, '[[|' + currentWord + ']]');
    
    let body = '<div class="para"><div class="s"><div class="en">' + fx(en) + '</div><div class="zh">' + zh + '</div></div></div>';
    let clueHtml = clue('本題測驗單字「<b>' + currentWord + '</b>」。請根據句意「' + zh + '」推敲，填入正確的字彙。');
    appHtml += card(qNum++, ['文意字彙', '詞性需求：單字'], currentWord, body + clueHtml);
  }
}

navHtml += '<button id="tg">全部收合</button><a href="review.html" class="review-btn" target="_blank">📚 前往總複習</a>';
document.getElementById('nav').innerHTML = navHtml;
document.getElementById('app').innerHTML = appHtml;
