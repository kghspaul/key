<meta charset="UTF-8">

<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>301大卷詳解</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

/* === I. 文意字彙與詞類變化 === */
const h1 = '<h2 id="p1">I. 文意字彙與詞類變化（配分 20%，每題 2 分）</h2>'
+ card(1, ["考點：動詞用法＋句型搭配 (prompt sb. to V)", "詞性需求：過去式動詞 (V-ed)"], "prompted",
  '<div class="stem"><div class="en">'+fx("The unreasonably heavy workload [[1|prompted]] Jennifer to consider quitting her job soon.")+'</div><div class="zh">這極度不合理且沉重的工作量，促使（驅使）珍妮佛考慮儘快辭職。</div></div>'
  + clue("句中主詞是 heavy workload，後方受詞加受詞補語結構為 “Jennifer to consider quitting”。能配合首尾字母 p______ted 且表示「促使、激勵某人去做某事」的動詞即為 prompt + O + to V；依據時態填入過去式 prompted。")
  + '<h4>形近與延伸辨析：何時才對</h4><p style="margin:2px 0"><b>prompt</b>（v. 促使、引起）；形容詞用法表示「迅速敏捷的」（如：<i>a prompt response</i> 迅速的回覆）。<br><b>易混淆字：promoted</b>（v. 晉升、宣傳）若填入句意會變成「重擔晉升了珍妮佛」，文意荒謬且字尾字母不合。何時才對：<i>Hard work promoted Jennifer to the position of manager.</i>（努力工作使珍妮佛晉升為經理。）</p>')

+ card(2, ["考點：連綴動詞與並列形容詞", "詞性需求：形容詞 (adj.)"], "drowsy",
  '<div class="stem"><div class="en">'+fx("Patients are warned not to drive after taking this medicine because it may make them feel [[2|drowsy]] or dizzy.")+'</div><div class="zh">病患被警告在服用這種藥物後切勿開車，因為這可能會讓他們感到昏昏欲睡或頭暈。</div></div>'
  + clue("句中出現警告 “not to drive after taking this medicine”（服藥勿開車），以及由對等連接詞 or 連接的形容詞 dizzy（暈眩的）。連綴動詞 feel 後需接形容詞，表示服藥副作用「昏昏欲睡」且符合 d______y 的字即為 drowsy（想睡的）。")
  + '<h4>延伸辨析：何時才對</h4><p style="margin:2px 0"><b>drowsy</b> 常見搭配為 feel / become drowsy。<br><b>名詞形：drowsiness</b>（n. 睡意）在 “feel + [adj.] or dizzy” 的結構中詞性不符。何時才對：必須搭配及物動詞受詞結構，如 <i>This medicine may cause drowsiness.</i>（這種藥可能會引起睡意。）</p>')

+ card(3, ["考點：及物動詞語意（僱用）", "詞性需求：過去式動詞 (V-ed)"], "employed",
  '<div class="stem"><div class="en">'+fx("To handle the increased workload, the store [[3|employed]] many part-time workers during the busy holiday season.")+'</div><div class="zh">為了應付增加的工作量，這家商店在忙碌的假期旺季期間僱用了許多工讀生。</div></div>'
  + clue("主詞為 the store，受詞為 many part-time workers（許多兼職員工）。為了解決激增的工作量，店家所採取的動作是「僱用」；字頭結尾提示 e______yed，故答案為 employed（過去式）。")
  + '<h4>延伸概念＆詞類家族：何時才對</h4><p style="margin:2px 0"><b>employ</b>（v. 僱用）同義詞有 hired / took on。<br><b>名詞形：employment</b>（n. 就業、僱用）何時才對：<i>She found full-time employment after graduation.</i>（她畢業後找到了全職工作。）另可衍生 <b>employer</b>（n. 雇主）、<b>employee</b>（n. 員工）。</p>')

+ card(4, ["考點：名詞比喻用法與固定搭配", "詞性需求：單數可數名詞 (N)"], "sparkle",
  '<div class="stem"><div class="en">'+fx("There was a [[4|sparkle]] in the little boy's eyes when he saw his father come to pick him up earlier than usual.")+'</div><div class="zh">當小男孩看到父親比平常更早來接他時，他的眼中閃爍著喜悅的光芒。</div></div>'
  + clue("前方有不定冠詞 a，後方搭配介系詞片語 “in the little boy’s eyes”（在眼神中）。英文中描述喜悅、興奮時眼神發亮，固定說法為 a sparkle in one’s eyes（眼神閃爍光彩）。")
  + '<h4>易混淆字：何時才對</h4><p style="margin:2px 0"><b>sparkle</b>（n. 閃耀、光芒）搭配 in one’s eyes。<br><b>易混淆字：smile</b>（n. 微笑）雖然也是 s______e，但通常是 <i>a smile on one’s face</i>（臉上的笑容），一般不會說在眼睛裡面的 smile；描寫眼神發亮最道地的用字就是 <b>sparkle</b>。</p>')

+ card(5, ["考點：動詞片語（伸出雙臂）", "詞性需求：過去式動詞 (V-ed)"], "stretched",
  '<div class="stem"><div class="en">'+fx("Seeing his mother coming home, Justin opened the front door and [[5|stretched]] out his arms to help her with the groceries.")+'</div><div class="zh">一看到媽媽回家，賈斯汀打開大門並伸出雙臂，幫忙拿採買的食品雜貨。</div></div>'
  + clue("後方緊接著介系副詞與受詞 “out his arms”。英文中「伸出雙臂」的典型動詞片語是 stretch out one’s arms。由前文對等連接詞前之過去式 opened 可知此處需填過去式動詞，結尾為 s______hed，故填 stretched。")
  + '<h4>同義片語辨析：何時才對</h4><p style="margin:2px 0"><b>stretch out one’s arms</b>（伸展／伸出雙臂）。<br><b>同義片語：reach out one’s arms / hands</b> 亦表「伸出手臂」，但其字首為 r；此處限制 s______hed，唯一的標準用字為 <b>stretched</b>。</p>')

+ card(6, ["考點：程度副詞修飾形容詞", "詞性需求：副詞 (adv.)"], "tremendously",
  '<div class="stem"><div class="en">'+fx("The speaker's speech was [[6|tremendously]] boring, so most of the audience members lost their concentration and began to doze off.")+'</div><div class="zh">演講者的演說極其無聊，因此大部分的聽眾都失去專注力，開始打瞌睡。</div></div>'
  + clue("空格位於 was 與形容詞 boring 之間，文法上必須使用「程度副詞」修飾後面的 boring。後文指出大家都恍神並打瞌睡（doze off），表示無聊的程度極大。依字首尾提示 tr______y，應填入 tremendously（極其、非常）。")
  + '<h4>詞性變化：何時才對</h4><p style="margin:2px 0"><b>tremendously</b>（adv. 極其、非常）常相當於 extremely / exceedingly。<br><b>形容詞形：tremendous</b>（adj. 龐大的、極大的）何時才對：修飾名詞時，如 <i>The speaker made a tremendous effort to keep the audience awake.</i>（講者付出了極大的努力讓聽眾保持清醒。）</p>')

+ card(7, ["考點：介系詞片語固定搭配 (without hesitation)", "詞性需求：不可數名詞 (N)"], "hesitation",
  '<div class="stem"><div class="en">'+fx("After listening to the brief introduction about the new project, Karen agreed to join us without [[7|hesitation]].")+'</div><div class="zh">在聽完關於新專案的簡短介紹後，凱倫毫不猶豫地同意加入我們。</div></div>'
  + clue("空格緊接在介系詞 without 之後，需填名詞。表示「毫不猶豫、爽快地」之固定高頻片語即為 without hesitation。字母提示為 h______n，故填入動詞 hesitate 的名詞形 hesitation。")
  + '<h4>衍生句型：何時才對</h4><p style="margin:2px 0"><b>without hesitation</b>（介系詞片語，毫不猶豫地）。<br><b>動詞形：hesitate</b>（v. 猶豫）何時才對：搭配不定詞 <i>hesitate to V</i>，如 <i>Karen didn’t hesitate to join us.</i>（凱倫毫不猶豫地加入我們。）</p>')

+ card(8, ["考點：名詞詞類變化＋形容詞修飾", "詞性需求：單數可數名詞 (N)"], "refusal",
  '<div class="stem"><div class="en">'+fx("The British royal family responded to the paparazzi with a flat [[8|refusal]] (refuse) when they were asked to comment on the scandal.")+'</div><div class="zh">當被要求評論這起醜聞時，英國王室以斷然拒絕回應了狗仔隊。</div></div>'
  + clue("空格前有冠詞 a 與形容詞 flat（此處為「斷然的、堅決的」），後方必須接單數名詞。動詞 refuse 的名詞字尾為特殊名詞尾 -al，變化為 refusal。a flat refusal 為常見慣用語（斷然拒絕）。")
  + '<h4>特別注意：何時才對</h4><p style="margin:2px 0"><b>refusal</b>（n. 拒絕）。許多學生容易誤將名詞寫成 refuse 本身，但 <b>refuse</b> 當名詞時發音為 /ˈref.juːs/ 且意為「廢棄物、垃圾」；表示拒絕的行為必須去 e 加 -al 轉為 <b>refusal</b>。<br><b>動詞原形：refuse</b> 何時才對：<i>The royal family refused to comment on the scandal.</i></p>')

+ card(9, ["考點：介系詞片語 (in + 情緒名詞)", "詞性需求：不可數名詞 (N)"], "fright",
  '<div class="stem"><div class="en">'+fx("When the police officers fired the tear gas at the crowd, some protestors were very scared and shook in [[9|fright]] (frighten).")+'</div><div class="zh">當警方朝群眾發射催淚瓦斯時，一些抗議者非常害怕，甚至害怕得發抖。</div></div>'
  + clue("句型為動詞片語 “shook in + [名詞]”（因……而發抖）。提示字 frighten 為動詞（使驚嚇），而其名詞形式正是 fright（恐懼、害怕）。片語 shake in fright / fear 即「恐懼得顫抖」。")
  + '<h4>誤答防範：何時才對</h4><p style="margin:2px 0"><b>in fright</b>（處於驚恐之中，介系詞 in 接情緒名詞，類似 in anger 生氣中、in fear 恐懼中）。<br><b>情緒分詞形容詞：frightened / frightening</b> 何時才對：<i>The frightened protestors shook when they saw the frightening scene.</i>（受驚嚇的抗議者看到令人恐懼的場面時發抖。）</p>')

+ card(10, ["考點：名詞轉形容詞修飾名詞", "詞性需求：形容詞 (adj.)"], "corporate",
  '<div class="stem"><div class="en">'+fx("With branches all around the world, the [[10|corporate]] (corporation) headquarters of Uber is in San Francisco.")+'</div><div class="zh">在世界各地都設有分公司的情況下，Uber 的企業總部坐落於舊金山。</div></div>'
  + clue("空格後方為名詞 headquarters（總部），因此空格處需填入修飾總部的形容詞。提示字為名詞 corporation（大企業、法人），其相對應的形容詞為 corporate（企業的、公司的）。商業英文固定搭配：corporate headquarters（企業總部）。")
  + '<h4>延伸搭配：何時才對</h4><p style="margin:2px 0"><b>corporate</b>（adj. 企業的）常見搭配：<i>corporate culture</i>（企業文化）、<i>corporate image</i>（企業形象）。<br><b>名詞原形：corporation</b>（n. 大企業、公司）何時才對：<i>Uber is a multinational corporation with branches all around the world.</i></p>');

/* === II. 綜合測驗 === */
const T2 = [
  [
    ["Dan works for McDonald's.", "丹在麥當勞工作。"],
    ["Neither a clerk nor a store manager, he actually has quite a special position in the [[11|corporation]].", "他既不是店員，也不是店經理，事實上他在這家企業中擁有一個相當特別的職位。"],
    ["On Ronald Day, he [[12|dresses up as]] Ronald McDonald and goes to visit sick children at the local hospital.", "在「麥當勞叔叔日」，他會裝扮成麥當勞叔叔，前往當地醫院探視生病的孩子。"],
    ["Dan finds his job interesting.", "丹覺得他的工作很有趣。"],
    ["He loves being with the children and bringing them some joy.", "他喜歡和孩子們待在一起，為他們帶來一些歡樂。"],
    ["However, the job can also be challenging, for there are some rules that make it difficult.", "然而，這份工作也具挑戰性，因為有一些規定讓工作變得困難。"],
    ["For example, one of the rules is never to have any physical [[13|contact]] with any of the children.", "例如，其中一條規定就是絕對不能和任何孩子有任何肢體接觸。"],
    ["The hospital authorities are concerned that if he does, he may [[14|pass on]] diseases to them.", "醫院當局擔心，如果他這麼做，他可能會把疾病傳染給他們。"]
  ],
  [
    ["The most difficult experience Dan has had in this job may have been the afternoon he spent with a young boy called Billy.", "丹在這份工作遇過最艱難的經歷，或許是他和一個名叫比利的小男孩共度的那個下午。"],
    ["Billy had [[15|terminal]] cancer and wouldn't have much time to live, but he was still happy to see Dan, or Ronald.", "比利罹患了末期癌症，剩下的日子不多了，但他看到丹（或者說麥當勞叔叔）依然很開心。"],
    ["They colored and chatted together, [[16|getting]] to know each other.", "他們一起著色、聊天，逐漸認識彼此。"],
    ["Then, when Dan was about to leave, Billy asked him for a hug.", "接著，當丹正準備離開時，比利向他討一個擁抱。"],
    ["Initially, Dan tried to [[17|turn down]] Billy's request and to explain that he was not allowed to hug him.", "起初，丹試圖拒絕比利的請求，並解釋自己不被允許擁抱他。"],
    ["However, he then found [[18|it]] difficult to witness Billy's disappointment.", "然而，他接著發現自己很難親眼目睹比利的失望。"],
    ["[[19|Thus]], he finally decided to break the rules and hug Billy.", "因此，他最終決定打破規則，抱了比利。"]
  ],

  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 誤寫 <i>Most people consider rude and impolite to speak ill of others...</i>（遺漏虛受詞 <b>it</b>：當受詞是不定詞 to V 且帶有受詞補語時，動詞 consider / find / think 後必須先放虛受詞 <b>it</b>，再把真正的受詞 to V 移到補語後方）。<br>✘ 若寫成子句 <i>Most people think that speaking ill of others is rude...</i> 雖文法正確，但違反題目括號規定的 <b>(S+V+O+OC....)</b> 句型要求，會被扣句型分！</p>')

+ card(35, ["考點：虛主詞推測句型 (It seems / appears that + S + V)", "詞性需求：完整英文句子（規定以 It.... 開頭）"], "見下方參考譯文",
  '<div class="stem"><div class="zh" style="color:inherit">Sarah 似乎是她班上最受歡迎的女孩。（It....）</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[35|It seems that Sarah is the most popular girl in her class.]]")+'</div></div>'
  + clue("1. <b>虛主詞＋推測動詞：</b><b>It seems that...</b> 或 <b>It appears that...</b>（注意主詞為單數 It，現在式動詞必須加 -s）。<br>2. <b>that 子句：</b><b>Sarah is the most popular girl</b>（最高級 most popular 前方務必加上定冠詞 <b>the</b>）。<br>3. <b>範圍介系詞片語：</b><b>in her class</b>（在某班級／團體中用介系詞 in）。")
  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 誤寫 <i>Sarah seems to be the most popular girl in her class.</i>（雖然文法完全正確，但題目明文規定以 <b>(It....)</b> 開頭，未依提示作答會被扣分！）<br>✘ 誤寫 <i>It seems like that Sarah is...</i>（seems that 與 seems like 不可混用，正式書面語請直接用 <b>It seems that + S + V</b>）。</p>')

+ card(36, ["考點：複合關係副詞 Whenever＋hesitate to V＋可分動詞片語 cheer sb. up", "詞性需求：完整英文句子"], "見下方參考譯文",
  '<div class="stem"><div class="zh" style="color:inherit">每當她的朋友難過時，她從不猶豫會去鼓舞他或她。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[36|Whenever her friend is sad, she never hesitates to cheer him or her up.]]")+'</div></div>'
  + clue("1. <b>「每當……時」副詞子句：</b><b>Whenever her friend is sad,</b>（或 Every time her friend feels sad,）。<br>2. <b>「從不猶豫做……」主要子句：</b><b>she never hesitates to + V</b>（或 she doesn’t hesitate to + V；注意主詞 she 為第三人稱單數，動詞 hesitates 須加 -s）。<br>3. <b>「鼓舞他或她」可分動詞片語：</b><b>cheer him or her up</b>（代名詞受詞必須放在動詞 cheer 與副詞 up 中間！）。")
  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 誤寫 <i>...cheer up him or her.</i>（重大文法地雷：當可分雙字動詞片語如 cheer up, pick up, turn down 的受詞是「人稱代名詞 him, her, it, them」時，<b>代名詞受詞必須置於動詞與副詞正中間</b>！何時才可放後面：當受詞是一般名詞時，如 <i>cheer up her friend</i> 或 <i>cheer her friend up</i> 皆可。）</p>');

/* === VI. 混合題 === */
const T6 = [

const h6 = '<h2 id="p6">VI. 混合題（配分 11%，第 37 題 4 分、第 38 題 4 分、第 39 題 3 分）</h2>'
+ passage("混合題閱讀文章（第 37–39 題）", T6)
+ card(37, ["考點：文章單詞摘取與語法詞形變化（動詞→名詞／動詞→現在分詞）", "詞性需求：(1) 單數名詞 (N) (2) 現在分詞 (V-ing)"], "(1) improvement ／ (2) offering",
  '<div class="stem"><div class="zh" style="color:inherit;margin-bottom:6px">請從文章中找出最適當的單詞填入下列摘要空格，並視句型結構需要做適當的字形變化（每格限填一字）：</div><div class="en">Ronald McDonald House Charities (RMHC) was established for the (1) '+fx("[[|improvement]]")+' of children’s welfare. RMHC has three programs which provide different services: places to stay for families with sick children, rooms for family members who cannot stay with their sick children, and mobile care facilities (2) '+fx("[[|offering]]")+' children free healthcare in their own neighborhoods.</div><div class="zh" style="margin-top:6px">麥當勞叔叔之家慈善基金會（RMHC）是為了改善兒童福祉而成立的。RMHC 有三項提供不同服務的計畫：為育有病童的家庭提供住宿處、為無法住在麥當勞叔叔之家的家屬提供休息套房，以及為社區鄰里兒童免費提供醫療保健的行動醫療設施。</div></div>'
  + clue("<b>第 (1) 格：</b>定位第一段第 2 句 “aims to <b>improve</b> the welfare of children”。摘要句結構為 “for the ___ of children’s welfare”，在定冠詞 the 與介系詞 of 之間必須填入<b>名詞</b>，故將原形動詞 improve 加上名詞字尾 -ment 轉為 <b>improvement</b>。<br><b>第 (2) 格：</b>定位第四段第 2 句 “The mission of this program is to <b>offer</b> healthcare to children...”。摘要句結構為 “and mobile care facilities ___ children free healthcare...”，名詞 facilities 後方無關係代名詞，需用分詞片語後位修飾；因「行動醫療設施」與「提供（offer）」為主動關係，故將原形動詞 offer 轉為現在分詞 <b>offering</b>（＝which offer）。")
  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 第 (1) 格誤填 <i>improve</i>（未做詞類變化：the ___ of N 中間必須是名詞 <b>improvement</b>；若填動名詞 improving 則後方不加 of，會寫成 <i>for improving children’s welfare</i>）。<br>✘ 第 (2) 格誤填 <i>offer</i> 或 <i>offered</i>（前面已有主要子句動詞 has，此處是修飾名詞 facilities 的分詞片語，主動提供須用現在分詞 <b>offering</b>；若填過去分詞 offered 會變成「被提供給孩子的設施」，但後面卻有雙受詞 children free healthcare，文法不通）。</p>')

+ card(38, ["考點：多選細節事實檢驗（跨段落數據與條件比對）", "詞性需求：多選題（選二個正確敘述）"], "D、F",
  '<div class="stem"><div class="en">According to the passage, which TWO of the following statements are true about RMHC’s programs?</div><div class="zh">根據本文，下列關於 RMHC 各項計畫的敘述何者正確？（請選兩項）</div></div>'
  + clue("逐一核對三大計畫的「數據（375 間、262 間 / 28 國、51 個據點）」、「年齡限制（21 歲以下）」與「服務性質（前兩者提供住宿／休息空間，第三者為免費行動醫療車）」。")

    ["Ronald McDonald Family Rooms are located in 21 countries around the world.", "麥當勞叔叔家庭套房遍布全球 21 個國家。", "數字張冠李戴！第三段第 1 句明確寫道：“The 262 Ronald McDonald Family Rooms can be found in <b>28 countries</b>.”（21 是第二段病童年齡上限 under 21 years old）。何時才對：改為 28 countries。"],

    ["Ronald McDonald Houses only accept families with sick children under the age of ten.", "麥當勞叔叔之家只收容育有 10 歲以下病童的家庭。", "年齡條件錯誤！第二段第 1 句明載 “for families with sick children <b>under 21 years old</b>”（21 歲以下，而非 10 歲以下；10 歲是第三大題文意選填 A-T 罕病患者坐輪椅的年紀）。何時才對：改為 under the age of 21。"],
    ["Family members who cannot get a room at a Ronald McDonald House can use a Ronald McDonald Family Room.", "無法入住麥當勞叔叔之家的家屬，可以使用麥當勞叔叔家庭套房。", "完全符合第三段第 2 句：“Family members who cannot stay at a Ronald McDonald House can come to live in one of these rooms...”。"],
    ["The Ronald McDonald Care Mobile service is available only to families staying at a Ronald McDonald House.", "麥當勞叔叔醫療行動專車的服務僅限入住於麥當勞叔叔之家的家庭使用。", "無中生有的限制！第四段第 2 句指出醫療專車的使命是 “to offer healthcare to <b>children from the neighborhood</b> for free”（免費提供給社區鄰里的孩童），並未限制必須入住麥當勞叔叔之家。"],

  ], "DF"))

+ card(39, ["考點：語境英英字義對應", "詞性需求：複數可數名詞（照抄原文單字形式）"], "amenities",
  '<div class="stem"><div class="en">Which word in the above passage means "equipment or services that are provided for a particular purpose"?<br>Answer: '+fx("[[|amenities]]")+'</div><div class="zh">上文中哪個單字的意思是「為特定目的而提供的設備或便利設施／服務」？</div></div>'
  + stem(39)
  + clue("定位第三段（Ronald McDonald Family Room）第 2 句：“...which are furnished with essential <b>amenities</b> for them to rest, do laundry, or take a shower without going far from their sick children.” 句中列舉的「供他們休息、洗衣服或淋浴的基本設施」，即完全對應題幹定義 “equipment or services that are provided for a particular purpose”。")
  + '<h4>作答細節注意</h4><p style="margin:2px 0"><b>amenities</b>（n. 複數，生活便利設施、設備；單數原形為 amenity）。從文章摘錄單字時，請務必照抄原文出現的複數形 <b>amenities</b>，切勿自行改為單數，以免因字形與原文不符而失分。</p>');

document.getElementById('app').innerHTML = h1+h2+h3+h4+h5+h6;

document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){open=!open;document.querySelectorAll('details.q').forEach(d=>d.open=open);this.textContent=open?'全部收合':'全部展開';};
