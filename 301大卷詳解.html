<script>
const S=[
{id:"I",title:"I. 文意字彙與詞類變化",items:[
["1","prompted","The unreasonably heavy workload prompted Jennifer to consider quitting her job soon.","不合理的繁重工作量促使 Jennifer 考慮很快辭職。","考點：動詞語意＋句型 prompt sb to V／時態","過去式動詞","主詞 workload 後缺動詞，後接 Jennifer to consider → 句型 prompt + O + to V（促使…）。","prompt/prompts：時態不符（敘述已發生的事）；prompting：缺 be 動詞不能當述語；prompt 當形容詞「迅速的」、名詞「提示」時才可用，如 a prompt reply。"],
["2","drowsy","…it may make them feel drowsy or dizzy.","…可能讓他們感到昏昏欲睡或頭暈。","考點：形容詞語意＋連綴動詞","形容詞（補語）","feel 為連綴動詞，後接形容詞；or dizzy 為形容詞，並列結構詞性須一致；首字 d、尾字 y。","drowsily 是副詞，只在修飾動詞時才對（speak drowsily）；drowsiness 為名詞，如 fight off drowsiness。"],
["3","employed","…the store employed many part-time workers during the busy holiday season.","為了應付增加的工作量，商店在繁忙的假期僱用了許多兼職員工。","考點：動詞語意＋時態","過去式動詞","To handle… 為不定詞片語表目的，主詞 the store 缺述語動詞；during the … season 為已發生的期間。","employ：現在式，時態不符；employing：缺 be；employee 是名詞（受僱者），employer 是雇主，當受詞 workers 前不可用。"],
["4","sparkle","There was a sparkle in the little boy's eyes…","小男孩看到父親比平常早來接他時，眼中閃著光芒。","考點：名詞語意＋冠詞 a","單數可數名詞","There was a ___ in… ：a 後需單數名詞；sparkle in one's eyes 為固定搭配。","sparkling：形容詞，a sparkling smile 才對；sparkled：動詞過去式，主詞 The boy's eyes sparkled 時才對。"],
["5","stretched","…Justin opened the front door and stretched out his arms…","Justin 打開前門並伸出雙臂幫媽媽拿雜貨。","考點：動詞語意＋對等連接詞","過去式動詞","and 連接前後對等的動詞：opened … and stretched out，時態須一致（Seeing… 為分詞構句）。","stretch/stretches：時態不一致；stretching：若前面有 was 進行式才對。"],
["6","tremendously","The speaker's speech was tremendously boring…","演講者的演說極度無聊，所以大多數聽眾都失去專注並開始打瞌睡。","考點：副詞修飾形容詞","副詞","空格後是形容詞 boring，需副詞修飾；首字 tr、尾字 y。","tremendous 是形容詞，只能修飾名詞（a tremendous success）；tremendousness 名詞。"],
["7","hesitation","…agreed to join us without hesitation.","聽了新專案的簡短介紹後，Karen 毫不猶豫地同意加入我們。","考點：名詞語意＋介系詞 without","名詞（介系詞受詞）","without 為介系詞，後接名詞／動名詞；hesitation 不可數，without hesitation 為固定用法（毫不猶豫）。","hesitate 動詞原形，不能直接接在 without 後；hesitant 為形容詞，be hesitant to V 才對。"],
["8","refusal","…responded … with a flat refusal…","英國王室對狗仔隊的回應是斷然拒絕，當被要求評論這樁醜聞時。","考點：詞類變化 refuse→refusal＋固定搭配","單數名詞","括號給 refuse；a flat ___ 前有 a 與形容詞 flat，需單數名詞；a flat refusal＝斷然拒絕。","refuse：動詞（或垃圾 /ˈrefjuːs/ 名詞）在此語意不通；refused：過去式或形容詞，不能接在 flat 後當名詞。"],
["9","fright","…shook in fright.","有些抗議者非常害怕而嚇得發抖。","考點：詞類變化 frighten→fright＋in 固定搭配","名詞（介系詞受詞）","shake/tremble in fright（嚇得發抖）為固定搭配，in 後需名詞。","frightened 為形容詞，be frightened 才對；frightening 為「令人害怕的」，修飾事物。"],
["10","corporate","…the corporate headquarters of Uber is in San Francisco.","Uber 的分公司遍布全球，公司總部位於舊金山。","考點：詞類變化 corporation→corporate","形容詞（修飾名詞）","the ___ headquarters：冠詞與名詞之間，需形容詞修飾 headquarters；corporate＝公司的。","corporation 是名詞，只在 the corporation's headquarters 所有格時才對；corporations 亦為名詞，單獨置於此處會與 headquarters 形成錯誤複合結構。"]
]},
{id:"II",title:"II. 綜合測驗",custom:`<div class="card"><div class="q">文章中譯</div><div class="zh">Dan 在麥當勞工作。他既不是店員也不是店經理，其實在公司裡擁有相當特別的職位。在 Ronald Day 這天，他會扮成 Ronald McDonald，前往當地醫院探視生病的孩子。Dan 覺得這份工作很有趣，他喜歡陪伴孩子並帶給他們一些快樂。然而，這份工作也可能很有挑戰性，因為有些規定讓事情變得困難。例如，其中一條規定是絕不能和任何孩子有身體接觸。醫院當局擔心，如果他這樣做，可能會把疾病傳染給孩子。<br>Dan 在這份工作中最困難的經驗，也許是他和一位名叫 Billy 的小男孩共度的那個下午。Billy 罹患末期癌症，來日不多，但他見到 Dan（也就是 Ronald）仍然很開心。他們一起著色、聊天，逐漸認識彼此。當 Dan 準備離開時，Billy 要求他給一個擁抱。起初，Dan 試著拒絕 Billy 的請求，並解釋自己不被允許擁抱他。然而，他隨後發現自己很難親眼目睹 Billy 的失望。因此，他最後決定打破規定，擁抱 Billy。<br>不幸的是，幾天後 Billy 就去世了。儘管如此，他在人生盡頭前擁抱過自己的英雄 Ronald，似乎一定很開心。因此，即使 Dan 很難過，他也很感激自己能給 Billy 最後一個快樂的時刻。最重要的是，他很高興在這次場合中打破了規定。</div></div>`,items:[
["11","(D) corporation","…he actually has quite a special position in the ____.","他其實在公司裡擁有相當特別的職位。","考點：名詞語意＋固定搭配 position in the corporation","詞性需求：the 後接單數名詞","線索：首句 Dan works for McDonald's，並列舉 a clerk、a store manager 等職位，可知是「公司內的職位」，in the corporation＝在公司裡。","(A) germ 細菌：只在談疾病、衛生時才對（a germ can spread disease）。(B) laughter 笑聲：在 there was laughter in the room 這類句子才對。(C) warmth 溫暖：在 the warmth of a family 才對；三者皆與 position 無語意關聯。"],
["12","(A) dresses up as","On Ronald Day, he ____ Ronald McDonald and goes to visit sick children…","Ronald Day 這天，他扮成 Ronald McDonald 去探訪病童。","考點：片語動詞語意＋主詞動詞一致","詞性需求：第三人稱單數現在式動詞片語，後接人物","線索：空格後接人物 Ronald McDonald，且與 and goes 並列，dress up as＋人物＝裝扮成；dresses 呼應主詞 he。","(B) grows up for：grow up 是長大，for 後不接人物當扮演對象；在 She grew up for … 不成立。(C) ends up in 最後落得：後接結果或地點，如 ends up in jail。(D) shows up at 出現在：後接地點或場合，如 shows up at the party，而 Ronald McDonald 是人物。"],
["13","(C) contact","…never to have any physical ____ with any of the children.","絕不與任何孩子有身體接觸。","考點：名詞語意＋固定搭配 physical contact / have contact with","詞性需求：形容詞 physical 後接名詞","線索：下文 hug（擁抱）與 may pass on diseases，指的是身體接觸；have contact with＝與…接觸。","(A) chase 追逐：have a chase 語意不搭，且不是 physical contact 的意思。(B) sweat 汗水：physical sweat 不成詞組，須有 have a sweat 之類語境。(D) vision 視力：have good vision 才對，與 with any of the children 不搭。"],
["14","(A) pass on","…if he does, he may ____ diseases to them.","如果他這樣做，可能把疾病傳染給他們。","考點：片語動詞語意 pass on sth to sb","詞性需求：助動詞 may 後接動詞原形","線索：空格後有 diseases to them，to them 表傳遞對象；pass on A to B＝把 A 傳給 B。","(B) cheer up 使振作：cheer sb up，不接 diseases to them。(C) think of 想到：think of sth（想起），無傳遞語意。(D) pick up 染上／拾起：pick up a disease 是「自己染上」，主詞成為受害者，與 to them 不合；若說 he may pick up diseases from them 才對。"],
["15","(B) terminal","Billy had ____ cancer and wouldn't have much time to live…","Billy 罹患末期癌症，來日不多。","考點：形容詞語意＋固定搭配 terminal cancer","詞性需求：形容詞修飾名詞 cancer","線索：wouldn't have much time to live 說明病情無法治癒，terminal cancer＝末期癌症。","(A) frail 虛弱：修飾人，如 a frail old man。(C) pale 蒼白：修飾臉色，如 a pale face。(D) ill 生病的：作補語，如 Billy was ill，一般不放在名詞前面修飾 cancer。"],
["16","(D) getting","They colored and chatted together, ____ to know each other.","他們一起著色、聊天，逐漸認識彼此。","考點：分詞構句（伴隨）＋ get to know","詞性需求：現在分詞","線索：逗號前已是完整句（colored and chatted），沒有連接詞，逗號後只能用分詞構句；主詞 they 為主動，用 V-ing。","(A) get／(B) got：又形成一個動詞，句中缺連接詞；若寫 and got to know 才對。(C) gotten 過去分詞：表被動或完成，如 Having gotten to know each other，此處主動且不需完成式。"],
["17","(C) turn down","Initially, Dan tried to ____ Billy's request and to explain that he was not allowed to hug him.","起初，Dan 試著拒絕 Billy 的請求，並解釋自己不被允許擁抱他。","考點：片語動詞語意 turn down a request","詞性需求：to 後接動詞原形，且接受詞 request","線索：to explain that he was not allowed to hug him 說明理由，加上後文 However（轉折）與 decided to break the rules，可知起初是拒絕。","(A) agree to 同意：若後面是 agree to Billy's request 且沒有理由，語意才通，但與 not allowed 矛盾。(B) work out 解決／健身：work out a problem 才對。(D) put in 提出：put in a request 是由 Billy 提出，Dan 不是提出請求的人。"],
["18","(B) it","…he then found ____ difficult to witness Billy's disappointment.","然而，他發現很難親眼目睹 Billy 的失望。","考點：形式受詞 find it + adj + to V","詞性需求：形式受詞代名詞","線索：find＋受詞＋形容詞 difficult 的句型，真正受詞是 to witness…，因此前面用 it 代替。","(A) ×：不填則變成 found difficult，缺少受詞。(C) that：that 指前面已提過的事物，如 found that difficult 需 that 有明確指涉；此處指向後面的 to V。(D) him：him 指某個人，若 found him difficult to deal with，主詞才成立。"],
["19","(C) Thus","____, he finally decided to break the rules and hug Billy.","因此，他最後決定打破規定，擁抱 Billy。","考點：連接副詞語意（因果）","詞性需求：句首連接副詞加逗號","線索：前句「難以目睹 Billy 的失望」是原因，後句「決定擁抱」為結果，需要表因果的 Thus（因此）。","(A) Actually 事實上：用於補充、更正，如 Actually, I don't like it。(B) Indeed 的確：加強前句語氣，不表因果。(D) Instead 反而：前面要有被否定的行為，如 He didn't leave. Instead, he stayed；此處前句不是否定某個行為。"],
["20","(A) that","Nevertheless, it seems ____ he must have been happy…","儘管如此，他似乎一定很開心。","考點：虛主詞 it seems that S + V","詞性需求：連接詞","線索：it seems that＋完整子句，he must have been happy 是完整子句，用 that 引導。","(B) what：關係代名詞，後面需缺主詞或受詞的子句；此處不缺成分。(C) which：關係代名詞，需要先行詞。(D) when：時間連接詞，語意不對；it seems when… 不成立。"]
]},
{id:"III",title:"III. 文意選填",custom:`<div class="card"><div class="q">文章中譯</div><div class="zh">醫生們帶給 Jo Bloomer 一個壞消息：她的第二個孩子 Lola 罹患一種非常罕見的疾病，稱為 A-T。起初，她無法接受自己的家庭這麼不幸。A-T 非常罕見，當時英國只有六十名孩童罹患這種病。三歲的 Lola 的病情代表她將開始變得虛弱，接著會出現越來越多障礙，並逐漸衰退。大多數 A-T 病患到十歲時就被限制在輪椅上。最終，她會死於這種奇怪的疾病，大概在二十出頭時。對 Jo 而言，想到 Lola 這麼年輕就會過世，真的令人心碎。<br>對 Lola 來說很幸運的是，她的母親拒絕只是坐著等待女兒變得更虛弱然後死去。畢竟，生命太珍貴了。相反地，她想想出一件特別的事為 Lola 做。她想在女兒的生命中創造重大的改變。這一切促使 Jo 立下承諾。她把女兒抱在懷裡，發誓在她死前帶她去世界七大奇蹟的每一處。她要幫助小 Lola 充分過完她短暫的一生！</div></div><div class="card"><div class="q">選項詞性總表（各字只用一次）</div><div class="row">(A) think up 想出（動詞片語，要接受詞）｜(B) refused 拒絕（過去式，refuse to V）｜(C) rare 罕見的（形容詞）｜(D) illness 疾病（名詞）｜(E) frail 虛弱的（形容詞，指人或身體）｜(F) pass away 過世（不及物動詞片語）｜(G) fade away 逐漸衰弱／消失（不及物動詞片語）｜(H) difference 差別（名詞，make a difference）｜(I) suffered 受苦（過去式，suffer from）｜(J) confined 被限制的（過去分詞，be confined to）</div></div>`,items:[
["21","(C) rare","Lola had a very ____ condition known as A-T.","Lola 罹患一種非常罕見的疾病，稱為 A-T。","考點：形容詞語意＋副詞 very 修飾","詞性需求：形容詞","線索：前有 very，後有 condition，需形容詞；下句 so uncommon that only sixty children… 是同義呼應。","(E) frail：形容人虛弱，如 a frail child，不用來形容疾病。(J) confined：需 be confined to。名詞、動詞類的 (A)(B)(D)(F)(G)(H)(I)：詞性不符，不能接在 very 後。"],
["22","(I) suffered","…only sixty children in the UK ____ from it.","當時英國只有六十名孩童罹患這種病。","考點：動詞搭配 suffer from＋時態","詞性需求：過去式動詞","線索：空格後是 from it，suffer from＝罹患；at the time 表過去。","(B) refused：refuse 不接 from。(F)(G)(A)：原形，且語意與 from 不合；若 sixty children may pass away from it 才有「死於」的意思。(J) confined：confined to 才對。"],
["23","(E) frail","…she would start to grow ____.","她將開始變得虛弱。","考點：連綴動詞 grow＋形容詞","詞性需求：形容詞補語","線索：grow＋形容詞＝變得…；後文 grow weaker 同樣是漸趨虛弱；frail 描述人的身體狀況。","(C) rare：grow rare 用於事物變稀少，如 Some species grow rare，不能形容 Lola 的身體。(J) confined：grow confined 不成搭配。其他非形容詞。"],
["24","(G) fade away","…develop more and more disabilities and gradually ____.","出現越來越多障礙，並逐漸衰退。","考點：動詞片語語意＋副詞 gradually","詞性需求：與 develop 並列的原形動詞（would 之後）","線索：gradually 表漸進，前面是 disabilities 增加的過程，fade away 逐漸衰退；第 26 句才出現 die，代表死亡是最後階段。","(F) pass away：直接指死亡，與 gradually 的過程感不搭，且 27 才需要 die 的委婉語。(A) think up：要接受詞，語意無關。(B)(I)：過去式，與 would 後原形不符。"],
["25","(J) confined","Most A-T patients are ____ to a wheelchair by the age of ten.","大多數 A-T 病患到十歲時就被限制在輪椅上。","考點：被動語態 be confined to＋介系詞 to","詞性需求：過去分詞（be 後）","線索：are ____ to a wheelchair，be confined to＝被限制在…；病患行動受限。","(B) refused：are refused to a wheelchair 不成立，若 are refused entry 才對。(I) suffered：suffer 為不及物，不能 are suffered。(E) frail：are frail to 不成立。"],
["26","(D) illness","…she would die from this strange ____, probably in her early twenties.","她最終會死於這種奇怪的疾病。","考點：名詞語意＋指示詞 this","詞性需求：名詞","線索：this strange ____ 需名詞，並回指前面反覆提到的 condition（A-T）。","(H) difference：名詞，但 this strange difference 不等於疾病，die from a difference 語意錯。其他不是名詞。"],
["27","(F) pass away","It was heartbreaking for Jo to think that Lola would ____ at such a young age.","想到 Lola 這麼年輕就會過世，真令人心碎。","考點：委婉語 pass away＝die","詞性需求：would 後原形不及物動詞片語","線索：at such a young age 與前句 she would die 對應，用委婉語 pass away 表示過世。","(G) fade away：強調漸進消逝，已在 24 使用。(A) think up 需受詞。(B)(I) 為過去式，不接在 would 後。"],
["28","(B) refused","Luckily for Lola, her mother ____ to simply sit around and wait…","對 Lola 來說很幸運，她的母親拒絕只是坐著等待。","考點：動詞語意 refuse to V＋時態","詞性需求：過去式動詞，後接不定詞","線索：主詞 her mother 缺動詞；Luckily 與 Instead（下句）暗示她不願被動等待；refuse to V＝拒絕做…。","(I) suffered：suffer to V 不成立。(A)(F)(G)：原形，與過去時態不合，且不接 to V。"],
["29","(A) think up","Instead, she wanted to ____ something special to do for Lola.","相反地，她想想出一件特別的事為 Lola 做。","考點：片語動詞語意 think up sth","詞性需求：wanted to 後接及物動詞原形片語","線索：空格後接 something special to do，需及物動詞；think up＝想出（點子）。","(F)(G)：不及物，後面不能接 something。(B)(I)：過去式，不能放在 to 後。"],
["30","(H) difference","She wanted to make a significant ____ in her life.","她想在女兒的生命中造成重大的改變。","考點：固定搭配 make a difference","詞性需求：形容詞 significant 後接名詞","線索：make a significant difference＝造成重大影響；in her life 表範圍。","(D) illness：make an illness 不成搭配，且已用於 26。其他非名詞。"]
]},
{id:"IV",title:"IV. 閱讀測驗《Patch Adams》",custom:`
<div class="card"><div class="q">文章中譯（第一段被截斷，從 Williams 起）</div>
<div class="en">Williams plays the lead role. His wonderful portrayal of the doctor's quest to relieve as much suffering as possible led the film to be nominated for several awards.</div><div class="zh">Williams 擔綱主角。他對這位醫生盡可能減輕痛苦之追求的精彩詮釋，使這部電影獲得多項獎項提名。</div>
<div class="en">The movie starts off with middle-aged Patch himself having depression and voluntarily entering a mental hospital for treatment. Once inside, however, he notices the positive effect his humor has on his fellow patients. This inspires him to become a doctor, and he subsequently enrolls at a medical school.</div><div class="zh">電影一開始，中年的 Patch 自己患有憂鬱症，自願進入精神病院治療。然而一進去，他就注意到自己的幽默對其他病人有正面影響。這激勵他成為醫生，隨後他註冊進入醫學院。</div>
<div class="en">Though a brilliant student, Patch frequently challenges the traditional, more formal approach to medical treatment that the school promotes. … he wears a red clown nose and plays funny pranks on others. This makes him popular with patients and nurses but gets him into trouble with the very serious and strict dean of the college, Walcott, who dislikes Patch a lot.</div><div class="zh">雖然是優秀的學生，Patch 卻經常挑戰學校推崇的傳統、較正式的醫療方式。到醫院探視時，他戴紅色小丑鼻子並捉弄別人。這讓他深受病人和護理師喜愛，卻使他惹上非常嚴肅嚴格、且非常討厭他的學院院長 Walcott。</div>
<div class="en">With the help of some fellow students and a wealthy former fellow patient, Patch sets up a care facility for patients who do not have insurance. A major part of the treatments are comedy sketches… Will laughter truly prove to be the best medicine? Will he ever fulfill his dream of graduating? Watch Patch Adams to find out.</div><div class="zh">在一些同學與一位富有的前病友協助下，Patch 為沒有保險的病人設立照護機構。治療的主要部分是 Patch 與其他工作人員演出的喜劇短劇。笑聲真的會是最好的良藥嗎？他能實現畢業的夢想嗎？看《Patch Adams》就知道。</div></div>
<div class="card"><div class="q">31 ｜ 考點：文章主旨／電影類型 <span class="tag">答案 (B)</span></div><div class="row"><b>解題線索：</b>文中 the story of a man…（首段）、Patch 成為醫生並開設診所，是根據真人故事的醫生傳記片。</div><div class="row ans">(B) 正確：關於一位醫生的傳記電影。</div><div class="row no"><b>(A)</b> 沒有獵人；action movie about a hunter 要有打獵情節才對。<br><b>(C)</b> Williams 是演員，但內容不是科幻（sci-fi 需外星、未來科技）。<br><b>(D)</b> Patch Adams 是角色，不是演員，且無愛情主軸。</div></div>
<div class="card"><div class="q">32 ｜ 考點：因果細節 <span class="tag">答案 (D)</span></div><div class="row"><b>解題線索：</b>he notices the positive effect his humor has on his fellow patients. <u>This inspires him to become a doctor</u>——This 指前句的幽默有效。</div><div class="row ans">(D) 正確：發現幽默對其他病人有神奇效果。</div><div class="row no"><b>(A)</b> 中年是背景，文中未說找不到工作。<br><b>(B)</b> 他是因憂鬱症入院，但後來的動機是幫助別人，不是自己治療。<br><b>(C)</b> nominated 是電影獲提名，不是 Patch 在學校的期望。</div></div>
<div class="card"><div class="q">33 ｜ 考點：NOT 是非題／細節比對 <span class="tag">答案 (B)</span></div><div class="row"><b>解題線索：</b>Walcott, who dislikes Patch a lot——院長討厭他，故 (B) 錯。</div><div class="row ans">(B) 為不正確敘述（NOT true）。</div><div class="row no"><b>(A)</b> Williams plays the lead role. 正確。<br><b>(C)</b> comedy sketches、laughter … best medicine 顯示以笑聲治療。<br><b>(D)</b> Patch frequently challenges the traditional… approach → 不信奉傳統醫療，正確。</div></div>`},
{id:"V",title:"V. 翻譯",items:[
["34","","Most people consider it rude and impolite to speak ill of others behind their backs.","","考點：S＋V＋O＋OC，形式受詞 it","consider it + 形容詞 + to V","題目提示 S+V+O+OC：consider 的受詞為虛受詞 it，OC 為 rude and impolite，真受詞為 to speak ill of…。","若寫 consider to speak… 錯，因 consider 不接不定詞當受詞；behind one's back 要用 their backs（others 複數）；ill 為副詞，speak ill of＝說…壞話。"],
["35","","It seems/appears that Sarah is the most popular girl in her class.","","考點：虛主詞 it＋seem that／最高級","It seems that + S + V","提示 It…：it 為虛主詞，that 子句為真主詞；最高級 the most popular＋in her class。","She seems that… 錯（seem 主詞是 it 時才接 that 子句）；in 後接範圍（class），若用 of 需接複數群體 of all the girls。"],
["36","","Whenever her friend is sad, she never hesitates to cheer him or her up.","","考點：複合關係副詞＋hesitate to V＋片語動詞","Whenever…, S never hesitates to V","hesitate to V＝猶豫做…；cheer up 為片語動詞，受詞為代名詞時要放中間（cheer him up）。","hesitate to cheering 錯；cheer up him 錯（代名詞須置中間）；hesitate 後接 to V，若寫 in V-ing 亦通，但常見為 to V。"]
]},
{id:"VI",title:"VI. 混合題《Ronald McDonald House Charities》",custom:`
<div class="card"><div class="q">文章中譯</div><div class="zh">麥當勞不只賣漢堡。Ronald McDonald House Charities (RMHC) 是一個獨立的美國非營利組織，旨在改善兒童福祉。RMHC 的核心方案包括 Ronald McDonald House、Ronald McDonald Family Room 與 Ronald McDonald Care Mobile。<br>Ronald McDonald House：目前有 375 間，提供二十一歲以下病童家庭的住所，孩子可在附近醫院接受治療。每晚提供超過 7,200 間臥室，估計價值 7 億美元的住宿費。<br>Family Room：262 間分布於 28 個國家。無法住在 House 的家屬可住進這些設備齊全的房間休息、洗衣或淋浴，而不必離病童太遠。<br>Care Mobile：目前有 51 輛，目的是免費為兒童提供醫療服務，每年超過十萬名兒童受益。</div></div>
<div class="card"><div class="q">37 ｜ 考點：詞類變化／of 後接名詞 <span class="tag">(1) improvement　(2) offering</span></div>
<div class="row"><b>(1) improvement：</b>線索為 the ___ of children's welfare：the 後接名詞，of 前為名詞；文章 aims to improve the welfare 提示 improve → improvement。錯誤：improve（動詞，不能接在 the 後）、improving（可當形容詞或動名詞，但 the improving of 語感不自然）。</div>
<div class="row"><b>(2) offering：</b>mobile care facilities ___ children free healthcare：facilities 後為修飾語，接分詞（現在分詞，主動）片語；原文 is to offer healthcare to children。錯誤：offer（動詞原形，前面已有 which provide 的平行結構才對）、offered（被動，此處設施是主動提供）。</div></div>
<div class="card"><div class="q">38 ｜ 考點：多選題／細節比對 <span class="tag">答案 (D)(F)</span></div>
<div class="row ans">(D) 正確：無法住 House 的家屬可使用 Family Room（Family members who cannot stay at a Ronald McDonald House can come to live in…）。<br>(F) 正確：Care Mobile 提供免費醫療，但沒有住處（offer healthcare … for free）。</div>
<div class="row no"><b>(A)</b> Family Rooms 位於 28 個國家，並非 21 個。<br><b>(B)</b> Care Mobile 是 51 輛，House 是 375 間，所以是 House 較多。<br><b>(C)</b> 是 under 21 years old，不是 ten。<br><b>(E)</b> Care Mobile 服務對象為 children 免費，不限住在 House 的家庭；only 為不當限縮。</div></div>
<div class="card"><div class="q">39 ｜ 考點：字義（從文中找單字） <span class="tag">答案 amenities</span></div>
<div class="row"><b>解題線索：</b>furnished with essential amenities for them to rest, do laundry, or take a shower——amenity 指為特定用途提供的設備或服務（舒適設施）。<br><b>其他：</b>facilities 是設施，但不強調 equipment or services 提供特定舒適用途；expenses 為費用。</div></div>`}
];
function card(i){return `<div class="card"><div class="q">${i[0]}${i[1]?'（'+i[1]+'）':''} ｜ <span class="tag">${i[4]}</span><span class="tag" style="background:#888">${i[5]}</span></div>
<div class="en">${i[2]}</div>${i[3]?`<div class="zh">${i[3]}</div>`:''}<div class="row ans">答案：${i[1]||i[2]}</div>
<div class="row"><b>解題線索：</b>${i[6]}</div><div class="row no"><b>誤答與適用情境：</b>${i[7]}</div></div>`}
document.getElementById('app').innerHTML=S.map(s=>`<h2 id="${s.id}">${s.title}</h2>`+(s.custom||'')+(s.items?s.items.map(card).join(''):'')).join('');
</script></body></html>
