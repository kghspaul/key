<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>301 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>301 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h = '';

// --- 背景補充 ---
h += passage("情境閱讀", [
  [["A few years ago, I was employed by the McDonald’s Corporation.", "幾年前，我受僱於麥當勞公司。[cite: 5]"]],
  [["On “Ronald Day,” I would dress up as Ronald McDonald and visit the community hospital’s sick children.", "在「麥當勞叔叔日」，我會打扮成麥當勞叔叔去探望社區醫院裡的病童。[cite: 5]"]],
  [["Most of these young patients were suffering from terminal illnesses.", "這些年輕的病患大多患有絕症。[cite: 5]"]],
  [["Thus, I would try my best to ease their pain.", "因此，我會盡力減輕他們的痛苦。[cite: 5]"]],
  [["And I found it tremendously rewarding to be able to bring some laughter to the kids.", "而且我發現能夠帶給孩子們一些歡笑是非常有意義的。[cite: 5]"]]
]);

// --- 挑戰題 1-1 ---
h += '<h2 id="p1">挑戰題 1</h2>';

h += card('1', ['連接詞'], 'D',
  '<div class="stem"><div class="en">One of the rules of my job was never to visit the children alone when I was dressed as Ronald, '+fx("[[1|for]]")+' I might frighten them with my painted face and red wig.</div><div class="zh">我工作的一項規定是，當我打扮成麥當勞叔叔時，絕不能單獨去探望孩子，因為我畫滿顏料的臉和紅假髮可能會嚇到他們。[cite: 5]</div></div>' +
  clue('for 作為連接詞 (conj.) 表示「因為」。[cite: 5]') +
  ops([
    ['so', '因此', 'conj.[cite: 5]'],
    ['though', '雖然', 'conj.[cite: 5]'],
    ['whereas', '雖然；而', 'conj.[cite: 5]'],
    ['for', '因為', 'conj. (for prep. 表「為了」)[cite: 5]']
  ], 'D')
);

// --- 挑戰題 1-2 ---
h += card('2', ['動名詞作主詞'], 'A',
  '<div class="stem"><div class="en">I wasn’t permitted to have any physical contact with the children either, since '+fx("[[2|doing]]")+' so might pass on germs to them.</div><div class="zh">我也不被允許與孩子們有任何身體接觸，因為這樣做可能會把細菌傳染給他們。[cite: 5]</div></div>' +
  clue('since 在此為連接詞「因為」。doing so 作為動名詞片語，當作 since 子句中的主詞，視為單數。[cite: 5]') +
  ops([
    ['doing', '這樣做', '動名詞作主詞[cite: 5]'],
    ['I did', '', '多了動詞 did[cite: 5]'],
    ['I have done', '', '多了動詞 have done[cite: 5]'],
    ['by doing', '', '介系詞片語 = adj./adv. (主詞必為名詞)[cite: 5]']
  ], 'A')
);

h += passage("補充段落", [
  [["Though I understood the reasoning behind these rules, I also felt that sometimes nothing could convey love, empathy, and warmth like a heartfelt embrace.", "雖然我了解這些規定背後的理由，但我也覺得有時候沒有什麼比一個發自內心的擁抱更能傳達愛、同理心和溫暖。[cite: 5]"]]
]);

// --- 挑戰題 2-1 ---
h += '<h2 id="p2">挑戰題 2</h2>';

h += passage("補充段落", [
  [["Once, as I was leaving the hospital after finishing my work for the day, I heard a voice coming from a half-open door.", "有一次，當我結束一天的工作準備離開醫院時，我聽到半開的門裡傳來一個聲音。[cite: 5]"]],
  [["\"Ronald,\" the frail voice called, prompting me to push open the door and go in.", "「麥當勞叔叔，」虛弱的聲音呼喚著，促使我推開門走進去。[cite: 5]"]]
]);

h += card('3', ['動詞變化', 'find + O + OC'], 'A',
  '<div class="stem"><div class="en">I found a small boy of about five '+fx("[[3|lying]]")+' in bed and looking extremely weak and pale.</div><div class="zh">我發現一個大約五歲的小男孩躺在床上，看起來極度虛弱和蒼白。[cite: 5]</div></div>' +
  clue('find + O + OC。男孩是主動「躺」在床上，lie 的現在分詞為 lying。[cite: 5]') +
  ops([
    ['lying', '躺', 'lie 的現在分詞[cite: 5]'],
    ['laid', '放置', 'lay 的過去式/過去分詞[cite: 5]'],
    ['lain', '躺', 'lie 的過去分詞[cite: 5]'],
    ['lied', '說謊', 'lie (說謊) 的過去式/過去分詞[cite: 5]']
  ], 'A')
);

// --- 挑戰題 2-2 ---
h += card('4', ['感官動詞'], 'C',
  '<div class="stem"><div class="en">The old lady told the police that she saw the bank '+fx("[[4|robbed]]")+' by three armed men.</div><div class="zh">老太太告訴警察，她看到銀行被三名武裝人員搶劫。[cite: 5]</div></div>' +
  clue('感官動詞 (saw) + O (the bank) + p.p. (robbed) 表被動。[cite: 5]') +
  ops([
    ['rob', '', '原形動詞表主動[cite: 5]'],
    ['robbing', '', '現在分詞表主動進行[cite: 5]'],
    ['robbed', '被搶', '過去分詞表被動[cite: 5]'],
    ['to rob', '', '感官動詞不接不定詞[cite: 5]']
  ], 'C')
);

h += passage("補充段落", [
  [["“His name is Billy,” his parents told me, smiling.", "「他的名字叫比利，」他的父母微笑著告訴我。[cite: 5]"]],
  [["It was really heartbreaking to see such a young boy confined to a hospital bed.", "看到這麼小的一個男孩被限制在病床上，真的很令人心碎。[cite: 5]"]],
  [["I knew I had to do anything I could to cheer little Billy up, so I stayed and did some magic tricks for him.", "我知道我必須盡我所能讓小比利振作起來，所以我留下來為他變了一些魔術。[cite: 5]"]],
  [["A sparkle soon came to his eyes and I asked if I could do anything else for him. Billy replied, “Ronald, can I have a hug?”", "他眼裡很快閃現出光芒，我問是否還能為他做些什麼。比利回答說：「麥當勞叔叔，我可以要一個擁抱嗎？」[cite: 5]"]]
]);

// --- 挑戰題 3 ---
h += '<h2 id="p3">挑戰題 3</h2>';

h += card('5', ['連接詞與介系詞'], 'B',
  '<div class="stem"><div class="en">'+fx("[[5|Although having to]]")+' turn him down pained me deeply, I had no choice.</div><div class="zh">雖然不得不拒絕他讓我深感痛苦，但我別無選擇。[cite: 5]</div></div>' +
  clue('Although 為連接詞，後接子句。having to turn him down (動名詞片語) 為該子句的主詞，pained 為動詞。despite 只能當介系詞。[cite: 5]') +
  ops([
    ['Although I had to', '', '若加 I had to，則 pained 會變成多餘的動詞 (V3)[cite: 5]'],
    ['Although having to', '雖然不得不...', 'having to... 作為 although 子句的主詞[cite: 5]'],
    ['Despite having to', '', '介系詞片語不能當主詞 (缺連接詞)[cite: 5]'],
    ['Despite the fact that I had to', '', 'I had to... 為子句，但後方加上 pained 會產生文法錯誤[cite: 5]']
  ], 'B')
);

h += passage("補充段落", [
  [["I told Billy that it was against the rules and then quickly added that we could do some coloring instead.", "我告訴比利這違反了規定，然後迅速補充說我們可以改畫畫。[cite: 5]"]],
  [["A while later, it appeared that he was getting drowsy, so I rose to my feet to get ready to leave.", "過了一會兒，他似乎開始昏昏欲睡，所以我站起身準備離開。[cite: 5]"]]
]);

// --- 挑戰題 3-1 ---
h += card('6', ['不定詞表目的'], 'A',
  '<div class="stem"><div class="en">That was when he stretched out his tiny arms '+fx("[[6|to hug]]")+' me. I was about to refuse again, but then I saw the look of hope in his eyes.</div><div class="zh">就在那時，他伸出小手臂要擁抱我。我正準備再次拒絕，但接著我看到他眼中充滿希望的眼神。[cite: 5]</div></div>' +
  clue('不定詞 to hug 表「尚未做的事、目的」。[cite: 5]') +
  ops([
    ['to hug', '為了擁抱', '不定詞表目的[cite: 5]'],
    ['hugging', '', '現在分詞表「正在做、持續發生、已發生」[cite: 5]'],
    ['hugged', '', '過去分詞表「被動」[cite: 5]'],
    ['by hugging', '', 'by表「藉著」[cite: 5]']
  ], 'A')
);

// --- 挑戰題 3-2 ---
h += card('7', ['被動與分詞'], 'D',
  '<div class="stem"><div class="en">Suddenly, I realized I no longer cared if I was caught '+fx("[[7|breaking]]")+' the rules.</div><div class="zh">突然，我意識到我不再在乎是否會被逮到違反規定。[cite: 5]</div></div>' +
  clue('be caught + V-ing 被逮到在做⋯。[cite: 5]') +
  ops([
    ['to break', '', '不定詞為「尚未做」、「目的」等[cite: 5]'],
    ['break', '', '多了一個動詞[cite: 5]'],
    ['broken', '', '被抓到被打破？語意不通[cite: 5]'],
    ['breaking', '違反(進行)', 'Ving 表「正在做、持續發生、已發生」[cite: 5]']
  ], 'D')
);

h += passage("補充段落", [
  [["Some things in life, after all, were more important. I picked him up and held him in my arms.", "畢竟，生活中有些事情更重要。我抱起他，將他擁入懷中。[cite: 5]"]],
  [["After that, we talked and talked. He confided his worries to me.", "那之後，我們聊了又聊。他向我傾訴了他的煩惱。[cite: 5]"]],
  [["He was afraid that his little brother would have no one to play with.", "他害怕他的弟弟會沒有人一起玩。[cite: 5]"]],
  [["Also, he was scared that his dog would go hungry because he had hidden all its bones.", "此外，他也害怕他的狗會挨餓，因為他把牠所有的骨頭都藏起來了。[cite: 5]"]],
  [["It seemed that Billy knew he would never be going home. And yet, even then, he was only thinking of others.", "比利似乎知道他再也回不了家了。然而，即使在那時，他心裡想的仍是別人。[cite: 5]"]]
]);

// --- 挑戰題 4 ---
h += '<h2 id="p4">挑戰題 4</h2>';

h += card('8', ['名詞與介系詞'], 'A',
  '<div class="stem"><div class="en">When I finally stood up to leave, I gave Billy’s parents my number and told them not to hesitate to call me if I could be '+fx("[[8|of assistance]]")+'.</div><div class="zh">當我終於站起來準備離開時，我把電話號碼給了比利的父母，並告訴他們如果我能幫上忙，請毫不猶豫地打電話給我。[cite: 5]</div></div>' +
  clue('be of (any) assistance = be helpful。of + 抽象名詞可替換為形容詞。[cite: 5]') +
  ops([
    ['of assistance', '有幫助的', 'of + 抽象名詞[cite: 5]'],
    ['assisting', '', '正在協助？[cite: 5]'],
    ['assistant', '助理', '名詞 (或作形容詞修飾，但此處不合)[cite: 5]'],
    ['assistance', '幫助', '名詞，前方需加 of[cite: 5]']
  ], 'A')
);

h += card('9', ['關係代名詞/分詞構句'], 'B',
  '<div class="stem"><div class="en">Two days later, I received a call from Billy’s mom '+fx("[[9|in which she told]]")+' me her son had passed away.</div><div class="zh">兩天後，我接到比利媽媽的一通電話，她在電話中告訴我她的兒子過世了。[cite: 5]</div></div>' +
  clue('in which she told = and in the call she told me。which 代替 the call。[cite: 5]') +
  ops([
    ['and told', '', 'and (she) told (省略主詞)，但前方的受詞是 a call，易混淆[cite: 5]'],
    ['in which she told', '在電話中告訴...', 'which = the call[cite: 5]'],
    ['which she told', '', '她告訴這通電話(call)？[cite: 5]'],
    ['she told', '', 'and she told / who told[cite: 5]']
  ], 'B')
);

h += passage("補充段落", [
  [["She wanted to thank me for making a difference in his life, for he’d said to her, “Mommy, I don’t mind if I can’t see Santa this year because I’ve hugged Ronald.”", "她想謝謝我改變了他的人生，因為他曾對她說：「媽咪，我不介意今年看不到聖誕老人，因為我已經擁抱過麥當勞叔叔了。」[cite: 5]"]]
]);

// --- 課本句型實例 1 ---
h += '<h2 id="p5">課本句型 1 (find/consider/think/feel/believe + it + OC + to VR)</h2>';

h += '<div class="stem"><div class="zh" style="color:inherit">1. 許多球迷認為贏得三次冠軍是項偉大的成就。(Many fans think...)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Many fans think it a great achievement to win three championships.]]")+'[cite: 5]<br><small>= Many fans think (that) it is a great achievement to win three championships.</small></div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">2. 許多人認為用手機付費很方便。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Many people consider it convenient to use mobile payment / pay by their phones.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">3. Peter發現通勤上班很浪費時間。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Peter finds it a waste of time (time-wasting) to commute to work.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">4. 有些美國人認為握手時握太用力是不恰當的。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Some Americans consider it inappropriate (for people) to squeeze too hard when shaking hands.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">5. Mandy認為成為大公司的實習生是個很棒的機會。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Mandy thinks it a good chance to become an intern in a large company/corporation.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">6. 多數父母認為投資他們孩子的教育是值得的。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Most parents consider it worthwhile to invest money in the education of their kids.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">7. 越來越多人認為採取立即行動來阻止全球暖化是必要的。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|More and more people consider it essential to take immediate action to stop global warming.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">8. Aaron認為他最喜愛的球隊輸掉冠軍是很可惜的事。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Aaron considers it a great shame/pity for his favorite team to lose the championship.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">9. 動物權利支持者覺得有些人虐待動物的行為令人憂慮。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Animal rights supporters find it disturbing for some people to abuse animals.]]")+'[cite: 5]</div></div>';


// --- 課本句型實例 2 ---
h += '<h2 id="p6">課本句型 2 (appear / seem to have p.p.)</h2>';
h += passage("句型提示", [
  [["seem/appear to have pp 表示該動作發生的時間比 seem/appear 更早。", "to VR 的過去式用 to have p.p.[cite: 5]"]]
]);

h += '<div class="stem"><div class="zh" style="color:inherit">1. 這女孩似乎對這個禮物感到驚訝。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|It appears that the girl is surprised by the gift.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">2. 當地居民似乎對空氣污染感到不滿。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The local residents appeared to be unhappy with the air pollution.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">3. 觀眾似乎對那部浪漫電影評價很高。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|It seemed that the audience thought highly of the romantic movie.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">4. 你似乎把牛仔褲撕破了。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|You appear to have torn your jeans.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">5. 他的第一次約會似乎進行的很順利。(It…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|It seems/appears that his first date went / has gone very well.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">6. 他似乎忘了回家的路。(It…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|It seems/appears that the man forgot / has forgotten his way home.]]")+'[cite: 5]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">7. 他們似乎被什麼可怕的東西嚇到了。(They…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|They seem to have been frightened by some scary things / something scary.]]")+'[cite: 5]</div></div>';
