<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>307 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>307 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h = '';

// --- 挑戰題 1 ---
h += '<h2 id="p1">挑戰題 1</h2>';

h += card('1', ['文法', '名詞子句同位語'], 'C',
  '<div class="stem"><div class="en">The theory '+fx("[[1|that]]")+' spoken words account for only about seven percent of communication involving emotions may surprise many people.</div><div class="zh">口語只佔涉及情感溝通約百分之七的理論，可能會讓許多人感到驚訝。[cite: 6]</div></div>' +
  clue('that + 完整子句時為名詞子句，在此當 theory 的同位語。[cite: 6]') +
  ops([
    ['which', '', 'which + 不完整子句[cite: 6]'],
    ['in which', '', 'in which + 完整子句 = and in this theory，語意不合理[cite: 6]'],
    ['that', '引導名詞子句', '作同位語，後接完整子句[cite: 6]'],
    ['what', '', 'what + 不完整子句[cite: 6]']
  ], 'C')
);

h += card('2', ['字彙', '字根字首'], 'B',
  '<div class="stem"><div class="en">This was first '+fx("[[2|proposed]]")+' by Dr. Albert Mehrabian, a famous psychology professor.</div><div class="zh">這首先是由著名的心理學教授 Albert Mehrabian 博士所提出的。[cite: 6]</div></div>' +
  clue('字根 –pos / -pon / -posit = put。pro- = forward (提出/提議)。[cite: 6]') +
  ops([
    ['composed', '作曲；組成', '= put together (把人事物放一起)[cite: 6]'],
    ['proposed', '提出；提議', '= put … forward (把…放到前面)[cite: 6]'],
    ['imposed', '強加於', '= put … on … (將不好的事物強加在…上)[cite: 6]'],
    ['disposed', '處理掉', '= put … away (賣掉、送人、丟掉)[cite: 6]']
  ], 'B')
);

h += card('3', ['代名詞'], 'A',
  '<div class="stem"><div class="en">According to his studies, we achieve about 55% of our emotional communication with our bodies, for '+fx("[[3|they]]")+' typically demonstrate our true feelings and what we’re actually thinking.</div><div class="zh">根據他的研究，我們約有 55% 的情感溝通是透過身體達成的，因為它們通常展現出我們真實的感受和我們實際在想什麼。[cite: 6]</div></div>' +
  clue('for 在此為連接詞表「因為」(前面須加逗號)。they 代替前面的 our bodies。[cite: 6]') +
  ops([
    ['they', '它們', '= our bodies[cite: 6]'],
    ['which', '', '介 + 關代 + 完整子句 (但此處已經有連接詞 for)[cite: 6]'],
    ['those', '', '需加介片或關係子句[cite: 6]'],
    ['what', '', '當主詞時視為第三人稱單數  demonstrates[cite: 6]']
  ], 'A')
);

h += passage("情境閱讀", [
  [["Therefore, understanding people’s body language is an important ability to help us better interpret others’ messages.", "因此，了解人們的肢體語言是幫助我們更好解讀他人訊息的重要能力。[cite: 6]"]]
]);

// --- 挑戰題 2 ---
h += '<h2 id="p2">挑戰題 2</h2>';

h += card('4', ['介系詞片語'], 'B',
  '<div class="stem"><div class="en">Being able to read body language well is helpful '+fx("[[4|in determining]]")+' whether or not someone is telling the truth.</div><div class="zh">能夠讀懂肢體語言，在判斷某人是否說實話時很有幫助。[cite: 6]</div></div>' +
  clue('in + V-ing = when + V-ing (在做…時)。[cite: 6]') +
  ops([
    ['that it determines', '', '它判斷？它決定？不合邏輯[cite: 6]'],
    ['in determining', '在判斷...時', '= when (we are) determining[cite: 6]'],
    ['to determine', '', 'helpful 後較常搭配 in + V-ing[cite: 6]'],
    ['which determines', '', 'which 指代不明[cite: 6]']
  ], 'B')
);

h += passage("情境閱讀", [
  [["When people are lying, there are usually three telltale signs: making stiff body movements, touching or scratching themselves, and making eye movements.", "當人們說謊時，通常有三個明顯的跡象：僵硬的身體動作、觸摸或抓撓自己，以及眼球的轉動。(telltale signs = obvious signs)[cite: 6]"]],
  [["Typically, liars exhibit fewer arm and hand gestures. When they do make such gestures, their movements are usually stiff, and their hands tend to stay close to the body rather than move in an outward direction.", "通常，說謊者表現出較少的手臂和手勢。當他們確實做出這類手勢時，動作通常是僵硬的，而且他們的手傾向於貼近身體，而不是向外移動。[cite: 6]"]]
]);

h += card('5', ['慣用語', '忍不住'], 'B',
  '<div class="stem"><div class="en">Moreover, liars often '+fx("[[5|can’t help but]]")+' touch or scratch their faces, their necks, or behind their ears.</div><div class="zh">此外，說謊者往往會忍不住觸摸或抓撓他們的臉、脖子，或耳後。[cite: 6]</div></div>' +
  clue('can\'t help but + VR (忍不住；不得不)。[cite: 6]') +
  ops([
    ['can’t help', '', '應接 V-ing[cite: 6]'],
    ['can’t help but', '忍不住', '後接原形動詞 touch/scratch[cite: 6]'],
    ['have no choice but', '', '應接 to VR (have no choice but to)[cite: 6]'],
    ['can’t resist', '', '應接 V-ing[cite: 6]']
  ], 'B')
);

// --- 講義重點 1 ---
h += '<h2 id="p3">講義重點 1 (介系詞片語)</h2>';

h += passage("句型提示", [
  [["They sometimes rub their eyes without being conscious of it as well.", "他們有時也會揉眼睛而不自覺 / 而沒有察覺。[cite: 6]"]],
  [["They sometimes rub their eyes instead of looking into yours.", "他們有時會揉眼睛而不是直視你的眼睛。[cite: 6]"]]
]);

h += card('6', ['介系詞'], 'C',
  '<div class="stem"><div class="en">'+fx("[[6|Due to]]")+' bad management, the company sustained great losses in business.</div><div class="zh">由於管理不善，該公司在業務上蒙受了巨大損失。[cite: 6]</div></div>' +
  ops([
    ['Instead of', '不是...而是...', '[cite: 6]'],
    ['Without', '沒有', '[cite: 6]'],
    ['Due to', '由於', '引導原因[cite: 6]'],
    ['In regard to', '關於', '= regarding = about[cite: 6]']
  ], 'C')
);

h += card('7', ['介系詞'], 'D',
  '<div class="stem"><div class="en">One cannot be creative '+fx("[[7|without]]")+' being out there and alone...</div><div class="zh">一個人在不跳脫常規且獨處的情況下是無法發揮創造力的...[cite: 6]</div></div>' +
  ops([
    ['instead of', '不是...而是', '[cite: 6]'],
    ['apart from', '除...外', '[cite: 6]'],
    ['besides', '除...外 (包含)', '[cite: 6]'],
    ['without', '在不...的情況下', '而不...[cite: 6]']
  ], 'D')
);

h += card('8', ['介系詞'], 'D',
  '<div class="stem"><div class="en">Our habit of relying on intuition '+fx("[[8|instead of]]")+' instructions may cause catastrophic consequences.</div><div class="zh">我們依賴直覺而非指示的習慣可能會導致災難性的後果。[cite: 6]</div></div>' +
  ops([
    ['but rather', '', '[cite: 6]'],
    ['other than', '', '[cite: 6]'],
    ['without', '', '[cite: 6]'],
    ['instead of', '而非', '取代[cite: 6]']
  ], 'D')
);

h += card('9', ['介系詞'], 'A',
  '<div class="stem"><div class="en">Experts predict that more people will live in rural settings, with technology enabling them to do almost anything they like '+fx("[[9|without]]")+' leaving their homes.</div><div class="zh">專家預測將有更多人居住在鄉村環境中，科技使他們能夠在「不」離開家的情況下做幾乎任何他們想做的事。[cite: 6]</div></div>' +
  ops([
    ['without', '在不...的情況下', '[cite: 6]'],
    ['by', '', '[cite: 6]'],
    ['while', '', '[cite: 6]'],
    ['instead of', '', '[cite: 6]']
  ], 'A')
);

h += card('10', ['介系詞 / 連接詞'], 'D',
  '<div class="stem"><div class="en">Some schools encourage students to keep their books in school lockers '+fx("[[10|rather than]]")+' (to) carry them around.</div><div class="zh">有些學校鼓勵學生把書留在學校的置物櫃，而不是帶著它們到處走。[cite: 6]</div></div>' +
  ops([
    ['instead', 'adv.', '[cite: 6]'],
    ['instead of', '', '應接 N / Ving[cite: 6]'],
    ['without', '', '[cite: 6]'],
    ['rather than', '而不是', '連接詞，後可接原形動詞或不定詞[cite: 6]']
  ], 'D')
);

// --- 課文挑戰題 (L22-L26) ---
h += '<h2 id="p4">課文與講義重點 2 (轉折語)</h2>';
h += passage("情境閱讀", [
  [["Whether people are telling falsehoods (or not) can also be detected by observing how their eyes move as they speak.", "人們是否在說謊（falsehoods = lies）也可以透過觀察他們說話時眼睛如何移動來偵測。[cite: 6]"]]
]);

h += card('11', ['轉折語'], 'A',
  '<div class="stem"><div class="en">When right-handed people say true things, their eyes move to their left. '+fx("[[11|In contrast]]")+', when they are lying or being “creative” with the truth, their eyes tend to drift toward their right.</div><div class="zh">當右撇子說實話時，他們的眼睛會向左移。相比之下，當他們在說謊或對真相「發揮創意」時，他們的眼睛往往會向右飄。[cite: 6]</div></div>' +
  clue('in/by contrast 用在不同的人事物之間的對比（說實話 vs. 說謊）。on the contrary 用於前後相同的人事物。[cite: 6]') +
  ops([
    ['In contrast', '相比之下', '用於不同事物對比[cite: 6]'],
    ['On the contrary', '相反地', '用於前後相同人事物的更正[cite: 6]'],
    ['Rather', '取而代之地', '= Instead (adv)[cite: 6]'],
    ['To be sure', '的確', '= Indeed[cite: 6]']
  ], 'A')
);

h += card('12', ['轉折語'], 'C',
  '<div class="stem"><div class="en">Good listeners are inclined to accept or tolerate rather than to judge and criticize. Therefore, they have fewer enemies than other people. '+fx("[[12|In fact]]")+', they are probably the most loved of people.</div><div class="zh">好的傾聽者傾向於接受或包容，而不是評判和批評。因此，他們的敵人比其他人少。事實上，他們可能是最受喜愛的人。[cite: 6]</div></div>' +
  clue('in fact 的兩個意思：加強語氣 & 更正事實。此處為加強語氣。[cite: 6]') +
  ops([
    ['In contrast', '', '[cite: 6]'],
    ['In particular', '', '[cite: 6]'],
    ['In fact', '事實上', '加強語氣[cite: 6]'],
    ['In other words', '', '[cite: 6]']
  ], 'C')
);

h += card('13', ['轉折語'], 'B',
  '<div class="stem"><div class="en">The petrol scooter, as its name suggests, uses gas as fuel. '+fx("[[13|By contrast]]")+', the electric scooter runs on electric energy stored in the battery, thus producing less air pollution.</div><div class="zh">正如其名，汽油機車使用汽油作為燃料。相比之下，電動機車依賴儲存在電池中的電能運行，從而產生較少的空氣污染。[cite: 6]</div></div>' +
  clue('兩種不同事物 (petrol scooter 與 electric scooter) 的對比，使用 by contrast。[cite: 6]') +
  ops([
    ['On the contrary', '', '[cite: 6]'],
    ['By contrast', '相比之下', '[cite: 6]'],
    ['In addition', '', '[cite: 6]'],
    ['Likewise', '同樣地', '= in the same way[cite: 6]']
  ], 'B')
);

h += card('14', ['轉折語'], 'C',
  '<div class="stem"><div class="en">Carla: Have you two been fighting? Frasier: '+fx("[[14|On the contrary]]")+'. Cam and I are here to announce the cessation of all hostilities between us.</div><div class="zh">Carla: 你們兩個在打架嗎？ Frasier: 恰恰相反。Cam 和我是來宣布我們之間所有敵意的停止。[cite: 6]</div></div>' +
  clue('對先前提問的直接更正/反駁，使用 on the contrary。[cite: 6]') +
  ops([
    ['In contrast', '', '[cite: 6]'],
    ['In other words', '', '[cite: 6]'],
    ['On the contrary', '恰恰相反', '[cite: 6]'],
    ['To the contrary', '', '[cite: 6]']
  ], 'C')
);

h += card('15', ['轉折語'], 'D',
  '<div class="stem"><div class="en">Research has proven that weather plays a part in our moods... '+fx("[[15|Accordingly]]")+', many people believe that bad weather can reduce productivity and efficiency.</div><div class="zh">研究證明天氣會影響我們的情緒... 因此，許多人認為惡劣的天氣會降低生產力和效率。[cite: 6]</div></div>' +
  clue('accordingly = therefore = thus (adv) 因此。[cite: 6]') +
  ops([
    ['At most', '最多', '[cite: 6]'],
    ['In contrast', '對比', '[cite: 6]'],
    ['Literally', '真的；照字面地', '[cite: 6]'],
    ['Accordingly', '因此', '[cite: 6]']
  ], 'D')
);

h += card('16', ['轉折語'], 'D',
  '<div class="stem"><div class="en">The eastern dragon, for example, is a benevolent creature that controls bodies of water and represents good fortune. '+fx("[[16|As such]]")+', people born in the Year of the Dragon are said to be healthy, wealthy, and wise.</div><div class="zh">例如，東方龍是一種控制水域並代表好運的仁慈生物。正因如此（作為這樣代表好運的生物），據說在龍年出生的人健康、富有且聰明。[cite: 6]</div></div>' +
  clue('as such = as such a creature (作為這樣的生物)。[cite: 6]') +
  ops([
    ['On the other hand', '另一方面', '≒ however[cite: 6]'],
    ['(Ever) since', '從那時起', '[cite: 6]'],
    ['In contrast', '對比', '[cite: 6]'],
    ['As such', '正因如此', '作為這樣的人事物[cite: 6]']
  ], 'D')
);

h += card('17', ['轉折語'], 'A',
  '<div class="stem"><div class="en">Good writers do not always write explicitly; '+fx("[[17|on the contrary]]")+', they often express what they really mean in an indirect way.</div><div class="zh">優秀的作家並不總是寫得很直白；相反地，他們經常以間接的方式表達他們真正的意思。[cite: 6]</div></div>' +
  clue('用來更正/反駁前半句的說法 (do not always write explicitly)，故用 on the contrary。[cite: 6]') +
  ops([
    ['on the contrary', '相反地', '[cite: 6]'],
    ['namely', '也就是說', '= in other words[cite: 6]'],
    ['in a way', '某種程度上', '[cite: 6]'],
    ['in contrast', '相比之下', '[cite: 6]']
  ], 'A')
);
