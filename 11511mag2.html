<style>
  :root{
    color-scheme: light;
    --paper:#EEEAE0;
    --paper-deep:#E6E1D3;
    --card:#FBF9F3;
    --rule:#D8D2C0;
    --ink:#24262A;
    --ink-soft:#63665F;
    --ink-faint:#94978D;
    --margin:#3A5A7A;
    --red:#A6321D;
    --red-soft:#C65A3E;
    --green:#3A5A40;
    --focus:#1D4E89;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: calc(128px + env(safe-area-inset-top,0px));}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 0 0, rgba(0,0,0,0.02), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(0,0,0,0.02), transparent 40%);
    color:var(--ink);
    font-family:'Source Serif 4','Noto Serif TC',serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
    -webkit-text-size-adjust:100%;
  }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  header.hero{ max-width:640px; margin:0 auto; padding:30px 20px 18px; }
  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:12px; letter-spacing:.04em; color:var(--margin);
    display:flex; align-items:center; gap:8px;
  }
  .kicker::before{ content:""; width:7px;height:7px;border-radius:50%; background:var(--margin); display:inline-block; }
  h1{
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:26px;
    line-height:1.35; margin:10px 0 6px; letter-spacing:.01em;
  }
  h1 em{
    font-style:normal; color:var(--margin);
    text-decoration:underline; text-decoration-color:#8FA9BC;
    text-decoration-thickness:2px; text-underline-offset:3px;
  }
  .hero-sub{ color:var(--ink-soft); font-size:14.5px; line-height:1.6; max-width:52ch; }
  .hero-meta{
    margin-top:16px; display:flex; gap:18px;
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint);
  }
  .hero-meta b{ color:var(--ink); font-weight:700; }

  .toolbar{
    position:sticky; top:0; z-index:20;
    background:rgba(238,234,224,.94);
    backdrop-filter:saturate(140%) blur(6px);
    border-bottom:1px solid var(--rule);
    padding-top:env(safe-area-inset-top,0px);
  }
  .nav{
    max-width:640px; margin:0 auto; display:flex; gap:8px;
    overflow-x:auto; padding:10px 20px; scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none;}
  .navchip{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace; font-size:12.5px;
    color:var(--ink-soft); background:transparent;
    border:1px solid var(--rule); border-radius:999px;
    padding:6px 12px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .navchip.active{ background:var(--ink); border-color:var(--ink); color:#F3EFE4; }

  .controls{
    max-width:640px; margin:0 auto; padding:0 20px 12px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .progress{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); }
  .progress b{ color:var(--red); font-weight:700; }
  .reveal-toggle{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--card); background:var(--red); border:1px solid var(--red);
    border-radius:999px; padding:7px 14px; cursor:pointer; letter-spacing:.02em;
  }

  main{ max-width:640px; margin:0 auto; padding:8px 16px 0; }

  .range-section{ margin-top:26px; scroll-margin-top:110px; }

  }
  .range-head .r-label{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--margin); }
  .range-head .r-count{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); }

  .qlist{ list-style:none; margin:0; padding:0; }

  .qcard{
    position:relative; background:var(--card);
    border-bottom:1px solid var(--rule);
    padding:16px 14px 16px 46px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .qcard::before{
    content:""; position:absolute; left:30px; top:0; bottom:0; width:1px;
    background:var(--margin); opacity:.55;
  }
  .qnum{
    position:absolute; left:6px; top:16px; width:20px;
    font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--ink-faint); text-align:right;
  }
  .q-en{ font-size:16px; line-height:1.75; color:var(--ink); }
  .blank{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;
    letter-spacing:.01em; color:var(--ink-faint);
    border-bottom:1.5px dashed var(--ink-faint); padding:0 1px;
  }
  .answer-ink{
    display:none;
    font-family:Arial, Helvetica, 'Segoe UI', sans-serif;
    font-weight:700; font-size:15.5px; letter-spacing:.01em;
    color:var(--red); margin-left:2px; white-space:nowrap;
  }
  .qcard.revealed .blank{
    color:var(--ink-faint); text-decoration:line-through;
    text-decoration-color:var(--ink-faint); opacity:.55; border-bottom-style:solid;
  }
  .qcard.revealed .answer-ink{ display:inline; }

  .q-zh{ margin-top:8px; font-family:'Noto Serif TC',serif; font-size:13.5px; line-height:1.85; color:var(--ink-soft); }

  .q-foot{
    margin-top:9px; display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint);
  }
  .tap-hint{ display:inline-flex; align-items:center; gap:5px; }
  .qcard.revealed .tap-hint::before{ content:"✓ "; color:var(--green); }
  .qcard:not(.revealed) .tap-hint::before{ content:"點按查看答案"; }
  .qcard.revealed .tap-hint::before{ content:"答案：" attr(data-word); }

  footer{
    max-width:640px; margin:34px auto 0; padding:18px 20px 0;
    border-top:1px solid var(--rule);
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); text-align:center;
  }

  @media (min-width:640px){
    .qcard{ padding-left:52px; }
    .qcard::before{ left:36px; }
    .qnum{ left:8px; }
  }
</style>
</head>

 their valuable c____ns to cleaning up the neighborhood parks.", "zh": "市長在年度社區晚宴上感謝了所有盡責的志工。黃先生表彰了他們在清理社區公園方面所做的寶貴貢獻。", "blank": "c____ns"}, {"num": 16, "word": "accelerated", "en": "The car a________ted rapidly after the traffic light turned green. Within seconds, the driver had reached the speed limit.", "zh": "交通號誌轉綠後，汽車迅速加速。幾秒內，駕駛就已經達到速限。", "blank": "a________ted"}, {"num": 17, "word": "combinations", "en": "The safety lock requires three numbers to be turned in the exact order. Kevin tried multiple c____ns before finally managing to open the heavy metal safe.", "zh": "安全鎖需要按精確順序轉動三個數字。凱文嘗試了多種組合，最後終於成功打開了沉重的金屬保險箱。", "blank": "c____ns"}, {"num": 18, "word": "exceeded", "en": "The successful fundraising campaign went far beyond everyone's initial expectations. Director Lin was thrilled that the total donations e____ded the original goal by one million dollars.", "zh": "成功的募款活動遠遠超出了每個人的初步預期。林主任對於總捐款數額超過原定目標一百萬元感到非常興奮。", "blank": "e____ded"}, {"num": 19, "word": "reinforces", "en": "The teacher gives students a weekly quiz to review the previous lessons. Mr. Chang uses these short tests to r____es important mathematical concepts.", "zh": "老師每週給學生小測驗以複習之前的課程。張老師利用這些簡短的考試來強化重要的數學概念。", "blank": "r____es"}, {"num": 20, "word": "pace", "en": "The teacher encouraged the students to work at their own p___e. Taking short breaks helped several students remain focused longer.", "zh": "老師鼓勵學生按照自己的步調學習。短暫休息幫助幾名學生維持更長時間的專注。", "blank": "p___e"}, {"num": 21, "word": "presentation", "en": "The marketing manager prepared multiple visual charts for the important client meeting. Director Zhao expects this professional p____n to win the huge contract.", "zh": "行銷經理為重要的客戶會議準備了多張視覺圖表。趙總監期望這場專業的簡報能贏得這份巨額合約。", "blank": "p____n"}, {"num": 22, "word": "variations", "en": "The composer wrote several different versions of the main theme song. Pianist Chou played all the beautiful v____ns during his impressive solo concert.", "zh": "作曲家寫了幾種不同版本的主題曲。鋼琴家周在他令人印象深刻的獨奏會上演奏了所有美麗的變奏。", "blank": "v___         <div class="q-en">${escapeHtml(parts.before)}<span class="blank">${escapeHtml(parts.blankTxt)}</span><span class="answer-ink">${escapeHtml(e.word)}</span>${escapeHtml(parts.after)}</div>
        <div class="q-zh">${escapeHtml(e.zh)}</div>
        <div class="q-foot"><span class="tap-hint" data-word="${escapeHtml(e.word)}"></span></div>
      `;

      li.addEventListener('click', () => {
        li.classList.toggle('revealed');
        updateProgress();
      });

      list.appendChild(li);
    });

    section.appendChild(list);
    main.appendChild(section);
  });

  function updateProgress(){
    const total = document.querySelectorAll('.qcard').length;
    const revealed = document.querySelectorAll('.qcard.revealed').length;
    document.getElementById('progressN').textContent = revealed;
    document.getElementById('metaRevealed').textContent = revealed;
    const btn = document.getElementById('revealAllBtn');
    btn.textContent = (revealed === total && total > 0) ? '隱藏全部答案' : '顯示全部答案';
  }

  window.toggleAll = function(){
    const cards = document.querySelectorAll('.qcard');
    const allRevealed = document.querySelectorAll('.qcard.revealed').length === cards.length;
    cards.forEach(c => c.classList.toggle('revealed', !allRevealed));
    updateProgress();
  };

  window.jumpTo = function(rid){
    const el = document.getElementById(rid);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
  };

  const chips = Array.from(document.querySelectorAll('.navchip'));
  const sections = RANGES.map(([a,b]) => document.getElementById(`r${a}-${b}`));
  function onScroll(){
    let activeIdx = 0;
    const y = window.scrollY + 130;
    sections.forEach((s, i) => { if(s && s.offsetTop <= y) activeIdx = i; });
    chips.forEach((c, i) => c.classList.toggle('active', i === activeIdx));
  }
  document.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
  updateProgress();
})();
</script>
</body>
</html>
