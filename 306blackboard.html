<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>306 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>306 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

/* === Part 1: L1 ~ L56 課文講解與非題目句子依序呈現 === */
const h1 = '<h2 id="p1">L1 ~ L56 課文講解 (The Country of the Blind)</h2>' +
  passage("L1 課文段落与字彙補充", [[
    ["Nuñez, an experienced mountaineer, was climbing up one of Ecuador’s highest mountains when he lost his footing.", "經驗豐富的登山客 Nuñez 在攀登厄瓜多最高峰之一時失足了。（an experienced mountaineer 為同位語；equator 赤道；experienced adj. 有經驗的）"]
  ]]) + [
  card("L3", ["詞義解析", "tumbling 翻滾/滾落"], "A",
    st("He slid down a snowy slope and fell over a cliff edge, [[L3|tumbling]] a great distance.", "他滑下雪坡，掉下懸崖邊緣，翻滾了很長一段距離。") +
    clue("移動動詞 + 距離的用法（e.g., <i>walk a mile, travel a long way</i>）。") +
    ops([
      ["tumbling", "86%", "Vi. 翻滾、滾落（後接移動距離 a great distance）。"],
      ["vanishing", "0%", "Vi. 消失。"],
      ["trembling", "14%", "Vi. 發抖、顫抖。"],
      ["surviving", "0%", "Vi. 在…之後存活下來。"]
    ], "A")
  ),

  card("L4", ["分詞片語修飾", "(which was) cut off 與…隔絕"], "C",
    st("Bruised and dazed, he found himself in a place [[L4|(which was) cut off]] from the world.", "帶著瘀青和神情恍惚，他發現自己身處一個與世隔絕的地方。") +
    clue("• <code>dazed</code>：confused and unable to think clearly 神情恍惚的（例：<i>You're looking rather dazed -- is something wrong?</i>）<br>• <code>be cut off from...</code>：與…隔絕（= <code>be isolated from</code>）。") +
    ops([
      ["which cut off", "23%", "少受詞，且句意不合理（<code>cut … off</code> 為及物片語「將…切斷」）。"],
      ["where it’s cut off", "23%", "it 不知指誰？什麼被切斷？"],
      ["(which was) cut off", "43%", "過去分詞片語修飾 a place，表「與世隔絕的」。"],
      ["cutting off", "11%", "= which cut off，少受詞且句意不合理。"]
    ], "C")
  ),

  card("L6", ["詞義解析与慣用語", "struggle to one's feet 掙扎著站起來"], "A",
    st("Despite his injuries, Nuñez [[L6|struggled]] to his feet and set off to explore.", "儘管受了傷，Nuñez 還是掙扎著站了起來，出發去探索。") +
    clue("慣用片語：<code>struggle to one’s feet</code>（掙扎、費力地站起來）。") +
    ops([
      ["struggled", "46%", "Vi. 掙扎、費力地移動（<code>struggle to one’s feet</code> 掙扎著站起來）。"],
      ["managed", "23%", "<code>manage to VR</code> 設法完成某件困難的事 → 應寫 <i>managed to get on/to his feet</i>。"],
      ["recovered", "9%", "恢復；沒有 recovered to his feet 的用法 → <i>he recovered his balance</i>（恢復平衡）。"],
      ["attempted", "23%", "attempt 後接不定詞（e.g., <i>attempted to stand up</i>）。"]
    ], "A")
  ),

  card("L7", ["動詞與連接詞數量判斷", "S2 + V2 (had)"], "B",
    st("As he made his way through the unfamiliar land, he came upon an unusual village. The houses were unevenly painted, and all the roads leading to the houses [[L7|had]] low walls alongside them.", "當他在這片陌生的土地上前行時，偶然發現了一個不尋常的村莊。房屋塗漆不均勻，而且所有通往房屋的道路兩旁都有低矮的牆。") +
    clue("結構剖析：<code>The houses (S1) were (V1) unevenly painted, <b>and</b> (連) all the roads (S2) [leading to the houses (分詞片語)] <b>had</b> (V2) low walls (O) alongside them.</code><br>對等連接詞 <code>and</code> 後方的主詞是 <code>all the roads</code>，需要第二個子句的主要動詞 <code>had</code>（使整句有 2 個主要動詞 + 1 個連接詞）！") +
    ops([
      ["which had", "49%", "多一個連接詞 which，導致 S2 (all the roads) 沒有主要動詞。"],
      ["had", "41%", "主要動詞，使整句剛好為「2 動詞 + 1 連接詞（and）」。"],
      ["in which", "8%", "多一個連接詞且缺動詞（比較：<i>All the roads lead to the houses in which blind people live.</i>）。"],
      ["where they had", "2%", "多一個連接詞，且 they 指代不明。"]
    ], "B")
  ),

  card("L10", ["不定詞意義主詞", "It takes + 時間 + for sb + to VR"], "D",
    st("It didn’t take long [[L10|for]] Nuñez to realize that every villager was blind.", "Nuñez 沒花多少時間就意識到每個村民都是盲人。") +
    clue("句型：<code>It takes + 時間 + <b>for + 人</b> + to VR</code>（某人花多少時間做到某事），不定詞 <code>to realize</code> 的行為者（意義主詞）以 <code>for + N</code> 表達。") +
    ops([
      ["until", "17%", "until 為連接詞，後接完整子句（如 <i>It wasn’t long until he understood...</i>），但空格後是 <code>Nuñez to realize</code>（非完整子句）！"],
      ["when", "0%", "後接完整子句。"],
      ["that", "9%", "後接完整子句。"],
      ["for", "74%", "<code>for Nuñez to realize...</code>（不定詞的意義主詞用 for + N）。"]
    ], "D") +
    passage("L10 ~ L11 課文與補充閱讀", [[
      ["【L10 補充例句】It wasn’t long until he understood that some things are worth losing in order to find yourself again. / It takes time for us to realize that happiness does not come from having more, but from needing less.", "沒過多久他就明白，為了重新找回自己，有些東西是值得放下的（lose 除了失去，亦有放下、脫下之意，如 lose your gloves 脫下手套）。／我們需要時間才會意識到，幸福並非來自擁有更多，而是來自需要的更少。"],
      ["【L11】Feeling superior to these sightless people, he thought to himself, “In the country of the blind, the one-eyed man is king.”", "覺得自己比這些看不見的人優越，他心想：「在盲人國裡，獨眼人就是國王。」（superior to 較…優越 ↔ inferior to 較…低劣；senior to 較…年長/資深 ↔ junior to 較…年輕/資淺）"],
      ["【情境思考】Imagine landing in a remote tribe where nobody has ever used a phone and the internet doesn’t even exist. Then you pull out an iPhone 18 Pro Max. Do you become their queen… or just the crazy gal carrying a glowing brick?", "想像一下，你來到了一個從未有人用過手機、連網路都不存在的偏遠部落。然後你掏出了一支 iPhone 18 Pro Max。你會成為他們的女王……還是只是一個拿著發光磚塊的瘋女孩？"]
    ]])
  ),

  card("L14", ["副詞字彙辨析", "intimately 透徹地/非常熟悉地"], "A",
    st("However, after spending time with the locals, he was amazed at their great knowledge. Though blind, they knew their mountain kingdom [[L14|intimately]].", "然而，在與當地人相處一段時間後，他對他們豐富的知識感到驚訝。雖然失明，但他們對自己的高山王國瞭若指掌（非常熟悉）。") +
    clue("村民雖然看不見，但對自己的高山王國了解得非常「透徹、熟悉（intimately）」。") +
    ops([
      ["intimately", "—", "透徹地、非常熟悉地（knew their mountain kingdom intimately）。"],
      ["vaguely", "—", "模糊地（與前句 amazed at their great knowledge 矛盾）。"],
      ["intensely", "—", "強烈地、極度地（常修飾情緒、疼痛或光芒，不修飾 knew）。"],
      ["instinctively", "—", "本能地、直覺地（本能通常用於抽象反應如「本能地察覺危險」，對地理環境的了解是長年生活累積而來，非本能）。"]
    ], "A")
  ),

  card("L16", ["形容詞字彙搭配", "keen senses 敏銳的感官"], "C",
    st("The villagers skillfully farmed and moved around by using their [[L16|keen]] senses of hearing, touch, and smell.", "村民們利用他們敏銳的聽覺、觸覺和嗅覺，熟練地耕種並四處走動。") +
    clue("修飾感官（聽覺、觸覺、嗅覺）「敏銳的」，標準搭配為 <code>keen senses</code>。") +
    ops([
      ["fierce", "—", "激烈的、兇猛的（用在競爭、情緒、暴風雨等）。"],
      ["vital", "—", "極重要的、維持生命必需的。"],
      ["keen", "—", "敏銳的（<code>keen senses of hearing, touch, and smell</code>）。"],
      ["hollow", "—", "空洞的、中空的。"]
    ], "C")
  ),

  card("L18", ["動詞字彙辨析", "employed 採用/運用"], "D",
    st("They also [[L18|employed]] effective techniques for growing crops and caring for animals.", "他們還採用（運用）了種植農作物和照料動物的有效技術。") +
    clue("受詞是 <code>effective techniques</code>（有效的技術），表「採用、運用（某種方法或技術）」用 <code>employed</code>（= used）。") +
    ops([
      ["appointed", "—", "指派、任命（職位）。"],
      ["cultivated", "—", "培養（特質）；種植（作物，不搭配 techniques）。"],
      ["dismissed", "—", "摒棄、不予理會；解僱。"],
      ["employed", "—", "採用、運用（技術或方法）。"]
    ], "D")
  ),

  card("L20", ["分詞插入後之主要動詞", "The paths, lined with..., were built"], "A",
    st("The paths, lined with low walls, [[L20|were]] specially built to help them navigate safely.", "兩旁排著低矮牆壁的小徑，是特別建造來幫助他們安全導航（尋路）的。") +
    clue("主詞為複數名詞 <code>The paths</code>，兩個逗號中間的 <code>, lined with low walls,</code> 為過去分詞片語（<code>be lined with</code> 兩旁排滿了…），空格需填主要動詞 <code>were</code>（與 <code>built</code> 構成過去簡單被動式）。") +
    ops([
      ["were", "—", "過去式複數 be 動詞，構成被動 <code>were specially built</code>。"],
      ["would be", "—", "小徑已經建造好了，非過去未來式。"],
      ["being", "—", "分詞無法作主要動詞。"],
      ["had been", "—", "無過去之過去的先後對比，用一般過去被動即可。"]
    ], "A") +
    passage("L20 補充例句 (be lined with & navigate)", [[
      ["Her room is lined with bookshelves from floor to ceiling. / The narrow lane, lined with old brick houses, leads to the river.", "她的房間從地板到天花板排滿了書架。／兩旁排著老磚房的狹窄巷弄通往河邊。"],
      ["navigate 導航、找路 →（引申）在複雜情境中摸索應對：Students need to learn how to navigate social media and spot fake news. / Choosing a university major can be hard, but a good mentor helps you navigate your options.", "學生需要學會如何駕馭社群媒體並識破假新聞。／選擇大學科系可能很難，但好的導師能幫助你釐清各種選擇。"]
    ]])
  ),

  card("L22", ["慣用片語", "put sb to work 派某人去工作"], "A",
    st("Among the villagers, a respected elder named Yacob put the outsider [[L22|to work]] and began teaching him their ways.", "在村民之中，一位名叫 Yacob 的受敬重長者派這個外來者去幹活（工作），並開始教導他他們的生活方式。") +
    clue("固定片語：<code>put sb to work</code>（叫某人開始做事、派某人去工作）。") +
    ops([
      ["to work", "—", "<code>put the outsider to work</code>（派這個外來者去工作）。"],
      ["working", "—", "無 put sb working 用法（若用 <code>set</code> 才可說 <i>set sb working</i>）。"],
      ["with work", "—", "無此用法（交代工作給某人用 <i>assign/give work to sb</i>）。"],
      ["by working", "—", "語意不合。"]
    ], "A") +
    passage("L22 補充例句", [[
      ["The teacher put the students to work on a group project. / To keep the mischievous boy out of trouble, she set him working in the garden.", "老師讓學生們開始進行小組報告工作。／為了不讓這個調皮男孩惹麻煩，她讓他在花園裡幹活。"],
      ["sb’s ways 生活方式、做事習慣：The coach taught the new player the team's ways, from training habits to game-day rules. / You and your ways! I should have known you'd show up late again. (Friends S5E10)", "教練教導新球員球隊的做事規矩。／你喔，就是這副德行！我早該知道你又會遲到了。"]
    ]])
  ),

  card("L24", ["動詞片語辨析", "adapted to 適應"], "C",
    st("Gradually, Nuñez [[L24|adapted to]] their way of life, but he clung to the reality of sight.", "漸漸地，Nuñez 適應了他們的生活方式，但他仍緊抓著視覺的真實性不放。") +
    clue("Nuñez 漸漸「適應（adapted to）」了盲人村的生活方式。") +
    ops([
      ["applied to", "—", "適用於；向…提出申請（<i>The rule applies to everyone.</i>）。"],
      ["appealed to", "—", "吸引；懇求（<i>The idea appeals to me.</i>）。"],
      ["adapted to", "—", "適應（<code>adapted to their way of life</code>）。"],
      ["objected to", "—", "反對（<i>He objected to letting her participate.</i>）。"]
    ], "C") +
    passage("L24 ~ L25 課文與補充例句", [[

  card("句2-3", ["句型2：either by credit card or in cash", "付款方式介系詞"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-3. 你可以用刷卡或現金付款。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|You can pay either by credit card or in cash.]]")+'</div></div>' + clue("道地英文表達：「刷卡付款」用 <code>pay <b>by</b> credit card</code>（不加冠詞 a）；「付現」用 <code>pay <b>in</b> cash</code>（避免寫出 <i>use a credit card or cash to pay</i> 的中式英文）。")),
  card("句2-4", ["句型2：neither ... nor ...", "都不喜歡"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-4. 我不喜歡爬山也不喜歡健行。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|I like neither mountain climbing nor hiking.]]")+'</div></div>'),
  card("句2-5", ["句型2：neither V-ed nor V-ed", "時態一致"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-5. Sam 沒道歉也沒給任何解釋。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Sam neither apologized nor gave any explanations.]]")+'</div></div>' + clue("注意對等連接詞時態一致：前面是過去式 <code>apologized</code>，後面也必須是過去式 <code>gave</code>（不可寫 give）！")),
  card("句2-6", ["句型2：Neither A nor B + V", "動詞鄰近一致"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">句2-6. Olivia 和她的先生都不會說英文。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Neither Olivia nor her husband speaks (can speak) English.]]")+'</div></div>' + clue("1. 「會不會說某種語言」直接用 <code>speak(s) / can speak English</code>（不必加 know how to）。<br>2. <code>Neither A nor B</code> 連接主詞時，動詞配合靠近的 <b>B（<code>her husband</code>，單數）</b>，故用單數動詞 <code>speaks</code>！"))
].join('');

document.getElementById('app').innerHTML = h1 + h2;
const secs=[['p1','L1~L56 課文講解'],['p2','句型1 & 句型2']];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){
  open=!open;
  document.querySelectorAll('details.q').forEach(d=>d.open=open);
  this.textContent=open?'全部收合':'全部展開';
};
</script>
