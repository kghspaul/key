<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>306 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>306 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h1 = '<h2 id="p1">I 挑戰題 1</h2>';
h1 += passage("前言", [[
  ["Nuñez, an experienced mountaineer, was climbing up one of Ecuador’s highest mountains when he lost his footing.", "經驗豐富的登山客 Nuñez 在攀登厄瓜多最高的山峰之一時，不慎失足。 (equator 赤道)"]
]]);
SENT["L3"] = ["He slid down a snowy slope and fell over a cliff edge, [[L3|tumbling]] a great distance.", "他滑下雪坡並跌落懸崖邊緣，滾落了好長一段距離。"];
h1 += card("L3", ["詞彙", "分詞"], "A", stem("L3") + ops([
  ["tumbling", "Vi. 翻滾、滾落", "移動動詞 + 距離的用法 (e.g. walk a mile, travel a long way)"],
  ["vanishing", "Vi. 消失", ""],
  ["trembling", "Vi. 發抖、顫抖", ""],
  ["surviving", "Vi. 在…之後存活下來", ""]
], "A"));

SENT["L4"] = ["Bruised and dazed, he found himself in a place [[L4|(which was) cut off]] from the world.", "他滿身瘀青、神情恍惚，發現自己身處一個與世隔絕的地方。"];
h1 += card("L4", ["文法", "分詞片語"], "C", stem("L4") + clue("dazed: confused and unable to think clearly 神情恍惚的 (e.g. You're looking rather dazed -- is something wrong?)") + ops([
  ["which cut off", "", "少受詞，且句意不合理 (cut … off 將…切斷)"],
  ["where it’s cut off", "", "it不知指誰？什麼被切斷？"],
  ["(which was) cut off", "", "be cut off from 與…隔絕 = be isolated from"],
  ["cutting off", "", "= which cut off 少受詞，且句意不合理"]
], "C"));

SENT["L6"] = ["Despite his injuries, Nuñez [[L6|struggled]] to his feet and set off to explore.", "儘管受了傷，Nuñez 還是掙扎著站了起來，出發去探索。"];
h1 += card("L6", ["詞彙", "動詞搭配"], "A", stem("L6") + ops([
  ["struggled", "Vi. 掙扎、費力地移動", "struggle to one’s feet 掙扎、費力地站起來"],
  ["managed", "設法完成", "manage to VR 設法完成某件困難的事 → managed to get to his feet"],
  ["recovered", "恢復", "沒有 recovered to his feet 的用法 → he recovered his balance（恢復平衡）"],
  ["attempted", "試圖", "attempt 後接不定詞 (e.g. attempted to stand)"]
], "A"));

SENT["L7"] = ["As he made his way through the unfamiliar land, he came upon an unusual village. The houses were unevenly painted, and all the roads leading to the houses [[L7|had]] low walls alongside them.", "當他在這片陌生土地上前進時，偶然發現了一個不尋常的村莊。房屋的油漆塗得不均勻，且所有通往房屋的道路旁都有低矮的牆壁。"];
h1 += card("L7", ["文法", "句子結構"], "B", stem("L7") + clue("S1: The houses, V1: were; 連接詞: and; S2: all the roads leading to the houses, V2: had, O: low walls.") + ops([
  ["which had", "", "多一個連接詞"],
  ["had", "", "使整句有2動詞+1連接詞，為正確結構"],
  ["in which", "", "多一個連接詞。介系詞 + 關代 + 完整子句 (e.g. All the roads lead to the houses in which blind people live.)"],
  ["where they had", "", "多一個連接詞。they 指誰？roads 或houses都不合理"]
], "B"));

SENT["L10"] = ["It didn’t take long [[L10|for]] Nuñez to realize that every villager was blind.", "Nuñez 沒過多久就發現每個村民都是盲人。"];
h1 += card("L10", ["文法", "It takes 句型"], "D", stem("L10") + ops([
  ["until", "", "後接完整子句 (e.g. It wasn’t long until he understood that some things are worth losing in order to find yourself again. 💡人生的意義有時不在得到，而在放下。)"],
  ["when", "", "後接完整子句"],
  ["that", "", "後接完整子句 (e.g. It was Nuñez that realized the truth first.)"],
  ["for", "", "不定詞的行為者以 for + N 表達。It takes + 時間 + for + 人 + to V 花多少時間做到某事 (e.g. It takes time for us to realize that happiness does not come from having more, but from needing less.)"]
], "D"));

h1 += passage("補充段落 / 情境閱讀", [[
  ["Feeling superior to these sightless people, he thought to himself, “In the country of the blind, the one-eyed man is king.”", "由於對這些失明的人感到優越，他心想：「在盲人的國度裡，獨眼龍就是國王。」 (superior to 較…佳/高等 ↔ inferior to 較…劣/低等)"],
  ["Imagine landing in a remote tribe where nobody has ever used a phone and the internet doesn’t even exist.", "想像一下，你降落到一個偏遠的部落，那裡沒有人使用過手機，甚至不存在網路。"],
  ["Then you pull out an iPhone 18 Pro Max.", "然後你拿出了一支 iPhone 18 Pro Max。"],
  ["Do you become their queen… or just the crazy gal carrying a glowing brick?", "你會成為他們的女王……還是只是個拿著發光磚塊的瘋女孩？"]
]]);

let h2 = '<h2 id="p2">II 挑戰題 2</h2>';
SENT["L14"] = ["However, after spending time with the locals, he was amazed at their great knowledge. Though blind, they knew their mountain kingdom [[L14|intimately]].", "然而，在與當地人相處一段時間後，他對他們豐富的知識感到驚訝。雖然失明，他們對自己的山區王國卻非常熟悉。"];
h2 += card("L14", ["詞彙"], "A", stem("L14") + clue("instinctively通常用於抽象事物（例如：本能地知道危險），而對於「地理環境」的了解，是經過長年生活累積而來，絕非「本能」") + ops([
  ["intimately", "透徹地、非常熟悉地", ""],
  ["vaguely", "模糊地", ""],
  ["intensely", "強烈地 / 極度地", ""],
  ["instinctively", "本能地 / 直覺地", ""]
], "A"));

SENT["L16"] = ["The villagers skillfully farmed and moved around by using their [[L16|keen]] senses of hearing, touch, and smell.", "村民們運用敏銳的聽覺、觸覺和嗅覺，熟練地耕作和移動。"];
h2 += card("L16", ["詞彙"], "C", stem("L16") + ops([
  ["fierce", "激烈的", "(用在競爭、情緒、天氣等)"],
  ["vital", "極重要的", ""],
  ["keen", "敏銳的", ""],
  ["hollow", "空洞的", ""]
], "C"));

SENT["L18"] = ["They also [[L18|employed]] effective techniques for growing crops and caring for animals.", "他們還採用了有效的技術來種植農作物和照顧動物。"];
h2 += card("L18", ["詞彙"], "D", stem("L18") + ops([
  ["appointed", "指派", ""],
  ["cultivated", "培養；種植", ""],
  ["dismissed", "摒棄；解僱", ""],
  ["employed", "採用、運用", ""]
], "D"));

SENT["L20"] = ["The paths, lined with low walls, [[L20|had been]] specially built to help them navigate safely.", "兩旁砌有矮牆的小徑，是特別建造來幫助他們安全找路的。"];
h2 += card("L20", ["文法", "時態"], "D", stem("L20") + clue("be lined with = 兩旁排滿了…<br>navigate 導航、找路 →在複雜情境中摸索前進") + ops([
  ["were", "", ""],
  ["would be", "", ""],
  ["being", "", ""],
  ["had been", "", "早於過去的動作"]
], "D"));

SENT["L22"] = ["Among the villagers, a respected elder named Yacob put the outsider [[L22|to work]] and began teaching him their ways.", "在村民中，一位受人尊敬的長老 Yacob 叫這個外地人開始工作，並開始教導他他們的生活方式。"];
h2 += card("L22", ["片語"], "A", stem("L22") + clue("put sb to work = 叫某人開始做事、派某人去工作。sb’s ways 生活方式、做事的方式。You and your ways! 你就是這樣 (帶點好氣又好笑、或不以為然)") + ops([
  ["to work", "", ""],
  ["working", "", "無 put sb working用法。使某人處於工作狀態：set sb working"],
  ["with work", "", "無 put sb with work用法。交代工作給某人：assign work to sb 或 give sb work"],
  ["by working", "", ""]
], "A"));

SENT["L24"] = ["Gradually, Nuñez [[L24|adapted to]] their way of life, but he clung to the reality of sight.", "漸漸地，Nuñez 適應了他們的生活方式，但他仍堅持視覺的現實。"];
h2 += card("L24", ["詞彙", "片語"], "C", stem("L24") + clue("way of life 某群體、民族、社會的生活方式、傳統和習俗。lifestyle 個人在日常生活中的選擇與偏好。") + ops([
  ["applied to", "適用於、向…申請", "The rule applies to everyone."],
  ["appealed to", "吸引、訴求於", "The idea appeals to me."],
  ["adapted to", "適應", ""],
  ["objected to", "反對", "He objected to letting her participate."]
], "C"));

h2 += passage("補充", [[
  ["To him, vision was as real as the air he breathed.", "對他來說，視覺就像他呼吸的空氣一樣真實。"]
]]);

SENT["L26"] = ["Although he tried to explain what he saw, he failed to make them understand what [[L26|it meant]] to have vision.", "儘管他試圖解釋他所看到的，但他無法讓他們理解擁有視覺意味著什麼。"];
h2 += card("L26", ["文法", "名詞子句"], "C", stem("L26") + ops([
  ["meaning", "", "what子句少動詞"],
  ["was meant", "", "be meant to 被設計、製造、安排… (e.g. This room is meant to be used as a study, not a bedroom.)"],
  ["it meant", "", "it 是虛主詞,真主詞為 to have vision"],
  ["he meant", "", "what he meant 他的意思 (邏輯不通)"]
], "C"));

SENT["L28"] = ["[[L28|The more]] he spoke of high mountains and twinkling stars, the more the villagers pitied him.", "他越是談論高山和閃爍的星星，村民們就越同情他。"];
h2 += card("L28", ["文法", "The 比較級"], "D", stem("L28") + clue("The + 比較級 + S + V..., the + 比較級 + S + V.... 愈⋯⋯，就愈⋯⋯ 表達兩件事的變化是正相關或負相關的關係") + ops([
  ["Even if", "", ""],
  ["As long as", "", ""],
  ["No matter what", "", ""],
  ["The more", "", ""]
], "D"));

h2 += passage("補充", [[
  ["Nuñez felt frustrated at the villagers’ lack of awe for his precious gift of sight.", "Nuñez 對村民們對他珍貴的視覺天賦缺乏敬畏感到沮喪。 (awe = 敬畏、驚嘆)"]
]]);

SENT["L31"] = ["It wasn’t until he first laid eyes on Yacob’s daughter, Medina-saroté, [[L31|that he began]] to feel better.", "直到他第一次看到 Yacob 的女兒 Medina-saroté，他才開始感覺好些。"];
h2 += card("L31", ["文法", "It is not until...that..."], "A", stem("L31") + clue("It was not until + 時間/事件 + that + 句子 直到…才…") + ops([
  ["that he began", "", ""],
  ["did he begin", "", "否定副詞放句首時，才需要倒裝：Not until... did he begin..."],
  ["with whom he began", "", "→ he began with Yacob’s daughter to feel better???"],
  ["whom he began", "", "→ he began Yacob’s daughter to feel better???"]
], "A"));

h2 += passage("補充", [[
  ["No one else admired Medina’s beauty, as she had well-defined features that lacked the smoothness the villagers valued.", "沒有其他人欣賞 Medina 的美貌，因為她輪廓分明，缺乏村民們所看重的光滑感。 (well-defined adj. 輪廓分明的 / value vt. 重視)"]
]]);

SENT["L35"] = ["Furthermore, her weak voice was neither powerful nor pleasing enough to [[L35|meet]] their standards.", "此外，她微弱的聲音既不夠有力，也不夠悅耳，無法達到他們的標準。"];
h2 += card("L35", ["動詞搭配"], "B", stem("L35") + ops([
  ["set", "制定標準", ""],
  ["meet", "符合／達到", "meet + standards / requirements / expectations / needs"],
  ["achieve", "達成", "achieve 透過努力而達成(目標、成功、理想等) achieve goals / success / targets / ambitions"],
  ["catch", "", "無 catch… standard用法"]
], "B"));

SENT["L37"] = ["Nuñez [[L37|alone]] recognized her beauty, and he soon fell in love with her.", "唯獨 Nuñez 認出了她的美，他很快就愛上了她。"];
h2 += card("L37", ["詞彙"], "B", stem("L37") + ops([
  ["alike", "皆然", "A and B alike（A 與 B 皆然）"],
  ["alone", "唯獨…、只有…", ""],
  ["merely", "只不過是", "修飾recognized → Nuñez 只不過是認出了她的美"],
  ["barely", "幾乎不、勉強", "→ 幾乎看不出她的美"]
], "B"));

SENT["L39"] = ["Yet, as their relationship blossomed, their desire to marry faced fierce opposition from the other villagers, who viewed Nuñez’s “sight” as a dangerous delusion that needed to be “cured.” [[L39|Worst of all]], even Medina herself agreed with them.", "然而，隨著他們關係的發展，他們想結婚的願望遭到了其他村民的強烈反對，村民們將 Nuñez 的「視覺」視為一種需要被「治癒」的危險錯覺。最糟的是，連 Medina 自己也同意他們的看法。"];
h2 += card("L39", ["轉折語"], "B", stem("L39") + ops([
  ["Above all", "首要的是、最重要的是", "(強調優先順序) Study hard, but above all, take care of your health."],
  ["Worst of all", "最糟的是", ""],
  ["After all", "畢竟", "畢竟、終究(補充理由,或結果與預期相反)"],
  ["Most of all", "最重要的是；尤其是", "(在多項事物中最…)"]
], "B"));

h2 += passage("補充", [[
  ["She persuaded Nuñez to remove the peculiar orbs on either side of his nose.", "她說服 Nuñez 移除他鼻子兩側那奇特的球體。 (orb n. 球體;球狀物)"]
]]);

SENT["L44"] = ["That way, he could stop daydreaming and truly become one of them. [[L44|In return for]] Nuñez’s great sacrifice, she agreed to marry him.", "那樣，他就可以停止做白日夢，真正成為他們的一員。作為 Nuñez 巨大犧牲的回報，她同意嫁給他。"];
h2 += card("L44", ["介系詞片語"], "D", stem("L44") + ops([
  ["In honor of", "為了向…致敬／為紀念…", "A statue was built in honor of the brave man."],
  ["In terms of", "就…而言、在…方面", "Cats beat dogs in terms of playing hard to get."],
  ["In favor of", "贊成、支持", "Most students are in favor of a later start time for school."],
  ["In return for", "作為…的回報、交換", "I made him dinner in return for his help."]
], "D"));

SENT["L48"] = ["Nuñez was confronted with a dilemma: he had to choose either to lose his eyes or to end their relationship. Eventually, he agreed to give up his eyes for Medina’s [[L48|sake]].", "Nuñez 面臨進退兩難的困境：他必須選擇失去雙眼或結束他們的關係。最終，看在 Medina 的份上，他同意放棄他的眼睛。"];
h2 += card("L48", ["詞彙片語"], "A", stem("L48") + ops([
  ["sake", "看在…的份上、為了…的緣故", "He gave up gaming for his health's sake."],
  ["request", "要求", "at sb's request 應某人要求"],
  ["purpose", "目的", "for the purpose of 為了…目的"],
  ["favor", "恩惠、幫忙、偏愛", "The coach was accused of showing favor to his best friend's son."]
], "A"));

SENT["L51"] = ["Nevertheless, not until the day of his surgery [[L51|did he realize]] he was making a huge mistake.", "然而，直到他動手術的那天，他才意識到自己犯了一個巨大的錯誤。"];
h2 += card("L51", ["文法", "倒裝句"], "B", stem("L51") + clue("= Nevertheless, it wasn’t until the day of his surgery that he realized he was making a huge mistake.") + ops([
  ["that he realized", "", "前有虛主詞時使用：it was not until … that …"],
  ["did he realize", "", "否定副詞放句首時，需接倒裝句"],
  ["when he realized", "", "缺倒裝句"],
  ["had he realized", "", "過去完成式只用在兩個過去動作中，較早發生的動作 此句只有一個動作：he realized…"]
], "B"));

h2 += passage("補充", [[
  ["That morning, he once again beheld the splendor of the sunrise.", "那天早上，他再次凝視著日出的壯麗。"],
  ["Gazing at the beautiful surrounding landscape and envisioning all that he might still see in the future, Nuñez saw ( = understood) that he had to escape.", "凝視著周圍美麗的風景，並想像著他在未來可能還會看到的一切，Nuñez 明白了，他必須逃跑。"]
]]);

SENT["L56"] = ["[[L56|Driven]] by the desire to save his sight, he fled the country of the blind.", "在想要挽救視力的渴望驅使下，他逃離了盲人國。"];
h2 += card("L56", ["分詞構句"], "D", stem("L56") + ops([
  ["Fulfilled", "", "fulfill one’s desire 滿足…的慾望"],
  ["Haunted", "", "be haunted by 長期受…困擾、某事縈繞心頭"],
  ["Accompanied", "", "由…陪伴、伴隨著 通常搭配隨行的人或同時發生的現象(雷聲、音樂、症狀等)"],
  ["Driven", "受到…的驅使", "Driven by curiosity, I took apart the old radio to see how it worked."]
], "D"));


let h3 = '<h2 id="p3">III 課本句型實例</h2>';
h3 += '<section class="pas"><h3>句型 1 實例 (Kiss the girl) The Little Mermaid OST</h3>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">1. 直到他筋疲力盡，他才停下來休息。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("He didn’t stop [[|to take a break/rest until he was exhausted]].<br>to rest until…=It was not until he was exhausted that he stopped to take a break.=Not until he was exhausted did he stop to take a break.")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">2. 人都是失去自由才了解它有多可貴。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("People don’t realize [[|how valuable freedom is until they lose it]].<br>= It’s not until they lose it that people realize how valuable freedom is.<br>= Not until they lose it do people realize how valuable freedom is.")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">3. 直到Angela做完工作，她才回我訊息。(It…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("It wasn’t until Angela finished her work [[|that she replied to my text (message) / texted me back]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">4. 人都是到了自己當了父母才了解教養子女是這麼難。(People…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("People don’t realize [[|(that) teaching children is so difficult until they become parents themselves]]. parenting= People don’t realize how difficult parenting is until they become parents themselves.")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">5. 直到考試結果出爐，Charlotte才鬆了一口氣。(Not…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("Not until the test results came out [[|did Charlotte feel relieved]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">6. 我是到了停止使用智慧型手機才了解到我以前有多麼依賴它。(It…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("It wasn’t until I stopped using a/my smartphone [[|that I realized how much I had depended/relied on it / how dependent/reliant I had been on it]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">7. 直到事故發生，大眾才會注意到可能的危險。(Not…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("Not until an accident happens [[|do the public notice the potential / possible danger(s)]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">8. 直到政府與民眾一起努力，我們才能減少颱風所造成的損害及死亡。(It…)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("It is not until the government and the public/the people work together [[|that we can decrease / reduce the damages and death(s) caused by a typhoon]].")+'</div></div>';
h3 += '</section>';

h3 += '<section class="pas"><h3>句型 2 be to blame 應受責怪；應為某錯誤負責</h3>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">1. 根據氣象報導，明天要不下雨要不下雪。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("According to the weather report, it will [[|either rain or snow tomorrow]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">2. Sean既沒時間也沒錢去度假。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("Sean has [[|neither time nor money to go on a vacation/holiday]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">3. 你可以用刷卡或現金付款。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("You can pay [[|either by credit card or in cash]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">4. 我不喜歡爬山也不喜歡健行。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("I like [[|neither mountain climbing nor hiking]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">5. Sam沒道歉也沒給任何解釋。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("Sam [[|neither apologized nor gave any explanations]].")+'</div></div>';
h3 += '<div class="stem"><div class="zh" style="color:inherit">6. Olivia和她的先生都不會說英文。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Neither Olivia nor her husband knows how to speak English]].")+'</div></div>';
h3 += '</section>';
