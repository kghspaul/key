<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>504 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>504 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

/* === Part 1: 課前字彙 & L1 ~ L66 課文講解 === */
const h1 = '<h2 id="p1">課前字彙 ＆ L1 ~ L66 課文講解</h2>' +
  passage("Thinking Ahead 課前字彙與 P90 補充", [[
    ["字彙表：1. identical (adj. 相同的) ｜ 2. available (adj. 可得到的) ｜ 3. extract (v. 提取) ｜ 4. replicate (v. 複製) ｜ 5. feasible (adj. 可行的) ｜ 6. preference (n. 偏好) ｜ 7. exceed (v. 超過) ｜ 8. accelerating (adj. 加速的)", "課前核心字彙整理。"],
    ["1. When it comes to sweet food, I have a [[1|preference]] for brownies.", "說到甜食，我偏愛布朗尼。"],
    ["2. Due to COVID-19, many online free learning resources are [[2|available]] for teachers and students.", "由於新冠肺炎，許多免費的線上學習資源可供師生使用。"],
    ["3. With the [[|greatly increased / increasing]] population, food consumption is growing at an [[3|accelerating / increasing]] rate.", "隨著大幅增加的人口，糧食消耗正以加速（不斷增加）的速率成長。（講解提醒：increasing 本身即表「正在增加的」，不加 greatly，或改用 greatly increased；at an increasing rate 比 accelerating rate 更自然道地）"],
    ["4. The government is working on a(n) [[4|feasible]] solution to overtourism.", "政府正在研擬一個解決過度旅遊的可行方案。"],
    ["5. The money we can spend on this trip should not [[5|exceed]] 5,000 NT dollars because we are on a tight budget.", "我們這趟旅行能花的錢不應超過台幣五千元，因為我們的預算很緊。"],
    ["P90 紅色表格右下：a call to action 行動呼籲 (a call for sb to take action)：In marketing, your call to action is the part of your advertisement that tells your target audience what they should be doing once they click on your ad and hit your website. The simplest example of a call to action is \"Buy now!\"", "在行銷中，「行動呼籲（CTA）」是廣告中告訴目標受眾點擊廣告進入網站後應該做什麼的部分。最簡單的例子就是「立即購買！」"]
  ]]) +
  passage("2. L1 & 3. L2 課文與補充例句", [[
    ["Can you imagine taking a bite of a steak that was grown in a Petri dish instead of on a farm?", "你能想像咬下一口在培養皿中而非農場裡培育出來的牛排嗎？"],
    ["image (n. 形象；意象；電腦圖片) vs. imagine (Vt. 想像，不可接 to VR)：He is trying to improve his image. / You can't imagine what a terrible week we had. / I can’t imagine (X) to go → (O) going out on a date with someone like that.", "他正試著改善自己的形象。／你無法想像我們這週過得多慘。／我無法想像跟那樣的人出去約會。"],
    ["3. L2 instead of 理論上是介系詞，而 rather than 則可當介系詞或連接詞，但實際上許多人亦把 instead of 當連接詞用（連接兩個介系詞片語）：The resignation took effect on Saturday instead of on Sunday.", "辭職於週六生效，而非週日。"]
  ]]) + [
  card("L2", ["介系詞 + 關係代名詞", "in which (= and in this process)"], "D",
    st("It may sound like a scene in a sci-fi movie, but this is already a reality! Many start-ups have begun to develop a special new production process [[L2|in which]] meat is created by taking animal stem cells, transforming them into primitive fibers, and combining these fibers to form muscle tissue.", "這聽起來可能像科幻電影裡的場景，但這已經成為現實！許多新創公司已開始研發一種特殊的新生產製程，在此製程中，肉是藉由取得動物幹細胞、將其轉化為原始纖維，並結合這些纖維形成肌肉組織而製造出來的。") +
    clue("先行詞為 <code>a special new production process</code>（一種特殊的新生產過程），還原後方子句為 <code>meat is created ... <b>in</b> this production process</code>，故用 <code>in which</code>。") +
    ops([
      ["that", "33%", "若用 that + 完整子句，會變成同位語名詞子句，但 process 通常搭配 in which 表「在該過程中」。"],
      ["by which", "11%", "後方已經有 <code>by taking animal stem cells...</code> 說明方式，故前面用 in which 指「在這個製程中」。"],
      ["for which", "11%", "介系詞搭配不合。"],
      ["in which", "43%", "<code>= and in this production process</code>。"]
    ], "D")
  ),

  card("L8", ["複合形容詞與字彙", "lab-grown / backed (支持)"], "A, C",
    st("The final product is known as “[[L8-1|lab-grown]] meat,” and it’s a thought-provoking recent trend that is [[L8-2|backed]] by both Bill Gates and agricultural giant Cargill.", "最終產品被稱為「實驗室培育肉（人造肉）」，這是一股發人深省的近期趨勢，獲得比爾・蓋茲與農業巨擘嘉吉公司（Cargill）雙方的支持。") +
    clue("• 第 1 空：<code>lab-grown meat = meat (which is) grown in a lab</code>（<code>N-p.p. = p.p. + 介 + N</code>）。<br>• 6. L8：<code>a thought-provoking trend = a trend (which is) provoking thought</code>（<code>N-Ving = Vt-ing + O</code>）。<br>• 第 2 空：這股趨勢受到比爾蓋茲與農業巨頭的「支持、贊助（backed）」。注意：<code>back</code> 當動詞表「支持」，<b>沒有「回到（return）」之意</b>！") +
    ops([
      ["(1) lab-grown / (2) raised", "68% / 88%", "(1) lab-grown 正確；(2) 常見誤答 raised（提高；養育；募款；提出），但趨勢（trend）是被「支持（backed）」而非被養育或募集。"],
      ["(1) lab-growing / (2) ranked", "26% / 6%", "lab-growing = meat which is growing lab（種實驗室的肉？）；ranked 排名。"],
      ["(1) lab-grew / (2) backed", "3% / 3%", "複合字中不會用過去式 grew；(2) backed（支持）正確！"],
      ["(1) growing-lab / (2) ruled", "0% / 3%", "複合字中分詞通常在後面；ruled 統治、裁定。"]
    ], "AC") +
    passage("5. L8 選項補充例句", [[
      ["(A) The government aims to raise the minimum wage for workers. / They raised their children with love and care.", "政府旨在提高勞工基本工資。／他們用愛與關懷養育孩子。"],
      ["(B) The university is ranked among the top institutions in the world. / She ranked highest in her class for academic achievement.", "這所大學名列全球頂尖機構之列。／她的學業成績在班上排名最高。"],
      ["(C) (X) When he backed home... → (O) When he returned home... / Many people backed the candidate in the election. / The company is backed by a team of experienced investors.", "許多人在選舉中支持這位候選人。／這家公司獲得一群經驗豐富的投資人支持。"],
      ["(D) Queen Elizabeth II has ruled the United Kingdom for many years. / The court ruled in favor of the plaintiff in the lawsuit.", "伊莉莎白二世女王統治英國多年。／法院在訴訟中作出有利於原告的裁定。"]
    ]])
  ),

  card("L11", ["分詞慣用片語", "compared with 相較於"], "C",
    st("The widespread support for producing meat in this way is due to the fact that it has several substantial advantages [[L11|compared]] with more traditional methods of meat production.", "以這種方式生產肉類之所以獲得廣泛支持，是因為與較傳統的肉類生產方式相比，它具有幾項重大的優勢。") +
    clue("注意後方搭配的介系詞是 <code>with</code>！表示「與…相比、相較於…」用 <code>compared with / to</code>。") +
    ops([
      ["related", "19%", "<code>be related to</code> 與…有關（搭配 to，不搭配 with）。"],
      ["linked", "0%", "<code>be linked to / with</code> 與…有關聯（語意不合，此處是在比較優劣）。"],
      ["compared", "77%", "<code>compared to / with</code> 相較於…。"],
      ["opposed", "2%", "<code>be opposed to = object to = oppose</code> 反對（搭配 to）。"]
    ], "C") +
    passage("7. L11 & 8. L13 補充例句", [[
      ["(A) The new research findings are closely related to the previous studies.", "這些新的研究發現與先前的研究密切相關。"],
      ["(B) The rise in pollution levels is linked to increased industrial activity. / The suspect is linked with a series of burglaries in the area.", "污染程度上升與工業活動增加有關。／嫌犯與該地區一連串住宅竊盜案有關。"],
      ["(C) The size of this apartment is small compared to the one we saw last week. / His salary is quite high compared with others in his profession.", "這間公寓的面積與我們上週看的那間相比較小。／他的薪水與同業其他人相比相當高。"],
      ["(D) Many people are opposed to (= object to = oppose <del>to</del>) the government's new tax policy. / The majority of the board members were opposed to the proposed merger.", "許多人反對政府的新稅收政策。／大多數董事會成員反對擬議的合併案。"],
      ["8. L13 advantage (事物優點/人事物優勢)  disadvantage；strength  weakness (人或事的優缺點)：Her experience meant that she had a big advantage over her opponent.", "她的經驗意味著她比對手具有很大的優勢。"]
    ]])
  ),

  card("L13", ["轉折詞與「忍受」動詞辨析", "therefore / In other words / endure"], "B, A, C",
    st("First, one could argue that traditional meat production facilities, such as farms or factories, hardly ever have the animals’ best interests at heart. Growing meat in a laboratory [[L13-1|therefore]] helps eliminate the need for slaughterhouses as well as the unethical treatment of these animals. [[L13-2|In other words]], you could rest assured that the lab-grown beef patty on your plate didn’t come from a cow that had to [[L13-3|endure]] physical or mental torment.", "首先，有人可能會認為傳統肉類生產設施（如農場或工廠）幾乎從不把動物的最大利益放在心上。因此，在實驗室培育肉類有助於消除對屠宰場的需求以及對這些動物的不道德對待。換言之，你可以放心，你盤中的人造牛肉餅並不是來自一頭必須長期承受身心折磨的牛。") +
    clue("• 第 1 空：因為傳統養殖場不顧動物福祉，「因此（therefore）」在實驗室培育肉類有助於消除屠宰場與不人道對待。<br>• 第 2 空：將前句「消除屠宰場與不道德對待」換個具體說法詮釋（「換言之 In other words = That is (to say)」，你盤中的牛肉餅不是來自受折磨的牛）。<br>• 第 3 空：「忍受、承受」辨析：<br>1. <code>endure</code>：長期承受（某種苦難或折磨，可用於肯定句）<br>2. <code>stand = bear</code>：忍受某件不愉快的事（<b>通常只用於否定句或疑問句</b>，如 <i>couldn't stand</i>）<br>3. <code>put up with</code>：勉強忍受、容忍（口語，用於人容忍某人的壞脾氣等）") +
    ops([
      ["(1) instead / (2) In other words / (3) stand", "32% / 57% / 11%", "(2) In other words 正確；stand 通常用於否定與疑問句。"],
      ["(1) therefore / (2) On the other hand / (3) bear", "36% / 11% / 18%", "(1) therefore 正確；bear 同樣多用於否定疑問。"],
      ["(1) then / (2) In contrast / (3) endure", "28% / 2% / 57%", "(3) endure（承受苦難折磨）正確。"],
      ["(1) rather / (2) In addition / (3) put up with", "4% / 33% / 14%", "rather 用於否定句後修正；put up with 多指容忍小缺點或脾氣。"]
    ], "BAC") +
    passage("9. L13 ~ 11. L21 課文與補充例句", [[
      ["Their economy has expanded enormously, while ours, by/in contrast, has declined.", "他們的經濟大幅擴張，而我們的經濟相較之下卻衰退了。"],
      ["Ross couldn't stand the thought of leaving Rachel. / I wonder if I can stand his whining any longer. / She has put up with his temper for years.", "羅斯無法忍受離開瑞秋的想法。／我不知道我還能忍受他的抱怨多久。／她已經忍受他的脾氣好幾年了。"],
      ["10. L15 hardly ever = scarcely ever = almost never（幾乎從不）：The lonely widow hardly ever leaves the house now that her husband has passed away.", "既然丈夫已經過世，這位孤獨的寡婦幾乎足不出戶。"],
      ["11. L21 Better still (= better yet 更棒的是  worse still = worse yet 更糟的是), lab-grown meat could help make meat production more sustainable.", "更棒的是，實驗室培育肉有助於使肉類生產更具永續性。"]
    ]])
  ),

  card("L23", ["句子主要動詞與主詞一致", "The raising ... takes a heavy toll on"], "A",
    st("The raising of livestock (that is/are) needed to fulfill the current global demand for meat actually [[L23|takes]] a heavy toll on the environment.", "為了滿足當前全球肉類需求而進行的牲畜飼養，實際上對環境造成了沉重的破壞（使環境付出慘痛代價）。") +
    clue("結構剖析：<code><b>The raising</b> (S, 單數動名詞) of livestock [(that is/are) needed to fulfill the current global demand for meat (過去分詞片語修飾 livestock)] actually <b>takes</b> (V) a heavy toll on the environment.</code><br>• 13. L25：<code>toll</code> 過路費（<code>a toll-free number</code> 免付費電話） → <code>take a (heavy) toll on...</code> 對…造成嚴重傷害／使…付出沉重代價（例：<i>Years of smoking have taken a heavy toll on his health.</i>）。") +
    ops([
      ["takes", "59%", "現在簡單式單數動詞，配合單數主詞 <code>The raising</code>。"],
      ["took", "13%", "前後文描述當前現況（current global demand），用現在簡單式。"],
      ["taken", "5%", "過去分詞不能單獨當主要動詞。"],
      ["taking", "23%", "現在分詞不能單獨當主要動詞。"]
    ], "A")
  ),

  card("L25", ["動詞片語辨析", "account for 佔（比例）"], "D",
