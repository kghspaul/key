<style>

<body>
<div class="top">
<h1>303大卷詳解</h1>
<p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
<p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處　｜　<span class="tag">考點</span>　<span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note,lines){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const P=(l,t)=>'<p style="margin:6px 0"><b>'+l+'</b>'+t+'</p>';
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

/* ================= Part I ================= */
const P1=[
[1,"generous",["考點：形容詞語意＋人格評價句型 It is adj of 人","詞性需求：形容詞"],
"It was very [[1|generous]] of Ms. Lin to loan her sister such a large amount of money to help her out.",
"林女士借給妹妹這麼大一筆錢幫她度過難關，真是非常慷慨。",
"very 是程度副詞，只能修飾形容詞／副詞，所以空格是形容詞；「It was + adj + of + 人 + to V」是評價人格的專用句型；「借一大筆錢幫忙」就是慷慨的具體行為。首字母 g、尾字母 s 與 generous 吻合。",
"generosity（n. 慷慨）：要放在 show／with／her 等之後，如 She showed great generosity.；本句 very 後不能接名詞。generously（adv.）：修飾動詞，如 She gave generously."],
[2,"conflict",["考點：名詞語意＋固定搭配 in conflict with","詞性需求：名詞（in 之後）"],
"This inland country has been in [[2|conflict]] with its neighboring country over the control of the water supply.",
"這個內陸國家一直與鄰國為了水資源的控制權而處於衝突之中。",
"「has been in ___ with」：in 是介系詞，後面只能接名詞；in conflict with ＝ 與…衝突。over the control of the water supply 交代了爭執的原因（爭奪水源）。",
"動詞 conflict（/kənˈflɪkt/）不加 in，用法是 conflict with：Their schedules conflict with each other.；形容詞 conflicting（相衝突的）放名詞前：conflicting opinions."],
[3,"banished",["考點：被動語態＋動詞語意（放逐）","詞性需求：過去分詞"],
"In the past, prisoners in England were often [[3|banished]] to remote islands.",
"過去，英國的囚犯常被放逐到偏遠的島嶼。",
"「were often ___ to remote islands」：were ＋ 空格 → 被動，需過去分詞；字尾 -hed 提示 banish 加 -ed。prisoners 是被放逐的人，後接 to＋地點，語意為「被流放到」。",
"banish 也可說 banish A from B（把 A 逐出 B），如 He was banished from the country.；若主詞是做放逐動作的人（The king banished him.）才用主動。"],
[4,"slaughter",["考點：名詞語意（大屠殺）＋ The N of N","詞性需求：名詞（The 之後）"],
"The [[4|slaughter]] of millions of Jews during World War II is a terrible stain on human history.",
"二戰期間數百萬猶太人遭到屠殺，是人類歷史上的可怕汙點。",
"空格在 The 與 of 之間、後面動詞是 is → 這是句子主詞，需名詞；「the slaughter of 大量的人」指大規模屠殺。",
"slaughter 當動詞時要有受詞：Soldiers slaughtered millions.；也可指宰殺牲畜：slaughter cattle。若句子寫成 The soldiers ___ millions of Jews 才用動詞（過去式 slaughtered）。"],
[5,"tortured",["考點：被動語態＋情緒性動詞（被…折磨）","詞性需求：過去分詞"],
"Jerry was [[5|tortured]] by the thought that he should have told his wife the truth instead of lying to her.",
"Jerry 被「當初該對妻子說實話而不是欺騙她」的想法折磨著。",
"「was ___ by the thought」：was ＋ p.p. ＋ by → 被動；he should have told…（早該說實話）表示悔恨，這種想法讓人痛苦，所以用 torture 的被動表「被折磨」。",
"torture（n. 酷刑）：Prisoners suffered torture.；tortured 若用在 tortured prisoners 才是真的遭受肉體酷刑；本句是心理上的煎熬（比喻用法）。"],
[6,"hollow",["考點：形容詞語意（中空的）","詞性需求：形容詞（修飾 bones）"],
"Many birds have [[6|hollow]] bones, which is one of the main reasons that they can fly such long distances.",
"許多鳥類的骨頭是中空的，這是牠們能飛這麼遠距離的主要原因之一。",
"have ＋ 空格 ＋ bones：空格在名詞前，需形容詞；which 後說這是「能飛長途」的原因 → 骨頭輕 → 中空。",
"solid（實心的）才與 hollow 相反：solid bones 會使鳥太重；hollow 也可比喻「空洞的」，如 hollow promises（空頭承諾）。"],
[7,"theft",["考點：名詞語意（竊盜案）＋複合名詞 jewelry theft","詞性需求：名詞（The jewelry 之後作主詞）"],
"The jewelry [[7|theft]] took place in the middle of the night when no one was around. Therefore, the police had a hard time finding any witnesses.",
"這起珠寶竊案發生在深夜無人之際，因此警方很難找到任何目擊者。",
"空格後接 took place（發生），主詞必須是「事件」→ 名詞 theft（竊案）；jewelry 當前置名詞修飾它。",
"thief（n. 竊賊，指人）：The jewelry thief was arrested.（人才會被逮捕，不會 take place）；steal（v.）：Someone stole the jewelry."],
[8,"beneficial",["考點：詞類變化 benefit → beneficial","詞性需求：形容詞（be 動詞之後）"],
"Doing yoga on a regular basis is believed to be [[8|beneficial]] (benefit) not only to our physical health but also to our mental and emotional well-being.",
"規律地做瑜伽被認為不僅對我們的身體健康有益，也對心理與情緒的福祉有益。",
"to be 之後要補語 → 形容詞；beneficial to ＋ 名詞（對…有益），後面的 not only to…but also to… 兩個 to 正好對應。",
"benefit 當動詞時沒有 be：Yoga benefits our health.；beneficially（adv.）修飾動詞或形容詞，如 beneficially used。"],
[9,"universal",["考點：詞類變化 universe → universal","詞性需求：形容詞（a 與名詞之間）"],
"Exchanging information about the latest online games seems to be a [[9|universal]] (universe) interest of teenage boys.",
"交流最新線上遊戲的資訊，似乎是青少年男孩普遍共有的興趣。",
"a ＋ 空格 ＋ interest：夾在冠詞與名詞間，需形容詞；universal ＝ 普遍的、全體共通的，與 of teenage boys（整個群體）呼應。",
"universe（n. 宇宙）：the origin of the universe；universally（adv. 普遍地）：universally loved。"],
[10,"distributed",["考點：被動語態＋詞類變化 distribution → distribute","詞性需求：過去分詞"],
"In the refugee camp, all the food and other resources are [[10|distributed]] (distribution) by the local government.",
"在難民營裡，所有食物與其他資源都由當地政府分配。",
"are ＋ 空格 ＋ by the local government → 被動語態；資源是「被分配」，故用 distribute 的過去分詞。",
"distribution（n. 分配）：the distribution of food；distributor（n. 經銷商）；主動時：The government distributes the food."]
];
let h1='<h2 id="p1">I. 文意字彙與詞類變化（20%）</h2><div class="pas"><b>字彙庫</b><div class="bank"><span>generous 慷慨的</span><span>conflict 衝突</span><span>banish 放逐</span><span>slaughter 屠殺</span><span>torture 折磨</span><span>hollow 中空的</span><span>theft 竊盜</span><span>beneficial 有益的</span><span>universal 普遍的</span><span>distribute 分配</span></div><p class="note">本大題為單字填空（無選項），詳解改為：句子中英對照 → 線索 → 為什麼是這個字 → 易混淆字形／詞性「何時才對」。</p></div>';
P1.forEach(q=>{h1+=card(q[0],q[2],q[1],'<div class="stem"><div class="en">'+fx(q[3])+'</div><div class="zh">'+q[4]+'</div></div>'+clue(q[5])+'<h4>易混淆字形／詞性：何時才對</h4><p style="margin:2px 0">'+q[6]+'</p>');});

/* ================= Part II ================= */
const T2=[
[["My name is Prometheus.","我的名字是普羅米修斯（Prometheus）。"],
["The story of how I became attached to this rock started when I created human beings and asked my brother Epimetheus to [[11|decide on]] a special gift to give them.","我被綁在這塊岩石上的故事，始於我創造了人類，並請我的兄弟厄庇米修斯為他們挑選一份特別的禮物。"],
["Unfortunately, having just given gifts to all the animals, Epimetheus had nothing more to give.","不幸的是，厄庇米修斯剛把禮物都給了所有動物，已經沒有東西可以再給了。"],
["Therefore, I gifted humans with [[12|not only]] fire [[12|but also]] the ability to stand up straight.","因此，我賜給人類的不僅是火，還有直立站著的能力。"],
["I hoped that these could [[13|make up for]] their disadvantaged state.","我希望這些禮物能彌補他們處於劣勢的狀態。"]],
[["This made Zeus angry.","這讓宙斯很生氣。"],
["He did not believe that any creature should be able to stand upright like him and the other gods.","他不認為任何生物應該能像他和其他神一樣直立。"],
["[[14|Frustrated]], he demanded that humans sacrifice their meat to him.","感到受挫的他，要求人類把他們的肉獻祭給他。"],
["Knowing how important meat was to humans, I devised a plan to trick Zeus.","我知道肉對人類有多重要，便想出一個計畫來騙宙斯。"],
["He accepted my sacrifice of what he thought was an offering of meat but was actually just bones covered in fat.","他接受了我的獻祭，那是他以為是肉的供品，其實只是包著油脂的骨頭。"]],
[["My trick made Zeus even angrier, and no one could lessen his [[15|fury]].","我的詭計讓宙斯更加憤怒，沒有人能減輕他的怒火。"],
["He responded by taking fire away from humans.","他的回應是把火從人類手中奪走。"],
["I, however, wasn’t frightened off by Zeus’s revenge*, but instead I defied* him again by stealing some fire from the sun and giving it back to humans.","然而我並未被宙斯的報復嚇退，反而再次違抗他，從太陽偷了一些火還給人類。"]],
[["Finally, Zeus had had enough.","最後，宙斯忍無可忍了。"],
["[[16|To explain]] myself, I told him that everything I had done was out of love for humans, but he considered me a thief.","為了替自己辯解，我告訴他我所做的一切都出於對人類的愛，但他仍視我為竊賊。"],
["As [[17|punishment]], he chained me to this rock.","作為懲罰，他把我鎖在這塊岩石上。"],
["Every day, an eagle comes to [[18|feed on]] my liver.","每天，一隻老鷹會來啄食我的肝臟。"],
["However, by the time evening comes, my liver [[19|will have grown]] back.","然而到了傍晚，我的肝臟已經長回來了。"],
["Thus, I am to suffer repeatedly until the end of time.","因此，我注定要一再受苦，直到時間的盡頭。"],
["Nevertheless, to me, my suffering is worth it for the gifts I have been able to give [[20|humankind]].","儘管如此，對我而言，為了我能夠賜給人類的禮物，這些苦難都值得。"],
["If I had the choice to do it all again, I wouldn’t do anything differently.","如果能重新選擇一次，我什麼都不會改變。"]]
];
const Q2=[
[11,["考點：片語動詞語意（及物）＋上下文推理","詞性需求：及物動詞片語（原形，後接受詞）"],"B",
"asked my brother to ___ <u>a special gift</u>：ask sb to V 之後，空格後面直接接受詞 a special gift → 需要及物片語動詞。下一句 Epimetheus had nothing more to give（沒有禮物可給了）反推：原本的請求是「<b>挑選</b>一份禮物」。",
[["act like","表現得像","後接 a special gift 變成「表現得像一份禮物」，語意不通。何時才對：Don’t act like a child.（後接人或身分）"],
["decide on","選定","decide on ＝ choose，及物片語，受詞正是 a special gift；「請弟弟選一份禮物」且之後他發現沒東西可給，前後連貫。"],
["base on","以…為基礎","主動式需 base A on B；常用被動 be based on。「以禮物為基礎」語意不通。何時才對：The film is based on a true story."],
["begin with","以…開始","「從一份禮物開始」與後面 to give them（禮物是要給他們的）目的不合，也不呼應 nothing more to give。何時才對：Let’s begin with the first lesson."]]],
[12,["考點：成對連接詞 not only…but also","詞性需求：兩個空格同題號＝成對連接詞"],"D",
"同一題號出現<b>兩個空格</b> → 先想成對連接詞；fire 與 the ability to stand up straight 是兩個並列名詞片語；而下一句 <u>these</u> could…（複數）說明兩樣禮物<b>都</b>給了。",
[["not; but","不是…而是…","not fire but the ability 意思是「只給能力、沒給火」，與 these（兩樣）矛盾。何時才對：I gave humans not fire but the ability.（刻意否定前者）"],
["either; or","不是…就是…","表示二選一，不會再用複數 these 指兩樣東西。何時才對：You can have either fire or the ability, not both."],
["neither; nor","既不…也不…","neither…nor 本身帶否定，句意成了「兩樣都沒給」，與肯定動詞 gifted 矛盾。何時才對：Humans received neither fire nor the ability.（描述兩樣都沒得到）"],
["not only; but also","不僅…而且…","兩樣都給，並列名詞片語，與 these 呼應。"]]],
[13,["考點：片語動詞語意（彌補）","詞性需求：原形動詞片語（could 之後）"],"C",
"I <u>hoped</u> that these could ___ their <u>disadvantaged state</u>：hoped 表示正面期待；these（火與直立能力）是「禮物」，要拿來對付「劣勢」→ 彌補。",
[["run out of","用完","「禮物用完劣勢」不通。何時才對：They ran out of food."],
["fall victim to","淪為…的受害者","變成「禮物使人類淪為劣勢的受害者」，與 hoped 的正面期待相反。何時才對：Many people fall victim to online scams."],
["make up for","彌補","make up for ＝ compensate for，禮物彌補了人類的劣勢。"],

function w3(n,tags,ans,slot,clueT,cu){
  const li=Object.keys(WB).map(k=>{const w=WB[k];let txt;
    if(k==ans)txt='✔ 本格唯一符合「'+slot+'」且語意通順者。';
