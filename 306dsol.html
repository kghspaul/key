<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h = '';

// ==================== I. 文意字彙與詞類變化 ====================
h += '<h2 id="p1">I. 文意字彙與詞類變化 (20%)</h2>';

const vocabData = [
  [1, ['考點：字彙與過去式動詞', '詞性需求：動詞過去式 (V-ed)'], 'twinkled',
    'The delicate jewels on the royal crown [[1|twinkled]] under the museum\'s bright lights, attracting many visitors.',
    '皇冠上精緻的珠寶在博物館明亮的燈光下閃閃發光，吸引了許多遊客。',
    '主詞為 <b>The delicate jewels</b>（精緻的珠寶），且後方有介系詞片語 <b>under the museum\'s bright lights</b>（在博物館明亮的燈光下）。珠寶在燈光下會「閃爍、閃耀」，故填動詞 <b>twinkle</b>；配合字尾提示 <b>t...ed</b>，應填過去式 <b>twinkled</b>。',
    '<b>twinkle</b> (vi.) 閃爍、閃耀。常見搭配：<i>twinkle in the night sky</i>（在夜空中閃爍）、<i>eyes twinkle with delight</i>（眼睛因喜悅而閃閃發亮）。'],
  [2, ['考點：固定搭配片語', '詞性需求：不可數名詞 (N)'], 'pity',
    'Howard couldn\'t help but take [[2|pity]] on the stray dog shivering in the freezing rain.',
    'Howard 忍不住同情起那隻在冰冷雨中發抖的流浪狗。',
    '看到後方的 <b>the stray dog shivering in the freezing rain</b>（在冰冷雨中發抖的流浪狗），可知心生憐憫。固定片語 <b>take pity on sb./sth.</b> 意為「同情、憐憫……」，配合字首字尾提示 <b>p...y</b>，故填名詞 <b>pity</b>。',
    '<b>pity</b> (n.) 同情、憐憫；可惜的事。重要片語：<i>take/have pity on...</i>（同情……）、<i>feel pity for...</i>（對……感到同情）、<i>It is a pity that...</i>（真可惜……）。另外補充：<i>couldn\'t help but + V</i> = <i>couldn\'t help + V-ing</i>（忍不住……）。'],
  [3, ['考點：字彙與介系詞搭配', '詞性需求：單數名詞 (N)'], 'path',
    'In spite of many obstacles, Terry\'s determination and patience helped him stay on the right [[3|path]] to success.',
    '儘管有許多阻礙，Terry 的決心與耐心幫助他保持在通往成功的正確道路上。',
    '前方有 <b>stay on the right...</b>，後方接 <b>to success</b>（通往成功），構成常見搭配 <b>on the right path to...</b>（在通往……的正確道路/途徑上），配合提示 <b>p...h</b>，故填 <b>path</b>。',
    '<b>path</b> (n.) 小徑、道路、途徑。常見搭配：<i>stay on the right path</i>（保持在正確的軌道/道路上）、<i>the path to success</i>（成功之道）。'],
  [4, ['考點：轉折副詞', '詞性需求：副詞 (Adv)'], 'nevertheless',
    'The economy was struggling; [[4|nevertheless]], the company managed to achieve record profits that year.',
    '當時經濟不景氣；然而，該公司那年仍設法創下了歷史新高的利潤。',
    '前句說「經濟陷入困境（struggling）」，後句卻說「公司創下破紀錄的利潤（record profits）」，前後語意呈強烈轉折。分號後加上逗號前需填轉折副詞，配合提示 <b>ne...s</b>，故填 <b>nevertheless</b>（然而、儘管如此）。',
    '<b>nevertheless</b> (adv.) 然而、不過（＝ <i>nonetheless</i> / <i>however</i>），常置於分號後、逗號前連接兩個具有轉折關係的子句。'],
  [5, ['考點：字彙與語意推論', '詞性需求：單數可數名詞 (N)'], 'dilemma',
    'Julia faced a [[5|dilemma]] about whether to secure a stable job or pursue her passion for music.',
    'Julia 面臨一個進退兩難的困境：究竟是要確保一份穩定的工作，還是追尋她對音樂的熱情。',
    '後方 <b>whether to secure a stable job or pursue her passion for music</b>（要找穩定工作還是追尋音樂熱情）點出兩種難以抉擇的選項。搭配動詞 <b>faced a...</b>（面臨一個……）與提示 <b>d...a</b>，故填 <b>dilemma</b>（進退兩難的困境）。',
    '<b>dilemma</b> (n.) 進退兩難的困境、左右為難。常見搭配：<i>face a dilemma</i> / <i>be in a dilemma</i>（面臨兩難／處於兩難之中）。'],
  [6, ['考點：字彙與對比邏輯', '詞性需求：單數可數名詞 (N)'], 'outsider',
    'Though Morris was an [[6|outsider]] to the industry, his fresh perspective led to many wonderful new ideas.',
    '雖然 Morris 是這個產業的局外人（門外漢），但他新鮮的觀點帶來了許多極佳的新點子。',
    '從屬連接詞 <b>Though</b>（雖然）引導讓步子句，主句提到 <b>his fresh perspective</b>（他新鮮的觀點），可見他原本並非該領域內部的人。不定冠詞 <b>an</b> 後接母音開頭的單數名詞，配合 <b>to the industry</b> 與提示 <b>o...r</b>，故填 <b>outsider</b>。',
    '<b>outsider</b> (n.) 局外人、外人、門外漢（反義詞：<i>insider</i> 局內人、知情者）。'],
  [7, ['考點：字彙與複數名詞', '詞性需求：複數名詞 (N-s)'], 'slopes',
    'The ski resort is famous for its well-maintained [[7|slopes]] that appeal to skiers from all over the world.',
    '這座滑雪勝地以其維護良好的滑雪斜坡聞名，吸引來自世界各地的滑雪客。',
    '句首提到 <b>The ski resort</b>（滑雪度假村）與後方的 <b>skiers</b>（滑雪者），滑雪場供人滑雪的場地即為「山坡、斜坡（slope）」。配合字尾提示 <b>s...es</b>，應填複數名詞 <b>slopes</b>。',
    '<b>slope</b> (n.) 斜坡、山坡；滑雪道。常見搭配：<i>ski slopes</i>（滑雪坡道）、<i>a steep/gentle slope</i>（陡坡／緩坡）。'],
  [8, ['考點：詞類變化（動詞轉名詞）', '詞性需求：不可數名詞 (N)'], 'opposition',
    'Many local residents expressed their strong [[8|opposition]] (oppose) to the new construction project in their neighborhood.',
    '許多當地居民對他們社區的新建案表達了強烈的反對。',
    '空格前有所有格 <b>their</b> 與形容詞 <b>strong</b>，空格後接介系詞 <b>to</b>，因此須將括號內的動詞 <b>oppose</b> 轉為名詞 <b>opposition</b>（反對），構成 <b>express one\'s (strong) opposition to...</b>（對……表達強烈的反對）。',
    '<b>oppose</b> (vt.) 反對 → <b>opposition</b> (n.) 反對、反抗（搭配介系詞 <i>to</i>）→ <b>opposed</b> (adj.) 反對的（常搭配 <i>be opposed to + N/V-ing</i>）。'],
  [9, ['考點：詞類變化（形容詞轉名詞）', '詞性需求：不可數名詞 (N)'], 'superiority',
    'Some people exhibit an attitude of [[9|superiority]] (superior), which makes them difficult to get along with.',
    '有些人展現出一種優越感的態度，這使他們很難相處。',
    '介系詞 <b>of</b> 後方需要名詞作受詞，用來修飾前方的 <b>an attitude</b>（一種……的態度）。將形容詞 <b>superior</b>（優越的）加上字尾 <b>-ity</b> 轉為抽象名詞 <b>superiority</b>（優越感）。',
    '<b>superior</b> (adj.) 優越的、較好的（搭配 <i>be superior to...</i> 比……優越）→ <b>superiority</b> (n.) 優越（感）、優勢（反義詞：<i>inferiority</i> 自卑、劣勢）。'],
  [10, ['考點：詞類變化（動詞轉名詞）', '詞性需求：名詞 (N)'], 'adaptation',
    'Jack\'s quick [[10|adaptation]] (adapt) to different cultural settings makes him an excellent candidate for international assignments.',
    'Jack 對不同文化環境的快速適應，使他成為跨國任務的極佳人選。',
    '空格前有所有格 <b>Jack\'s</b> 與形容詞 <b>quick</b>，且整個名詞片語作句子的主詞（對應後方單數動詞 <b>makes</b>），故需將動詞 <b>adapt</b>（適應）轉為名詞 <b>adaptation</b>（適應）。',
    '<b>adapt</b> (v.) 適應；改編（常搭配 <i>adapt to...</i> 適應……）→ <b>adaptation</b> (n.) 適應；改編作品 → <b>adaptable</b> (adj.) 適應力強的。']
];

vocabData.forEach(q => {
  SENT[q[0]] = [q[3], q[4]];
  h += card(q[0], q[1], q[2], stem(q[0]) + clue(q[5]) + '<div class="clue"><h4>字彙與延伸補充</h4>' + q[6] + '</div>');
});

// ==================== II. 綜合測驗 ====================
h += '<h2 id="p2">II. 綜合測驗 (20%)</h2>';

h += passage('第 11–20 題文章：The Country of the Blind（盲人國）', [
  [
    ['Quito, Ecuador: A man named Nuñez arrived in town today with an incredible story to tell.', '厄瓜多基多訊：一名叫做 Nuñez 的男子今天抵達鎮上，帶來了一個令人難以置信的故事。'],
    ['One day, he was hiking high up in Ecuador\'s mountains when he [[11|lost his footing]] and fell a great distance.', '有一天，他正在厄瓜多的高山上健行，突然失足並墜落了很長一段距離。'],
    ['[[12|Bruised]] and dazed, he got to his feet and explored the region.', '全身瘀傷且頭昏眼花的他站起身來，開始探索這個地區。'],
    ['Shortly, he [[13|came upon]] a most unusual village.', '不久之後，他偶然發現了一個非常不尋常的村莊。'],
    ['It wasn\'t until he began trying to communicate with the villagers [[14|that]] he realized everyone was blind.', '直到他開始試著與村民溝通，他才意識到每個人都是盲人。']
  ],
  [
    ['At first, Nuñez thought his ability to see would give him obvious advantages over the locals.', '起初，Nuñez 以為自己看得見的能力會讓他比當地人擁有明顯的優勢。'],
    ['However, he soon discovered that he was wrong.', '然而，他很快就發現自己錯了。'],
    ['The villagers had developed techniques for coping with* their sightlessness [[15|skillfully]].', '村民們已經發展出能熟練地應付自身失明的各種技巧。'],
    ['Low walls had been built along all the lanes and alleys, which helped them to [[16|navigate]] their way around the village.', '所有小徑與巷弄旁都築起了矮牆，這幫助他們在村莊裡辨識方向、四處走動。'],
    ['Nuñez discovered that the villagers couldn\'t even understand the concept of sight.', 'Nuñez 發現村民們甚至無法理解「視覺」這個概念。']
  ],
  [
    ['One day, he met a beautiful girl named Medina, whose father was an elder of the village.', '有一天，他遇見了一位名叫 Medina 的美麗女孩，她的父親是村裡的長老。'],
    ['He wished to marry her but was told he had to [[17|either]] destroy his own eyesight to live as they did [[17|or]] give up the girl.', '他希望娶她為妻，卻被告知他必須毀掉自己的視力以像他們一樣生活，否則就得放棄這個女孩。'],
    ['What a difficult decision to be asked to make!', '被要求做出這樣的決定是多麼困難啊！'],
    ['[[18|Frustrated]] by this impossible choice, Nuñez struggled to make his decision.', '對這個不可能的選擇感到沮喪不已，Nuñez 苦苦掙扎著該如何做決定。'],
    ['[[19|Gradually]], it became clear to him what he had to do.', '漸漸地，他清楚了自己必須怎麼做。']
  ],
  [
    ['After a sleepless night, he was awakened by the sunrise.', '在一個不眠之夜後，他被日出喚醒。'],
    ['As the rest of the villagers were still asleep, he secretly [[20|set off]] never to return again.', '趁著其他村民還在熟睡時，他悄悄地動身離開，永不再回來。'],
    ['After he finished telling us his story, Nuñez said that he intended to disappear once again.', '在向我們講完他的故事後，Nuñez 說他打算再次消失。'],
    ['His experience in the mountains had been too difficult for him to bear.', '他在山裡的這段經歷對他來說實在太過沉重而難以承受。']

function makeBankOps(ansLetter, explanations) {
  const lab = 'ABCDEFGHIJ';
  return '<ul class="op">' + clozeBankOps.map((o, i) => {
    const k = lab[i] === ansLetter;
    return '<li class="' + (k ? 'ok' : 'no') + '"><b>(' + lab[i] + ') ' + o[0] + '</b> <small>' + o[1] + '</small> <i>' + (k ? '✔ 正解' : '✘ 誤答') + '</i><br>' + explanations[i] + '</li>';
  }).join('') + '</ul>';
}
