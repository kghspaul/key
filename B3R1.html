<style>

<body>
<div class="top">
  <h1>英文3 Review 1：3D Printing: Imagination Is the Only Limit 考題詳解</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 各大題資料與渲染邏輯 ===

// I. 文意字彙與詞類變化
const VOC=[
  [1,["考點：形容詞與介系詞搭配 (be beneficial to)","詞性需求：形容詞 (adj.)"],"beneficial",
    ["Exercising three times a week and eating an abundance of fresh vegetables can be very [[1|beneficial]] to one’s health.","每週運動三次以及攝取大量新鮮蔬菜對一個人的健康非常有益。"],
    "連綴動詞 <code>be</code> 加上程度副詞 <code>very</code> 後需接形容詞作主詞補語；且後方搭配介系詞片語 <code>to one's health</code>，主詞「每週運動三次與吃大量新鮮蔬菜」對健康應為正面影響，再結合字首 <b>b</b>、字尾 <b>l</b>，鎖定片語 <code>be beneficial to N</code>（對……有益的）。",
    [["beneficial","adj. 有益的；有利的","符合 <code>be beneficial to + N</code> 固定搭配與正面保健語意。<b>相似混淆字比較：</b>若填名詞 <i>benefit</i>（益處）則違反 <code>very + adj.</code> 的結構（<i>benefit</i> 需搭配 <code>be of great benefit to</code>）；若填動詞 <i>benefit</i>（使受益）則為及物動詞，直接接受詞而不加 <i>to</i>（例如：<i>Regular exercise benefits our health.</i>）。"]]
  ],
  [2,["考點：及物動詞語意（引發反應）＋過去式字尾","詞性需求：過去式及物動詞 (V-ed)"],"prompted",
    ["The candidate’s speech about nuclear power plants [[2|prompted]] an angry response from the public.","該候選人關於核電廠的演講引發了大眾憤怒的回應。"],
    "主詞為 <code>The candidate's speech...</code>（候選人的演講），受詞為 <code>an angry response</code>（憤怒的回應），句子缺少主要及物動詞；由字首 <b>p</b> 與字尾 <b>-ted</b> 可知為過去式及物動詞 <code>prompted</code>（促使、激起、引發）。",
    [["prompted","v. 促使；引發；激起（過去式）","及物動詞 <code>prompt + N (response / action / debate)</code> 表「引發某種反應或促成某行動」。<b>相似混淆字比較：</b>形容詞 <i>prompt</i> 表「迅速的、立即的」（例：<i>Thank you for your prompt reply.</i>）；另一字首尾相近的 <i>prevented</i>（阻止）後方多搭配 <code>prevent sb. from V-ing</code>，且核電爭議演講通常會「引發」而非「阻止」憤怒回應。"]]
  ],
  [3,["考點：前後分句因果對照（no two... alike）","詞性需求：形容詞 (adj.)"],"unique",
    ["Every single country in the world has a [[3|unique]] flag to represent itself; no two national flags are completely alike.","世界上每一個國家都有一面獨特的國旗來代表自己；沒有兩面國旗是完全相同的。"],
    "空格位於不定冠詞 <code>a</code> 與名詞 <code>flag</code> 之間，需填形容詞；分號後的關鍵解釋句 <code>no two national flags are completely alike</code>（沒有兩面國旗是完全相同的）直接定義了「獨一無二、獨特」的概念，且雖然首字母為母音 <b>u</b>，發音為子音 <code>/juː/</code> 故前面用冠詞 <code>a</code>，搭配字首 <b>u</b>、字尾 <b>e</b>，確認為 <code>unique</code>。",
    [["unique","adj. 獨特的；獨一無二的","精確對應後句 <code>no two ... are completely alike</code> 的定義，且發音以半母音 <code>/j/</code> 開頭，與前面的不定冠詞 <code>a</code> 完美吻合。<b>相似混淆字比較：</b><i>uniform</i>（一致的、相同的）雖同樣以 <i>u</i> 開頭且用冠詞 <i>a</i>，但語意與「沒有兩面完全相同」完全相反（何時才對：<i>The boxes are of a uniform size.</i>）。"]]
  ],
  [4,["考點：服飾觸感搭配詞 (soft and silky)","詞性需求：單數可數名詞 (n.)"],"texture",
    ["The well-known fashion designer is launching a new line of festive clothing with a soft and silky [[4|texture]].","這位知名的時尚設計師正在推出一系列具有柔軟絲滑質地的新節慶服飾。"],
    "空格前有冠詞與形容詞 <code>a soft and silky</code>（柔軟且絲滑的），後方需接單數名詞；用來描述服飾（<code>clothing</code>）「摸起來柔軟絲滑的觸感、質地」，結合字首 <b>t</b>、字尾 <b>e</b>，故填 <code>texture</code>。",
    [["texture","n. 質地；觸感；口感","專門用來搭配觸覺或口感形容詞（如 <code>soft, silky, smooth, rough, creamy</code>）。<b>相似混淆字比較：</b><i>textile</i>（n. 紡織品；織物）指布料商品本身而非「柔軟絲滑的觸感屬性」（何時才對：<i>The country's economy depends heavily on the textile industry.</i>）。"]]
  ],
  [5,["考點：醫療情境固定搭配 (take one's temperature)","詞性需求：單數名詞 (n.)"],"temperature",
    ["The nurse takes the patient’s [[5|temperature]] on an hourly basis to make sure that his fever remains under control.","護理師每小時為病患量一次體溫，以確保他的高燒維持在控制之中。"],
    "主詞為 <code>The nurse</code>（護理師），後文目的子句提到 <code>his fever remains under control</code>（他的發燒受到控制），加上動詞片語 <code>takes the patient's t___e</code>，為標準醫療搭配詞 <code>take one's temperature</code>（量某人的體溫）。",
    [["temperature","n. 體溫；溫度","固定片語 <code>take someone's temperature</code> 指「量某人的體溫」，完全呼應後文的 <code>fever</code>（發燒）。<b>相似混淆字比較：</b><i>temperament</i>（n. 氣質；性情）字首同為 <i>temper-</i> 但字尾不是 <i>e</i>，且不能用來監控發燒（何時才對：<i>The dog has a gentle temperament.</i>）。"]]
  ],
  [6,["考點：動詞與受詞語意呼應 (cherish ... memories)","詞性需求：形容詞 (adj.)"],"precious",
    ["Raised by his grandparents in the countryside, Rick really cherishes those [[6|precious]] childhood memories.","在鄉下由祖父母撫養長大，瑞克非常珍惜那些珍貴的童年回憶。"],
    "空格位於指示形容詞 <code>those</code> 與名詞片語 <code>childhood memories</code>（童年回憶）之間，需填形容詞；前面主要動詞 <code>cherishes</code>（珍視、珍惜）直接提示這些回憶對他而言非常「寶貴的、珍貴的」，配合字首 <b>p</b>、字尾 <b>s</b>，得出 <code>precious</code>。",
    [["precious","adj. 珍貴的；寶貴的","與動詞 <code>cherish</code>（珍惜）及名詞 <code>memories</code>（回憶）為高頻搭配。<b>相似混淆字比較：</b><i>previous</i>（adj. 先前的）雖字首字尾同樣是 <i>p...s</i>，但童年本就在過去，說「先前的童年回憶」語意多餘且無法凸顯 <i>cherishes</i> 的情感強度（何時才對：<i>She has two children from a previous marriage.</i>）。"]]
  ],
  [7,["考點：詞類變化（不定詞片語表目的 To + V）","詞性需求：原形及物動詞 (V)"],"reduce",
    ["To [[7|reduce]] (reduction) the cost of furnishing her new apartment, Linda ordered furniture parts online and put them together herself.","為了降低布置新公寓的成本，琳達在網路上訂購家具零件並自己組裝。"],
    "句首 <code>To ___ the cost...</code> 為表目的的不定詞片語（<code>In order to + 原形動詞</code>），且後方直接接名詞受詞 <code>the cost</code>（成本），因此必須將括號內的名詞 <code>reduction</code> 去掉名詞字尾 <i>-tion</i>，還原為及物動詞原形 <code>reduce</code>。",
    [["reduce","v. 減少；降低（原形動詞）","置於不定詞標記 <code>To</code> 後作目的狀語，及物動詞直接搭配受詞 <code>the cost</code>。"],["reduction","n. 減少；降低（原題括號詞）","名詞不可直接置於不定詞 <code>To</code> 後接名詞受詞 <code>the cost</code>。<br><b>何時才對：</b><i>There has been a significant reduction in traffic accidents this year.</i>（作介系詞或動詞之受詞，後方需接介系詞 <code>in</code> 或 <code>of</code>）。"]]
  ],
  [8,["考點：詞類變化（冠詞 + 形容詞 + 名詞）","詞性需求：形容詞 (adj.)"],"stable",
    ["To everyone’s surprise, Larry decided to start his own business instead of finding a job with a [[8|stable]] (stability) income.","令大家驚訝的是，賴瑞決定自己創業，而不是找一份有穩定收入的工作。"],
    "空格位於不定冠詞 <code>a</code> 與名詞 <code>income</code>（收入）之間，依「冠詞 + 形容詞 + 名詞」結構，須將抽象名詞 <code>stability</code>（穩定性）去字尾 <i>-ility</i> 改為形容詞字尾 <i>-le</i>，即 <code>stable</code>（穩定的）。",
    [["stable","adj. 穩定的；穩固的","修飾名詞 <code>income</code>，構成常見搭配詞 <code>a stable income / job</code>（穩定的收入／工作）。"],["stability","n. 穩定（性）；穩固（原題括號詞）","名詞不可直接夾在 <code>a ... income</code> 中修飾 <code>income</code>。<br><b>何時才對：</b><i>Political stability is essential for economic growth.</i>（作主詞或受詞）。"]]
  ],
  [9,["考點：詞類變化（定冠詞 the + 名詞 + to V）","詞性需求：單數名詞 (n.)"],"capability",
    ["Thanks to the invention of computers, we have the [[9|capability]] (capable) to process and analyze large quantities of data.","多虧了電腦的發明，我們擁有處理並分析大量數據的能力。"],
    "空格前有及物動詞與定冠詞 <code>have the</code>，後方接不定詞片語 <code>to process and analyze...</code> 作後位修飾，因此空格必須將形容詞 <code>capable</code> 轉為名詞 <code>capability</code>，構成句型 <code>have the capability to V</code>（有做……的能力）。",
    [["capability","n. 能力；才能","符合 <code>have the capability to V / of V-ing</code> 的名詞構式。"],["capable","adj. 有能力的（原題括號詞）","形容詞不可直接置於 <code>have the ___</code> 後當受詞。<br><b>何時才對：</b><i>With the help of computers, we are capable of processing large quantities of data.</i>（搭配 <code>be capable of V-ing</code>）。"]]
  ],
  [10,["考點：詞類變化（不可數集合名詞）","詞性需求：不可數名詞 (n. [U])"],"equipment",
    ["Since the local baseball team couldn’t afford to buy new uniforms and the necessary [[10|equipment]] (equip), many people tried to raise money for them.","由於當地棒球隊買不起新球衣和必要的裝備，許多人試著為他們募款。"],
    "對等連接詞 <code>and</code> 連接動詞 <code>buy</code> 的兩個名詞受詞：<code>new uniforms</code> 與 <code>the necessary ___</code>；定冠詞 <code>the</code> 與形容詞 <code>necessary</code> 後需接名詞，故將動詞 <code>equip</code> 加上名詞字尾 <i>-ment</i> 變成 <code>equipment</code>。特別注意：<code>equipment</code> 為<b>不可數名詞</b>，絕對不可加 <i>-s</i>！",
    [["equipment","n. [U] 設備；裝備（不可數）","作 <code>buy</code> 的受詞並受形容詞 <code>necessary</code> 修飾；注意 <code>equipment</code> 永遠不加複數 <i>-s</i>。"],["equip","v. 裝備；配備（原題括號詞）","動詞不可置於 <code>the necessary ___</code> 後作受詞。<br><b>何時才對：</b><i>The school plans to equip all classrooms with new computers.</i>（搭配 <code>equip A with B</code>）。"]]
  ]
];

// II. 綜合測驗
const P_CLOZE=[
  [
    ["Yesterday, I interviewed young Alex Pring.","昨天，我採訪了年幼的艾力克斯．普林（Alex Pring）。"],
    ["Alex was born without most of his right arm.","艾力克斯出生時就缺少了大部分的右臂。"],
    ["He thus lived a very different existence from most people.","因此，他過著與大多數人截然不同的生活。"],

    ["[[12|It]] seems that the surgery was a great success, and so far, he appears to be adjusting to his new arm very well.","這場手術似乎非常成功，而且到目前為止，他看起來非常適應他的新小手臂。"],
    ["Although the arm was tough to get used to at first, he has quickly come to love it.","雖然這隻手臂起初很難習慣，但他很快就愛上了它。"],
    ["He stated that he had never dreamed that [[13|such]] an object would be possible.","他表示自己從未夢想過這樣的一個物體會成為可能。"],
    ["Alex has also met the engineers who [[14|succeeded in]] producing the arm.","艾力克斯也見到了成功製造出這隻手臂的工程師們。"],
    ["They visited him not long after he woke up from the operation.","在他從手術中醒來後不久，他們便去探望了他。"],
    ["Alex appreciated the opportunity to thank them for their years of hard work to make the surgery a reality.","艾力克斯很感激有這個機會能感謝他們多年來的辛勤工作，讓這場手術成為現實。"],
    ["They have really [[15|given him a hand]]!","他們真的幫了他一個大忙（也雙關「給了他一隻手」）！"]

const q37Stem='<div class="stem"><div class="zh" style="margin-bottom:6px">請從文章中找出最適當的單詞（word）填入下列句子空格中，並視句型結構需要做適當的字形變化，使句子語意完整、語法正確，並符合全文文意。每格限填一個單詞。(4%)</div>'+
