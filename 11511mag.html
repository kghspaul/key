<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雜誌文意字彙練習．詳解</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#EEEAE0;
    --paper-deep:#E6E1D3;
    --card:#FBF9F3;
    --rule:#D8D2C0;
    --ink:#24262A;
    --ink-soft:#63665F;
    --ink-faint:#94978D;
    --margin:#8C3229;
    --red:#A6321D;
    --red-soft:#C65A3E;
    --red-wash:#F4E3DD;
    --green:#3A5A40;
    --focus:#1D4E89;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: calc(128px + env(safe-area-inset-top,0px));}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 0 0, rgba(0,0,0,0.02), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(0,0,0,0.02), transparent 40%);
    color:var(--ink);
    font-family:'Source Serif 4','Noto Serif TC',serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
    -webkit-text-size-adjust:100%;
  }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  header.hero{
    max-width:640px;
    margin:0 auto;
    padding:30px 20px 18px;
  }
  .kicker{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    color:var(--red);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .kicker::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--red);
    display:inline-block;
  }
  h1{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:26px;
    line-height:1.35;
    margin:10px 0 6px;
    letter-spacing:.01em;
  }
  h1 em{
    font-style:normal;
    color:var(--red);
    text-decoration:underline;
    text-decoration-color:var(--red-soft);
    text-decoration-thickness:2px;
    text-underline-offset:3px;
  }
  .hero-sub{
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.6;
    max-width:52ch;
  }
  .hero-meta{
    margin-top:16px;
    display:flex;
    gap:18px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--ink-faint);
  }
  .hero-meta b{ color:var(--ink); font-weight:700; }

  .toolbar{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(238,234,224,.94);
    backdrop-filter:saturate(140%) blur(6px);
    border-bottom:1px solid var(--rule);
    padding-top:env(safe-area-inset-top,0px);
  }
  .nav{
    max-width:640px;
    margin:0 auto;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 20px;
    scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none;}
  .navchip{
    flex:0 0 auto;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--rule);
    border-radius:999px;
    padding:6px 11px;
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, border-color .15s;
  }
  .navchip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#F3EFE4;
  }
  .navchip-count{
    font-size:10.5px;
    color:var(--ink-faint);
    background:rgba(0,0,0,.05);
    border-radius:999px;
    padding:1px 6px;
  }
  .navchip.active .navchip-count{
    color:#cfc8b4;
    background:rgba(255,255,255,.12);
  }
  .controls{
    max-width:640px;
    margin:0 auto;
    padding:0 20px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .progress{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--ink-faint);
  }
  .progress b{ color:var(--red); font-weight:700; }
  .reveal-toggle{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--card);
    background:var(--red);
    border:1px solid var(--red);
    border-radius:999px;
    padding:7px 14px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .reveal-toggle.is-off{
    background:transparent;
    color:var(--red);
  }

  main{
    max-width:640px;
    margin:0 auto;
    padding:8px 16px 0;
  }

  .unit-section{
    margin-top:26px;
    scroll-margin-top:110px;
  }
  .unit-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:0 4px 8px;
    border-bottom:2px solid var(--ink);
  }
  .unit-head .u-label{
    font-family:'Noto Serif TC',serif;
    font-weight:700;
    font-size:19px;
  }
  .unit-head .u-count{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--ink-faint);
  }

  .qlist{ list-style:none; margin:0; padding:0; }

  .qcard{
    position:relative;
    background:var(--card);
    border-bottom:1px solid var(--rule);
    padding:16px 14px 16px 46px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .qcard::before{
    /* red margin rule, notebook-style */
    content:"";
    position:absolute;
    left:30px; top:0; bottom:0;
    width:1px;
    background:var(--margin);
    opacity:.55;
  }
  .qnum{
    position:absolute;
    left:6px; top:16px;
    width:20px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    text-align:right;
  }
  .q-en{
    font-size:16px;
    line-height:1.75;
    color:var(--ink);
  }
  .blank{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:.01em;
    color:var(--ink-faint);
    border-bottom:1.5px dashed var(--ink-faint);
    padding:0 1px;
  }
  .answer-ink{
    display:none;
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:21px;
    color:var(--red);
    margin-left:2px;
    white-space:nowrap;
  }
  .qcard.revealed .blank{
    color:var(--ink-faint);
    text-decoration:line-through;
    text-decoration-color:var(--ink-faint);
    opacity:.55;
    border-bottom-style:solid;
  }
  .qcard.revealed .answer-ink{ display:inline; }

  .q-zh{
    margin-top:8px;
    font-family:'Noto Serif TC',serif;
    font-size:13.5px;
    line-height:1.85;
    color:var(--ink-soft);
  }

  .q-foot{
    margin-top:9px;
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--ink-faint);
  }
  .tap-hint{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .qcard.revealed .tap-hint::before{ content:"✓ "; color:var(--green); }
  .qcard:not(.revealed) .tap-hint::before{ content:"點按查看答案"; }
  .qcard.revealed .tap-hint::before{ content:"答案：" attr(data-word); }

  footer{
    max-width:640px;
    margin:34px auto 0;
    padding:18px 20px 0;
    border-top:1px solid var(--rule);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    text-align:center;
  }

  @media (min-width:640px){
    .qcard{ padding-left:52px; }
    .qcard::before{ left:36px; }
    .qnum{ left:8px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="kicker">詳解 · 對答案模式</div>
  <h1>雜誌文意字彙練習<br><em>依序詳解</em></h1>

<script>
const DATA = [{"unit": "U2", "num": 1, "word": "inspiration", "en": "Emma found i________n while visiting the quiet village during her summer vacation. The beautiful scenery encouraged her to start painting again.", "zh": "Emma 在暑假造訪寧靜村莊時找到了靈感。美麗的景色鼓勵她重新開始畫畫。", "blank": "i________n"}, {"unit": "U2", "num": 2, "word": "deadly", "en": "The poisonous snake can be d____y if medical treatment is delayed. Local residents have been warned to avoid walking alone in the forest.", "zh": "如果延誤治療，這種毒蛇可能會致命。當地居民已被警告避免獨自在森林中行走。", "blank": "d____y"}, {"unit": "U2", "num": 3, "word": "physical", "en": "Regular exercise improves p______l health and helps people maintain strong muscles. Kevin goes swimming three times a week after finishing work.", "zh": "規律運動能改善身體健康，並幫助人們維持強壯的肌肉。Kevin 每週下班後游泳三次。", "blank": "p______l"}, {"unit": "U2", "num": 4, "word": "numerous", "en": "The museum contains n______s paintings from different periods of European history. Visitors can spend hours exploring the impressive collection.", "zh": "這間博物館收藏了許多來自歐洲不同歷史時期的畫作。遊客可以花數小時探索這批令人印象深刻的收藏。", "blank": "n______s"}, {"unit": "U2", "num": 5, "word": "disguise", "en": "The detective wore a d_____e while observing the suspect near the train station. Nobody recognized the detective because of the unusual clothing.", "zh": "偵探在火車站附近監視嫌疑犯時進行了偽裝。沒有人認出這名偵探，因為他的服裝很不尋常。", "blank": "d_____e"}, {"unit": "U2", "num": 6, "word": "throne", "en": "The young prince finally sat on the t____e after his father retired from the kingdom. Thousands of citizens gathered outside the palace to celebrate.", "zh": "年輕王子在父親退位後終於坐上王位。數千名市民聚集在皇宮外慶祝。", "blank": "t____e"}, {"unit": "U2", "num": 7, "word": "intelligence", "en": "The detective relied on i________e rather than physical strength to solve the difficult case. Careful reasoning helped Marcus identify the hidden connection.", "zh": "這名偵探依靠智慧而非體力來解決棘手的案件。仔細推理幫助 Marcus找出隱藏的關聯。", "blank": "i________e"}, {"unit": "U2", "num": 8, "word": "aspect", "en": "One important a_____t of learning a language is regular practice. Students who use English every day usually become more confident speakers.", "zh": "學習語言的一個重要面向是規律練習。每天使用英文的學生通常會變得更有自信。", "blank": "a_____t"}, {"unit": "U2", "num": 9, "word": "essentially", "en": "The two proposals are e________y the same despite their different names. Both plans require the government to invest more money in transportation.", "zh": "儘管名稱不同，這兩項提案基本上是相同的。兩項計畫都要求政府投入更多資金在交通運輸上。", "blank": "e________y"}, {"unit": "U2", "num": 10, "word": "context", "en": "The meaning of the word can change depending on the c_____t. Reading the entire paragraph helps students understand the writer's intended meaning.", "zh": "這個單字的意思可能會根據上下文改變。閱讀整個段落能幫助學生理解作者想表達的意思。", "blank": "c_____t"}, {"unit": "U2", "num": 11, "word": "endure", "en": "The hikers had to e____e several hours of heavy rain before reaching the shelter. Despite the difficult conditions, everyone remained calm.", "zh": "登山客必須忍受數小時的大雨才能抵達避難所。儘管環境艱困，所有人仍保持冷靜。", "blank": "e____e"}, {"unit": "U2", "num": 12, "word": "universal", "en": "The desire for friendship seems u_______l among people of different cultures. Although customs vary, most people want meaningful relationships.", "zh": "對友誼的渴望似乎存在於不同文化的人們之中。雖然習俗各不相同，大多數人都希望建立有意義的人際關係。", "blank": "u_______l"}, {"unit": "U11", "num": 13, "word": "predict", "en": "Weather experts p____t that a strong storm will reach the coast tomorrow morning. Local authorities have already prepared emergency shelters.", "zh": "氣象專家預測強烈暴風雨將在明天早上抵達海岸。地方當局已經準備緊急避難所。", "blank": "p____t"}, {"unit": "U11", "num": 14, "word": "backyard", "en": "Ethan built a small vegetable garden in his b______d last spring. His family now grows tomatoes, peppers, and several kinds of herbs there.", "zh": "Ethan 去年春天在後院打造一座小菜園。他的家人現在在那裡種番茄、辣椒和幾種香草。", "blank": "b______d"}, {"unit": "U11", "num": 15, "word": "workout", "en": "Jessica designed a short w_____t for people with busy schedules. The routine includes stretching, squats, and several strength exercises.", "zh <script>
(function(){
  const main = document.getElementById('main');
  const units = [];
  DATA.forEach(e => { if(!units.includes(e.unit)) units.push(e.unit); });

  document.getElementById('metaTotal').textContent = DATA.length;
  document.getElementById('metaUnits').textContent = units.length;
  document.getElementById('progressTotal').textContent = DATA.length;
  document.getElementById('footTotal').textContent = DATA.length;

  function blankHtml(en, blank, word){
    const idx = en.indexOf(blank);
    if(idx === -1) return {before: en, blankTxt: blank, after: ''};
    return {
      before: en.slice(0, idx),
      blankTxt: blank,
      after: en.slice(idx + blank.length)
    };
  }

  units.forEach(u => {
    const uid = u.replace(/ /g, '-');
    const items = DATA.filter(e => e.unit === u);

    const section = document.createElement('section');
    section.className = 'unit-section';
    section.id = uid;

    const head = document.createElement('div');
    head.className = 'unit-head';
    head.innerHTML = `<span class="u-label">${u}</span><span class="u-count">${items.length} 題</span>`;
    section.appendChild(head);

    const list = document.createElement('ul');
    list.className = 'qlist';

    items.forEach(e => {
      const li = document.createElement('li');
      li.className = 'qcard';
      li.dataset.num = e.num;

      const parts = blankHtml(e.en, e.blank, e.word);

      li.innerHTML = `
        <span class="qnum">${e.num}</span>
        <div class="q-en">${escapeHtml(parts.before)}<span class="blank">${escapeHtml(parts.blankTxt)}</span><span class="answer-ink">${escapeHtml(e.word)}</span>${escapeHtml(parts.after)}</div>
        <div class="q-zh">${escapeHtml(e.zh)}</div>
        <div class="q-foot"><span class="tap-hint" data-word="${escapeHtml(e.word)}"></span></div>
      `;

      li.addEventListener('click', () => {
        li.classList.toggle('revealed');
        updateProgress();
      });

      list.appendChild(li);
    });

    section.appendChild(list);
    main.appendChild(section);
  });

  function escapeHtml(s){
    return String(s)
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;');
  }

  function updateProgress(){
    const total = document.querySelectorAll('.qcard').length;
    const revealed = document.querySelectorAll('.qcard.revealed').length;
    document.getElementById('progressN').textContent = revealed;
    document.getElementById('metaRevealed').textContent = revealed;
    const btn = document.getElementById('revealAllBtn');
    if(revealed === total && total > 0){
      btn.textContent = '隱藏全部答案';
      btn.classList.remove('is-off');
    } else if (revealed === 0){
      btn.textContent = '顯示全部答案';
      btn.classList.remove('is-off');
    } else {
      btn.textContent = '顯示全部答案';
    }
  }

  window.toggleAll = function(){
    const cards = document.querySelectorAll('.qcard');
    const allRevealed = document.querySelectorAll('.qcard.revealed').length === cards.length;
    cards.forEach(c => c.classList.toggle('revealed', !allRevealed));
    updateProgress();
  };

  window.jumpTo = function(uid){
    const el = document.getElementById(uid);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); }
  };

  // highlight active nav chip on scroll
  const chips = Array.from(document.querySelectorAll('.navchip'));
  const sections = units.map(u => document.getElementById(u.replace(/ /g,'-')));
  function onScroll(){
    let activeIdx = 0;
    const y = window.scrollY + 130;
    sections.forEach((s, i) => { if(s && s.offsetTop <= y) activeIdx = i; });
    chips.forEach((c, i) => c.classList.toggle('active', i === activeIdx));
  }
  document.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
  updateProgress();
})();
</script>
