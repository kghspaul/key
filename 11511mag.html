  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與易混淆字形／詞性剖析（含「何時才對」例句）</p>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

  { n: 21, sec: "s1", tags: ["考點：accelerate 加速、加快", "詞性需求：原形動詞 (VR)"], ans: "accelerate",

    zh: "新的火車系統將加快兩座主要城市之間的交通。官員預期旅程將縮短三十分鐘。",
    clue: "助動詞 will 後接原形動詞；使行車時間縮減三十分鐘，加快兩城往返速度，依首尾提示 a____e 判定為 accelerate。",
    confuse: "acceleration (n. 加速度)。助動詞後接動詞原形。何時才對：The car accelerated rapidly down the highway." },
  { n: 22, sec: "s1", tags: ["考點：pace 步伐、節奏步調", "詞性需求：可數名詞 (單數)"], ans: "pace",
    en: "Maria walked at a comfortable [[22|pace]] during the long hike. She wanted to save enough energy for the difficult climb later that afternoon.",
    zh: "Maria 在長途健行時以舒服的步調行走。她想保留足夠體力應付當天下午的艱難攀爬。",
    clue: "片語 at a comfortable pace（以舒適的步調）；長途健行調節體力，依首尾提示 p____e 判定為 pace。",
    confuse: "pace 也可當動詞踱步。名詞常用於 keep pace with（與……並駕齊驅）。何時才對：You should slow down and pace yourself." },
  { n: 23, sec: "s1", tags: ["考點：statistic 統計數據、統計數值", "詞性需求：可數名詞 (單數)"], ans: "statistic",
    en: "One surprising [[23|statistic]] shows that many young adults now prefer public transportation. The survey also found convenience was their main reason.",
    zh: "一項令人驚訝的統計數據顯示，許多年輕人現在比較喜歡大眾運輸。調查也發現便利性是主要原因。",
    clue: "One surprising 後接單數名詞作主詞；動詞為 shows，民調呈現的統計資料，依首尾提示 s____c 判定為 statistic。",
    confuse: "statistics (n. 統計學，單數；亦可指各項統計數據，複數)。此處有 One 修飾且動詞為單數 shows，填單數 statistic。何時才對：A shocking statistic reveals high unemployment." },
  { n: 24, sec: "s1", tags: ["考點：competitor 競爭者、對手", "詞性需求：可數名詞 (單數指人)"], ans: "competitor",
    en: "The young athlete trained every morning to become a stronger [[24|competitor]]. Her coach believed regular practice would prepare her for the championship.",
    zh: "這名年輕運動員每天早晨訓練，以成為更強的競爭者。她的教練相信規律練習能讓她為錦標賽做好準備。",
    clue: "become a stronger 後接名詞指人；運動員刻苦訓練備戰錦標賽成為更強勁的賽場對手，依首尾提示 c____r 判定為 competitor。",
    confuse: "competition (n. 比賽競爭)、competitive (adj. 競爭激烈的)。指人使用 competitor。何時才對：Our main competitor has lowered their prices." },
  { n: 25, sec: "s1", tags: ["考點：scam 詐騙、騙局", "詞性需求：可數名詞 (單數)"], ans: "scam",
    en: "The elderly man nearly lost his savings because of an online [[25|scam]]. His daughter noticed the suspicious message and contacted the bank.",
    zh: "這名老人差點因為網路詐騙而失去積蓄。他的女兒注意到可疑訊息後聯絡銀行。",
    clue: "an online 後接單數名詞；險些損失存款的可疑網路欺詐行為，依首尾提示 s____m 判定為 scam。",
    confuse: "scammer (n. 詐騙份子)。指網路詐騙犯罪事件用 scam。何時才對：Be careful not to fall for a telephone scam." },

  // 26 - 50
  { n: 26, sec: "s2", tags: ["考點：elaborate 精心製作的、精緻的", "詞性需求：形容詞"], ans: "elaborate",
    en: "The chef prepared an [[26|elaborate]] meal for the visiting guests. The dinner included several courses, handmade desserts, and carefully decorated dishes.",
    zh: "主廚為來訪客人準備了一頓精心製作的餐點。晚餐包含數道菜、手工甜點和精心裝飾的料理。",
    clue: "不定冠詞 an 與名詞 meal 之間填形容詞；晚餐菜色繁複精美，依首尾提示 e____e 判定為 elaborate。",
    confuse: "elaborately (adv. 精緻地)、elaborate (v. 詳加說明)。修飾名詞 meal 填形容詞。何時才對：She wore an elaborate wedding dress." },
  { n: 27, sec: "s2", tags: ["考點：convincing 令人信服的", "詞性需求：形容詞"], ans: "convincing",
    en: "The lawyer presented a [[27|convincing]] argument during the trial. Several pieces of evidence supported the explanation and changed the judge's view.",
    zh: "律師在審判中提出令人信服的論點。幾項證據支持這個說法，並改變法官的看法。",
    clue: "修飾名詞 argument；論據充足使法官動搖信服，依首尾提示 c____g 判定為 convincing。",
    confuse: "convince (v. 使信服)、convinced (adj. 感到確信的)。修飾論點 argument 表具說服力填 convincing。何時才對：There is no convincing evidence of life on Mars." },
  { n: 28, sec: "s2", tags: ["考點：scheme 計畫、方案", "詞性需求：可數名詞 (單數)"], ans: "scheme",
    en: "The government introduced a new [[28|scheme]] to encourage people to use bicycles. Residents can receive financial support when purchasing approved electric bikes.",
    zh: "政府推出一項新計畫，鼓勵民眾使用自行車。居民購買核准的電動自行車時可以獲得經濟補助。",
    clue: "introduced a new 後接單數名詞；官方推動的補助方案計畫，依首尾提示 s____e 判定為 scheme。",
    confuse: "scheme 在英國常指官方方案，在美國有時含貶義陰謀之意。此處為政府補助政策方案。何時才對：The company launched a training scheme for new graduates." },
  { n: 29, sec: "s2", tags: ["考點：commission 委託、委任酬勞", "詞性需求：可數名詞 (單數)"], ans: "commission",
    en: "The artist received a large [[29|commission]] for creating a painting for the new hotel. The hotel owner wanted a colorful artwork for the entrance hall.",
    zh: "這名藝術家收到一筆高額委託，為新飯店創作一幅畫。飯店老闆希望入口大廳有一件色彩繽紛的藝術作品。",
    clue: "received a large 後接名詞；飯店老闆委託畫家作畫並給付酬金，依首尾提示 c____n 判定為 commission。",
    confuse: "commission 亦可作佣金或委員會。藝術委託創作稱作 an art commission。何時才對：The architect received a commission to design the museum." },
  { n: 30, sec: "s2", tags: ["考點：psychology 心理學", "詞性需求：不可數名詞"], ans: "psychology",
    en: "Professor Chen studies [[30|psychology]] to understand how people make decisions. Her research focuses on the relationship between emotions and consumer behavior.",
    zh: "Chen 教授研究心理學，以了解人們如何做決定。她的研究著重於情緒與消費者行為之間的關係。",
    clue: "studies 後接學科名詞作受詞；研究人類決策與情緒消費者行為的科學，依首尾提示 p____y 判定為 psychology。",
    confuse: "psychologist (n. 心理學家)、psychological (adj. 心理上的)。學科領域名詞為 psychology。何時才對：She has a degree in psychology." },
  { n: 31, sec: "s2", tags: ["考點：greed 貪婪", "詞性需求：不可數名詞"], ans: "greed",
    en: "The novel explores how [[31|greed]] can destroy relationships between family members. The main character becomes increasingly selfish after gaining control of the family business.",
    zh: "這部小說探討貪婪如何摧毀家人之間的關係。主角掌控家族企業後變得越來越自私。",
    clue: "how 引導之子句中作主詞；主角因自私自利爭奪家產引發的貪慾，依首尾提示 g____d 判定為 greed。",
    confuse: "greedy (adj. 貪心的)。作子句主詞需填名詞 greed。何時才對：His greed for power eventually led to his downfall." },
  { n: 32, sec: "s2", tags: ["考點：investigate 調查、偵查", "詞性需求：原形動詞 (VR)"], ans: "investigate",
    en: "The police will [[32|investigate]] the strange disappearance of the valuable painting. Several security cameras recorded unusual activity that night.",
    zh: "警方將調查那幅珍貴畫作的離奇失蹤。幾支監視器在當晚拍到異常活動。",
    clue: "助動詞 will 後接原形動詞；警方偵辦珍貴畫作離奇失竊案，依首尾提示 i____e 判定為 investigate。",
    confuse: "investigation (n. 調查)、investigator (n. 調查員)。助動詞後接原形動詞。何時才對：Detectives are investigating the murder case." },
  { n: 33, sec: "s2", tags: ["考點：thoroughly 徹底地、詳盡地", "詞性需求：副詞"], ans: "thoroughly",
    en: "The doctor examined the patient [[33|thoroughly]] before recommending any treatment. The careful examination helped identify the real cause of the problem.",
    zh: "醫生在建議任何治療方式前徹底檢查了病人。仔細的檢查幫助找出問題真正的原因。",
    clue: "修飾動詞 examined；後文呼應 careful examination，指全面而詳盡的診斷，依首尾提示 t____y 判定為副詞 thoroughly。",
    confuse: "thorough (adj. 徹底的)。修飾動作動詞 examine 需加 -ly。何時才對：I thoroughly enjoyed the performance." },
  { n: 34, sec: "s2", tags: ["考點：suspicious 可疑的", "詞性需求：形容詞"], ans: "suspicious",
    en: "The police noticed a [[34|suspicious]] vehicle parked outside the bank. The driver left quickly after seeing officers approach the area.",
    zh: "警方注意到一輛可疑的車停在銀行外。駕駛看到警察靠近後迅速離開。",
    clue: "不定冠詞 a 與名詞 vehicle 之間填形容詞；銀行外可疑車輛駕駛見警迅速逃逸，依首尾提示 s____s 判定為 suspicious。",
    confuse: "suspicion (n. 懷疑)。修飾名詞 vehicle 需用形容詞 suspicious。何時才對：His strange behavior aroused suspicious thoughts." },
  { n: 35, sec: "s2", tags: ["考點：financial 財務的、金融的", "詞性需求：形容詞"], ans: "financial",
    en: "The company is facing serious [[35|financial]] problems after losing several major customers. Managers are trying to reduce expenses without firing employees.",
    zh: "這家公司失去幾個重要客戶後正面臨嚴重的財務問題。經理正試圖在不解雇員工的情況下降低支出。",
    clue: "修飾名詞 problems；失去大客戶導致削減開銷之金錢危機，依首尾提示 f____l 判定為 financial。",
    confuse: "finance (n. 財務 / v. 資助)、financially (adv. 財務上)。修飾名詞 problems 填形容詞。何時才對：The firm needs immediate financial assistance." },
  { n: 36, sec: "s2", tags: ["考點：mislead 誤導", "詞性需求：原形動詞 (VR)"], ans: "mislead",
    en: "The advertisement may [[36|mislead]] customers by showing an unrealistically low price. The company later added extra fees that were not clearly explained.",
    zh: "這則廣告可能會透過顯示不切實際的低價來誤導消費者。這家公司後來增加了一些沒有清楚說明的額外費用。",
    clue: "情態助動詞 may 後接原形動詞；不實低價誘騙消費者而後加收隱藏手續費，依首尾提示 m____d 判定為 mislead。",
    confuse: "misleading (adj. 具誤導性的)。助動詞 may 後接動詞原形 mislead。何時才對：Statistics can easily be used to mislead people." },
  { n: 37, sec: "s2", tags: ["考點：profile 人物簡介、專題報導", "詞性需求：可數名詞 (單數)"], ans: "profile",
    en: "The magazine published a detailed [[37|profile]] of the successful entrepreneur. The article described her childhood, education, and rise to international fame.",
    zh: "這本雜誌刊登了一篇關於這位成功企業家的詳細人物專訪。文章描述她的童年、教育以及成名國際的過程。",
    clue: "published a detailed 後接名詞；詳述企業家生平、教育與奮鬥歷程的人物專文，依首尾提示 p____e 判定為 profile。",
    confuse: "profile 亦可指社群帳號檔案。描述生平人物報導時稱 biographical profile。何時才對：The newspaper ran a profile of the candidate." },
  { n: 38, sec: "s2", tags: ["考點：alert 保持警覺的", "詞性需求：形容詞 (主詞補語)"], ans: "alert",
    en: "The security guard remained [[38|alert]] throughout the night shift. His careful attention helped him notice a broken window near the entrance.",
    zh: "保全在整個夜班期間都保持警覺。他的仔細注意讓他發現入口附近有一扇破窗。",
    clue: "連綴動詞 remained 後接形容詞補語；夜班專注巡視並察覺破窗，片語 remain alert，依首尾提示 a____t 判定為 alert。",
    confuse: "alert 亦可作動詞 (alert sb. to...) 或名詞 (警報)。連綴動詞後作補語填形容詞。何時才對：Drivers must stay alert on icy roads." },
  { n: 39, sec: "s2", tags: ["考點：unidentified 未確認身分的、不明的", "詞性需求：形容詞"], ans: "unidentified",
    en: "Officer Chang reported an [[39|unidentified]] vehicle parked right outside the local bank. The police are currently trying to figure out who owns this mysterious car.",
    zh: "張警官報告有一輛身分不明的車輛停在當地銀行外。警方目前正試圖查明這輛神祕汽車的車主是誰。",
    clue: "不定冠詞 an 與名詞 vehicle 之間填形容詞；後文指神秘不知車主是誰，依首尾提示 u____ied 判定為 unidentified。",
    confuse: "identify (v. 辨識身分)。UFO 即 Unidentified Flying Object 之縮寫。何時才對：The victim remained unidentified for days." },
  { n: 40, sec: "s2", tags: ["考點：phenomenon 自然現象", "詞性需求：可數名詞 (單數)"], ans: "phenomenon",
    en: "The northern lights are a beautiful [[40|phenomenon]] observed mainly in polar regions. Emily traveled all the way to Iceland just to witness this natural event.",
    zh: "北極光是主要在極地地區觀察到的美麗現象。艾蜜莉大老遠跑到冰島，只為了親眼目睹這個自然事件。",
    clue: "a beautiful 後接單數名詞；極光屬於極地自然景觀現象，依首尾提示 p____n 判定為 phenomenon。",
    confuse: "phenomena (複數形)。前面有 a beautiful 限定，須填單數形 phenomenon。何時才對：Global warming is a complex phenomenon." },
  { n: 41, sec: "s2", tags: ["考點：radar 雷達裝置", "詞性需求：可數名詞 (複數)"], ans: "radars",
    en: "The military base installed new [[41|radars]] along the southern coastline yesterday. General Wang expects these advanced devices to detect approaching aircraft much more effectively.",
    zh: "軍事基地昨天在南部海岸線安裝了新的雷達。王將軍期望這些先進設備能更有效地偵測到靠近的飛機。",
    clue: "installed new 後接名詞；後文對應 these advanced devices，偵測來犯飛機的設備，依首尾提示 r____rs 判定為 radars。",
    confuse: "radar 常用於 under the radar（低調不為人知）。此處指實體探測儀器複數。何時才對：The airport installed modern radar systems." },
  { n: 42, sec: "s2", tags: ["考點：sensor 感測器", "詞性需求：可數名詞 (複數)"], ans: "sensors",
    en: "The smart home system uses highly sensitive [[42|sensors]] to monitor indoor temperatures. Mr. Lin relies on these small gadgets to keep his living room comfortable.",
    zh: "智慧家庭系統使用高靈敏度的感測器來監控室內溫度。林先生依賴這些小裝置來保持客廳的舒適。",
    clue: "uses highly sensitive 後接複數名詞；智慧家居監測溫度的感測元件 (gadgets)，依首尾提示 s____rs 判定為 sensors。",
    confuse: "sense (n. 感官 / v. 感覺)。感測元件名詞為 sensor。何時才對：Motion sensors turn on the lights automatically." },
  { n: 43, sec: "s2", tags: ["考點：personnel 全體人員、職員", "詞性需求：集合名詞 (複數動詞)"], ans: "personnel",
    en: "All company [[43|personnel]] are required to attend the safety training session tomorrow. Manager Huang wants every single employee to understand the new emergency evacuation procedures.",
    zh: "公司所有人員都必須參加明天的安全培訓課程。黃經理希望每一位員工都能了解新的緊急疏散程序。",
    clue: "All company 後接集合名詞作主詞；動詞為 are，後文指 every single employee，依首尾提示 p____l 判定為 personnel。",
    confuse: "personal (adj. 個人的)。personnel 為集合名詞指全體員工，接複數動詞。何時才對：Only authorized personnel may enter." },
  { n: 44, sec: "s2", tags: ["考點：strengthen 加強、加固", "詞性需求：動詞過去式 (V-ed)"], ans: "strengthened",
    en: "The city council [[44|strengthened]] the old bridge before the upcoming typhoon season. Mayor Chen hopes these crucial repairs will prevent the structure from collapsing under heavy winds.",
    zh: "市議會在即將到來的颱風季之前加固了這座舊橋。陳市長希望這些關鍵的維修能防止建築物在強風中倒塌。",
    clue: "主詞 The city council 後接及物動詞；受詞為 the old bridge，預防颱風崩塌而修繕加固，時態為過去式，依首尾提示 s____ned 判定為 strengthened。",
    confuse: "strength (n. 力量)、strong (adj. 強壯的)。動詞字尾加 -en，過去式加 -ed。何時才對：Exercise strengthens your heart muscles." },
  { n: 45, sec: "s2", tags: ["考點：mysterious 神秘的", "詞性需求：形容詞"], ans: "mysterious",
    en: "A [[45|mysterious]] stranger left a locked wooden box on the front porch. Detective Lin spent hours trying to figure out who delivered the secret package.",
    zh: "一個神祕的陌生人在前廊留下了一個上鎖的木盒。林探長花了幾個小時試圖查明是誰送來了這個祕密包裹。",
    clue: "不定冠詞 A 與名詞 stranger 之間填形容詞；身分不明且留下上鎖秘盒，依首尾提示 m____s 判定為 mysterious。",
    confuse: "mystery (n. 謎團)。修飾名詞 stranger 填形容詞 mysterious。何時才對：A mysterious package arrived in the mail." },
  { n: 46, sec: "s2", tags: ["考點：communication 溝通、交流", "詞性需求：不可數名詞"], ans: "communication",
    en: "Effective [[46|communication]] is the key to solving conflicts within any corporate team. Alice always encourages her colleagues to share their honest thoughts and feelings openly.",
    zh: "有效的溝通是解決任何企業團隊內部衝突的關鍵。愛麗絲總是鼓勵她的同事公開分享他們真實的想法和感受。",
    clue: "形容詞 Effective 後接名詞作主詞；後文提示敞開心扉分享真實想法，依首尾提示 c____n 判定為 communication。",
    confuse: "communicate (v. 溝通)。作主詞核心詞需填名詞形式。何時才對：Good communication improves teamwork." },
  { n: 47, sec: "s2", tags: ["考點：conventional 傳統的、常規的", "詞性需求：形容詞"], ans: "conventional",
    en: "The farmer uses [[47|conventional]] farming methods rather than expensive modern technologies. Uncle Lee prefers traditional techniques that have been passed down for many generations.",
    zh: "農夫使用傳統的耕作方法，而不是昂貴的現代科技。李叔叔偏好已經傳承了許多代的傳統技術。",
    clue: "修飾名詞片語 farming methods；下文對應 traditional techniques，指代代相傳之傳統方式，依首尾提示 c____l 判定為 conventional。",
    confuse: "convention (n. 習俗/大會)。修飾名詞填形容詞 conventional。何時才對：She rejected conventional social norms." },
  { n: 48, sec: "s2", tags: ["考點：fascinating 迷人的、極有趣的", "詞性需求：形容詞"], ans: "fascinating",
    en: "The museum exhibition features a [[48|fascinating]] collection of ancient Egyptian artifacts. Professor Chang spent the entire afternoon admiring the incredibly interesting historical items on display.",
    zh: "博物館的展覽以一系列迷人的古埃及文物為特色。張教授花了整個下午欣賞展出的極其有趣的歷史物品。",
    clue: "不定冠詞 a 與名詞 collection 之間填形容詞；下文呼應 incredibly interesting，形容古文物極具魅力，依首尾提示 f____ing 判定為 fascinating。",
    confuse: "fascinate (v. 迷住)、fascinated (adj. 感到著迷的)。形容物品吸引人填 fascinating。何時才對：The documentary tells a fascinating story." },
  { n: 49, sec: "s2", tags: ["考點：generate 產生、發電", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "generates",
    en: "The new solar panel system [[49|generates]] enough electricity to power the entire building. Mr. Chen is very proud of this eco-friendly facility that produces abundant clean energy.",
    zh: "新的太陽能板系統產生足夠的電力來供應整棟大樓。陳先生非常自豪這個能產生豐富乾淨能源的環保設施。",
    clue: "主詞 The new solar panel system 為單數，後接及物動詞；後文呼應 produces abundant clean energy，現在式加 -s，依首尾提示 g____tes 判定為 generates。",
    confuse: "generation (n. 世代/產生)、generator (n. 發電機)。此處作及物述詞動詞。何時才對：Wind turbines generate clean electricity." },
  { n: 50, sec: "s2", tags: ["考點：scent 香氣、氣味", "詞性需求：可數/不可數名詞"], ans: "scent",
    en: "The sweet [[50|scent]] of fresh roses filled the beautifully decorated living room. Grandma Lin always enjoys breathing in the wonderful smell of her blooming garden.",
    zh: "新鮮玫瑰的甜美香氣充滿了裝飾美麗的客廳。林奶奶總是喜歡呼吸她盛開花園的美妙氣味。",
    clue: "形容詞 sweet 與介系詞 of 之間填名詞作主詞；下文呼應 wonderful smell，花朵散發的芳香，依首尾提示 s____t 判定為 scent。",
    confuse: "smell (泛指氣味)、scent (通常指花草或香水之清香)。何時才對：The hound followed the scent of the fox." },

  // 51 - 75
  { n: 51, sec: "s3", tags: ["考點：prompt 促使、激勵", "詞性需求：動詞過去式 (V-ed)"], ans: "prompted",
    en: "The sudden heavy rain [[51|prompted]] the organizers to cancel the outdoor concert. Manager Wu had to make the quick decision to ensure the safety of all attendees.",
    zh: "突然的傾盆大雨促使主辦單位取消了戶外演唱會。吳經理必須做出快速的決定，以確保所有參加者的安全。",
    clue: "主詞 The sudden heavy rain 後接及物動詞；句型 prompt sb. to VR，暴雨引發取消活動，時態為過去式，依首尾提示 p____ted 判定為 prompted。",
    confuse: "prompt 也可作形容詞表「迅速的」。此處為及物述詞動詞過去式。何時才對：Curiosity prompted her to investigate." },
  { n: 52, sec: "s3", tags: ["考點：nutrient 營養素", "詞性需求：可數名詞 (複數)"], ans: "nutrients",
    en: "Green leafy vegetables provide essential [[52|nutrients]] for proper brain and body development. Doctor Huang advises all her patients to consume these healthy components every day.",
    zh: "綠葉蔬菜為大腦和身體的適當發展提供必需的營養素。黃醫師建議她所有的病患每天都要攝取這些健康的成分。",
    clue: "provide essential 後接複數名詞；後文呼應 healthy components，綠色蔬菜所含的養分，依首尾提示 n____ts 判定為 nutrients。",
    confuse: "nutrition (n. 營養[不可數])、nutritious (adj. 有營養的)。具體指多種營養成分時用複數 nutrients。何時才對：Plants absorb vital nutrients from the soil." },
  { n: 53, sec: "s3", tags: ["考點：harsh 嚴酷的、惡劣的", "詞性需求：形容詞"], ans: "harsh",
    en: "The explorers faced [[53|harsh]] weather conditions during their long journey across Antarctica. Captain Smith warned everyone about the dangerously cold and unforgiving freezing winds.",
    zh: "探險家們在橫越南極洲的漫長旅程中面臨了惡劣的天氣條件。史密斯船長警告所有人要注意危險寒冷且無情的刺骨寒風。",
    clue: "修飾名詞片語 weather conditions；下文形容極地嚴寒刺骨無情之氣候，依首尾提示 h____h 判定為 harsh。",
    confuse: "harshly (adv. 嚴厲地)。修飾名詞填形容詞。何時才對：They survived the harsh winter in the mountains." },
  { n: 54, sec: "s3", tags: ["考點：essential 不可或缺的、極重要的", "詞性需求：形容詞"], ans: "essential",
    en: "Water is an [[54|essential]] element for the survival of all living creatures. Professor Wang always emphasizes how absolutely necessary this simple liquid is for biology.",
    zh: "水是所有生物生存不可或缺的元素。王教授總是強調這種簡單的液體對生物學來說是多麼絕對必要。",
    clue: "不定冠詞 an 與名詞 element 之間填形容詞；下文對應 absolutely necessary，生命生存絕對必備之要素，依首尾提示 e____l 判定為 essential。",
    confuse: "essentially (adv. 本質上)。修飾名詞 element 填形容詞。何時才對：Good sleep is essential for mental health." },
  { n: 55, sec: "s3", tags: ["考點：absorb 吸收、吸乾", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "absorbs",
    en: "The dark sponge easily [[55|absorbs]] large amounts of liquid from the kitchen counter. Mother Chen uses it to completely soak up the spilled milk in seconds.",
    zh: "深色海綿很容易從廚房流理台上吸收大量的液體。陳媽媽用它在幾秒鐘內完全吸乾灑出來的牛奶。",
    clue: "主詞 The dark sponge 為單數，副詞 easily 後接及物動詞；後文呼應 soak up，海綿吸水，現在式加 -s，依首尾提示 a____bs 判定為 absorbs。",
    confuse: "absorption (n. 吸收)。此處作及物述詞動詞現在式單數。何時才對：Towels easily absorb water." },
  { n: 56, sec: "s3", tags: ["考點：otherwise 否則", "詞性需求：轉折副詞/連接副詞"], ans: "otherwise",
    en: "You must submit the application form by Friday; [[56|otherwise]], you will lose the opportunity. Manager Lee warned the students that failing to meet the deadline would result in rejection.",
    zh: "你必須在星期五前提交申請表；否則，你將失去這個機會。李經理警告學生，未能趕上截止日期將導致被拒絕。",
    clue: "分號後引導轉折結果；未遵照期限即喪失資格的條件警告，依首尾提示 o____e 判定為 otherwise。",
    confuse: "or (對等連接詞)。分號後面單獨作轉折副詞連接兩句使用 otherwise。何時才對：Hurry up, otherwise we'll miss the train." },
  { n: 57, sec: "s3", tags: ["考點：exceed 超過、超出", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "exceeds",
    en: "The weight of this massive package clearly [[57|exceeds]] the strict airline limit. Mr. Zhang will have to pay an extra fee because his luggage is too heavy.",
    zh: "這個巨大包裹的重量明顯超過了嚴格的航空公司限制。張先生將不得不支付額外費用，因為他的行李太重了。",
    clue: "主詞 The weight 為單數第三人稱，副詞 clearly 後接動詞；行李過重超出航空規定上限，現在式加 -s，依首尾提示 e____ds 判定為 exceeds。",
    confuse: "excess (n. 過量 / adj. 過多的)。此處作及物述詞動詞。何時才對：Do not exceed the speed limit." },
  { n: 58, sec: "s3", tags: ["考點：physics 物理學", "詞性需求：不可數學科名詞"], ans: "physics",
    en: "Many high school students find [[58|physics]] to be an incredibly difficult science subject. Teacher Wu spends extra time explaining the complex laws of motion and energy.",
    zh: "許多高中生覺得物理是一門極其困難的科學科目。吳老師花了額外的時間解釋運動和能量的複雜定律。",
    clue: "find 後接名詞作受詞；下文指運動定律與能量之科學學科，依首尾提示 p____s 判定為 physics。",
    confuse: "physicist (n. 物理學家)、physical (adj. 身體的/物理的)。學科名稱固定為 physics (單數名詞)。何時才對：Quantum physics is hard to understand." },
  { n: 59, sec: "s3", tags: ["考點：behavior 行為、舉止", "詞性需求：不可數名詞"], ans: "behavior",
    en: "The sudden aggressive [[59|behavior]] of the neighborhood dog frightened the little children. Mr. Chen promised to train his pet to act much more politely in public spaces.",
    zh: "鄰居狗突然的攻擊行為嚇壞了小孩子們。陳先生承諾會訓練他的寵物在公共場所表現得更有禮貌。",
    clue: "形容詞 aggressive 後接名詞作主詞；下文提到 act much more politely，指犬隻的突發行徑，依首尾提示 b____r 判定為 behavior。",
    confuse: "behave (v. 表現舉止)。在形容詞 aggressive 後填名詞 behavior。何時才對：His bad behavior upset the teacher." },
  { n: 60, sec: "s3", tags: ["考點：recipe 食譜、烹飪配方", "詞性需求：可數名詞 (單數)"], ans: "recipe",
    en: "Grandmother passed down her secret chicken soup [[60|recipe]] to the younger family members. Jessica uses these exact instructions whenever she wants to cook a warm, traditional meal.",
    zh: "祖母將她的祕密雞湯食譜傳給了年輕的家庭成員。潔西卡每當想煮一頓溫暖的傳統餐點時，都會使用這些精確的指示。",
    clue: "chicken soup 後接名詞構成名詞詞組；祖傳煲湯的烹調烹飪步驟說明，依首尾提示 r____e 判定為 recipe。",
    confuse: "receipt (n. 收據，發音不同且字義不同)。烹調指南使用 recipe。何時才對：Do you have a good recipe for apple pie?" },
  { n: 61, sec: "s3", tags: ["考點：pasta 義大利麵食", "詞性需求：不可數名詞"], ans: "pasta",
    en: "The Italian restaurant serves incredibly delicious [[61|pasta]] with fresh tomato sauce. David always orders the spaghetti whenever he visits this charming little dining place.",
    zh: "這家義大利餐廳供應極其美味的義大利麵和新鮮番茄醬。大衛每次造訪這家迷人的小餐館時總是點義大利麵。",
    clue: "serves 後接受詞名詞，由 delicious 修飾；義式餐廳佐番茄醬之麵食，下文提及 spaghetti，依首尾提示 p____a 判定為 pasta。",
    confuse: "spaghetti 指特定直條細麵，pasta 則為義大利麵食總稱。何時才對：I love cooking fresh pasta for dinner." },
  { n: 62, sec: "s3", tags: ["考點：variation 變異、劇烈變化", "詞性需求：可數/不可數名詞"], ans: "variation",
    en: "The sudden [[62|variation]] in local temperature caused many people to catch a cold. Doctor Lee noticed that this weather change led to crowded hospital waiting rooms.",
    zh: "當地溫度的突然變化導致許多人感冒。李醫師注意到這種天氣變化導致醫院候診室擠滿了人。",
    clue: "形容詞 sudden 與介系詞 in 之間填名詞作主詞；氣溫忽冷忽熱劇變導致感冒，依首尾提示 v____n 判定為 variation。",
    confuse: "vary (v. 改變)、various (adj. 各式各樣的)。在形容詞 sudden 後填名詞 variation。何時才對：Prices are subject to seasonal variation." },
  { n: 63, sec: "s3", tags: ["考點：combination 結合、組合", "詞性需求：可數/不可數名詞"], ans: "combination",
    en: "The unique [[63|combination]] of sweet and sour flavors makes this dish extremely popular. Chef Wang perfectly mixed the ingredients to create a highly enjoyable dining experience.",
    zh: "甜與酸的獨特組合使得這道菜極受歡迎。王主廚完美地混合了這些食材，創造出高度令人愉悅的用餐體驗。",
    clue: "形容詞 unique 與介系詞 of 之間填名詞作主詞；酸甜滋味調和融匯之搭配，依首尾提示 c____n 判定為 combination。",
    confuse: "combine (v. 結合)。作主詞名詞填 combination。何時才對：A combination of factors led to his success." },
  { n: 64, sec: "s3", tags: ["考點：ultimately 最終、歸根究底", "詞性需求：副詞"], ans: "ultimately",
    en: "The hard-working student [[64|ultimately]] achieved his lifelong dream of becoming a doctor. Jason pushed through years of intense studying and finally graduated from the medical school.",
    zh: "這位努力的學生最終實現了他成為醫生的畢生夢想。傑森熬過了多年高強度的學習，終於從醫學院畢業。",
    clue: "修飾動詞 achieved；熬過多年醫學院苦讀最後如願以償，呼應下句 finally，依首尾提示 u____y 判定為副詞 ultimately。",
    confuse: "ultimate (adj. 終極的)。修飾述詞動詞填副詞形式。何時才對：The decision rests ultimately with the board." },
  { n: 65, sec: "s3", tags: ["考點：generation 世代", "詞性需求：可數名詞 (單數)"], ans: "generation",
    en: "The younger [[65|generation]] often relies heavily on smartphones for daily social interactions. Grandfather Lin finds it difficult to understand how teenagers communicate entirely through tiny screens.",
    zh: "年輕一代通常嚴重依賴智慧型手機進行日常社交互動。林爺爺覺得很難理解青少年如何完全透過小螢幕來溝通。",
    clue: "The younger 後接名詞作主詞；與祖父世代對比之年輕族群群體，依首尾提示 g____n 判定為 generation。",
    confuse: "generate (v. 產生)。指某個年齡世代群體用 generation。何時才對：This gap between generations is growing wider." },
  { n: 66, sec: "s3", tags: ["考點：deserve 應得、值得", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "deserves",
    en: "After working continuously for fourteen hours, the exhausted nurse [[66|deserves]] a long break. Supervisor Huang told her to go home immediately and get some well-earned rest.",
    zh: "連續工作了十四個小時後，筋疲力盡的護理師值得一個長假。黃主管告訴她立刻回家，獲得應得的休息。",
    clue: "主詞 the exhausted nurse 為單數第三人稱，後接動詞；超長工時後理應獲得休假，現在式加 -s，依首尾提示 d____es 判定為 deserves。",
    confuse: "deserving (adj. 值得幫助的)。此處作及物述詞動詞。何時才對：Everyone deserves a second chance." },
  { n: 67, sec: "s3", tags: ["考點：breakthrough 重大突破", "詞性需求：可數名詞 (單數)"], ans: "breakthrough",
    en: "Dr. Chen announced a major [[67|breakthrough]] in cancer research yesterday. The dedicated medical team finally discovered a new treatment after years of hard work.",
    zh: "陳博士昨天宣布了癌症研究的一項重大突破。這個專注的醫療團隊經過多年的努力，終於發現了一種新的療法。",
    clue: "announced a major 後接名詞；癌症研究多年後終於發現新療法的重大進展，依首尾提示 b____h 判定為 breakthrough。",
    confuse: "break through (動詞片語：突破)。名詞為單一複合字 breakthrough。何時才對：Scientists made a historic breakthrough in AI." },
  { n: 68, sec: "s3", tags: ["考點：laboratory 實驗室", "詞性需求：可數名詞 (單數)"], ans: "laboratory",
    en: "The university recently built a highly advanced [[68|laboratory]] for chemical experiments. Professor Lin expects the new research facility to attract many top scientists to Taiwan.",
    zh: "該大學最近為化學實驗建立了一個高度先進的實驗室。林教授期望這個新的研究設施能吸引許多頂尖科學家來到台灣。",
    clue: "不定冠詞 a 與形容詞 advanced 後接名詞；進行化學實驗的研究場所，依首尾提示 l____y 判定為 laboratory。",
    confuse: "口語常簡稱為 lab。正式學術書寫填完整名詞 laboratory。何時才對：The new vaccines were tested in the laboratory." },
  { n: 69, sec: "s3", tags: ["考點：workshop 研討會、工作坊", "詞性需求：可數名詞 (單數)"], ans: "workshop",
    en: "Manager Lee organized a practical [[69|workshop]] to improve employees' communication skills. All the participants found the intensive training session extremely helpful for their daily tasks.",
    zh: "李經理舉辦了一場實用的工作坊來提升員工的溝通技巧。所有參與者都覺得這場密集的培訓課程對他們的日常工作極有幫助。",
    clue: "organized a practical 後接名詞；提升員工溝通技巧的實務培訓課程，依首尾提示 w____p 判定為 workshop。",
    confuse: "workshop 亦可指工匠車間。指密集實務訓練專題課程時稱 training workshop。何時才對：She attended a creative writing workshop." },
  { n: 70, sec: "s3", tags: ["考點：calculation 計算結果", "詞性需求：可數名詞 (單數)"], ans: "calculation",
    en: "Engineer Wu made a precise [[70|calculation]] before building the suspension bridge. He needed to ensure the mathematical result was perfectly accurate for safety reasons.",
    zh: "吳工程師在建造吊橋前進行了精確的計算。出於安全考量，他必須確保數學結果完全準確。",
    clue: "made a precise 後接名詞；下文提示確保 mathematical result 完全精確，依首尾提示 c____n 判定為 calculation。",
    confuse: "calculate (v. 計算)、calculator (n. 計算機)。名詞填 calculation。何時才對：According to my calculations, we have enough fuel." },
  { n: 71, sec: "s3", tags: ["考點：envision 設想、構想預見", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "envisions",
    en: "Mayor Chen boldly [[71|envisions]] a city fully powered by renewable energy. He imagines a green and sustainable future for all the local residents.",
    zh: "陳市長大膽地設想了一個完全由再生能源供電的城市。他為所有當地居民想像了一個綠色且永續的未來。",
    clue: "主詞 Mayor Chen 為單數第三人稱，副詞 boldly 後接及物動詞；後文呼應 imagines a green future，現在式加 -s，依首尾提示 e____ns 判定為 envisions。",
    confuse: "vision (n. 願景)。動詞為 envision (或 envisage)。何時才對：She envisions a world free of poverty." },
  { n: 72, sec: "s3", tags: ["考點：striking 醒目的、驚人的", "詞性需求：形容詞"], ans: "striking",
    en: "There is a [[72|striking]] resemblance between the famous actor and his younger brother. Director Huang immediately noticed how remarkably similar they looked in the audition.",
    zh: "這位著名男演員和他的弟弟之間有著驚人的相似之處。黃導演在試鏡時立刻注意到他們長得極其相似。",
    clue: "冠詞 a 與名詞 resemblance 之間填形容詞；下文對應 remarkably similar，指兄弟長相極度神似，依首尾提示 s____king 判定為 striking。",
    confuse: "strike (v. 打擊/罷工)。固定片語 a striking resemblance 指神似。何時才對：The building features a striking modern design." },
  { n: 73, sec: "s3", tags: ["考點：insight 洞察力、深刻見解", "詞性需求：不可數/可數名詞"], ans: "insight",
    en: "The experienced consultant provided valuable [[73|insight]] into the changing consumer market. Manager Zhao appreciated this deep understanding of the current economic trends.",
    zh: "這位經驗豐富的顧問對不斷變化的消費市場提供了寶貴的見解。趙經理很感激對當前經濟趨勢的深刻理解。",
    clue: "provided valuable 後接名詞；搭配介系詞 into，後文呼應 deep understanding，依首尾提示 i____t 判定為 insight。",
    confuse: "insightful (adj. 富有洞察力的)。作動詞受詞填名詞 insight。何時才對：The book offers deep insight into human nature." },
  { n: 74, sec: "s3", tags: ["考點：formula 配方、公式", "詞性需求：可數名詞 (單數)"], ans: "formula",
    en: "The secret [[74|formula]] for this popular soda has been protected for over a century. Mr. Chang refuses to reveal the exact recipe that makes the drink so delicious.",
    zh: "這款受歡迎汽水的秘密配方已經被保護了一個多世紀。張先生拒絕透露讓這款飲料如此美味的確切配方。",
    clue: "形容詞 secret 後接名詞作主詞；後文對應 exact recipe，保密百年的汽水調配配方，依首尾提示 f____a 判定為 formula。",
    confuse: "formula 可指數學公式亦可指商業配方。複數為 formulas 或 formulae。何時才對：The company guards its secret formula carefully." },
  { n: 75, sec: "s3", tags: ["考點：equation 數學等式、方程式", "詞性需求：可數名詞 (單數)"], ans: "equation",
    en: "Finding the value of the unknown variable in this [[75|equation]] is quite challenging. Student Lin spent thirty minutes solving the difficult math problem.",
    zh: "在這個方程式中找出未知變數的值是相當具挑戰性的。林同學花了三十分鐘解決這個困難的數學問題。",
    clue: "指示代名詞 this 後接單數名詞；求未知數 (unknown variable) 之數學難題，依首尾提示 e____n 判定為 equation。",
    confuse: "equate (v. 視為等同)、equality (n. 平等)。數學方程式為 equation。何時才對：Can you solve this linear equation?" },

  // 76 - 100
  { n: 76, sec: "s4", tags: ["考點：orbit 環繞軌道運行", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "orbits",
    en: "The communications satellite continuously [[76|orbits]] the Earth at a very high speed. Engineer Chen monitors its circular path every single day to ensure stable signals.",
    zh: "通訊衛星持續以極高的速度環繞地球運行。陳工程師每天監控其圓形軌道以確保訊號穩定。",
    clue: "主詞 The communications satellite 為單數第三人稱，副詞 continuously 後接及物動詞；衛星繞行地球運轉，現在式加 -s，依首尾提示 o____ts 判定為 orbits。",
    confuse: "orbit 也可作名詞 (in orbit)。此處為及物述詞動詞。何時才對：The Moon orbits the Earth once a month." },
  { n: 77, sec: "s4", tags: ["考點：abstract 抽象的", "詞性需求：形容詞"], ans: "abstract",
    en: "The contemporary art museum features many [[77|abstract]] paintings by local artists. Viewers like Mrs. Wang often find it difficult to understand these non-realistic artworks.",
    zh: "當代藝術博物館展出許多當地藝術家的抽象畫。像王太太這樣的觀眾通常覺得很難理解這些非寫實的藝術品。",
    clue: "修飾名詞 paintings；下文對應 non-realistic（非具象寫實的），指抽象藝術畫作，依首尾提示 a____t 判定為 abstract。",
    confuse: "abstract 亦可指論文摘要。修飾畫作表非具象時填形容詞 abstract。何時才對：Abstract art does not attempt to depict reality." },
  { n: 78, sec: "s4", tags: ["考點：contribution 貢獻、捐獻", "詞性需求：可數名詞 (單數)"], ans: "contribution",
    en: "The wealthy businessman made a significant [[78|contribution]] to the local orphanage. Director Lin deeply appreciated this generous donation to help the poor children.",
    zh: "這位富有的商人對當地孤兒院做出了重大貢獻。林主任深深感激這筆幫助貧困兒童的慷慨捐款。",
    clue: "made a significant 後接名詞；搭配介系詞 to，後文對應 generous donation，依首尾提示 c____n 判定為 contribution。",
    confuse: "contribute (v. 貢獻捐贈)。片語 make a contribution to...（對……做出貢獻）。何時才對：He made outstanding contributions to science." },
  { n: 79, sec: "s4", tags: ["考點：forge 締造、建立合作", "詞性需求：動詞過去式 (V-ed)"], ans: "forged",
    en: "The two rival tech companies [[79|forged]] a strong partnership to develop new software. CEO Chen believed that building this alliance would greatly benefit both organizations.",
    zh: "兩家競爭的科技公司建立了強大的合作夥伴關係以開發新軟體。陳執行長相信建立這個聯盟將使雙方組織都大受裨益。",
    clue: "主詞 The two rival tech companies 後接及物動詞；受詞為 a strong partnership，下文對應 building this alliance，時態為過去式，依首尾提示 f____ged 判定為 forged。",
    confuse: "forge 原意為鍛造，引申為締造關係 (forge a partnership)，亦可指偽造 (forge a signature)。何時才對：The treaty forged a lasting peace." },
  { n: 80, sec: "s4", tags: ["考點：grip 緊抓、握力", "詞性需求：可數名詞 (單數)"], ans: "grip",
    en: "The mountain climber maintained a tight [[80|grip]] on the wet and slippery rock. John knew that losing his firm hold could lead to a very dangerous fall.",
    zh: "登山者緊緊抓著濕滑的岩石。約翰知道失去穩固的抓地力可能會導致非常危險的墜落。",
    clue: "maintained a tight 後接名詞；搭配介系詞 on，後文呼應 firm hold，攀岩牢牢抓緊岩壁，依首尾提示 g____p 判定為 grip。",
    confuse: "grip 亦可作動詞抓緊。名詞片語 keep/maintain a tight grip on 指緊緊握牢。何時才對：Keep a firm grip on the handlebars." },
  { n: 81, sec: "s4", tags: ["考點：adjustment 調整、微幅修改", "詞性需求：可數名詞 (單數)"], ans: "adjustment",
    en: "The tailor made a slight [[81|adjustment]] to the waistline of the wedding dress. Mary requested this minor alteration to ensure the gown fit her perfectly.",
    zh: "裁縫對婚紗的腰線做了輕微的調整。瑪麗要求這項小幅修改，以確保禮服完美合身。",
    clue: "made a slight 後接名詞；後文對應 minor alteration，指婚紗腰圍之尺寸微調，依首尾提示 a____t 判定為 adjustment。",
    confuse: "adjust (v. 調整)。動詞 make 後接名詞受詞 adjustment。何時才對：A slight adjustment to the mirrors will give better view." },
  { n: 82, sec: "s4", tags: ["考點：adjust 調節、自動調整", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "adjusts",
    en: "The smart thermostat automatically [[82|adjusts]] the room temperature based on the weather outside. Father Lin loves how the device regulates the cold air without manual control.",
    zh: "智慧恆溫器會根據室外天氣自動調整室內溫度。林爸爸很喜歡這個設備無需手動控制就能調節冷氣的方式。",
    clue: "主詞 The smart thermostat 為單數第三人稱，副詞 automatically 後接動詞；自動調節室溫，現在式加 -s，依首尾提示 a____ts 判定為 adjusts。",
    confuse: "adjustable (adj. 可調節的)。此處作述詞動詞現在式單數。何時才對：The seat easily adjusts to fit drivers of all heights." },
  { n: 83, sec: "s4", tags: ["考點：strain 使勞損、過度消耗疲勞", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "strains",
    en: "Reading small text in the dark severely [[83|strains]] your sensitive eyes. Doctor Wu always warns his patients that doing so can damage their vision over time.",
    zh: "在黑暗中閱讀小文字會嚴重讓你不適的眼睛感到疲勞。吳醫師總是警告他的病人，這樣做久了會損害他們的視力。",
    clue: "動名詞片語 Reading... 作單數主詞，副詞 severely 後接及物動詞；暗處閱讀導致眼睛疲累受損，現在式加 -s，依首尾提示 s____ns 判定為 strains。",
    confuse: "strain 也可作名詞 (壓力負擔)。此處作及物述詞動詞。何時才對：Lifting heavy boxes strains your back muscles." },
  { n: 84, sec: "s4", tags: ["考點：flexible 柔軟的、有彈性的", "詞性需求：形容詞"], ans: "flexible",
    en: "The yoga instructor has a highly [[84|flexible]] body due to years of daily practice. Miss Chen can easily bend and stretch her limbs into incredibly difficult poses.",
    zh: "由於多年的日常練習，這位瑜珈教練擁有高度柔軟的身體。陳小姐可以輕鬆地將她的四肢彎曲和伸展成極度困難的姿勢。",
    clue: "副詞 highly 修飾後方形容詞；修飾名詞 body，瑜珈教練肢體能輕鬆伸展折彎，依首尾提示 f____e 判定為 flexible。",
    confuse: "flexibility (n. 柔軟度)。修飾名詞填形容詞 flexible。何時才對：Dancers need strong and flexible muscles." },
  { n: 85, sec: "s4", tags: ["考點：loosen 放鬆、鬆開", "詞性需求：動詞過去式 (V-ed)"], ans: "loosened",
    en: "The tired businessman quickly [[85|loosened]] his tight tie after leaving the office. Mr. Wang felt much more comfortable once the pressure around his neck was gone.",
    zh: "疲倦的商人在離開辦公室後迅速鬆開了他緊繃的領帶。一旦脖子周圍的壓力消失，王先生覺得舒服多了。",
    clue: "主詞 The tired businessman 與副詞 quickly 後接及物動詞；受詞為 his tight tie，下班鬆解緊繃領帶，時態為過去式，依首尾提示 l____ned 判定為 loosened。",
    confuse: "loose (adj. 鬆的)。動詞加上 -en，過去式填 loosened。何時才對：He loosened his collar to breathe better." },
  { n: 86, sec: "s4", tags: ["考點：slightly 稍微、略微地", "詞性需求：副詞"], ans: "slightly",
    en: "The new smartphone model is [[86|slightly]] thinner than the previous version. Customer Lin barely noticed the minor difference in thickness when holding both devices.",
    zh: "新款智慧型手機型號比先前的版本稍微薄一點。林顧客在拿著兩款設備時，幾乎沒有注意到厚度上細微的差異。",
    clue: "修飾比較級形容詞 thinner；後文對應 minor difference，指厚度僅有些微差距，依首尾提示 s____y 判定為副詞 slightly。",
    confuse: "slight (adj. 輕微的)。修飾比較級形容詞需用副詞。何時才對：Her condition is slightly better today." },
  { n: 87, sec: "s4", tags: ["考點：demonstrate 演示、示範說明", "詞性需求：動詞第三人稱單數 (V-s)"], ans: "demonstrates",
    en: "The science teacher constantly [[87|demonstrates]] exciting chemical reactions in front of the classroom. Mr. Yang loves to show his curious students exactly how these experiments work.",
    zh: "自然老師經常在教室前面示範令人興奮的化學反應。楊老師喜歡向他充滿好奇心的學生展示這些實驗確切的運作方式。",
    clue: "主詞 The science teacher 為單數第三人稱，副詞 constantly 後接動詞；後文對應 show students how experiments work，現在式加 -s，依首尾提示 d____es 判定為 demonstrates。",
    confuse: "demonstration (n. 示範/遊行示威)。此處為及物述詞動詞單數。何時才對：The chef demonstrated how to fillet the fish." },
  { n: 88, sec: "s4", tags: ["考點：beloved 深愛的、心愛的", "詞性需求：形容詞"], ans: "beloved",
    en: "The famous author dedicated his final novel to his [[88|beloved]] wife. Mr. Chang wanted to show how much he deeply cherished and adored her.",
    zh: "這位著名作家將他最後的一本小說獻給他深愛的妻子。張先生想表達他有多麼深深地珍視和愛慕她。",
    clue: "所有格 his 後接形容詞修飾名詞 wife；下文提到 deeply cherished and adored（深愛與珍視），依首尾提示 b____ved 判定為 beloved。",
    confuse: "beloved 重音可讀 /bɪˈlʌvɪd/。修飾親密家人配偶作形容詞。何時才對：He returned to his beloved hometown." },
  { n: 89, sec: "s4", tags: ["考點：highlight 精華片段、亮點", "詞性需求：可數名詞 (複數)"], ans: "highlights",
    en: "The evening news broadcast showed the amazing [[89|highlights]] of the championship baseball game. David enjoyed watching those most exciting and memorable moments over and over again.",
    zh: "晚間新聞廣播播出了冠軍棒球賽精彩的精華片段。大衛喜歡一遍又一遍地觀看那些最令人興奮和難忘的時刻。",
    clue: "showed the amazing 後接名詞；後文對應 most exciting and memorable moments，指賽事高光集錦，依首尾提示 h____ts 判定為 highlights。",
    confuse: "highlight 亦可作動詞強調。指球賽精彩畫面時用複數名詞 highlights。何時才對：Here are the highlights of today's sports news." },
  { n: 90, sec: "s4", tags: ["考點：performer 表演者、街頭藝人", "詞性需求：可數名詞 (單數指人)"], ans: "performer",
    en: "The street [[90|performer]] played a beautiful melody on his acoustic guitar. Many pedestrians stopped to listen to the talented musician play near the subway station.",
    zh: "街頭表演者用他的木吉他彈奏出美麗的旋律。許多行人停下來聆聽這位才華洋溢的音樂家在地鐵站附近的演奏。",
    clue: "The street 後接名詞作主詞；後文對應 talented musician，指地鐵站彈吉他的藝人，依首尾提示 p____r 判定為 performer。",
    confuse: "performance (n. 演出表演)。指演出的人使用 performer。何時才對：Circus performers practiced their acrobatic stunts." },
  { n: 91, sec: "s4", tags: ["考點：compelling 令人信服的、引人入勝的", "詞性需求：形容詞"], ans: "compelling",
    en: "The clever lawyer presented a highly [[91|compelling]] argument to the jury. Attorney Chen provided such convincing evidence that everyone believed his client was innocent.",
    zh: "聰明的律師向陪審團提出了極具說服力的論點。陳律師提供了如此令人信服的證據，以至於每個人都相信他的委託人是無辜的。",
    clue: "副詞 highly 修飾後方形容詞；修飾名詞 argument，後文對應 convincing evidence，使陪審團信服，依首尾提示 c____ling 判定為 compelling。",
    confuse: "compel (v. 強迫)。形容論點極具說服力填 compelling。何時才對：The novel tells a deeply compelling story." },
  { n: 92, sec: "s4", tags: ["考點：luxury 奢華、奢侈的", "詞性需求：名詞作修飾語/不可數名詞"], ans: "luxury",
    en: "The wealthy celebrity purchased a beautiful [[92|luxury]] yacht for his summer vacation. Mr. Wang enjoys spending his money on expensive and high-end items.",
    zh: "這位富有的名人為他的暑假買了一艘美麗的豪華遊艇。王先生喜歡把錢花在昂貴且高檔的物品上。",
    clue: "修飾名詞 yacht 構成名詞詞組；下文對應 expensive and high-end items，豪華遊艇，依首尾提示 l____y 判定為 luxury。",
    confuse: "luxurious (adj. 奢華的)。名詞 luxury 亦可直接作名詞修飾語 (luxury goods/car/yacht)。何時才對：They stayed at a luxury hotel in Paris." },
  { n: 93, sec: "s4", tags: ["考點：elaborately 精心細緻地、繁複地", "詞性需求：副詞"], ans: "elaborately",
    en: "The grand ballroom was [[93|elaborately]] decorated with crystal chandeliers and fresh roses. Manager Huang spent a huge budget making the venue look incredibly detailed and fancy.",
    zh: "宏偉的宴會廳裡精心裝飾著水晶吊燈和新鮮的玫瑰。黃經理花了龐大的預算讓場地看起來無比精緻華麗。",
    clue: "修飾過去分詞 decorated；後文對應 incredibly detailed and fancy，指宴會廳裝潢無比考究，依首尾提示 e____y 判定為副詞 elaborately。",
    confuse: "elaborate (adj. 精巧的)。修飾被動分詞 decorated 需加 -ly。何時才對：The cake was elaborately decorated with sugar flowers." },
  { n: 94, sec: "s4", tags: ["考點：surroundings 周圍環境", "詞性需求：名詞 (恆用複數)"], ans: "surroundings",
    en: "The frightened stray cat carefully observed its unfamiliar [[94|surroundings]] before stepping out of the alley. The poor animal needed to make sure the new environment was safe from danger.",
    zh: "受驚的流浪貓在走出巷子前，仔細觀察了牠不熟悉的周圍環境。這隻可憐的動物需要確保新環境安全無虞。",
    clue: "所有格 its 與形容詞 unfamiliar 後接名詞；後文對應 the new environment，指身處的周遭環境，依首尾提示 s____gs 判定為 surroundings。",
    confuse: "surround (v. 包圍)、surrounding (adj. 周遭的)。指環境名詞時恆用複數形 surroundings。何時才對：The hotel has peaceful rural surroundings." },
  { n: 95, sec: "s4", tags: ["考點：imaginative 富有想像力的", "詞性需求：形容詞"], ans: "imaginative",
    en: "The [[95|imaginative]] child built an entire castle using only cardboard boxes and tape. Mother Chen was amazed by her son's creative and original ideas.",
    zh: "這個充滿想像力的孩子只用厚紙箱和膠帶就建了一整座城堡。陳媽媽對兒子充滿創意和原創的想法感到驚訝。",
    clue: "定冠詞 The 與名詞 child 之間填形容詞；下文對應 creative and original ideas，用紙箱蓋城堡展現豐富想像力，依首尾提示 i____e 判定為 imaginative。",
    confuse: "imaginary (adj. 虛構的)、imaginable (adj. 想像得到的)。指人充滿想像力用 imaginative。何時才對：An imaginative writer creates captivating worlds." },
  { n: 96, sec: "s4", tags: ["考點：artistic 藝術的、富有美感的", "詞性需求：形容詞"], ans: "artistic",
    en: "The talented student displayed great [[96|artistic]] skills during the annual painting competition. Teacher Lin praised her beautiful use of colors and creative expression.",
    zh: "這位才華洋溢的學生在年度繪畫比賽中展現了出色的藝術技巧。林老師稱讚她對色彩的美麗運用和創意表達。",
    clue: "修飾名詞 skills；繪畫比賽展現的美感與色彩技巧，依首尾提示 a____c 判定為 artistic。",
    confuse: "art (n. 藝術)、artist (n. 藝術家)。修飾名詞 skills 填形容詞 artistic。何時才對：She possesses great artistic talent." },
  { n: 97, sec: "s4", tags: ["考點：atmosphere 氣氛、氛圍", "詞性需求：可數名詞 (單數)"], ans: "atmosphere",
    en: "The romantic restaurant provides a quiet and intimate [[97|atmosphere]] for couples. Mr. Zhao loves taking his wife there because the mood is always incredibly relaxing.",
    zh: "這家浪漫的餐廳為情侶提供了一個安靜且私密的氛圍。趙先生喜歡帶他妻子去那裡，因為氣氛總是極度令人放鬆。",
    clue: "冠詞 an 與形容詞 quiet and intimate 後接名詞；後文對應 the mood，餐廳營造出的浪漫情調氣氛，依首尾提示 a____e 判定為 atmosphere。",
    confuse: "atmosphere 亦可指地球大氣層。指空間情調氛圍時可數。何時才對：The old pub has a friendly atmosphere." },
  { n: 98, sec: "s4", tags: ["考點：gallery 藝廊、美術館", "詞性需求：可數名詞 (單數)"], ans: "gallery",
    en: "The famous photographer displayed his latest landscape pictures in the local downtown [[98|gallery]]. Curator Huang invited art collectors to view the stunning exhibition yesterday evening.",
    zh: "這位著名的攝影師在當地市中心的畫廊展示了他最新的風景照片。黃館長昨天傍晚邀請了藝術收藏家來參觀這場令人驚嘆的展覽。",
    clue: "修飾名詞詞組 the local downtown 後接名詞；攝影師展出風景照、策展人接待藏家的藝術展覽館，依首尾提示 g____y 判定為 gallery。",
    confuse: "museum (博物館)。專門展示藝術品、畫作或攝影之藝廊場所為 gallery。何時才對：The gallery is showing works by young artists." },
  { n: 99, sec: "s4", tags: ["考點：architecture 建築風格、建築構造", "詞性需求：不可數名詞"], ans: "architecture",
    en: "The ancient temple is a perfect example of traditional Chinese [[99|architecture]]. Professor Chang always brings his students here to study the unique building design.",
    zh: "這座古廟是中國傳統建築的完美典範。張教授總是帶他的學生來這裡研究這獨特的建築設計。",
    clue: "修飾語 traditional Chinese 後接不可數名詞；後文對應 unique building design，古廟建築樣式，依首尾提示 a____e 判定為 architecture。",
    confuse: "architect (n. 建築師)。指建築總體風格與建造藝術填 architecture。何時才對：Modern architecture uses a lot of glass." },
  { n: 100, sec: "s4", tags: ["考點：professional 專業的", "詞性需求：形容詞"], ans: "professional",
    en: "The company hired a [[100|professional]] photographer to take pictures for their new marketing campaign. Manager Wu wanted an experienced expert who could deliver high-quality images.",
    zh: "公司聘請了一位專業攝影師為他們的新行銷活動拍照。吳經理需要一位能提供高品質影像的經驗豐富專家。",
    clue: "不定冠詞 a 與名詞 photographer 之間填形容詞；後文對應 experienced expert，指具專業水準的行家，依首尾提示 p____l 判定為 professional。",
    confuse: "profession (n. 職業)、professionally (adv. 專業地)。修飾名詞填形容詞。何時才對：Always maintain a professional attitude at work." },

  // 101 - 127
  { n: 101, sec: "s5", tags: ["考點：coincidence 巧合", "詞性需求：可數名詞 (單數)"], ans: "coincidence",
    en: "It was a pure [[101|coincidence]] that Manager Lin and his brother wore the exact same tie today. The two men had not planned their matching outfits beforehand.",
    zh: "林經理和他的兄弟今天戴了完全相同的領帶，這純粹是巧合。這兩個男人事先並沒有計畫要穿搭相配的服裝。",
    clue: "It was a pure 後接名詞作真主詞；事前未商量卻穿戴完全一樣，純屬不謀而合之巧合，依首尾提示 c____e 判定為 coincidence。",
    confuse: "coincidental (adj. 巧合的)。在 a pure 後填名詞 coincidence。何時才對：By sheer coincidence, we met at the airport." },
  { n: 102, sec: "s5", tags: ["考點：invade 武力入侵、侵略", "詞性需求：原形動詞 (VR)"], ans: "invade",
    en: "The aggressive army decided to [[102|invade]] the neighboring country during the harsh winter. General Wang ordered his troops to cross the northern border at midnight.",
    zh: "具侵略性的軍隊決定在嚴冬期間入侵鄰國。王將軍命令他的部隊在午夜越過北部邊界。",
    clue: "decided to 後接原形動詞；軍隊跨越邊界攻擊鄰邦，依首尾提示 i____e 判定為 invade。",
    confuse: "invasion (n. 侵略)、invader (n. 入侵者)。decided to 後接動詞原形。何時才對：Troops invaded the border town at dawn." },
  { n: 103, sec: "s5", tags: ["考點：overthrow 推翻政權", "詞性需求：原形動詞 (VR)"], ans: "overthrow",
    en: "The angry citizens planned to [[103|overthrow]] the corrupt government after weeks of protests. Leader Chen organized a massive strike to bring down the current president.",
    zh: "憤怒的市民計畫在數週的抗議後推翻腐敗的政府。陳領袖組織了一場大規模罷工，以拉下現任總統。",
    clue: "planned to 後接原形動詞；後文對應 bring down the current president，推翻腐敗政府，依首尾提示 o____w 判定為 overthrow。",
    confuse: "overthrow 過去式為 overthrew，過去分詞為 overthrown。此處不定詞 to 後接動詞原形。何時才對：Rebels plotted to overthrow the dictator." },
  { n: 104, sec: "s5", tags: ["考點：rigid 死板的、嚴苛僵化的", "詞性需求：形容詞"], ans: "rigid",
    en: "The strict school maintains a very [[104|rigid]] schedule for all its boarding students. Principal Wu does not allow any changes to the daily timetable.",
    zh: "這所嚴格的學校為所有住宿生維持著非常死板的時間表。吳校長不允許對每日作息表做任何更改。",
    clue: "副詞 very 修飾後方形容詞；修飾名詞 schedule，校規嚴苛不容任何行程變動，依首尾提示 r____d 判定為 rigid。",
    confuse: "rigidity (n. 僵化刻板)。修飾名詞 schedule 填形容詞 rigid。何時才對：The rules are too rigid and need reform." },
  { n: 105, sec: "s5", tags: ["考點：labor 體力勞動、勞役", "詞性需求：不可數名詞"], ans: "labor",
    en: "The heavy construction requires an incredible amount of physical [[105|labor]] from the workers. Foreman Zhang hired fifty strong men to lift the massive steel beams.",
    zh: "這項繁重的建築工程需要工人付出驚人的體力勞動。張工頭雇用了五十名強壯的男子來搬運巨大的鋼樑。",
    clue: "形容詞 physical 後接名詞；建築工地搬運鋼樑付出之繁重體力，片語 physical labor，依首尾提示 l____r 判定為 labor。",
    confuse: "laborer (n. 勞工)。指勞動本身使用不可數名詞 labor。何時才對：Manual labor can be exhausting." },
  { n: 106, sec: "s5", tags: ["考點：peasant 貧農、小農", "詞性需求：可數名詞 (單數指人)"], ans: "peasant",
    en: "The humble [[106|peasant]] grew wheat and vegetables on a small plot of land. Farmer Wang lived a simple agricultural life without any modern luxuries.",
    zh: "這位謙卑的農民在一小塊土地上種植小麥和蔬菜。王農夫過著沒有任何現代奢侈品的簡單農業生活。",
    clue: "定冠詞 The 與形容詞 humble 後接單數名詞作主詞；下文對應 Farmer Wang，指在簡樸小塊農地上耕作的佃農小民，依首尾提示 p____t 判定為 peasant。",
    confuse: "farmer (泛指農夫)。peasant 多指傳統農業社會中的基層貧農。何時才對：Peasants worked the land for the landlord." },
  { n: 107, sec: "s5", tags: ["考點：noble 貴族成員", "詞性需求：可數名詞 (單數指人)"], ans: "noble",
    en: "The generous [[107|noble]] donated half of his fortune to build a new hospital. Lord Chang believed that helping the poor was his highest duty.",
    zh: "這位慷慨的貴族捐出了他一半的財產來建造一家新醫院。張爵士認為幫助窮人是他最高的職責。",
    clue: "定冠詞 The 與形容詞 generous 後接名詞指人作主詞；下文對應 Lord Chang（貴族領主），捐贈家產濟貧，依首尾提示 n____e 判定為 noble。",
    confuse: "noble 亦可作形容詞指「高尚的、貴族的」；作可數名詞表貴族成員 (nobleman)。何時才對：The king rewarded the loyal noble with land." },
  { n: 108, sec: "s5", tags: ["考點：encounter 偶遇、遭遇", "詞性需求：動詞原形 (現在式複數)"], ans: "encounter",
    en: "Hikers often [[108|encounter]] dangerous wild animals in this remote mountain area. Guide Wu always carries bear spray to protect his tourist groups.",
    zh: "登山客經常在這個偏遠的山區遭遇危險的野生動物。吳導遊總是隨身攜帶防熊噴霧以保護他的旅遊團。",
    clue: "主詞 Hikers 為複數，副詞 often 後接及物動詞；後有受詞 dangerous wild animals，登山途中意外遇見猛獸，依首尾提示 e____r 判定為 encounter。",
    confuse: "encounter 亦可作名詞 (a dangerous encounter)。此處為及物述詞動詞。何時才對：We may encounter unexpected difficulties." },
  { n: 109, sec: "s5", tags: ["考點：feast 盛宴、宴席", "詞性需求：可數名詞 (單數)"], ans: "feast",
    en: "The grand [[109|feast]] included roasted pork, fresh seafood, and sweet desserts. Chef Liu prepared this amazing banquet to celebrate the glorious victory.",
    zh: "這場盛大的宴會包括了烤豬肉、新鮮海鮮和甜點。劉主廚準備了這場令人驚嘆的盛宴來慶祝光榮的勝利。",
    clue: "定冠詞 The 與形容詞 grand 後接名詞作主詞；後文對應 banquet，備有烤豬海鮮美饌慶功的宴席，依首尾提示 f____t 判定為 feast。",
    confuse: "feast 也可作動詞大吃大喝 (feast on...)。此處為名詞受詞。何時才對：The wedding feast lasted until midnight." },
  { n: 110, sec: "s5", tags: ["考點：merge 合併、整合", "詞性需求：原形動詞 (VR)"], ans: "merge",
    en: "The two small tech companies decided to [[110|merge]] into one large corporation. CEO Wang believes this combination will significantly increase their market share.",
    zh: "兩家小型科技公司決定合併成一家大企業。王執行長相信這種結合將會顯著增加他們的市佔率。",
    clue: "decided to 後接原形動詞；搭配介系詞 into，兩家小公司併為大集團，依首尾提示 m____e 判定為 merge。",
    confuse: "merger (n. 企業合併)。decide to 後接動詞原形。何時才對：The two banks announced plans to merge." },
  { n: 111, sec: "s5", tags: ["考點：distinct 明顯的、截然不同的", "詞性需求：形容詞"], ans: "distinct",
    en: "The beautiful bird has a very [[111|distinct]] red mark on its chest. Photographer Lin easily identified the rare species among the other flying creatures.",
    zh: "這隻美麗的鳥胸前有一個非常明顯的紅色印記。林攝影師很容易就能在其他飛行生物中辨認出這個稀有物種。",
    clue: "副詞 very 修飾後方形容詞；修飾名詞 mark，鳥類胸口有清晰好認的特徵印記，依首尾提示 d____t 判定為 distinct。",
    confuse: "distinction (n. 差別特徵)、distinctive (adj. 獨特的)。修飾名詞表外觀顯著清晰時用 distinct。何時才對：There is a distinct smell of gas." },
  { n: 112, sec: "s5", tags: ["考點：endure 忍耐、咬牙撐過", "詞性需求：原形動詞 (VR)"], ans: "endure",
    en: "The marathon runners must [[112|endure]] extreme physical exhaustion to finish the race. Coach Yang trains his athletes to push through the intense muscle pain.",
    zh: "馬拉松跑者必須忍受極度的體力透支才能完成比賽。楊教練訓練他的運動員熬過強烈的肌肉疼痛。",
    clue: "情態助動詞 must 後接原形動詞；跑者必須克服極端體力透支與肌肉酸痛完成賽事，依首尾提示 e____e 判定為 endure。",
    confuse: "endurable (adj. 可忍受的)。助動詞 must 後接動詞原形。何時才對：He endured months of tough military training." },
  { n: 113, sec: "s5", tags: ["考點：reminder 提醒物、提示鈴聲", "詞性需求：可數名詞 (單數)"], ans: "reminder",
    en: "The loud [[113|reminder]] on my phone woke me up for the morning meeting. Secretary Lin set this alarm to ensure I would never be late.",
    zh: "我手機上大聲的提醒鈴聲把我叫醒去參加早會。林秘書設定了這個鬧鐘以確保我絕不會遲到。",
    clue: "The loud 後接名詞作主詞；後文對應 set this alarm，手機設定的叫醒提示訊息，依首尾提示 r____r 判定為 reminder。",
    confuse: "remind (v. 提醒)。名詞形式為 reminder。何時才對：This photo serves as a constant reminder of our trip." },
  { n: 114, sec: "s5", tags: ["考點：presentation 簡報演說", "詞性需求：可數名詞 (單數)"], ans: "presentation",
    en: "The nervous student delivered a perfect [[114|presentation]] about global warming yesterday. Classmate Wu praised her clear slides and confident speaking style.",
    zh: "緊張的學生昨天發表了一場關於全球暖化的完美簡報。吳同學稱讚了她清晰的投影片和自信的演說風格。",
    clue: "delivered a perfect 後接名詞；片語 deliver a presentation（發表簡報），下文提及清晰投影片，依首尾提示 p____n 判定為 presentation。",
    confuse: "present (v. 呈獻發表)、presenter (n. 主持人/講者)。名詞填 presentation。何時才對：She gave an impressive sales presentation." },
  { n: 115, sec: "s5", tags: ["考點：boost 提振、提升促進", "詞性需求：原形動詞 (VR)"], ans: "boost",
    en: "The new advertising campaign will definitely [[115|boost]] our monthly sales figures. Manager Huang believes the creative posters can attract far more teenage customers.",
    zh: "新的廣告活動肯定會提升我們每月的銷售數字。黃經理相信這些有創意的海報能吸引多得多的青少年顧客。",
    clue: "助動詞 will 與副詞 definitely 後接原形動詞；廣告推廣促進月營業額成長，依首尾提示 b____t 判定為 boost。",
    confuse: "boost 亦可作名詞 (a big boost)。此處作述詞及物動詞。何時才對：The tax cuts gave a boost to the economy." },
  { n: 116, sec: "s5", tags: ["考點：accomplish 圓滿完成、達成", "詞性需求：動詞過去式 (V-ed)"], ans: "accomplished",
    en: "The dedicated team perfectly [[116|accomplished]] all their project goals ahead of schedule. Director Chen rewarded everyone with a large bonus for their impressive success.",
    zh: "這個盡責的團隊在進度前完美達成了他們所有的專案目標。陳總監用大筆獎金獎勵了每個人，以表彰他們令人印象深刻的成功。",
    clue: "主詞 The dedicated team 與副詞 perfectly 後接動詞；受詞為 all their project goals，超前達標，時態為過去式，依首尾提示 a____hed 判定為 accomplished。",
    confuse: "accomplished 亦可作形容詞表「有造詣的」。此處作及物述詞動詞過去式。何時才對：She accomplished her mission successfully." },
  { n: 117, sec: "s5", tags: ["考點：purchase 購買", "詞性需求：原形動詞 (VR)"], ans: "purchase",
    en: "The wealthy customer decided to [[117|purchase]] the luxurious sports car immediately. Salesman Lin happily prepared the official documents for this expensive transaction.",
    zh: "這位富有的顧客決定立刻購買這輛豪華跑車。林業務員開心地為這筆昂貴的交易準備了正式文件。",
    clue: "decided to 後接原形動詞；受詞為 the luxurious sports car，富豪簽約買下跑車，依首尾提示 p____e 判定為 purchase。",
    confuse: "purchase 為較正式之「購買」，等同於 buy。何時才對：You can purchase tickets online in advance." },
  { n: 118, sec: "s5", tags: ["考點：trigger 引發、觸發", "詞性需求：原形動詞 (VR)"], ans: "trigger",
    en: "The loud fireworks could easily [[118|trigger]] an anxiety attack for the rescue dog. Owner Wang keeps the poor animal in a quiet room during the festival.",
    zh: "大聲的煙火很容易引發這隻救援犬的焦慮發作。王主人在節慶期間將這隻可憐的動物關在安靜的房間裡。",
    clue: "情態助動詞 could 與副詞 easily 後接原形動詞；煙火巨響誘發毛孩焦慮恐慌，依首尾提示 t____r 判定為 trigger。",
    confuse: "trigger 亦可指槍械板機。作動詞表「引發」。何時才對：Stress can trigger severe headaches." },
  { n: 119, sec: "s5", tags: ["考點：psychology 心理學", "詞性需求：不可數名詞"], ans: "psychology",
    en: "The fascinating field of [[119|psychology]] studies how the human mind works. Professor Chang explains complex mental processes to her university students.",
    zh: "迷人的心理學領域研究人類大腦的運作方式。張教授向她的大學生解釋複雜的心理過程。",
    clue: "介系詞 of 後接學科名詞作受詞；探討大腦心智與心理運作機制的科學領域，依首尾提示 p____y 判定為 psychology。",
    confuse: "psychological (adj. 心理學的)。field of 後接學科名詞。何時才對：Child psychology focuses on early development." },
  { n: 120, sec: "s5", tags: ["考點：stability 穩定性、平穩", "詞性需求：不可數名詞"], ans: "stability",
    en: "The thick metal base provides excellent [[120|stability]] for the tall floor lamp. Designer Wu ensured the heavy object would never fall over easily.",
    zh: "厚實的金屬底座為高大的落地燈提供了極佳的穩定性。吳設計師確保這個重物絕對不會輕易倒下。",
    clue: "provides excellent 後接名詞；落地燈底座防傾倒所具備的平穩平衡力，依首尾提示 s____y 判定為 stability。",
    confuse: "stable (adj. 穩固的)。在形容詞 excellent 後填名詞 stability。何時才對：Price stability is vital for the economy." },
  { n: 121, sec: "s5", tags: ["考點：participant 參加者、參與者", "詞性需求：可數名詞 (單數指人)"], ans: "participant",
    en: "Every single [[121|participant]] must sign a safety waiver before joining the extreme marathon. Organizer Lin strictly enforces this rule to protect the runners.",
    zh: "每一位參加者在加入這場極限馬拉松之前，都必須簽署一份安全免責聲明。林主辦人嚴格執行這項規定以保護跑者。",
    clue: "Every single 後接單數名詞指人作主詞；極限馬拉松簽切結書的每位跑者參賽人員，依首尾提示 p____t 判定為 participant。",
    confuse: "participate (v. 參加)、participation (n. 參與)。指人填 participant。何時才對：All participants received a certificate of completion." },
  { n: 122, sec: "s5", tags: ["考點：implication 暗示、隱含意義", "詞性需求：可數名詞 (單數)"], ans: "implication",
    en: "The hidden [[122|implication]] in his speech suggested that massive layoffs were coming. Employee Zhang felt very anxious after hearing the manager's subtle warning.",
    zh: "他演講中隱含的暗示表明即將進行大規模裁員。張員工在聽到經理微妙的警告後感到非常焦慮。",
    clue: "形容詞 hidden 後接名詞作主詞；主管講話弦外之音、微妙隱射即將裁員，依首尾提示 i____n 判定為 implication。",
    confuse: "imply (v. 暗示)。在形容詞 hidden 後填名詞 implication。何時才對：What are the legal implications of this decision?" },
  { n: 123, sec: "s5", tags: ["考點：motivation 動力、動機", "詞性需求：不可數/可數名詞"], ans: "motivation",
    en: "The promised bonus served as a strong [[123|motivation]] for the sales team. Manager Lee knew that extra money would encourage everyone to work harder.",
    zh: "承諾的獎金成為了業務團隊強大的動力。李經理知道額外的金錢會鼓勵每個人更努力工作。",
    clue: "served as a strong 後接名詞；獎金鼓舞全員發奮衝刺業績的內驅力，依首尾提示 m____n 判定為 motivation。",
    confuse: "motivate (v. 激勵)、motive (n. 犯罪動機)。指激勵奮發之動力用 motivation。何時才對：Her main motivation was to help others." },
  { n: 124, sec: "s5", tags: ["考點：polished 完善精練的、優雅圓熟的", "詞性需求：形容詞"], ans: "polished",
    en: "The professional speaker delivered a highly [[124|polished]] speech at the annual conference. Audience members were deeply impressed by her flawless and smooth delivery.",
    zh: "這位專業講者在年度會議上發表了一場極度精鍊的演講。觀眾對她完美無瑕且流暢的表達留下了深刻的印象。",
    clue: "副詞 highly 修飾後方形容詞；修飾名詞 speech，下文對應 flawless and smooth delivery，指講稿無懈可擊，依首尾提示 p____hed 判定為 polished。",
    confuse: "polish (v. 磨光擦亮)。形容演說或技巧精練圓熟時填形容詞 polished。何時才對：He gave a polished piano performance." },
  { n: 125, sec: "s5", tags: ["考點：outfit 整套服裝、穿搭", "詞性需求：可數名詞 (單數)"], ans: "outfit",
    en: "The stylish [[125|outfit]] perfectly matched the elegant atmosphere of the evening gala. Model Lin received numerous compliments on her beautiful dress and matching shoes.",
    zh: "這套時尚的服裝完美搭配了晚會優雅的氛圍。林模特兒的漂亮禮服和相配的鞋子收到了無數的讚美。",
    clue: "形容詞 stylish 後接單數名詞作主詞；下文提到 beautiful dress and matching shoes，盛會穿戴的整體服裝，依首尾提示 o____t 判定為 outfit。",
    confuse: "costume (戲服/化裝服)。日常或宴會搭配的整套服飾為 outfit。何時才對：She bought a new outfit for the wedding." },
  { n: 126, sec: "s5", tags: ["考點：reinforce 加固、強化結構", "詞性需求：原形動詞 (VR)"], ans: "reinforce",
    en: "The construction crew used thick steel bars to [[126|reinforce]] the concrete walls. Engineer Yang wanted to ensure the tall building could survive massive earthquakes.",
    zh: "施工團隊使用了粗鋼筋來加固混凝土牆。楊工程師想要確保這棟高樓能撐過大地震。",
    clue: "不定詞 to 後接原形動詞；工班加裝粗鋼筋增強水泥牆耐震度，依首尾提示 re____e 判定為 reinforce。",
    confuse: "reinforcement (n. 援軍/增強物)。to 後接動詞原形。何時才對：They used sandbags to reinforce the flood barrier." },
  { n: 127, sec: "s5", tags: ["考點：accessible 可通達的、無障礙的", "詞性需求：形容詞 (主詞補語)"], ans: "accessible",
    en: "The newly built subway station is completely [[127|accessible]] to wheelchair users. Mayor Zhao installed several modern elevators to help disabled passengers travel easily.",
    zh: "新建的地鐵站對輪椅使用者來說是完全無障礙的。趙市長安裝了幾部現代化的電梯，以幫助身障乘客輕鬆出行。",
    clue: "is completely 後接形容詞補語；搭配介系詞 to wheelchair users，下文提到設有電梯利於身障者通行，依首尾提示 a____e 判定為 accessible。",
    confuse: "access (n. 通道 / v. 存取)。形容環境對身障者無障礙通行填 accessible。何時才對：The building is easily accessible by bus." }
];

/* === 渲染各大題至 app === */
let s1HTML = '<section id="s1"><h2>第一部分 (題號 01 - 25)</h2>';
let s2HTML = '<section id="s2"><h2>第二部分 (題號 26 - 50)</h2>';
let s3HTML = '<section id="s3"><h2>第三部分 (題號 51 - 75)</h2>';
let s4HTML = '<section id="s4"><h2>第四部分 (題號 76 - 100)</h2>';
let s5HTML = '<section id="s5"><h2>第五部分 (題號 101 - 127)</h2>';

VOC_DATA.forEach(item => {
  const qBody = '<div class="stem">'
              + '<div class="en">' + fx(item.en) + '</div>'
              + '<div class="zh">' + item.zh + '</div>'
              + '</div>'
              + clue(item.clue)
              + '<h4>易混淆字形／詞性：何時才對</h4>'
              + '<p style="margin:2px 0">' + item.confuse + '</p>';
  const cardHTML = card(item.n, item.tags, item.ans, qBody);
  if (item.sec === "s1") s1HTML += cardHTML;
  else if (item.sec === "s2") s2HTML += cardHTML;
  else if (item.sec === "s3") s3HTML += cardHTML;
  else if (item.sec === "s4") s4HTML += cardHTML;
  else if (item.sec === "s5") s5HTML += cardHTML;
});

s1HTML += '</section>';
s2HTML += '</section>';
s3HTML += '</section>';
s4HTML += '</section>';
s5HTML += '</section>';

document.getElementById('app').innerHTML = s1HTML + s2HTML + s3HTML + s4HTML + s5HTML;

// 頂部導覽列與一鍵展開/收合
const navSections = [
  ['s1', '01 - 25'],
  ['s2', '26 - 50'],
  ['s3', '51 - 75'],
  ['s4', '76 - 100'],
  ['s5', '101 - 127']
];
document.getElementById('nav').innerHTML = navSections.map(s => '<a href="#' + s[0] + '">' + s[1] + '</a>').join('') + '<button id="tg">全部收合</button>';

let isAllOpen = true;
document.getElementById('tg').onclick = function() {
  isAllOpen = !isAllOpen;
  document.querySelectorAll('details.q').forEach(d => d.open = isAllOpen);
  this.textContent = isAllOpen ? '全部收合' : '全部展開';
};
</script>
<script src="bookmark.js"></script>
