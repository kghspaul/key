<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>308 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>308 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h = '';

// --- 課文挑戰題 ---
h += '<h2 id="p1">挑戰題 (課文內容)</h2>';

h += card('1', ['關係代名詞', '數量詞'], 'C',
  '<div class="stem"><div class="en">Every year, Thailand sees millions of tourists, '+fx("[[1|many of whom]]")+' have a lot of fun riding elephants.</div><div class="zh">每年泰國吸引數以百萬計的遊客，其中許多人在騎大象中獲得很多樂趣。[cite: 7]</div></div>' +
  clue('many of whom = and many of them。在介系詞 of 後，用受格 whom 代替 tourists，引導形容詞子句。[cite: 7]') +
  ops([
    ['many', '', '缺連接詞 (→ and many of them)[cite: 7]'],
    ['many of them', '', '缺連接詞 (→ and many of them)[cite: 7]'],
    ['many of whom', '', '關代 whom = 連接詞 + 代名詞[cite: 7]'],
    ['with many of them', '', 'with + O + OC，此處應接 having... 而非 have[cite: 7]']
  ], 'C')
);

h += card('2', ['存在句型'], 'C',
  '<div class="stem"><div class="en">However, '+fx("[[2|there]]")+' is a dark side to elephant tourism that would horrify many travelers.</div><div class="zh">然而，大象旅遊業有一個會讓許多遊客感到恐懼的黑暗面。[cite: 7]</div></div>' +
  clue('there is a dark side to... 表示「...有黑暗面」。(There is more to a person than meets the eye)[cite: 7]') +
  ops([
    ['it', '', '若為分裂句，後面需有明顯強調對比，此處不合[cite: 7]'],
    ['what', '', '名詞子句當主詞，會導致主要子句缺動詞[cite: 7]'],
    ['there', '有', '存在句型[cite: 7]'],
    ['that', '', '一般代名詞，語意不合[cite: 7]']
  ], 'C')
);

h += card('3', ['字彙', '動詞'], 'A',
  '<div class="stem"><div class="en">Due to high demand in Thailand’s tourism industry, the illegal trade of young elephants has '+fx("[[3|expanded]]")+'.</div><div class="zh">由於泰國旅遊業的高需求，小象的非法交易擴大了。[cite: 7]</div></div>' +
  ops([
    ['expanded', '擴展，擴大', '[cite: 7]'],
    ['developed', '發展，形成', '[cite: 7]'],
    ['existed', '存在', '[cite: 7]'],
    ['intensified', '加強，增強', '[cite: 7]']
  ], 'A')
);

h += card('4', ['字彙', '形容詞'], 'A',
  '<div class="stem"><div class="en">Being highly '+fx("[[4|social]]")+' creatures in their natural habitat, elephants often travel great distances in herds which are led by females.</div><div class="zh">作為自然棲息地中高度群居的生物，大象經常在母象的帶領下成群結隊地長途跋涉。[cite: 7]</div></div>' +
  ops([
    ['social', '群居的 / 社交的', 'social creatures 群居生物[cite: 7]'],
    ['socializing', '與...交際', 'Vi.[cite: 7]'],
    ['socialized', '', '[cite: 7]'],
    ['socialize', '', '動詞[cite: 7]']
  ], 'A')
);

h += card('5', ['介系詞'], 'C',
  '<div class="stem"><div class="en">Unfortunately, a number of young wild elephants are lured away from their mothers and '+fx("[[5|into]]")+' traps by brutal trappers.</div><div class="zh">不幸的是，許多野生小象被殘忍的捕獸者誘離母親並誘入陷阱。[cite: 7]</div></div>' +
  clue('are lured away from... and (lured) into traps (被誘離...並被誘入...)。[cite: 7]') +
  ops([
    ['caught', '', '應為 (are) caught in traps[cite: 7]'],
    ['hidden', '', '應為 into (hidden) traps[cite: 7]'],
    ['into', '進入', 'lured into traps[cite: 7]'],
    ['fallen', '', '應為 falling into traps[cite: 7]']
  ], 'C')
);

h += card('6', ['關係副詞'], 'D',
  '<div class="stem"><div class="en">The elephants that fall victim to the traps are then sold to tour operators. That is '+fx("[[6|when]]")+' the real horror begins, as the elephants are often violently abused.</div><div class="zh">那些落入陷阱成為受害者的大象接著被賣給旅遊業者。那正是真正的恐怖開始的時候，因為大象經常遭到暴力的虐待。[cite: 7]</div></div>' +
  clue('That is when... = That is (the time/moment) when + 完整子句 (名詞子句作主詞補語)。[cite: 7]') +
  ops([
    ['what', '', 'what + 不完整子句[cite: 7]'],
    ['why', '', '意思不合理[cite: 7]'],
    ['how', '', '意思不合理[cite: 7]'],
    ['when', '當...時', '引導名詞子句[cite: 7]']
  ], 'D')
);

h += card('7', ['轉折語'], 'D',
  '<div class="stem"><div class="en">These young elephants are confined in very small cages. '+fx("[[7|Furthermore]]")+', they are beaten without mercy for days and even struck with sharp nails.</div><div class="zh">這些小象被關在非常小的籠子裡。此外，牠們被無情地連續毆打好幾天，甚至被尖銳的釘子刺打。[cite: 7]</div></div>' +
  clue('前後為遞進關係，故用 furthermore (此外)。[cite: 7]') +
  ops([
    ['In other words', '換句話說', '[cite: 7]'],
    ['In contrast', '相比之下', '[cite: 7]'],
    ['On the other hand', '另一方面', '用於前後對立的句子[cite: 7]'],
    ['Furthermore', '此外', '表遞進[cite: 7]']
  ], 'D')
);

h += card('8', ['關係代名詞'], 'B',
  '<div class="stem"><div class="en">Such psychological torture and physical abuse, '+fx("[[8|both of which]]")+' cause extreme suffering, are committed in order to make them obedient to their human trainers.</div><div class="zh">這種造成極度痛苦的心理折磨和肉體虐待被實施，是為了讓牠們服從人類訓練員。[cite: 7]</div></div>' +
  clue('both of which = and both of them。先行詞為 torture and abuse。[cite: 7]') +
  ops([
    ['both of them', '', '缺連接詞[cite: 7]'],
    ['both of which', '', '關代 which = 連接詞 + 代名詞[cite: 7]'],
    ['they both', '', '缺連接詞[cite: 7]'],
    ['and either', '', '應為 and either causes[cite: 7]']
  ], 'B')
);

h += card('9', ['代名詞'], 'D',
  '<div class="stem"><div class="en">Once the elephants are tamed, they are forced into a life of slavery. Many of '+fx("[[9|them]]")+' are made to carry people on their backs at tourist attractions and elephant camps.</div><div class="zh">一旦大象被馴服，牠們就被迫過著奴役的生活。牠們之中的許多被迫在旅遊景點和大象營地背著人。[cite: 7]</div></div>' +
  clue('此處兩句有句號分隔，不需連接詞，直接使用代名詞 them。[cite: 7]') +
  ops([
    ['which', '', '本句不需連接詞[cite: 7]'],
    ['whom', '', '本句不需連接詞[cite: 7]'],
    ['what', '', '本句不需連接詞[cite: 7]'],
    ['them', '牠們', '作介系詞 of 的受詞[cite: 7]']
  ], 'D')
);

h += card('10', ['字彙搭配'], 'D',
  '<div class="stem"><div class="en">Since an elephant’s spine is '+fx("[[10|vulnerable]]")+' to pressure from above, carrying heavy tourists for hours every day can lead to painful, permanent back injuries.</div><div class="zh">由於大象的脊椎容易受到來自上方的壓力傷害，每天背負沉重的遊客好幾個小時會導致痛苦且永久的背部損傷。[cite: 7]</div></div>' +
  clue('所有選項皆可修飾 spine，但只有 vulnerable 可與 "to" 搭配 (vulnerable to 易受...傷害的)。[cite: 7]') +
  ops([
    ['softened', '軟化的', '不搭配 to[cite: 7]'],
    ['fragile', '脆弱的', '不搭配 to[cite: 7]'],
    ['delicate', '精緻的；柔弱的', '不搭配 to[cite: 7]'],
    ['vulnerable', '易受...傷害的', 'vulnerable to[cite: 7]']
  ], 'D')
);

h += card('11', ['動名詞當主詞'], 'C',
  '<div class="stem"><div class="en">Since an elephant’s spine is vulnerable to pressure from above, '+fx("[[11|carrying]]")+' heavy tourists for hours every day can lead to painful, permanent back injuries.</div><div class="zh">由於大象的脊椎容易受到來自上方的壓力傷害，每天背負沉重的遊客好幾個小時會導致痛苦且永久的背部損傷。[cite: 7]</div></div>' +
  clue('逗號後為主要子句，動名詞 carrying 作為子句主詞。[cite: 7]') +
  ops([
    ['which carries', '', '多連接詞、多動詞[cite: 7]'],
    ['which is carried', '', '同上[cite: 7]'],
    ['carrying', '背負', '動名詞作主詞[cite: 7]'],
    ['and carry', '', '多連接詞[cite: 7]']
  ], 'C')
);

h += card('12', ['關係代名詞'], 'D',
  '<div class="stem"><div class="en">What’s more, they are denied an adequate amount of food and water, '+fx("[[12|which]]")+' further contributes to their exhaustion.</div><div class="zh">更重要的是，牠們被拒絕給予充足的食物和水，這進一步導致了牠們的疲憊。[cite: 7]</div></div>' +
  clue('which 指前面整句話 (= and that)。[cite: 7]') +
  ops([
    ['thus', '因此', '少連接詞[cite: 7]'],
    ['so that', '以便', '需加完整子句，語意不合[cite: 7]'],
    ['and', '', '應為 and that[cite: 7]'],
    ['which', '這', '代替前方整句話[cite: 7]']
  ], 'D')
);

h += card('13', ['假設語氣'], 'C',
  '<div class="stem"><div class="en">Supply never comes without demand, and it is time '+fx("[[13|that we dealt]]")+' with the roots of this problem.</div><div class="zh">沒有需求就沒有供給，我們是時候處理這個問題的根源了。[cite: 7]</div></div>' +
  clue('It is (high) time that + S + Ved (該是做...的時候了)。that 子句時態用過去式，表與現在事實相反的假設語氣。[cite: 7]') +
  ops([
    ['to have dealt', '', '應為 to deal[cite: 7]'],
    ['to be dealt', '', '應為 to deal[cite: 7]'],
    ['that we dealt', '', '假設語氣過去式[cite: 7]'],
    ['that we will deal', '', '應為 dealt[cite: 7]']
  ], 'C')
);

h += card('14', ['祈使句強週'], 'B',
  '<div class="stem"><div class="en">When you visit Thailand, '+fx("[[14|do avoid]]")+' companies profiting from elephant tourism.</div><div class="zh">當你拜訪泰國時，務必避開從大象旅遊中獲利的公司。[cite: 7]</div></div>' +
  clue('逗號後需有主要子句。do + VR 表強調(務必要做)。[cite: 7]') +
  ops([
    ['which avoids', '', '整個句子只有副詞子句和形容詞子句，缺主要子句[cite: 7]'],
    ['do avoid', '務必避開', '祈使句加 do 表強調[cite: 7]'],
    ['to avoid', '', '缺主要子句/缺動詞[cite: 7]'],
    ['in which avoid', '', '同上[cite: 7]']
  ], 'B')
);

h += card('15', ['介系詞'], 'A',
  '<div class="stem"><div class="en">'+fx("[[15|As]]")+' an alternative, visit one of Thailand’s three national parks where wild elephants roam free.</div><div class="zh">作為替代方案，可以參觀泰國三個能讓野生大象自由漫步的國家公園之一。[cite: 7]</div></div>' +
  ops([
    ['As', '作為', '[cite: 7]'],
    ['Try', '', '缺連接詞[cite: 7]'],
    ['Here’s', '', '缺連接詞[cite: 7]'],
    ['With', '', '無意義[cite: 7]']
  ], 'A')
);

h += passage("補充段落 / 延伸閱讀", [
  [["There, you can take pleasure in seeing these complex, intelligent animals as they happily go about their lives in peace.", "在那裡，你可以從看著這些複雜、聰明的動物平靜而快樂地過日子中獲得樂趣。[cite: 8]"]]
]);


// --- 綜合文法題 (基本題) ---
h += '<h2 id="p2">綜合文法題 - 基本題 (各種子句題型解析)</h2>';
h += passage("重點觀念提示", [
  [["每 2 個動詞需 1 個連接詞，3 個動詞需 2 個連接詞，依此類推。[cite: 7]"]],
  [["what / which / who / whom + 不完整子句(缺主詞、受詞或補語)。what 前通常沒有名詞，which 前通常有名詞。[cite: 7]"]],
  [["that + 不完整子句 = 關係子句/形容詞子句；that + 完整子句 = 名詞子句(當主/受/補/同位語)。[cite: 7]"]],
  [["關係副詞 (where / when / why / how) 後必接完整子句。[cite: 7]"]],
  [["介系詞 + which/whom → 後接完整子句。[cite: 7]"]]
]);

h += card('B1', ['綜合關代'], 'D',
  '<div class="stem"><div class="en">Whenever we need answers to the questions of life, we can always refer to the wise lines of poems, '+fx("[[B1|many of which have become]]")+' proverbs: "Good fences make good neighbors," "To err is human, to forgive, divine," "What\'s done cannot be undone," to name but a few.</div><div class="zh">每當我們需要解答人生問題時，總能參考那些已經成為諺語的智慧詩句：「好籬笆造就好鄰居」、「人非聖賢，孰能無過」、「覆水難收」，僅舉幾例。[cite: 7]</div></div>' +
  ops([
    ['many of those', '', '缺連接詞[cite: 7]'],
    ['many of them', '', '缺連接詞[cite: 7]'],
    ['many of what have become', '', 'what 子句為名詞子句，會導致主要子句缺動詞[cite: 7]'],
    ['many of which have become', '', '= and many of these lines[cite: 7]']
  ], 'D')
);

h += card('B2', ['綜合關代'], 'A',
  '<div class="stem"><div class="en">She only gave me a vague description of '+fx("[[B2|what]]")+' happened here yesterday. I still don\'t have a clear picture.</div><div class="zh">她只對昨天這裡發生的事給了個模糊的描述。我仍然沒有一個清晰的概念。[cite: 7]</div></div>' +
  ops([
    ['what', '', '= the thing(s) which/that[cite: 7]'],
    ['of which', '', '介+關代=關副，不可當主詞[cite: 7]'],
    ['things', '', '應為 things that/which[cite: 7]'],
    ['that', '', '應為 the thing that[cite: 7]']
  ], 'A')
);

h += card('B3', ['綜合關代'], 'D',
  '<div class="stem"><div class="en">Emily Dickinson wrote thousands of poems, '+fx("[[B3|only seven of which]]")+' were published in her lifetime.</div><div class="zh">Emily Dickinson 寫了數千首詩，其中只有七首在她生前出版。[cite: 7]</div></div>' +
  ops([

    ['only seven of which', '', '[cite: 7]']
  ], 'D')
);

h += card('B4', ['綜合關代'], 'C',
  '<div class="stem"><div class="en">When he was very young, Stephen King discovered a box of his father\'s books, '+fx("[[B4|most of which]]")+' were horror novels. After reading them, King was hooked on the genre.</div><div class="zh">Stephen King 小時候發現了他父親的一箱書，其中大部分是恐怖小說。讀完後，King 就迷上了這個類型。[cite: 7]</div></div>' +
  ops([
    ['most (of them)', '', '缺連接詞[cite: 7]'],

    ['most of them', '', '缺連接詞[cite: 7]']
  ], 'C')

h += card('B5', ['關係代名詞', '插入語'], 'A',
  '<div class="stem"><div class="en">There is a program specifically meant for teenagers, '+fx("[[B5|which]]")+' I think you might be interested in.</div><div class="zh">有一個專為青少年設計的節目，我想你可能會感興趣。[cite: 7]</div></div>' +

  ops([

    ['one of what', '', '錯誤用法[cite: 7]']

h += card('B6', ['介系詞 + 名詞子句'], 'C',
  '<div class="stem"><div class="en">Environmentalists around the world are working together to raise awareness '+fx("[[B6|of what]]")+' must be done to save our environment.</div><div class="zh">世界各地的環保人士正攜手合作，以提升人們對拯救環境必須採取何種行動的意識。[cite: 7]</div></div>' +
  clue('what = the thing(s) that。raise awareness of the thing(s) that must be done...[cite: 7]') +
  ops([
    ['in which', '', '關係副詞[cite: 7]'],
    ['of things', '', '少 that[cite: 7]'],
    ['of what', '', 'of + 名詞子句[cite: 7]'],
    ['that', '', 'that = awareness，語意變成 "必須採取意識來拯救環境"，不合理[cite: 7]']
  ], 'C')
);

h += card('B7', ['代名詞與分詞構句'], 'A',
  '<div class="stem"><div class="en">Many scientists, some of '+fx("[[B7|them]]")+' using Albert Einstein\'s Theory of Relativity as a basis for their arguments, have published theories on the possibility of time travel.</div><div class="zh">許多科學家發表了關於時間旅行可能性的理論，其中一些人將愛因斯坦的相對論作為其論點的基礎。[cite: 7]</div></div>' +
  clue('some of them using... 為獨立分詞構句 (= and some of them are using)。若用 whom，則後面需有動詞 (used)。[cite: 7]') +
  ops([
    ['them', '', '→ and some of them are using[cite: 7]'],
    ['whom', '', '→ some of whom used[cite: 7]'],
    ['those', '', '錯誤[cite: 7]'],
    ['which', '', '代指科學家應為人[cite: 7]']
  ], 'A')
);

h += card('B8', ['關係代名詞'], 'D',
  '<div class="stem"><div class="en">The chicken virus was found in Hong Kong in 1997. Though bird flu viruses usually do not infect humans, this one did, killing six of 18 people who got it, '+fx("[[B8|which]]")+' was a very high death rate for an infectious disease.</div><div class="zh">禽流感病毒於1997年在香港被發現。雖然禽流感病毒通常不感染人類，但這次卻感染了，並殺死了18名感染者中的6人，這對於傳染病來說是極高的致死率。[cite: 7]</div></div>' +
  clue('which 關代用來指代前面整句話「18人死6人這件事」。[cite: 7]') +
  ops([
    ['some of what', '', '不合語意[cite: 7]'],
    ['some of which', '', '前無適當的事物名詞[cite: 7]'],
    ['what', '', '不合語意[cite: 7]'],
    ['which', '', '指代前一句話的事實[cite: 7]']
  ], 'D')
);

h += card('B9', ['數量詞 + 關代'], 'B',
  '<div class="stem"><div class="en">In 1995, the International Shark Attack File recorded 59 shark attacks worldwide, '+fx("[[B9|of which]]")+' only ten resulted in fatalities.</div><div class="zh">1995年，國際鯊魚攻擊檔案記錄了全球 59 起鯊魚攻擊事件，其中只有 10 起導致死亡。[cite: 7]</div></div>' +
  clue('only ten of which resulted = and only ten of them resulted。[cite: 7]') +
  ops([
    ['where', '', '關係副詞不能加數量詞[cite: 7]'],

    ['so that', '', '語意不合[cite: 7]']

);

h += card('B10', ['數量詞 + 關代'], 'D',
  '<div class="stem"><div class="en">Each year, in total, we produce more than 20 million tons of garbage, '+fx("[[B10|of which]]")+' the industrial waste accounts for 60 percent.</div><div class="zh">每年我們總共製造超過 2000 萬噸垃圾，其中工業廢棄物佔了百分之 60。[cite: 7]</div></div>' +
  clue('the industrial waste of which (= of the 20 million tons of garbage) accounts for 60 percent。[cite: 7]') +
  ops([
    ['where', '', '[cite: 7]'],
    ['what', '', '不完整子句[cite: 7]'],
    ['for which', '', '[cite: 7]'],

  ], 'D')
);


// --- 綜合文法題 (進階題) ---
h += '<h2 id="p3">綜合文法題 - 進階題</h2>';

h += card('A1', ['使役動詞'], 'D',
  '<div class="stem"><div class="en">For yesterday is but a dream, and tomorrow is only a vision, but today, (when it is) well lived, '+fx("[[A1|makes]]")+' every yesterday a dream of happiness, and every tomorrow a vision of hope.</div><div class="zh">因為昨天不過是一場夢，明天只是個幻影；但是今天若過得好，就能使每個昨天成為快樂的夢，使每個明天成為希望的幻影。[cite: 7]</div></div>' +
  clue('句首 for, and, but 為對等連接詞。這句話中的 but 連接了 today 這個主詞，因此需要一個主要動詞 makes (makes + O + OC)。[cite: 7]') +
  ops([
    ['which makes', '', '多1連接詞[cite: 7]'],
    ['when making', '', '多1連接詞[cite: 7]'],
    ['made', '', '時態不對[cite: 7]'],
    ['makes', '使...', '因有2連接詞，故需第3個主要動詞[cite: 7]']
  ], 'D')
);

h += card('A2', ['介系詞 + 關代'], 'B',
  '<div class="stem"><div class="en">Scientists previously believed that the whole universe consisted of the Milky Way, the belt of stars '+fx("[[A2|of which]]")+' our solar system is just a small part. It was Hubble who discovered that the Milky Way was only one of countless similar galaxies.</div><div class="zh">科學家以前認為整個宇宙由銀河系組成，而我們的太陽系只是這條星帶的一小部分。是哈伯發現銀河系只是無數類似星系中的一個。[cite: 7]</div></div>' +
  clue('our solar system is just a small part of the Milky Way. 將 of 移至關代 which (代替 the belt of stars) 之前，變成 of which。[cite: 7]') +
  ops([
    ['where', '', 'plays a small part (X)[cite: 7]'],
    ['of which', '', 'of which + 完整子句[cite: 7]'],
    ['that', '', '介系詞後不可加 that[cite: 7]'],
    ['what', '', '不合文法[cite: 7]']
  ], 'B')
);

h += card('A3', ['代名詞與分詞構句'], 'B',
  '<div class="stem"><div class="en">St. Mark\'s Basilica, a spectacular church in Venice, is decorated with priceless treasures, many of '+fx("[[A3|them]]")+' stolen from other countries when medieval Venice was a leading sea power.</div><div class="zh">聖馬可大教堂是一座位於威尼斯的壯麗教堂，裝飾著無價的珍寶，其中許多是在中世紀威尼斯作為主要海上強權時從其他國家偷來的。[cite: 7]</div></div>' +
  clue('many of them (being) stolen 為獨立分詞構句 (= and many of them were stolen)。若用 which，後方需有動詞 were。[cite: 7]') +
  ops([
    ['which', '', '→ which were[cite: 7]'],
    ['them', '', '= and many of them were stolen[cite: 7]'],
    ['what was', '', '名詞子句[cite: 7]'],
    ['those were', '', '缺連接詞[cite: 7]']
  ], 'B')
);

h += card('A4', ['介系詞 + 關代'], 'D',
  '<div class="stem"><div class="en">Tom is looking for a job '+fx("[[A4|at which]]")+' he will be able to fulfill himself. He hopes he can develop his abilities to the full.</div><div class="zh">湯姆正在找一份能讓他實現自我的工作。他希望他能充分發揮自己的能力。[cite: 7]</div></div>' +
  clue('at a/the job (在工作上)。at which = and at this job。[cite: 7]') +
  ops([
    ['of which', '', 'fulfill himself of the job? 不合邏輯[cite: 7]'],
    ['of what', '', '不合文法[cite: 7]'],
    ['that', '', 'that+完子=名詞子句，當 job 的同位語？不合理[cite: 7]'],
    ['at which', '', '在...工作上[cite: 7]']
  ], 'D')
);

h += card('A5', ['介系詞 + 名詞子句'], 'C',
  '<div class="stem"><div class="en">There are some people who just can\'t make up their own mind. They frequently ask the advice of their friends and then do quite the opposite '+fx("[[A5|of what]]")+' their friends have suggested.</div><div class="zh">有些人就是無法自己下決定。他們經常徵求朋友的建議，然後做與朋友建議完全相反的事情。[cite: 7]</div></div>' +
  clue('the opposite of + N (與...相反的人事物)。what = the thing(s) that/which。[cite: 7]') +
  ops([

  ], 'C')
);

h += card('A6', ['分詞構句'], 'B',
  '<div class="stem"><div class="en">Scientists at Macquarie University in Australia found that chickens actually chat during mealtimes. They have a vocabulary of some 20 sounds, '+fx("[[A6|each]]")+' representing a different kind of food.</div><div class="zh">澳洲麥覺理大學的科學家發現雞在吃飯時實際上會聊天。牠們有大約 20 種聲音的詞彙量，每一種都代表不同種類的食物。[cite: 7]</div></div>' +
  clue('each representing... 為分詞構句 (= and each sound represents)。[cite: 7]') +
  ops([
    ['and they all', '', '多連接詞[cite: 7]'],

    ['which', '', '應為 which represent (因為 which 代替 some 20 sounds)[cite: 7]'],
    ['each of which + represents', '', '這也是獨立分詞構句用法[cite: 7]']
  ], 'B')
);

h += card('A7', ['關代'], 'A',
  '<div class="stem"><div class="en">Nie Xiaoqian is probably the most famous Chinese ghost tale, and has been turned into numerous films, the best of '+fx("[[A7|which]]")+' is the kung fu horror-comedy A Chinese Ghost Story, by Tsui Hark.</div><div class="zh">《聶小倩》可能是最著名的中國鬼故事，並被翻拍成無數電影，其中最棒的就是徐克執導的功夫恐怖喜劇《倩女幽魂》。[cite: 7]</div></div>' +
  clue('the best of which 指代前面的 numerous films。[cite: 7]') +
  ops([
    ['which', '', '關代[cite: 7]'],

);

h += card('A8', ['分詞構句'], 'C',
  '<div class="stem"><div class="en">When the two sisters first started, they are said to have been in keen competition, '+fx("[[A8|each of them trying]]")+' to attract more readers than the other.</div><div class="zh">當這兩姊妹剛起步時，據說她們處於激烈的競爭中，兩人都試圖吸引比對方更多的讀者。[cite: 7]</div></div>' +
  clue('each of them trying... 為獨立分詞構句 (= and each of them was trying)。[cite: 7]') +

h += card('A9', ['獨立分詞構句'], 'D',
  '<div class="stem"><div class="en">In a flea market, you\'ll find aisles lined with odds and ends, many of '+fx("[[A9|them]]")+' comic books, shoes, garden tools, and just about anything you can think of.</div><div class="zh">在跳蚤市場，你會發現走道旁擺滿了各種零碎小東西，其中許多是漫畫書、鞋子、園藝工具，以及幾乎任何你能想到的東西。[cite: 7]</div></div>' +
  clue('此題為獨立分詞構句，省略了 being。many of them (being) comic books。在沒有連接詞 and 的情況下只能選代名詞 them。[cite: 7]') +
  ops([
    ['which being', '', '應為 which are[cite: 7]'],

    ['which', '', '應為 which are[cite: 7]'],
    ['them', '代名詞', '搭配省略的 being 形成獨立分詞構句[cite: 7]']
  ], 'D')
);

h += card('A10', ['名詞子句'], 'A',
  '<div class="stem"><div class="en">Before the United States became a country, there were 13 colonies in '+fx("[[A10|what]]")+' today is America, all of them belonging to Great Britain.</div><div class="zh">在美國建國之前，在今天稱為美國的地方有 13 個殖民地，全部隸屬於英國。[cite: 7]</div></div>' +

  ops([

    ['which', '', '介系詞+關代=關副 → 應引導完子，但 today is America 缺主詞補語[cite: 7]'],
    ['whose', '', '錯誤[cite: 7]'],
    ['that', '', 'that 前不可有介/逗[cite: 7]']
  ], 'A')
);

h += card('A11', ['名詞子句'], 'D',
  '<div class="stem"><div class="en">Some people say that aliens have kept an eye on what happens on Earth, and are responsible for quite a few legends, and '+fx("[[A11|that]]")+' the ancient Greek and Roman gods were in fact "space people" living here.</div><div class="zh">有些人說外星人一直關注地球上發生的事，並且是許多傳說的源頭，而且古希臘和羅馬神話中的神其實是住在這的「太空人」。[cite: 7]</div></div>' +
  clue('此處 and 連接兩個 that 子句 (名詞子句當 say 的受詞)。第二個 that 子句不可省略。[cite: 7]') +
  ops([
    ['what', '', '不完整子句[cite: 7]'],

  ], 'D')
);

h += card('A12', ['動詞與關副'], 'C',
  '<div class="stem"><div class="en">Though it took millions of years for the Colorado River to create the Grand Canyon, which runs almost 350 kilometers in length, 8 to 25 kilometers in width, and 1900 meters deep, it was not on any map until 1869, when John Wesley Powell, a geologist, '+fx("[[A12|led]]")+' a team down the treacherous Colorado River and discovered its secrets.</div><div class="zh">雖然科羅拉多河花了數百萬年才創造出長近 350 公里、寬 8 到 25 公里、深 1900 公尺的大峽谷，但直到 1869 年它才出現在任何地圖上，那年地質學家約翰·韋斯利·鮑威爾帶領一支隊伍沿著危險的科羅拉多河而下，並發現了它的秘密。[cite: 7]</div></div>' +
  clue('when 為關係副詞 (= and in that year)。後面 John Wesley Powell 是主詞，需要主要動詞 led。[cite: 7]') +
  ops([
    ['who was led', '', '被動語態不合[cite: 7]'],
    ['leading', '', '缺主要動詞[cite: 7]'],
    ['led', '帶領', '過去式動詞[cite: 7]'],
    ['with whom', '', '不合文法[cite: 7]']
  ], 'C')
);


// --- 課本句型 1 ---
h += '<h2 id="p4">課本句型實例 1 (N + 介 + which/whom)</h2>';

h += '<div class="stem"><div class="zh" style="color:inherit">1. 敵人轟炸(bomb)了這個城市，城市的一部分已被全毀。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The enemy bombed the city, part of which had been totally destroyed.]]")+'[cite: 7]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">2. Andy 申請了六間大學，只有一間錄取(accept)他。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Andy applied to six universities, only one of which accepted him.]]")+'[cite: 7]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">3. 台灣有很多便利商店，絕大部分(majority)都設有自動提款機(ATM)。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|There are many convenience stores (in Taiwan), the majority of which are equipped with an ATM.]]")+'[cite: 7]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">4. 每年有數百起的交通事故，其中許多是酒駕引起的。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|There are hundreds of traffic accidents every year, many of which are caused by drunk driving.]]")+'[cite: 7]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">5. 這間飯店有60間房間，其中10間已經為殘障人士改建(adapt)。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The hotel has sixty rooms, ten of which have been adapted for the disabled visitors.]]")+'[cite: 7]</div></div>';


// --- 課本句型 2 ---
h += '<h2 id="p5">課本句型實例 2 (It is high time that)</h2>';

h += '<div class="stem"><div class="zh" style="color:inherit">1. 該是Tina學習餐桌禮儀的時候了。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|It is about time that Tina learned table manners.]]")+'[cite: 7]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">2. 早該是你踏出舒適圈、嘗試新事物的時候了。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|It is high time that you stepped out of your comfort zone and tried new things.]]")+'[cite: 7]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">3. 政府早該做點事來解決市區的交通問題。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|It is high time that the government did something to solve the downtown traffic problems.]]")+'[cite: 7]</div></div>';

document.getElementById('app').innerHTML = h;

const secs=[
  ['p1','挑戰題 (課文內容)'],
  ['p2','綜合文法 (基本題)'],
  ['p3','綜合文法 (進階題)'],
  ['p4','句型 1'],
  ['p5','句型 2']
];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){
  open=!open;
  document.querySelectorAll('details.q').forEach(d=>d.open=open);
  this.textContent=open?'全部收合':'全部展開';
};
</script>
