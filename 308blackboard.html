<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>308 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>308 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

/* === Part 1: L1 ~ L46 課文講解 === */
const h1 = '<h2 id="p1">L1 ~ L46 課文講解</h2>' + [
  card("L1", ["關係代名詞", "數量詞 + of whom"], "C",
    st("Every year, Thailand sees millions of tourists, [[L1|many of whom]] have a lot of fun riding elephants.", "每年泰國吸引數以百萬計的遊客，其中許多人在騎大象中獲得很多樂趣。") +
    clue("<code>many of whom = and many of them</code>。在介系詞 <code>of</code> 後，用受格關代 <code>whom</code> 代替先行詞 <code>tourists</code>，引導非限定形容詞子句。") +
    ops([
      ["many", "", "缺連接詞（→ and many of them）。"],
      ["many of them", "", "缺連接詞（→ and many of them）。"],
      ["many of whom", "", "關代 whom = 連接詞 + 代名詞。"],
      ["with many of them", "", "with + O + OC，後方應接現在分詞 having... 而非動詞 have。"]
    ], "C")
  ),

  card("L3", ["存在句型", "there is a dark side to..."], "C",
    st("However, [[L3|there]] is a dark side to elephant tourism that would horrify many travelers.", "然而，大象旅遊業有一個會讓許多遊客感到恐懼的黑暗面。") +
    clue("<code>there is a dark side to...</code> 表示「…有黑暗面」（類似 <i>There is more to a person than meets the eye</i>）。") +
    ops([
      ["it", "", "若為分裂句，後面需有明顯強調對比，此處為存在句。"],
      ["what", "", "名詞子句當主詞會導致整句缺主要動詞。"],
      ["there", "有", "存在句型 there is...。"],
      ["that", "", "一般代名詞，語意不合。"]
    ], "C")
  ),

  card("L5", ["字彙", "expanded 擴大"], "A",
    st("Due to high demand in Thailand’s tourism industry, the illegal trade of young elephants has [[L5|expanded]].", "由於泰國旅遊業的高需求，小象的非法交易擴大了。") +
    ops([
      ["expanded", "擴展，擴大", "符合非法貿易規模擴大之語意。"],
      ["developed", "發展，形成", ""],
      ["existed", "存在", ""],
      ["intensified", "加強，加劇", "常指衝突、疼痛或程度加劇。"]
    ], "A")
  ),

  card("L7", ["字彙", "social creatures 群居生物"], "A",
    st("Being highly [[L7|social]] creatures in their natural habitat, elephants often travel great distances in herds which are led by females.", "作為自然棲息地中高度群居的生物，大象經常在母象的帶領下成群結隊地長途跋涉。") +
    ops([
      ["social", "群居的 / 社交的", "<code>social creatures</code> 群居生物。"],
      ["socializing", "與...交際", "不及物動詞現在分詞。"],
      ["socialized", "", "過去分詞。"],
      ["socialize", "", "原形動詞。"]
    ], "A")
  ),

  card("L10", ["介系詞平行結構", "lured away from... and into..."], "C",
    st("Unfortunately, a number of young wild elephants are lured away from their mothers and [[L10|into]] traps by brutal trappers.", "不幸的是，許多野生小象被殘忍的捕獸者誘離母親並誘入陷阱。") +
    clue("平行結構：<code>are lured <b>away from</b> their mothers and (lured) <b>into</b> traps</code>（被誘離母親並被誘入陷阱）。") +
    ops([
      ["caught", "", "應加介系詞 in：<code>(are) caught in traps</code>。"],
      ["hidden", "", "應加介系詞 into：<code>into hidden traps</code>。"],
      ["into", "進入", "<code>(lured) into traps</code>。"],
      ["fallen", "", "fall 為不及物動詞，不可作被動，且應搭配 into。"]
    ], "C")
  ),

  card("L12", ["關係副詞", "That is when..."], "D",
    st("The elephants that fall victim to the traps are then sold to tour operators. That is [[L12|when]] the real horror begins, as the elephants are often violently abused.", "那些落入陷阱成為受害者的大象接著被賣給旅遊業者。那正是真正的恐怖開始的時候，因為大象經常遭到暴力的虐待。") +
    clue("<code>That is when... = That is (the time/moment) when + 完整子句</code>（名詞子句／關係副詞子句作主詞補語）。") +
    ops([
      ["what", "", "what + 不完整子句（但 the real horror begins 已完整）。"],
      ["why", "", "語意不合。"],
      ["how", "", "語意不合。"],
      ["when", "當...的時候", "後接完整子句 the real horror begins。"]
    ], "D")
  ),

  card("L15", ["轉折語", "Furthermore 此外"], "D",
    st("These young elephants are confined in very small cages. [[L15|Furthermore]], they are beaten without mercy for days and even struck with sharp nails.", "這些小象被關在非常小的籠子裡。此外，牠們被無情地連續毆打好幾天，甚至被尖銳的釘子刺打。") +
    clue("前後為遞進補充關係（除了關在小籠子裡，還被無情毆打），故用 <code>Furthermore</code>（此外）。") +
    ops([
      ["In other words", "換句話說", ""],
      ["In contrast", "相比之下", ""],
      ["On the other hand", "另一方面", "用於前後對立的句子。"],
      ["Furthermore", "此外", "表遞進補充。"]
    ], "D")
  ),

  card("L18", ["關係代名詞", "both of which"], "B",
    st("Such psychological torture and physical abuse, [[L18|both of which]] cause extreme suffering, are committed in order to make them obedient to their human trainers.", "這種造成極度痛苦的心理折磨和肉體虐待被實施，是為了讓牠們服從人類訓練員。") +
    clue("<code>both of which = and both of them</code>。先行詞為 <code>psychological torture and physical abuse</code>（共兩項事物），兩個逗號中間為非限定關係子句。") +
    ops([
      ["both of them", "", "缺連接詞。"],
      ["both of which", "", "關代 which = 連接詞 + 代名詞（指前面兩項事物）。"],
      ["they both", "", "缺連接詞。"],
      ["and either", "", "缺 of 且會破壞主詞與後方主要動詞 are committed 的結構。"]
    ], "B")
  ),

  card("L21", ["代名詞", "Many of them (獨立句)"], "D",
    st("Once the elephants are tamed, they are forced into a life of slavery. Many of [[L21|them]] are made to carry people on their backs at tourist attractions and elephant camps.", "一旦大象被馴服，牠們就被迫過著奴役的生活。牠們之中的許多被迫在旅遊景點和大象營地背著人。") +
    clue("注意！此處兩句中間是<b>句號（<code>.</code>）</b>而非逗號！既然已經斷句成獨立的新句子，就<b>不需要連接詞</b>，直接使用受格代名詞 <code>them</code>！") +
    ops([
      ["which", "", "前為句號，本句只有一個動詞 are made，不需連接詞 which。"],
      ["whom", "", "不需連接詞且指動物。"],
      ["what", "", "不合文法。"],
      ["them", "牠們", "獨立句中作介系詞 of 的受詞。"]
    ], "D")
  ),

  card("L24", ["字彙搭配", "vulnerable to 易受…傷害的"], "D",
    st("Since an elephant’s spine is [[L24|vulnerable]] to pressure from above, carrying heavy tourists for hours every day can lead to painful, permanent back injuries.", "由於大象的脊椎容易受到來自上方的壓力傷害，每天背負沉重的遊客好幾個小時會導致痛苦且永久的背部損傷。") +
    clue("雖然四個選項字義都與脆弱有關，但只有 <code>vulnerable</code> 固定搭配介系詞 <code><b>to</b></code>（<code>be vulnerable to...</code> 易受…傷害的）！") +
    ops([
      ["softened", "軟化的", "不搭配 to。"],
      ["fragile", "脆弱的", "不搭配 to。"],
      ["delicate", "精緻的；柔弱的", "不搭配 to。"],
      ["vulnerable", "易受...傷害的", "固定搭配 <code>vulnerable to</code>。"]
    ], "D")
  ),

  card("L25", ["動名詞當主詞", "carrying ... can lead to ..."], "C",
    st("Since an elephant’s spine is vulnerable to pressure from above, [[L25|carrying]] heavy tourists for hours every day can lead to painful, permanent back injuries.", "由於大象的脊椎容易受到來自上方的壓力傷害，每天背負沉重的遊客好幾個小時會導致痛苦且永久的背部損傷。") +
    clue("前半句為 <code>Since</code> 引導的副詞子句，逗號後為主要子句，動詞為 <code>can lead to</code>，需要動名詞片語 <code>carrying heavy tourists...</code> 作為主要子句的主詞。") +
    ops([
      ["which carries", "", "多連接詞與動詞，導致主要子句缺主詞。"],
      ["which is carried", "", "同上。"],
      ["carrying", "背負", "動名詞片語作主要子句主詞。"],
      ["and carry", "", "從屬子句與主要子句之間不可加對等連接詞 and。"]
    ], "C")
  ),

  card("L27", ["非限定關係代名詞", ", which 代替前文整句話"], "D",
    st("What’s more, they are denied an adequate amount of food and water, [[L27|which]] further contributes to their exhaustion.", "更重要的是，牠們被拒絕給予充足的食物和水，這進一步導致了牠們的疲憊。") +
    clue("<code>, which</code> 指代前面整句話「牠們沒有獲得充足的食物與水（<code>= and that</code>）」，並作單數動詞 <code>contributes</code> 的主詞。") +
    ops([
      ["thus", "因此", "副詞，缺少連接詞與主詞（應為 <i>thus further contributing</i>）。"],
      ["so that", "以便", "後需接完整子句（缺主詞）。"],
      ["and", "", "缺主詞（應為 <i>and this/that</i>）。"],
      ["which", "這件事", "非限定關代代替前方整句話，並作 contributes 的主詞。"]
    ], "D")
  ),

  card("L30", ["假設語氣", "It is (high) time that + S + V-ed"], "C",
    st("Supply never comes without demand, and it is time [[L30|that we dealt]] with the roots of this problem.", "沒有需求就沒有供給，我們是時候處理這個問題的根源了。") +
    clue("核心句型：<code>It is (high / about) time that + S + V-ed (過去式動詞)</code>（早該是做…的時候了），that 子句中動詞必須用<b>過去式</b>，表與現在事實相反的假設語氣（若用不定詞則是 <code>It is time (for us) to deal with...</code>）。") +
    ops([
      ["to have dealt", "", "若用不定詞應為現在式 <code>to deal</code>。"],
      ["to be dealt", "", "我們是主動處理問題，應為 <code>(for us) to deal</code>。"],
      ["that we dealt", "", "<code>It is time that + S + V-ed</code> 假設語氣過去式。"],
      ["that we will deal", "", "不可用未來式 will deal。"]
    ], "C")
  ),

  card("L32", ["祈使句強調", "do + VR 務必…"], "B",
    st("When you visit Thailand, [[L32|do avoid]] companies profiting from elephant tourism.", "當你造訪泰國時，務必避開從大象旅遊中獲利的公司。") +
    clue("前半句為 <code>When</code> 時間副詞子句，逗號後為主要子句（祈使句），在原形動詞前加上助動詞 <code>do</code>（<code>do avoid</code>）表示強烈語氣「務必要避開」！") +
    ops([
      ["which avoids", "", "會導致整句話只有從屬子句，缺乏主要子句。"],
      ["do avoid", "務必避開", "祈使句加助動詞 do 表強調。"],
      ["to avoid", "", "不定詞不能作主要子句動詞。"],
      ["in which avoid", "", "缺主要子句動詞。"]
    ], "B")
  ),

  card("L34", ["介系詞", "As an alternative 作為替代方案"], "A",
    st("[[L34|As]] an alternative, visit one of Thailand’s three national parks where wild elephants roam free.", "作為替代方案，可以參觀泰國三個能讓野生大象自由漫步的國家公園之一。") +
    clue("<code>As an alternative</code>（作為替代方案），逗號後接祈使句動詞 <code>visit...</code>。") +
    ops([
      ["As", "作為", "介系詞構成 <code>As an alternative</code>。"],
      ["Try", "", "若用動詞 Try，逗號後的動詞 visit 就缺連接詞。"],
      ["Here’s", "", "同上，會造成兩個句子無連接詞。"],
      ["With", "", "語意不合。"]
    ], "A") +
    passage("L36 ~ L38 課文結尾段落", [[
      ["There, you can take pleasure in seeing these complex, intelligent animals as they happily go about their lives in peace.", "在那裡，你可以從看著這些複雜、聰明的動物平靜而快樂地過日子中獲得樂趣。"]
    ]])
  )
].join('');

/* === Part 2: 綜合文法題 - 基本題 (B1~B10) & 進階題 (A1~A12) === */
const h2 = '<h2 id="p2">綜合文法題 - 基本題 (B1~B10) ＆ 進階題 (A1~A12)</h2>' +
  passage("各種子句題型解題黃金法則", [[
    ["1. 動詞與連接詞數量公式：每 2 個動詞需 1 個連接詞（含對等連接詞、從屬連接詞、關係詞、疑問詞），3 個動詞需 2 個連接詞，依此類推。", "先數動詞與連接詞數量，可瞬間秒殺缺連接詞或多連接詞的選項！"],
    ["2. 關係代名詞（who / whom / which / what）後接「不完整子句（缺主詞、受詞或補語）」：which / who / whom 前面有先行詞名詞；what (= the thing that) 前面沒有先行詞名詞。", "區分 which 與 what 的關鍵。"],
    ["3. that + 不完整子句 ＝ 形容詞子句（關係子句，不可置於逗號或介系詞後）；that + 完整子句 ＝ 名詞子句（當主詞、受詞、補語或同位語）。", "that 的雙重身分。"],

  card("B1", ["綜合關代", "many of which"], "D", st("B1. Whenever we need answers to the questions of life, we can always refer to the wise lines of poems, [[B1|many of which have become]] proverbs: \"Good fences make good neighbors,\" \"To err is human, to forgive, divine,\" \"What's done cannot be undone,\" to name but a few.", "每當我們需要解答人生問題時，總能參考那些已經成為諺語的智慧詩句：「好籬笆造就好鄰居」、「人非聖賢，孰能無過」、「覆水難收」，僅舉幾例。") + ops([["many of those","","缺連接詞與動詞。"],["many of them","","缺連接詞与動詞。"],["many of what have become","","已有先行詞 lines of poems，不可用 what。"],["many of which have become","","= and many of these lines have become。"]], "D")),

  card("句1-4", ["句型1：數量詞 + of which", "many of which"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">4. 每年有數百起的交通事故，其中許多是酒駕引起的。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|There are hundreds of traffic accidents every year, many of which are caused by drunk driving.]]")+'</div></div>'),
  card("句1-5", ["句型1：數量詞 + of which", "ten of which"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">5. 這間飯店有 60 間房間，其中 10 間已經為殘障人士改建 (adapt)。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|The hotel has sixty rooms, ten of which have been adapted for the disabled (visitors).]]")+'</div></div>'),

  card("句2-1", ["句型2：It is (about/high) time that + V-ed", "learned table manners"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">1. 該是 Tina 學習餐桌禮儀的時候了。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|It is about/high time that Tina learned table manners.]]")+'</div></div>'),
  card("句2-2", ["句型2：It is high time that + V-ed", "stepped out ... and tried"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">2. 早該是你踏出舒適圈、嘗試新事物的時候了。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|It is high time that you stepped out of your comfort zone and tried new things.]]")+'</div></div>'),
  card("句2-3", ["句型2：It is high time that + V-ed", "did something to solve"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">3. 政府早該做點事來解決市區的交通問題。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|It is high time that the government did something to solve the downtown traffic problems.]]")+'</div></div>')
].join('');

document.getElementById('app').innerHTML = h1 + h2 + h3;
const secs=[['p1','L1~L46 課文講解'],['p2','綜合文法題 (基本 & 進階)'],['p3','句型1 & 句型2']];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){
  open=!open;
  document.querySelectorAll('details.q').forEach(d=>d.open=open);
  this.textContent=open?'全部收合':'全部展開';
};
</script>
