            { id: 123, word: "motivation", en: "The promised bonus served as a strong m n for the sales team. Manager Lee knew that extra money would encourage everyone to work harder.", zh: "承諾的獎金成為了業務團隊強大的動力。李經理知道額外的金錢會鼓勵每個人更努力工作。" },
            { id: 124, word: "polished", en: "The professional speaker delivered a highly p_hed speech at the annual conference. Audience members were deeply impressed by her flawless and smooth delivery.", zh: "這位專業講者在年度會議上發表了一場極度精鍊的演講。觀眾對她完美無瑕且流暢的表達留下了深刻的印象。" },
            { id: 125, word: "outfit", en: "The stylish o t perfectly matched the elegant atmosphere of the evening gala. Model Lin received numerous compliments on her beautiful dress and matching shoes.", zh: "這套時尚的服裝完美搭配了晚會優雅的氛圍。林模特兒的漂亮禮服和相配的鞋子收到了無數的讚美。" },
            { id: 126, word: "reinforce", en: "The construction crew used thick steel bars to re the concrete walls. Engineer Yang wanted to ensure the tall building could survive massive earthquakes.", zh: "施工團隊使用了粗鋼筋來加固混凝土牆。楊工程師想要確保這棟高樓能撐過大地震。" },
            { id: 127, word: "accessible", en: "The newly built subway station is completely a e to wheelchair users. Mayor Zhao installed several modern elevators to help disabled passengers travel easily.", zh: "新建的地鐵站對輪椅使用者來說是完全無障礙的。趙市長安裝了幾部現代化的電梯,以幫助身障乘客輕鬆出行。" }
        ];

        let isAllExpanded = false;

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            vocabData.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl p-5 shadow-sm border border-morandi-accent/60";
                
                card.innerHTML = `
                    <!-- 題目區塊：題號與挖空句子 -->
                    <div class="flex items-start gap-4">
                        <span class="flex-shrink-0 flex items-center justify-center w-8 h-8 mt-0.5 rounded-full bg-morandi-highlight text-morandi-primary font-bold text-sm">
                            ${item.id}
                        </span>
                        <p class="text-[1.05rem] text-morandi-textMain sentence-text font-medium">
                            ${item.en}
                        </p>
                    </div>

                    <!-- 隱藏的解答區塊 -->
                    <div id="answer-${item.id}" class="answer-transition">
                        <div class="mt-4 p-4 bg-morandi-highlight/50 rounded-lg border border-morandi-accent/40 text-center">
                            <h2 class="text-3xl font-bold text-morandi-primary mb-2 tracking-wider answer-word">${item.word}</h2>
                            <p class="text-[0.95rem] text-morandi-textSub leading-relaxed">
                                ${item.zh}
                            </p>
                        </div>
                    </div>

                    <!-- 切換按鈕 -->
                    <button 
                        id="btn-${item.id}"
                        onclick="toggleCard(${item.id})" 
                        class="mt-4 w-full py-2.5 bg-morandi-highlight hover:bg-morandi-accent text-morandi-primary font-semibold rounded-lg transition-colors flex items-center justify-center gap-2">
                        <span>顯示答案</span>
                        <svg class="w-4 h-4 transition-transform duration-300" id="icon-${item.id}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function toggleCard(id) {
            const answerDiv = document.getElementById(`answer-${id}`);
            const btn = document.getElementById(`btn-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            const isShowing = answerDiv.classList.contains('show');

            if (isShowing) {
                answerDiv.classList.remove('show');
                btn.querySelector('span').innerText = '顯示答案';
                btn.classList.remove('bg-morandi-primary', 'text-white');
                btn.classList.add('bg-morandi-highlight', 'text-morandi-primary');
                icon.classList.remove('rotate-180');
            } else {
                answerDiv.classList.add('show');
                btn.querySelector('span').innerText = '隱藏答案';
                btn.classList.remove('bg-morandi-highlight', 'text-morandi-primary');
                btn.classList.add('bg-morandi-primary', 'text-white');
                icon.classList.add('rotate-180');
            }
            
            checkAllStatus();
        }

        function toggleAll() {
            isAllExpanded = !isAllExpanded;
            
            vocabData.forEach(item => {
                const answerDiv = document.getElementById(`answer-${item.id}`);
                const btn = document.getElementById(`btn-${item.id}`);
                const icon = document.getElementById(`icon-${item.id}`);
                
                if (isAllExpanded) {
                    answerDiv.classList.add('show');
                    btn.querySelector('span').innerText = '隱藏答案';
                    btn.classList.remove('bg-morandi-highlight', 'text-morandi-primary');
                    btn.classList.add('bg-morandi-primary', 'text-white');
                    icon.classList.add('rotate-180');
                } else {
                    answerDiv.classList.remove('show');
                    btn.querySelector('span').innerText = '顯示答案';
                    btn.classList.remove('bg-morandi-primary', 'text-white');
                    btn.classList.add('bg-morandi-highlight', 'text-morandi-primary');
                    icon.classList.remove('rotate-180');
                }
            });

            updateGlobalBtnUI();
        }

        function checkAllStatus() {
            const allExpandedNow = vocabData.every(item => {
                return document.getElementById(`answer-${item.id}`).classList.contains('show');
            });
            const allCollapsedNow = vocabData.every(item => {
                return !document.getElementById(`answer-${item.id}`).classList.contains('show');
            });

            if (allExpandedNow) {
                isAllExpanded = true;
                updateGlobalBtnUI();
            } else if (allCollapsedNow) {
                isAllExpanded = false;
                updateGlobalBtnUI();
            }
        }

        function updateGlobalBtnUI() {
            const globalBtn = document.getElementById('toggleAllBtn');
            if (isAllExpanded) {
                globalBtn.innerText = '隱藏全部解答';
                globalBtn.classList.replace('bg-morandi-primary', 'bg-morandi-secondary');
            } else {
                globalBtn.innerText = '顯示全部解答';
                globalBtn.classList.replace('bg-morandi-secondary', 'bg-morandi-primary');
            }
        }

        window.onload = function() {
            renderCards();
        };
    </script>
</body>
</html>
