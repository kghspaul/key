<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跨考卷錯題與單字總複習中心</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9;
  --ink:#2b2620;--ink-soft:#5c5548;--accent:#c0392b;--correct:#1e7145;--correct-bg:#e6f4ec;--wrong:#a83232;--wrong-bg:#fbeceb;--clue:#8a5a00;--clue-bg:#fdf1dd;--tag-bg:#2b2620;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:960px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc);font-weight:800}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav.top-nav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px}
nav.top-nav button,nav.top-nav select,nav.top-nav input{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);font:inherit;font-size:.86rem;cursor:pointer}
nav.top-nav button.active{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
main{max-width:960px;margin:auto;padding:16px 16px 70px}

.q,.qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0;position:relative}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.n,.qnum{background:var(--acc);color:#fff;border-radius:6px;padding:2px 10px;font-weight:700;font-size:.95rem}
.tag,.badge-tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:1px 9px}
.ans,.answer-line{margin-left:auto;font-weight:700;color:var(--ok)}
.stem{margin:8px 0;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue,.clue-box{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--clue-bg);border-radius:0 6px 6px 0}
.correct-box{background:var(--correct-bg);border-left:3px solid var(--correct);padding:8px 10px;border-radius:0 6px 6px 0;margin:6px 0}
.wrong-item{background:var(--wrong-bg);border-left:3px solid var(--wrong);padding:8px 10px;border-radius:0 6px 6px 0;margin:6px 0}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line)}
ul.op li.ok,tr.correct td{background:var(--correct-bg);border-color:var(--ok)}
table.opts{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}
table.opts td{padding:6px 8px;border-bottom:1px solid var(--line)}

.exam-source{font-size:.78rem;background:var(--hl);color:var(--acc);padding:2px 10px;border-radius:99px;font-weight:700;display:inline-block;margin-bottom:6px}
.user-note{margin-top:10px;padding:8px 12px;background:var(--hl);border-left:4px solid var(--acc);border-radius:4px;font-size:.9rem}
.del-btn{border:1px solid var(--line);background:var(--bg);color:var(--no);border-radius:99px;padding:2px 10px;font-size:.78rem;cursor:pointer;float:right}
.del-btn:hover{background:var(--no);color:#fff}

/* 跨版型自我重測模式：隱藏答案與解析 */
body.quiz-mode .bl, body.quiz-mode .ans, body.quiz-mode .answer-line, body.quiz-mode .badge-tag.bg-emerald-100, body.quiz-mode .text-emerald-600, body.quiz-mode .qnum-ans-part { filter: blur(8px); user-select: none; cursor: pointer; }
body.quiz-mode .clue, body.quiz-mode .clue-box, body.quiz-mode .correct-box, body.quiz-mode .wrong-item, body.quiz-mode .expl, body.quiz-mode .bg-amber-50\/70, body.quiz-mode .bg-rose-50 { display: none !important; }
body.quiz-mode table.opts tr.correct td, body.quiz-mode table.opts tr.wrong td { background: transparent !important; color: var(--fg) !important; }
body.quiz-mode .opt-zh-hint { display: none !important; }
body.quiz-mode article table tr { background: transparent !important; }
body.quiz-mode article table td:first-child { color: var(--fg) !important; }
body.quiz-mode article table th:nth-child(n+2), body.quiz-mode article table td:nth-child(n+2) { display: none !important; }
body.quiz-mode ul.op li { background: transparent !important; border-color: var(--line) !important; }
body.quiz-mode ul.op li small, body.quiz-mode ul.op li i, body.quiz-mode ul.op li .op-exp-detail { display: none !important; }

/* 點擊揭曉後，還原顏色並顯示 SRS 按鈕 */
body.quiz-mode .revealed-card .bl, body.quiz-mode .revealed-card .ans, body.quiz-mode .revealed-card .answer-line, body.quiz-mode .revealed-card .badge-tag.bg-emerald-100, body.quiz-mode .revealed-card .text-emerald-600, body.quiz-mode .revealed-card .qnum-ans-part { filter: none !important; }
body.quiz-mode .revealed-card .clue, body.quiz-mode .revealed-card .clue-box, body.quiz-mode .revealed-card .correct-box, body.quiz-mode .revealed-card .wrong-item, body.quiz-mode .revealed-card .expl, body.quiz-mode .revealed-card .bg-amber-50\/70, body.quiz-mode .revealed-card .bg-rose-50 { display: block !important; }
body.quiz-mode .revealed-card .opt-zh-hint, body.quiz-mode .revealed-card ul.op li small, body.quiz-mode .revealed-card ul.op li i, body.quiz-mode .revealed-card ul.op li .op-exp-detail { display: inline !important; }
body.quiz-mode .revealed-card article table th:nth-child(n+2), body.quiz-mode .revealed-card article table td:nth-child(n+2) { display: table-cell !important; }
body.quiz-mode .revealed-card table.opts tr.correct td { background: var(--correct-bg) !important; }

.reveal-exp-btn{display:none;margin-top:10px;padding:6px 16px;border-radius:99px;border:1px solid var(--acc);background:var(--card);color:var(--acc);cursor:pointer;font-size:.86rem;font-weight:700;width:100%}
body.quiz-mode .reveal-exp-btn{display:block}

/* Anki 間隔重複按鈕 (SRS) */
.srs-bar { display: none; margin-top: 16px; gap: 8px; flex-wrap: wrap; padding-top: 14px; border-top: 2px dashed var(--line); }
body.quiz-mode .revealed-card .srs-bar { display: flex; }
.srs-btn { flex: 1; min-width: 60px; padding: 10px 4px; border: none; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.srs-btn:hover { opacity: 0.85; transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.srs-btn span { font-size: 11px; opacity: 0.8; font-weight: normal; }
.btn-again { background: #ef4444; }
.btn-hard { background: #f97316; }
.btn-good { background: #10b981; }
.btn-easy { background: #3b82f6; }

.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.v-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:10px;padding:16px;position:relative}
.v-word{font-size:1.25rem;font-weight:700;color:var(--acc);margin:8px 0;display:flex;align-items:center;gap:8px}
.speak-btn{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:2px 8px;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>

<div class="top">
  <h1>📚 跨考卷錯題與單字總複習中心</h1>
  <p>內建「間隔記憶演算法」，點擊自我重測模式，今天該複習的卡片會自動浮現！</p>
</div>

<nav class="top-nav">
  <button id="tab-q" class="active" onclick="switchTab('questions')">📝 錯題本 (<span id="q-count">0</span>)</button>
  <button id="tab-v" onclick="switchTab('vocab')">🔤 單字卡 (<span id="v-count">0</span>)</button>
  
  <select id="due-filter" onchange="render()" style="background:#e0e7ff; color:#3730a3; border-color:#818cf8; font-weight:700;">
    <option value="TODAY">⏳ 今日待複習</option>
    <option value="ALL">📂 所有紀錄</option>
  </select>

  <select id="exam-filter" onchange="render()"><option value="ALL">所有考卷</option></select>
  <button id="quiz-btn" onclick="toggleQuizMode()" style="border-color:var(--acc); color:var(--acc);">🎯 自我重測模式 (開啟記憶回饋)</button>

  <div style="margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
    <input type="text" id="sid-input" placeholder="👤 學號/暱稱" style="width:115px">
    <button id="sync-btn" onclick="pullCloud(true)">🔄 雲端同步</button>
  </div>
</nav>

<main>
  <div id="q-list"></div>
  <div id="v-list" class="vocab-grid" style="display:none"></div>
</main>

<script>
// ⚠️👇 務必將下方網址替換成你的 Google Apps Script 網址！
const GAS_URL = "https://script.google.com/macros/s/AKfycbz4d11mhhpKrOul0U05G5J0MyrAODB9byZeOzfSeyd005XPf6m1jMSrAeuqgULevn5q/exec";
const STORAGE_KEY = "kghs_exam_bookmarks_v1";
const STUDENT_KEY = "kghs_student_id";

let currentTab = "questions";
let vocabCloze = false;

function getData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("exam_study_bookmarks_v1");
    const parsed = JSON.parse(raw);
    return {
      questions: Array.isArray(parsed?.questions) ? parsed.questions : [],
      vocab: Array.isArray(parsed?.vocab) ? parsed.vocab : []
    };
  } catch {
    return { questions: [], vocab: [] };
  }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

const sidInput = document.getElementById("sid-input");
sidInput.value = localStorage.getItem(STUDENT_KEY) || localStorage.getItem("exam_student_id") || "";
sidInput.addEventListener("change", e => {
  localStorage.setItem(STUDENT_KEY, e.target.value.trim());
  pullCloud(true);
});

async function pullCloud(showAlert = false) {
  const sid = sidInput.value.trim();
  if (!sid) {
    if (showAlert) alert("請先輸入學號或暱稱！");
    return;
  }
  const btn = document.getElementById("sync-btn");
  if (btn) btn.textContent = "⏳ 同步中...";
  try {
    const res = await fetch(`${GAS_URL}?studentId=${encodeURIComponent(sid)}`);
    const json = await res.json();
    if (json.status === "ok") {
      saveData({ questions: json.questions || [], vocab: json.vocab || [] });
      if (showAlert) alert("✅ 雲端標記同步完成！");
    }
  } catch (e) {
    if (showAlert) alert("⚠️ 無法連線雲端，目前顯示本機紀錄");
  } finally {
    if (btn) btn.textContent = "🔄 雲端同步";
  }
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById("tab-q").classList.toggle("active", tab === "questions");
  document.getElementById("tab-v").classList.toggle("active", tab === "vocab");
  document.getElementById("q-list").style.display = tab === "questions" ? "block" : "none";
  document.getElementById("v-list").style.display = tab === "vocab" ? "grid" : "none";
}

function toggleQuizMode() {
  if (currentTab === "questions") {
    document.body.classList.toggle("quiz-mode");
    const isQuiz = document.body.classList.contains("quiz-mode");
    document.getElementById("quiz-btn").classList.toggle("active", isQuiz);
    document.getElementById("quiz-btn").textContent = isQuiz ? "👁️ 關閉重測模式" : "🎯 自我重測模式 (開啟記憶回饋)";
  } else {
    vocabCloze = !vocabCloze;
    document.body.classList.toggle("quiz-mode", vocabCloze);
    document.getElementById("quiz-btn").classList.toggle("active", vocabCloze);
    document.getElementById("quiz-btn").textContent = vocabCloze ? "👁️ 關閉背誦模式" : "🎴 單字挖空背誦模式";
    render();
  }
}

function removeItem(type, id, e) {
  if (e) e.stopPropagation();
  const data = getData();
  data[type] = data[type].filter(x => x.id !== id);
  saveData(data);
  const sid = sidInput.value.trim();
  if (sid) {
    fetch(GAS_URL, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", studentId: sid, itemType: type === "questions" ? "question" : "vocab", item: { id } }) });
  }
}

function speak(word, e) {
  if (e) e.stopPropagation();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

// === 核心：輕量化 SM-2 間隔記憶演算法 ===
function processSRS(type, id, quality, e) {
  if (e) e.stopPropagation();
  const data = getData();
  const arr = data[type];
  const idx = arr.findIndex(x => x.id === id);
  if (idx === -1) return;

  const item = arr[idx];
  let ease = item.ease || 2.5;
  let interval = item.interval || 0;
  let reps = item.reps || 0;

  // Quality: 0(Again), 1(Hard), 2(Good), 3(Easy)
  if (quality === 0) {
    reps = 0; interval = 0; ease = Math.max(1.3, ease - 0.2);
  } else if (quality === 1) {
    reps = Math.max(1, reps); interval = Math.max(1, interval * 1.2); ease = Math.max(1.3, ease - 0.15);
  } else if (quality === 2) {
    reps += 1;
    if (reps === 1) interval = 1;
    else if (reps === 2) interval = 3;
    else interval = Math.round(interval * ease);
  } else if (quality === 3) {
    reps += 1;
    if (reps === 1) interval = 4;
    else interval = Math.round(interval * ease * 1.3);
    ease += 0.15;
  }

  item.ease = ease;
  item.interval = interval;
  item.reps = reps;
  item.nextReview = Date.now() + (interval * 24 * 60 * 60 * 1000);

  saveData(data);
  
  // 同步更新回雲端 (Upsert)
  const sid = sidInput.value.trim();
  if (sid && GAS_URL.startsWith("https://script.google.com") && !GAS_URL.includes("請替換")) {
    fetch(GAS_URL, {
      method: "POST", mode: "no-cors",
      body: JSON.stringify({ action: "upsert", studentId: sid, itemType: type === "questions" ? "question" : "vocab", item })
    });
  }
}

function getSRSBarHtml(type, id, reps) {
  // 動態生成四個按鈕與預估天數
  let dHard = "1天"; let dGood = reps === 0 ? "1天" : (reps === 1 ? "3天" : "順延"); let dEasy = reps === 0 ? "4天" : "大延";
  return `
    <div class="srs-bar">
      <div style="width:100%; text-align:center; color:#64748b; font-size:12px; margin-bottom:2px;">請誠實評估你的記憶力，決定下次複習時間：</div>
      <button class="srs-btn btn-again" onclick="processSRS('${type}', '${id}', 0, event)">🔴 重來<span>< 10分</span></button>
      <button class="srs-btn btn-hard" onclick="processSRS('${type}', '${id}', 1, event)">🟠 困難<span>${dHard}</span></button>
      <button class="srs-btn btn-good" onclick="processSRS('${type}', '${id}', 2, event)">🟢 良好<span>${dGood}</span></button>
      <button class="srs-btn btn-easy" onclick="processSRS('${type}', '${id}', 3, event)">🔵 簡單<span>${dEasy}</span></button>
    </div>
  `;
}

function render() {
  const data = getData();
  const filterEl = document.getElementById("exam-filter");
  const dueFilter = document.getElementById("due-filter").value;
  const currFilter = filterEl.value;

  const exams = [...new Set([...data.questions.map(q => q.examTitle), ...data.vocab.map(v => v.examTitle)].filter(Boolean))];
  filterEl.innerHTML = `<option value="ALL">所有考卷 (${exams.length})</option>` + exams.map(ex => `<option value="${ex}">${ex}</option>`).join("");
  if (exams.includes(currFilter)) filterEl.value = currFilter;

  const now = Date.now();
  const isDue = (item) => !item.nextReview || item.nextReview <= now;

  const qs = data.questions.filter(q => (filterEl.value === "ALL" || q.examTitle === filterEl.value) && (dueFilter === "ALL" || isDue(q)));
  const vs = data.vocab.filter(v => (filterEl.value === "ALL" || v.examTitle === filterEl.value) && (dueFilter === "ALL" || isDue(v)));

  document.getElementById("q-count").textContent = qs.length;
  document.getElementById("v-count").textContent = vs.length;

  const qList = document.getElementById("q-list");
  if (qs.length === 0) {
    qList.innerHTML = `<div class="q" style="text-align:center;color:var(--mut);padding:40px 20px;">🎉 太棒了！${dueFilter === "TODAY" ? "今天的錯題複習任務已全部清空！" : "目前還沒有標記的題目。"}</div>`;
  } else {
    qList.innerHTML = "";
    qs.forEach(q => {
      const det = document.createElement("details");
      det.className = "q";
      det.open = true;

      const temp = document.createElement("div");
      temp.innerHTML = q.htmlContent || "";
      const innerDetails = temp.querySelector("details.q");
      det.innerHTML = innerDetails ? innerDetails.innerHTML : (q.htmlContent || "");

      det.querySelectorAll("ul.op li").forEach(li => {
        const parts = li.innerHTML.split(/<br\s*\/?>/i);
        if (parts.length > 1) li.innerHTML = parts[0] + `<span class="op-exp-detail"><br>` + parts.slice(1).join("<br>") + `</span>`;
      });

      let summary = det.querySelector("summary") || document.createElement("summary");
      if (!det.querySelector("summary")) det.insertBefore(summary, det.firstChild);

      const srcBadge = document.createElement("span");
      srcBadge.className = "exam-source";
      srcBadge.textContent = `${q.examTitle || "考卷"} - ${q.qNum || ""}`;
      summary.insertBefore(srcBadge, summary.firstChild);

      const delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.textContent = "✕ 移除";
      delBtn.onclick = (e) => removeItem("questions", q.id, e);
      summary.appendChild(delBtn);

      const qb = det.querySelector(".qb") || det;
      if (q.note) {
        const noteDiv = document.createElement("div");
        noteDiv.className = "user-note";
        noteDiv.innerHTML = `<b>📝 我的筆記：</b>${q.note}`;
        qb.insertBefore(noteDiv, qb.firstChild);
      }
      
      const revealBtn = document.createElement("button");
      revealBtn.className = "reveal-exp-btn";
      revealBtn.textContent = "👁️ 點擊揭曉對答案 (並安排下次複習)";
      revealBtn.onclick = () => det.classList.add("revealed-card");
      
      const stemEl = qb.querySelector(".stem");
      if (stemEl) stemEl.after(revealBtn); else qb.appendChild(revealBtn);

      // 加入記憶回饋按鈕
      qb.insertAdjacentHTML("beforeend", getSRSBarHtml("questions", q.id, q.reps || 0));
      qList.appendChild(det);
    });
  }

  const vList = document.getElementById("v-list");
  if (vs.length === 0) {
    vList.innerHTML = `<div class="q" style="grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 20px;">🎉 恭喜！${dueFilter === "TODAY" ? "今天的單字背誦任務已清空！" : "目前還沒有收藏的單字。"}</div>`;
  } else {
    vList.innerHTML = "";
    vs.forEach(v => {
      const card = document.createElement("div");
      card.className = "v-card";
      const wordStr = String(v.word || "");
      const sentStr = String(v.contextSentence || "");
      const safeRegex = new RegExp(`(${wordStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, "gi");
      const highlightedSent = sentStr.replace(safeRegex, `<span class="bl">$1</span>`);
      const maskedSent = sentStr.replace(safeRegex, `<span class="bl" style="color:transparent!important;background:var(--line)!important">______</span>`);

      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="exam-source">${v.examTitle || "考卷"}</span>
          <button class="del-btn" onclick="removeItem('vocab', '${v.id}', event)">✕ 移除</button>
        </div>
        <div class="v-word">
          <span class="v-word-text">${vocabCloze ? "❓ 點擊卡片翻開" : wordStr}</span>
          <button class="speak-btn" onclick="speak('${wordStr.replace(/'/g, "\\'")}', event)">🔊 發音</button>
        </div>
        <div class="stem"><div class="en">${vocabCloze ? maskedSent : highlightedSent}</div></div>
        ${v.note ? `<div class="user-note" style="display:${vocabCloze ? 'none' : 'block'}">${v.note}</div>` : ""}
        ${getSRSBarHtml("vocab", v.id, v.reps || 0)}
      `;
      card.onclick = () => {
        if (!vocabCloze) return;
        card.classList.add("revealed-card");
        const wordEl = card.querySelector(".v-word-text");
        const enEl = card.querySelector(".en");
        const noteEl = card.querySelector(".user-note");
        wordEl.textContent = wordStr;
        enEl.innerHTML = highlightedSent;
        if (noteEl) noteEl.style.display = "block";
      };
      vList.appendChild(card);
    });
  }
}

// 頁面載入時先渲染本機資料，若已有學號則自動向雲端拉取最新資料
render();
if (sidInput.value.trim()) pullCloud(false);
</script>
</body>
</html>
