let appHtml = '';
let qNum = 1;
let currentWord = '';

const lines = rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0 && l !== '|');

for (let i = 0; i < lines.length; i++) {
  let line = lines[i];
  
  if (!line.startsWith('|')) {
    currentWord = line;
  } else {
    let sentenceData = line.substring(1).trim();
    let zhStartIndex = sentenceData.search(/[\u4e00-\u9fa5]/);
    
    let en = sentenceData;
    let zh = '';
    
    if (zhStartIndex !== -1) {
        en = sentenceData.substring(0, zhStartIndex).trim();
        zh = sentenceData.substring(zhStartIndex).trim();
    }
    
    // 把題幹裡頭含有底線的字彙轉換為挖空填空格式
    en = en.replace(/[a-zA-Z]*_+[a-zA-Z]*/g, '[[|' + currentWord + ']]');
    
    let body = '<div class="para"><div class="s"><div class="en">' + fx(en) + '</div><div class="zh">' + zh + '</div></div></div>';
    let clueHtml = clue('本題測驗單字「<b>' + currentWord + '</b>」。請根據句意「' + zh + '」推敲，填入正確的字彙。');
    
    appHtml += card(qNum++, ['文意字彙', '詞性需求：單字'], currentWord, body + clueHtml);
  }
}
