<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>502 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>502 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

/* === Part 1: 課前字彙 & L1 ~ L73 課文講解 === */
const h1 = '<h2 id="p1">課前字彙 ＆ L1 ~ L73 課文講解</h2>' +
  passage("Thinking Ahead 課前字彙與引言", [[
    ["字彙表：groundbreaking (adj. 創新的) ｜ boost (v. 增強；提高) ｜ spot (v. 看見/注意到) ｜ sibling (n. 兄弟姐妹) ｜ exaggerated (adj. 誇張的) ｜ definitely (adv. 肯定地) ｜ come across (phr. 偶然發現) ｜ avoid (v. 避免) ｜ verify (v. 證實) ｜ consume (v. 食用；飲用)", "課前核心字彙整理。"],
    ["Last Sunday, I [[1|came across]] Jack, an old friend of mine. He looked depressed because he had suffered a lot of losses. His sibling told him a [[2|groundbreaking]] piece of news: [[3|consuming]] one bottle of ostrich soup a day could keep COVID-19 away.", "上週日我偶遇了老朋友傑克。他看起來很沮喪，因為他遭受了許多損失。他的兄弟姊妹告訴他一則突破性的消息：每天喝一瓶鴕鳥湯可以預防新冠肺炎。"],
    ["What’s better, it was on sale. Then, Jack spent a lot of money on the so-called ostrich soup. Then, these bottles were [[4|verified]] to be fake. Jack’s story tells us not to believe in foods with an [[5|exaggerated]] curative effect.", "更棒的是，它正在特價。於是傑克花了一大筆錢買所謂的鴕鳥湯。後來這些湯被證實是假貨。傑克的故事告訴我們不要相信具有誇大療效的食品。"],
    ["1. 引言：It is easier to con people than to convince them (that) they have been conned.", "欺騙別人，比說服他們相信自己已經被騙了還要容易。"]
  ]]) + [
  card("L1", ["分詞後位修飾與字彙", "containing 包含"], "C",
    st("Fake news can be defined as news [[L1|containing]] false or misleading information that appears truthful.", "假新聞可以定義為包含看似真實的錯誤或誤導性資訊的新聞。") +
    clue("• <code>contain</code> vt. 包含（此處用主動現在分詞 <code>containing</code> 修飾 news）<br>• <code>consist of</code> 由…組成 = <code>be composed of = be comprised of = be made up of = comprise</code><br>• <code>consist in</code> 在於 = <code>lie in</code>") +
    ops([
      ["consisting in", "16%", "consist in 表「在於」，若表由…組成應為 <code>consisting of</code>。"],
      ["composed by", "16%", "應為 <code>composed of</code>。"],
      ["containing", "67%", "現在分詞 <code>(which contains) containing</code> 表包含。"],
      ["comprised", "3%", "應為 <code>comprised of</code> 或主動 <code>comprising</code>。"]
    ], "C") +
    passage("3. L1 & 4. L2 補充例句", [[
      ["The class consists of 20 students. = The class is [composed/comprised/made up] of 20 students. = The class contains/comprises 20 students.", "這個班級由 20 名學生組成。"],
      ["True education does not consist in simply being taught facts.", "真正的教育並不在於只是被傳授事實。"],
      ["4. L2 Fake news can be defined as news containing false or misleading information that appears (to be) truthful. (= seems (to be) truthful)", "課文句型對照。"],
      ["true (adj. 真實的)：The movie is based on a true story. / It's true that I'm going to marry him.", "這部電影改編自真實故事。／我要嫁給他是真的。"],
      ["truthful (adj. 誠實的；根據事實的)：The public has a right to expect truthful answers from politicians. / He gave a truthful account of his experiences in the jungle.", "大眾有權要求政治人物給出誠實的回答。／他如實敘述了自己在叢林中的經歷。"],
      ["real (真實的，非人造/非偽造/非幻想的) vs. realistic (寫實的，看起來像真的) vs. right (正確的)：Santa Claus isn't a real person. / The coat is made of real fur. / The special effects were so realistic. / His ideas have now been proved right.", "聖誕老人不是真實存在的人。／這件大衣是真皮毛做的。／特效非常逼真寫實。／他的想法現在已被證明是正確的。"]
    ]])
  ),

  card("L3", ["受詞補語句型", "make + O + OC"], "A",
    st("Although fake news has long been in existence and this issue is as old as the news industry itself, the Internet and social media have [[L3|made]] creating and sharing fake news easier and faster than ever.", "雖然假新聞早已存在，且這個問題與新聞產業本身一樣古老，但網際網路與社群媒體已使製造與分享假新聞比以往更加容易且快速。") +
    clue("<code>make + O. (creating and sharing fake news) + OC (easier and faster)</code> 使創造與分享假新聞更容易也更快速。") +
    ops([
      ["made", "50%", "構成 <code>have made + O + OC</code>。"],
      ["been", "9%", "後接動名詞與形容詞比較級無法構成此語意。"],
      ["kept", "40%", "keep 表「維持原本就有的狀態」，但以前並沒有這麼容易快速，是網路「使其變得（made）」更容易快速。"],
      ["stayed", "3%", "不及物連綴動詞，後不可接動名詞受詞。"]
    ], "A") +
    passage("6. L3 ~ 8. L6 課文與補充例句", [[
      ["6. L3 Although fake news has long been in existence (= existed) ...", "雖然假新聞早已存在…"],
      ["7. L4 … and this issue is as old as the news industry itself (新聞業本身)：We've checked the wiring so the problem may be the television itself.", "我們已經檢查過線路，所以問題可能出在電視機本身。"],
      ["8. L6 Consequently, people may be deceived by fake news, believing the content to be genuine (≒ true/real) without questioning (質疑) the sources.", "因此，人們可能會被假新聞欺騙，在不質疑消息來源的情況下相信內容是真實的。"],
      ["We need laws that will protect genuine/real refugees. / The strap is genuine/real leather.", "我們需要能保護真正難民的法律。／這條錶帶是真皮的。"]
    ]])
  ),

  card("L8", ["對等平行結構", "to understand ... and to question ..."], "C",
    st("With so much fake news being spread every day, it is now more important than ever to understand where such news comes from and [[L8|to question]] the news stories we read.", "隨著每天有這麼多假新聞在散播，現在比以往任何時候都更重要的是去了解這類新聞從何而來，並質疑我們所讀到的新聞報導。") +
    clue("• 句首 <code>With so much fake news being spread</code> 為 <code>with + O + OC</code>（spread 三態同形）。<br>• 後半句為虛主詞 <code>it</code> 搭配兩個由 <code>and</code> 連接的真主詞不定詞：<code>to understand ... and to question ...</code>。") +
    ops([
      ["questioning", "27%", "與前面的 <code>to understand</code> 不對稱。"],
      ["be questioned", "11%", "我們是「主動質疑」新聞報導，非被質疑。"],
      ["to question", "61%", "與 <code>to understand</code> 平行對稱。"],
      ["by questioning", "3%", "結構不對稱。"]
    ], "C")
  ),

  card("L12", ["因果動詞片語", "come from 源自於"], "A",
    st("Although fake news comes in many forms, two are the most common. First, fake news can [[L12|come from]] sloppy journalism, which means that journalists write stories based on unreliable information or without fact-checking their sources prior to publication.", "雖然假新聞有許多形式，但有兩種最為常見。首先，假新聞可能源自於粗心草率的新聞工作，這意味著記者根據不可靠的資訊撰寫報導，或是在發表前沒有查核其消息來源。") +
    clue("• 11. L12：<code>come in ... forms/sizes/colors</code> 是指「有⋯形式／尺寸／顏色」（例：<i>This skirt comes in many colors.</i>）。<br>• 假新聞是「結果」，粗心的新聞工作（sloppy journalism）是「原因」，故用 <code>come from / result from</code>（源自於、起因於）。") +
    ops([
      ["come from", "83%", "來自於、源自於（後接原因）。"],
      ["result in", "12%", "導致（後接結果，應改為 <code>result from</code>）。"],
      ["give rise to", "2%", "引起、導致。"],
      ["lead to", "2%", "導致（<code>lead to = result in = give rise to = cause</code>）。"]
    ], "A")
  ),

  card("L16", ["獨立分詞構句與 including 陷阱", "examples including"], "D",
    st("Second, some news contains deliberately false information to achieve political results, [[L16|examples including]] attempts to influence people to vote for someone or to support a particular cause.", "其次，有些新聞包含蓄意捏造的錯誤資訊以達成政治目的，例子包括試圖影響人們投票給某人或支持特定理想目標。") +
    clue("注意 <code>including</code> 的合理性：<br>• 若只填 <code>(A) including</code>（= which include），在語意上會變成前面的「政治結果（political results）包含這些企圖（attempts）」，但「企圖影響選民」是「假新聞的例子（examples）」，而不是「政治結果」本身！<br>• 課文原句為分號連接子句：<code>... achieve social or political results; examples include attempts to...</code><br>• 若前面改為逗號（無連接詞），因前後主詞不同（S1 為 <code>some news</code>，S2 為 <code>examples</code>），保留主詞 <code>examples</code> 並將動詞改為分詞 <code>including</code>，即構成獨立分詞結構 <code>, examples including attempts to...</code>！") +
    ops([
      ["including", "60%", "常見陷阱！會變成修飾緊鄰的 political results，造成「結果包含企圖」的邏輯矛盾。"],
      ["inclusive of", "9%", "同上，修飾對象不合理。"],
      ["examples included", "9%", "<code>examples included</code> 只能放在列舉項目的後面表「例子包含在內」。"],
      ["examples including", "22%", "保留不同主詞 <code>examples</code> 的獨立分詞結構（= <code>; examples include...</code>）。"]
    ], "D") +
    passage("13. L19 ~ 17. L22 補充例句", [[
      ["13. L19 vote for (= vote in favor of 投票支持…) vs. vote against (投票反對)：In the meeting, 55 people voted for Ken’s proposal, while only 2 voted against it.", "在會議中，55 人投票支持肯的提案，而只有 2 人投票反對。"],
      ["14. L20 cause n. 某一群人所支持的崇高、利他的理想或目標：She devoted her life to the cause of women’s rights.", "她將一生奉獻給女權運動的理想。"],
      ["16. L22 highlight vt. = emphasize 強調、凸顯", "同義字整理。"],
      ["17. L22 long-lasting consequences 持續長久的後果 (= consequences that last long)：adv.-V-ing 的複合形容詞還有 hard-working（認真工作的）、fast-changing（快速變化的）、far-reaching（影響深遠的）。", "複合形容詞整理。"]
    ]])
  ),

  card("L23", ["易混淆形容詞", "respected 受人尊敬的/權威的"], "A",
    st("The following two examples illustrate the harm fake news can cause. The first highlights the potential long-lasting consequences of false information. In 1998, a British researcher published a small-scale study in a [[L23|respected]] medical journal, and it linked the MMR vaccine to autism.", "以下兩個例子說明了假新聞可能造成的傷害。第一個例子凸顯了錯誤資訊潛在的深遠後果。1998 年，一名英國研究人員在一份備受推崇（權威）的醫學期刊上發表了一項小規模研究，將麻疹腮腺炎德國麻疹混合疫苗（MMR）與自閉症連結在一起。") +
    clue("<code>respect</code> 家族完整辨析：<br>• <code>respected</code> adj. 受人尊敬的、受推崇的（修飾人或權威期刊）<br>• <code>respectful</code> adj. 恭敬的、充滿敬意的（-ful = full，人對別人恭敬）<br>• <code>respective</code> adj. 個別的、各自的<br>• <code>respectable</code> adj. 品行端正的、體面的、正當的") +
    ops([
      ["respected", "40%", "備受推崇的、權威的（修飾 medical journal）。"],
      ["respectful", "27%", "對他人恭敬有禮的（期刊不會對人恭敬）。"],
      ["respecting", "7%", "現在分詞，不作此形容詞用法。"],
      ["respective", "27%", "各自的。"]
    ], "A") +
    passage("18. L23 & 19. L25 補充例句", [[
      ["She respected him for his honesty. / He is a highly respected journalist.", "她因為他的誠實而尊敬他。／他是一位備受敬重的記者。"],
      ["They listened in respectful silence. / They chatted about their respective childhoods.", "他們恭敬地靜靜聆聽。／他們聊著各自的童年。"],
      ["They are respectable citizens. / She leads a respectable life.", "他們是品行端正的公民。／她過著體面正當的生活。"],
      ["19. L25 link A to B 把 A 和 B 聯繫在一起 / 把 A 連結到 B：Numerous studies have linked smoking to lung cancer.", "無數的研究已將吸菸與肺癌連結在一起。"]
    ]])
  ),

  card("L26", ["因果轉折詞", "As a result 因此"], "D",
    st("The media provided extensive coverage of this flawed study. [[L26|As a result]], the belief that the MMR vaccine could cause autism became widespread. Some people’s confidence in the vaccine was shattered, and vaccination rates dropped.", "媒體對這項有瑕疵的研究進行了廣泛報導。因此，認為 MMR 疫苗會導致自閉症的看法變得普遍。有些人對疫苗的信心破滅，疫苗接種率也隨之下降。") +
    clue("媒體廣泛報導這項有瑕疵的研究，「因此（As a result）」造成錯誤信念廣為流傳。<br>21. L27：<code>flawed</code> adj. 有瑕疵的（例：<i>The research behind this report is seriously flawed.</i>）。") +
    ops([
      ["In addition", "16%", "此外。"],
      ["On the other hand", "3%", "另一方面。"],
      ["In other words", "6%", "換言之。"],
      ["As a result", "75%", "因此。"]
    ], "D")

    clue("前句才剛說「要看文章發表在哪裡（<code>where the article has been published</code>）」，接著說「如果它是由 BBC 或 CNN 等權威平台所發表的，那就很可能是可靠的」。<br>這是在<b>不知道事實的情況下所做的真實條件判斷（直說語氣，正常時態）</b>，而且主要子句是現在式 <code>it <b>is</b> likely reliable</code>，故 If 子句呼應前句用現在完成被動式 <code>has been published</code>！") +
    ops([
      ["has been", "56%", "真實條件句（直說語氣），搭配主要子句現在式 <code>it is likely reliable</code>。"],
      ["had been", "2%", "過去完成式用於「與過去事實相反的假設」。"],
      ["were", "40%", "常見誤答！誤以為凡是 If 都要用假設語氣 were，但這不是與事實相反的假設，且主要子句是 <code>it is</code> 而非 <code>it would be</code>！"],
      ["will be", "2%", "If 條件子句不用未來式，且文章已經發表了。"]
    ], "A") +
    passage("42. L66 & 43. L67 補充例句", [[
      ["不知道事實時，用直說語氣（正常時態）：He will go to the concert if he can get tickets.", "如果他能買到票，他就會去聽演唱會。"],
      ["知道事實，但與事實相反時，才需用假設語氣：If I had been more careful, I wouldn't have spilled coffee on my laptop.", "如果我當時更小心一點，就不會把咖啡灑在筆電上了。"],
      ["43. L67 likely (adj. 可能的 / adv. 可能地)：likely 當副詞時通常只搭配 most/very/quite likely (= probably)，如 I would very likely have done the same thing in your situation. 故課文 it is likely reliable 在真實語料中更常見的寫法為 it is likely to be reliable（頻率相差 170 倍）。", "語料庫用法補充。"]
    ]])
  ),

  card("L67", ["動詞片語辨析", "appeal to readers' emotions 訴諸情緒"], "A",
    st("Last but not least, a clear sign of a factual report is objective writing that does not [[L67|appeal to]] readers’ emotions or use deliberately provocative language.", "最後但同樣重要的是，事實報導的一個明確標誌是客觀的寫作，不會訴諸讀者的情緒或使用蓄意煽動挑釁的語言。") +
    clue("<code>appeal to + N</code> 三大意思：<br>1. 懇求（<i>appealed to the crowd not to panic</i>）<br>2. 吸引（<i>appeals to me</i>）<br>3. <b>訴諸於（藉由…以說服他人）</b>：<code>appeal to readers’ emotions</code>（訴諸讀者的情緒，藉煽動情緒來說服讀者）、<code>appeal to force</code>（訴諸武力）。") +
    ops([
      ["appeal to", "38%", "訴諸於（讀者的情緒）。"],
      ["react to", "29%", "對…做出反應（文章不會對讀者的情緒做出反應）。"],
      ["refer to", "16%", "參考；提及。"],
      ["object to", "16%", "反對。"]
    ], "A") +
    passage("44. L67 選項補充例句", [[
      ["Under no circumstances should we appeal to force when dealing with conflicts with others.", "在處理與他人的衝突時，我們在任何情況下都不應訴諸武力。"],
      ["(A) In the face of diplomatic deadlock, the leaders appealed to mediation to find a peaceful solution to the international conflict. / The classic novel's timeless themes still appeal to readers of all generations.", "面對外交僵局，領袖們訴諸調解以尋求和平解決方案。／這部經典小說永恆的主題仍吸引著各世代讀者。"],
      ["(B) People react to stress in different ways; some become more focused, while others may feel overwhelmed. / It's important to carefully consider how you react to criticism, as it can impact your personal growth.", "人們對壓力有不同反應。／仔細思考你如何回應批評是很重要的。"],
      ["(C) In her essay, the author frequently refers to historical events to support her arguments. / During the lecture, the professor mentioned a few books to refer to for further reading.", "在文章中作者經常提及歷史事件以支持論點。／講座中教授提到幾本供進一步參考的書籍。"],
      ["(D) Some employees object to the new dress code, as they feel it restricts their personal expression. / The community members are likely to object to the construction of a noisy factory in their peaceful neighborhood.", "部分員工反對新的服裝規定。／社區居民很可能會反對在寧靜社區興建吵雜的工廠。"]
    ]])
  ),

  card("L70", ["動詞句型搭配", "prevent sb from V-ing (不可用 avoid)"], "B",
    st("These features can [[L70|prevent]] us from falling for fake news so that we can see the world accurately.", "這些特徵可以防止我們輕信假新聞，讓我們能正確地看待這個世界。") +
    clue("極重要考點！觀察空格後的結構是 <code>___ us (O) from falling (V-ing)</code>：<br>• <code>prevent / stop / keep + O + from V-ing</code>（防止／阻止某人做某事）<br>• <code>avoid</code> 後面<b>只能接 N 或 V-ing</b>（<code>avoid + N / V-ing</code>），<b>絕對沒有 <code>avoid sb from V-ing</code> 的用法</b>！") +
    ops([
      ["avoid", "—", "文法錯誤！avoid 不可接 <code>us from falling</code>（應改為 <i>help us avoid falling</i>）。"],
      ["prevent", "—", "<code>prevent us from falling for fake news</code>（防止我們受騙相信假新聞）。"],
      ["restrict", "—", "限制（用法為 <code>restrict sb to N</code>）。"],
      ["distinguish", "—", "區分、辨別（用法為 <code>distinguish A from B</code>）。"]
    ], "B") +
    passage("45. L70 ~ 48. L73 課文與補充例句", [[
      ["(O) I try to avoid going shopping on Saturdays. / (X) Rubber seals are fitted to avoid the gas from escaping. → (O) Rubber seals are fitted to prevent the gas from escaping.", "我試著避免在週六去購物。／安裝橡皮封嘴是為了防止瓦斯外洩。"],
      ["(A) To maintain a healthy lifestyle, it's important to avoid consuming excessive sugary foods and drinks. / She decided to avoid rush hour traffic by leaving for work earlier in the morning.", "為了維持健康生活型態，避免攝取過多含糖飲食很重要。／她決定提早出門上班以避開尖峰車潮。"],
      ["(B) The strong security measures prevented the protesters from entering the restricted area during the event. / Regular exercise and a balanced diet can help prevent many lifestyle-related diseases.", "嚴格的維安措施阻止抗議者在活動期間進入管制區。／規律運動與均衡飲食有助於預防許多文明病。"],
      ["(C) The new regulations will restrict the use of certain harmful chemicals in manufacturing processes. / To maintain a healthy weight, it's important to restrict your intake of high-calorie foods.", "新法規將限制在製造過程中使用某些有害化學物質。／為了維持健康體重，限制高熱量食物攝取很重要。"],
      ["(D) The ability to distinguish between reliable and unreliable sources of information is crucial in the digital age. / The artist's unique style of painting easily distinguishes his work from that of his contemporaries.", "在數位時代，區分可靠與不可靠資訊來源的能力至關重要。／這位藝術家獨特的畫風使其作品很容易與同代畫家區別開來。"],
      ["46. L72 In the current age of news overload, we must all watch out for fake news lest we fall victim to it.", "在當前資訊超載的時代，我們都必須小心防範假新聞，以免成為其受害者。"],
      ["watch out for 小心防範：When you are walking in the grass, you should watch out for snakes. ／ L73 fall victim/prey to 成為⋯的受害者：It’s reported that many popular tourist attractions have fallen victim to overtourism.", "走在草地上時應小心蛇。／據報導許多熱門景點已成為過度旅遊的受害者。"],
      ["47. L73 Useful strategies are to think critically about what we are reading and to conduct further research on news stories to check their content [[|before]] accepting them as truth.", "實用的策略是批判性地思考我們所讀的內容，並對新聞報導進行進一步查證以確認內容，然後再（在…之前 before）將其當作事實接受。"],
      ["48. L73 With due diligence (= When we have due diligence), we can win the war against fake news and help (us) (to) improve society.", "只要具備應有的謹慎查證（due 適當的/應有的；diligence 勤奮/審慎），我們就能打贏這場對抗假新聞的戰爭並協助改善社會。"]
    ]])
  )
].join('');

/* === Part 2: 句型與翻譯練習 === */
const h2 = '<h2 id="p2">課本句型與翻譯練習 (lest / for fear that / for fear of / in case)</h2>' +
  passage("句型講義重點整理與填空 (1~6) ＆ 課本句型 (2~6)", [
    [
      ["1. … lest + S + (should) VR ｜ 2. … for fear that + S + 助動詞 (限 would/should/might) ｜ 3. … for fear of + 名詞/動名詞 ｜ 4. … in case (that) + 正常子句 (無動詞限制)", "四大「以免／唯恐／以防萬一」句型結構總整理。"],
      ["填空1：Put on a coat [[|in case (that)]] it gets cold.", "穿件外套以防變冷。（gets 為現在簡單式，故用 in case）"],
      ["填空2：Amy threw away everything her ex-boyfriend gave her [[|for fear that]] she would feel sad when seeing them.", "艾咪把前男友送她的東西全丟了，深怕看到時會難過。（後接助動詞 would，用 for fear that）"],
      ["填空3：Helen wrote down what to buy in the supermarket [[|in case (that)]] she forgot.", "海倫寫下在超市要買的東西以防忘記。（forgot 為過去式，用 in case）"],
      ["填空4：The manager asked us to proofread the document [[|lest]] there be errors.", "經理要求我們校對文件以免有錯。（後接原形 be，用 lest）"],
      ["填空5：I turned on the light [[|for fear that]] I might fall down the stairs in the dark.", "我把燈打開，深怕在黑暗中摔下樓梯。（後接助動詞 might，用 for fear that）"],
      ["填空6：Tom slowed down suddenly [[|lest / in case (that)]] he hit the car ahead.", "湯姆突然減速，以免撞上前車。（hit 三態同形，可視為原形配 lest 或過去式配 in case）"]
    ],
    [
      ["課本句型補充：drunk driving 酒駕 (N.) vs. Don’t drink and drive. (V. 酒後不開車)", "詞性與慣用說法比較。"],
      ["課本2：[[|You should wear a face mask lest droplets spread the virus.]]", "你應該戴口罩，以免飛沫傳播病毒。（-let = 小，如 booklet 小冊子、piglet 小豬）"],
      ["課本3：[[|If you feel unwell, stay home lest you spread the virus to others.]]", "如果你覺得身體不適，待在家裡以免把病毒傳染給他人。"],
      ["課本4：[[|Those in quarantine should not go outside lest they be punished.]]", "居家檢疫／隔離者不應外出，以免受罰。（quarantine 傳染病隔離 vs. isolation 與世隔絕）"],
      ["課本5：[[|People should avoid crowded places lest they come into contact with the virus.]]", "人們應避開擁擠場所，以免接觸到病毒。"],
      ["課本6：[[|People are advised against spreading fake news lest they be fined.]]", "建議民眾切勿散播假新聞，以免受罰。"]
    ]
  ]) + [
  card("翻譯-1", ["for fear of + V-ing", "以免困在車陣中"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">1. 我們提早出門，以免困在車陣中。(for fear of)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|We left home earlier for fear of getting stuck in traffic / a traffic jam.]]")+'</div></div>' + clue("亦可用 <code>We set out earlier...</code>；介系詞 <code>for fear of</code> 後接動名詞 <code>getting stuck</code>。")),
  card("翻譯-2", ["lest + S + (should) be p.p.", "以免病患受到打擾"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">2. 建議訪客在醫院裡要輕聲說話，以免病患受到打擾。(lest) (Visitors are...)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Visitors are advised to speak in a low voice / softly in the hospital lest the patients be disturbed / bothered.]]")+'</div></div>' + clue("重要提醒：(X) <code>Visitors are suggested to...</code>（<code>suggest</code> 絕對不可接 <code>to VR</code>，被動也不行！必須用 <code>Visitors are advised to...</code>）。")),
  card("翻譯-3", ["lest + S + (should) be p.p.", "以免分心"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">3. Chris 讀書前會關掉手機，以免分心。(lest)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|Chris turns off his smartphone before he studies (before studying) lest he be distracted.]]")+'</div></div>' + clue("「分心（被分散注意力）」為被動 <code>be distracted</code>，接在 <code>lest</code> 後用原形 <code>be distracted</code>。")),
  card("翻譯-4", ["lest / for fear that", "就怕老師生氣"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">4. 學生準時繳交作業，就怕老師生氣。(lest)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|The students hand in their homework/assignments on time lest the teacher get angry.]]")+'</div></div>' + clue("<code>lest</code> 後接單數主詞 <code>the teacher</code> 時，動詞仍須用原形 <code>get</code>（省略 should）！")),
  card("翻譯-5", ["for fear that + S + would/should/might + VR", "以免滑倒受傷"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">5. 救生員警告人們不要在水池區奔跑，以免滑倒受傷。(for fear that)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[|The lifeguard warns people not to run (warns people against running) in the pool area for fear that they would/should/might slip and get hurt/injured.]]")+'</div></div>' + clue("<code>for fear that</code> 子句中必須搭配助動詞 <code>would / should / might + VR</code>。")),
  card("翻譯-6", ["for fear that vs. for fear of", "就怕吵到哥哥"], "參考譯文", '<div class="stem"><div class="zh" style="color:inherit">6. Alex 聽音樂會戴上耳機，就怕吵到他哥哥 Luke。(for fear that / for fear of)</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>• '+fx("[[|Alex puts on his earphones while listening to music for fear that he would/should/might disturb his brother Luke.]]")+'<br>• '+fx("[[|Alex puts on his earphones while listening to music for fear of disturbing his brother Luke.]]")+'</div></div>' + clue("<code>for fear that</code> 接完整子句（含助動詞）；<code>for fear of</code> 接動名詞 <code>disturbing</code>。"))
].join('');

document.getElementById('app').innerHTML = h1 + h2;
const secs=[['p1','課前字彙 & L1~L73 課文講解'],['p2','句型與翻譯練習']];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){open=!open;document.querySelectorAll('details.q').forEach(d=>d.open=open);this.textContent=open?'全部收合':'全部展開';};
</script>
<script src="bookmark.js"></script>
</body>
</html>
