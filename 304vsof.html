<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>304 Vocabulary 詳解 — Lesson 4: Day of the Dead</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
.feature-box{background:var(--hl);border-left:4px solid var(--acc);padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;font-size:0.9rem;color:var(--fg);}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
nav a.review-btn{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold;}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--zh-color, var(--mut));font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
.bank span{background:var(--bg);border:1px solid var(--line);padding:2px 10px;border-radius:6px;font-family:Georgia,serif;font-weight:600}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>304 Vocabulary (A4版) — Lesson 4: Day of the Dead</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與易錯詞性／搭配詞誤答分析（共 67 格）</p>
  <div class="feature-box">
    💡 <b>複習指南：</b> 點擊每題右上角的「標記此題」可收錄錯題；滑鼠反白任何英文字句可「收藏單字」。請前往 <a href="review.html" target="_blank" style="color:var(--acc);font-weight:bold;">錯題與單字總複習頁面</a> 進行閃卡測驗與匯出。
  </div>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag" id="secret-trigger" style="user-select:none;cursor:default;">考點</span> <span class="tag pos">詞性需求</span></p>
  <div id="secret-counter" style="display:none; margin-top:8px; font-size:0.9rem; color:var(--mut);">
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    👁️ <b>本頁瀏覽人次：</b><span id="busuanzi_value_page_pv"></span> 次
  </div>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let html = '';

// ==================== PART A ====================
html += '<h2 id="partA">Part A. Choose the vocabulary word that best suits the sentence. (題庫選詞與詞性變化)</h2>';

html += '<section class="pas"><h3>Word Bank 單字題庫 (需視語境做詞性與字尾變化)</h3>' +
  '<div class="bank">' +
  '<span>reunite (v. 重聚)</span><span>concept (n. 概念)</span><span>reception (n. 接待；婚宴)</span>' +
  '<span>restore (v. 修復)</span><span>cycle (n. 循環)</span><span>essential (adj. 必要的)</span>' +
  '<span>participate (v. 參與)</span><span>inevitable (adj. 不可避免的)</span><span>joy (n. 喜悅)</span>' +
  '<span>mourn (v. 哀悼)</span><span>resemble (v. 相似)</span><span>dawn (n. 黎明)</span>' +
  '</div>' +
  '<p class="note">注意：Part A 雖提供題庫單字，但空格需依據句中語法位置進行詞性轉換（如名詞、形容詞、動名詞或時態變化）及搭配適當介系詞。</p>' +
  '</section>';

html += passage('Part A 題組總覽 (A1 ~ A11)', [
  [
    ['1. The [[1|essential]] element of a successful marriage is trust. For a couple who want to maintain a healthy and happy marriage, it is [[1|essential]] that they trust each other.', '成功婚姻的必要元素是信任。對一對想要維持健康快樂婚姻的夫妻而言，彼此信任是極為必要的。'],
    ['2. Pia has an annual class [[2|reunion]] with her college roommates. They [[2|reunite]] with each other annually updating each other on their lives.', 'Pia 每年都會與她的大學室友舉辦同學會。她們每年重聚，向彼此更新近況。'],
    ['3. This Christmas is an especially [[3|joyous/joyful]] holiday for Dave. Tears of [[3|joy]] rolled down his cheeks when he heard the [[3|joyful]] news that his wife is pregnant.', '今年聖誕節對 Dave 來說是個特別歡樂的節日。當他聽到妻子懷孕的喜訊時，喜悅的淚水從臉頰滑落。'],
    ['4. Ken [[4|resembles]] his brother, Kyle, in appearance, but they’re actually not twins. / * Ken [[4|bears]] a striking [[4|resemblance]] [[4|to]] his brother, Kyle, but they’re not twins.', 'Ken 在外貌上與他的兄弟 Kyle 很像，但他們其實不是雙胞胎。／Ken 與他的兄弟 Kyle 長得極為相似，但他們不是雙胞胎。'],
    ['5. The authorities plan to [[5|restore]] the historic building damaged by the earthquake. Thus, it will be closed for [[5|restoration]] before it is reopen to the public.', '當局計畫修復那棟在地震中受損的歷史建築。因此，在重新對外開放之前，它將關閉進行修復工程。'],
    ['6. My grandpa used to be a farmer who had to work on the farm from [[6|dawn]] to/till dusk.', '我爺爺以前是位農夫，必須從黎明到黃昏都在農場工作。'],
    ['7. It is important that the [[7|receptionists]] of the wedding [[7|reception]] dress formally and make sure every guest is well [[7|received]].', '婚禮招待會（婚宴）的接待人員穿著正式，並確保每位賓客都受到妥善接待，這是很重要的。'],
    ['8. Students are encouraged to [[8|participate]] [[8|in]] extracurricular activities to broaden their horizons. / * Students’ [[8|participation]] [[8|in]] extracurricular activities helps broaden their horizons.', '學生被鼓勵參與課外活動以開拓視野。／學生對課外活動的參與有助於開拓他們的視野。'],
    ['9. The central [[9|concept]] of this story has to do with helping people without asking for anything in return.', '這個故事的核心概念與助人不求回報有關。'],
    ['10. The man’s [[10|mournful]] look shows that he still [[10|mourns]] the death of his wife. In fact, he has [[10|mourned]] for/over his wife for three years.', '這名男子悲慟的神情顯示他仍在哀悼妻子的逝世。事實上，他已經為妻子哀悼了三年。'],
    ['11. It is [[11|inevitable]] that everyone goes through a life [[11|cycle]] of birth, old age, sickness and death.', '每個人都會經歷生、老、病、死的生命循環，這是不可避免的。']
  ]
]);

// A1
html += card('A1', ['考點：必要性形容詞與假設語氣句型', '詞性需求：形容詞 / 形容詞'], 'essential / essential',
  stem('1') +
  clue('第一格位於冠詞 <b>The</b> 與名詞 <b>element</b>（元素）之間，需填形容詞修飾名詞；第二格為經典句型 <b>It is essential that + S + (should) + V</b>（……是極為必要的），故兩格皆填原形形容詞 <b>essential</b>。') +
  ops([
    ['essential / essential', 'adj. 極為必要的；不可或缺的', '第一格修飾名詞 element（核心／必要元素）；第二格構成 It is essential that they (should) trust each other 的假設語氣句型，語意與文法完全正確。'],
    ['essence / essential', 'n. 本質 / adj. 必要的', '第一格誤用名詞 essence。<b>何時才對：</b>若改為介系詞片語 <i>in essence</i>（本質上）或 <i>The essence of a successful marriage is trust</i>（不加 element）時才用名詞。'],
    ['inevitable / inevitable', 'adj. 不可避免的', '題庫另一形容詞，但「信任」是經營婚姻的「必要條件」而非「不可避免的宿命」，且後面搭配 that 子句省略 should 的動詞原形 trust，屬於重要性／必要性形容詞（essential）的專屬文法。<b>何時才對：</b>描述生老病死等自然法則無法避免時（如第 11 題）。'],
    ['essentially / essential', 'adv. 本質上 / adj. 必要的', '第一格誤填副詞，副詞無法直接修飾名詞 element。<b>何時才對：</b>修飾形容詞或動詞時（如 <i>A successful marriage is essentially built on trust</i>）。']
  ], 'A')
);

// A2
html += card('A2', ['考點：同根詞轉換 (reunite vs. reunion)', '詞性需求：單數名詞 / 動詞原形'], 'reunion / reunite',
  stem('2') +
  clue('第一格前有不定冠詞 <b>an</b>、形容詞 <b>annual</b> 及名詞修飾語 <b>class</b>，構成複合名詞 <b>class reunion</b>（同學會）；第二格主詞為複數代名詞 <b>They</b>，且副詞 <b>annually</b>（每年）提示現在簡單式習慣動作，故填動詞原形 <b>reunite</b>。') +
  ops([
    ['reunion / reunite', 'n. 重聚；聚會 / v. 重聚', 'class reunion 為固定搭配「同學會」，reunite with each other 表示「與彼此重聚」，詞性與時態完全符合。'],
    ['reunite / reunion', 'v. 重聚 / n. 聚會', '兩格詞性顛倒。an annual class 後須接名詞，而主詞 They 後須接動詞。<b>何時才對：</b>將兩者位置互換時才正確。'],
    ['reception / reunite', 'n. 接待會 / v. 重聚', '第一格誤填 reception。雖然 reception 也是聚會（接待會／婚宴），但「同學會」固定搭配為 <b>class reunion</b>，且同題前後句為同字根家族（reunion / reunite）對照練習。<b>何時才對：</b>指婚禮宴客（wedding reception）或飯店櫃檯時（如第 7 題）。'],
    ['reunion / reunited', 'n. 聚會 / v. 過去式', '第二格誤用過去式 reunited。前句動詞 has 為現在式，且本句有頻率副詞 annually（每年），應維持現在簡單式 reunite。<b>何時才對：</b>描述過去某一次特定重聚事件（如 <i>last year</i>）時。']
  ], 'A')
);

// A3
html += card('A3', ['考點：情緒名詞與衍生形容詞 (joy 家族)', '詞性需求：形容詞 / 不可數名詞 / 形容詞'], 'joyous (joyful) / joy / joyful',
  stem('3') +
  clue('第一格位於副詞 <b>especially</b> 後、名詞 <b>holiday</b> 前，需填形容詞 <b>joyous</b> 或 <b>joyful</b>；第二格位於介系詞 <b>of</b> 後，構成固定搭配 <b>tears of joy</b>（喜極而泣的淚水），需填名詞 <b>joy</b>；第三格修飾名詞 <b>news</b>（消息），填形容詞 <b>joyful</b>。') +
  ops([
    ['joyous (joyful) / joy / joyful', 'adj. 歡樂的 / n. 喜悅 / adj. 令人高興的', '完美對應三格所需的「形容詞 → 名詞 → 形容詞」結構，tears of joy（喜悅的淚水）與 joyful news（喜訊）皆為道地搭配。'],
    ['joy / joyous / joyful', 'n. / adj. / adj.', '第一格與第二格詞性顛倒。holiday 為名詞，前面不可直接放情緒抽象名詞 joy 修飾；介系詞 of 後則必須接名詞 joy。<b>何時才對：</b>第一格改為形容詞、第二格改為名詞時。'],
    ['joyfully / joy / joyful', 'adv. 喜悅地 / n. / adj.', '第一格誤用副詞 joyfully。雖然前面有副詞 especially，但整個字群是用來修飾後方的名詞 holiday（副詞 especially 修飾形容詞 joyous/joyful，再修飾名詞 holiday）。<b>何時才對：</b>修飾一般動詞時（如 <i>celebrated Christmas joyfully</i>）。'],
    ['mournful / mourning / mournful', 'adj. 悲傷的 / n. 哀悼 / adj. 悲傷的', '語意與上下文完全相反。聽到妻子懷孕且在聖誕節，通常為喜訊（joyful news）而非悲訊。<b>何時才對：</b>描述喪親之痛時（如第 10 題）。']
  ], 'A')
);

// A4
html += card('A4', ['考點：動詞與名詞片語轉換 (resemble = bear a resemblance to)', '詞性需求：第三人稱單數動詞 / 動詞 / 名詞 / 介系詞'], 'resembles / bears / resemblance / to',
  stem('4') +
  clue('第一句主詞為第三人稱單數 <b>Ken</b>，及物動詞「與……相似」直接受詞 his brother，故填 <b>resembles</b>（注意不可加 to 或 with）；第二句轉換為名詞片語結構：<b>bear a (striking) resemblance to sb.</b>（與某人極為相似），主詞 Ken 為單數，故依序填 <b>bears</b>、<b>resemblance</b>、<b>to</b>。') +
  ops([
    ['resembles / bears / resemblance / to', 'v. 相似 / v. 帶有 / n. 相似處 / prep. 與…', 'resemble 為及物動詞（不加介系詞），而轉為名詞 resemblance 時必須搭配動詞 bear（或 have）以及介系詞 to，四格完全精準。'],
    ['resembles to / has / resemblance / with', '搭配詞錯誤', 'resemble 作動詞時後面絕對不可加介系詞 to；而名詞 resemblance 後面固定搭配介系詞 <b>to</b>（偶用 between A and B），不搭配 with。<b>何時才對：</b>刪去第一格後的 to，並將最後一格 with 改為 to。'],
    ['resemble / bear / resemblance / to', '主詞動詞單複數不一致', '主詞 Ken 為第三人稱單數且後句動詞 they’re 為現在式，故動詞必須加 -s（resembles / bears）。<b>何時才對：</b>當主詞為複數（如 <i>Ken and his brother</i>）或助動詞後才用原形。'],
    ['resembling / bears / resembling / to', '分詞與動名詞誤用', '第一格缺少主要動詞，不可只填分詞 resembling；第三格前有冠詞 a 與形容詞 striking，必須填純正名詞 resemblance。<b>何時才對：</b>作分詞構句時才用 resembling。']
  ], 'A')
);

// A5
html += card('A5', ['考點：動名轉換 (restore → restoration)', '詞性需求：原形動詞 / 名詞'], 'restore / restoration',
  stem('5') +
  clue('第一格位於不定詞 <b>plan to</b> 後，受詞為 the historic building damaged by the earthquake（被地震損毀的歷史建築），故填原形動詞 <b>restore</b>（修復）；第二格位於介系詞 <b>for</b> 後表示關閉的目的，需填名詞 <b>restoration</b>（修復工程）。') +
  ops([
    ['restore / restoration', 'v. 修復 / n. 修復（工程）', 'plan to restore（計畫修復）搭配 closed for restoration（關閉以進行整修），詞性與語意皆完全正確。'],
