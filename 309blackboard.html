<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>309 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>309 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}
const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

let h = '';

h += '<h2 id="p1">L1~L49 課文與重點解析</h2>';

h += passage("L1", [
  [["Every year, more than five million people participate in the Mazu pilgrimage.", "每年，有超過五百萬人參加媽祖遶境。"]],
  [["participate in = take part in = join in = be involved in (參與活動的準備、進行等；參加比賽)。", "join 加入(組織/人)。join 和 join in 亦可用在「已開始的」活動。We’re going to the movies. Would you like to join us? He started to sing and I joined in (the singing)."]],
  [["attend = go to 上課；參加(只需付出注意力的活動，如party, concert, wedding, school, class等) (attend 🡸 attention)", "Only 12 people attended the funeral."]],
  [["enter 報名參加(比賽) = compete in", "I’d like to [enter/compete] in the speech contest."]]
]);

h += passage("L1 participate: 講義重點1(自習)", [
  [["講義重點1(自習)", ""]]
]);

h += passage("講義重點1參考答案", [
  [["1. Everyone in the class is expected to participate in these discussions actively.", ""]],
  [["2. I've voiced/expressed my opinion at every meeting I've attended.", ""]]
]);

h += passage("L2", [
  [["It is no exaggeration to say that this event might just be the world’s largest and wildest birthday party.", "毫不誇張地說，這個活動可能正是世界上最大的、最狂熱的生日派對。"]]
]);

h += passage("L4", [
  [["The festivities do not end until the participants have celebrated for nine days and journeyed over 300 kilometers in central Taiwan.", "慶祝活動要等到參與者慶祝了九天，並在台灣中部跋涉了三百多公里後才會結束。"]]
]);

h += passage("L6", [

]);

h += passage("undoubtedly: 講義重點2(自習)", [
  [[" Since television helps us relax after a tiring day, there is no doubt that it is regarded as an indispensable source of family entertainment.", "A. undoubtedly 為副詞，不可引導that子句\nB. no doubt 同上\nC. there is no doubt that + 完整子句 (… 是毫無疑問的)\nD. doubtfully 令人懷疑地"]],

]);

h += passage("重點整理", [
  [["(X) undoubtly (X) doubtlessly 這兩個字不存在", ""]],
  [["(O) undoubtedly = doubtless = without (a) doubt 無疑地 (adv.)", "Doubtless/Undoubtedly he is wrong. = There is no doubt that he is wrong.\n(X) It’s no doubt that he is wrong."]],
  [["undoubted 通常只用在名詞前：", "例 The film was an undoubted success."]]
]);

h += passage("講義重點3 日期表達法", [
  [["② falls in", ""]],
  [["③ Chinese new year falls early this year.", ""]],
  [["④ My mom’s birthday fell on a Monday so we celebrated it a day earlier.", ""]]
]);

h += passage("L7", [
  [["can’t-V 🡺 (複合形容詞) 不可…的；不可能…的", "This is a can't-go-wrong gift for her or yourself.\nThis coding boot camp is a can't-lose pursuit.\nThis is a can't-fail, easy-care, low-water plant."]]
]);

h += passage("請先進入挑戰題1", [
  [["請先進入挑戰題1", ""]]
]);

h += card("挑戰題1", ["時態"], "A",
  st("The pilgrimage, which honors the sea goddess Mazu, [[挑戰題1|sets]] out from Dajia’s Zhenlan Temple around her birthday, the twenty-third day of the third month on Taiwan’s lunar calendar.", "這場尊崇海神媽祖的遶境，在台灣農曆三月二十三日她的生日左右，從大甲鎮瀾宮出發。") +
  clue("The pilgrimage(S), which honors the sea goddess Mazu(形容詞子句), sets(V) out from Dajia’s Zhenlan Temple around her birthday, the twenty-third day of the third month on Taiwan’s lunar calendar.(her birthday的同位語)") +
  ops([
    ["sets", "39%", "不隨時間改變的情況用現在簡單式"],
    ["is set", "11%", "set out 出發(無被動式)"],
    ["setting", "36%", "導致本句缺V"],
    ["set", "14%", "不隨時間改變的情況用現在簡單式"]
  ], "A")
);

h += passage("L8 補充", [
  [["honor = show respect for 尊重/向…表示敬意", "The mayor honored the firefighters for their bravery during the rescue mission."]],
  [["I have the honor of introducing tonight's speaker.", "有這榮幸"]],
  [["It has been an honor to serve under you, Mr. Geller.", "是一種榮幸 擔任你的屬下"]]
]);

h += passage("L11", [
  [["The exact date and time, which vary from year to year, are determined earlier.", "確切的日期和時間每年都不一樣，會提前決定。"]],
  [["from N1 to N1 在…與…之間(表示變化或持續性)", "from year to year 在年與年之間\nfrom generation to generation 在代與代之間\nfrom country to country 在國與國對間\nThe cost of living changes from country to country."]]
]);

h += passage("L13", [
  [["During the Lantern Festival, temple authorities cast two half-moon-shaped wooden blocks to decide the actual schedule.", "在元宵節期間，廟方會擲出兩塊半月形的木筊來決定實際的行程。"]],
  [["與cast有關的字通常皆三態同形：", "cast 丟、拋\nbroadcast 廣播\nforecast 預報"]]
]);

h += card("挑戰題(上句改寫)", ["動詞時態"], "B",
  st("A few months earlier on the Lantern Festival, temple authorities at Zhenlan Temple in Dajia [[挑戰題(上句改寫)|flipped]] two half-moon-shaped wooden blocks to determine the exact starting date and time of the pilgrimage.", "幾個月前的元宵節，大甲鎮瀾宮的廟方人員擲了兩塊半月形的木筊，來決定遶境確切的出發日期和時間。") +
  clue("A few months earlier(時間副詞1) on the Lantern Festival(時間副詞2), temple authorities(主詞) at Zhenlan Temple(介片修飾authorities) in Dajia(介片修飾temple) cast/flipped(動詞) two half-moon-shaped(形1) wooden(形2) blocks(受詞) to determine the exact starting date and time of the pilgrimage.(不定詞片語表目的) *不定詞可當名、形、副詞") +
  ops([
    ["flip", "25%", ""],
    ["flipped", "54%", ""],
    ["flipping", "21%", ""],
    ["to flip", "0%", ""]
  ], "B")
);

h += passage("解題祕訣", [
  [["★ 綜合測驗常會改寫原文，有時只是把句子加長，但考點並不難。解題祕訣：看不懂長句時，先刪除所有的形容詞、副詞(含分詞、不定詞)，所以本句只剩紅色部分為關鍵：", ""]]
]);

h += card("挑戰題：請填入ago / earlier", ["時間副詞"], "earlier",
  st("Six months ago, I bought a new car. Six months [[挑戰題：請填入ago / earlier|earlier]], I had started saving for it.", "六個月前，我買了一輛新車。再早六個月前，我已經開始為此存錢了。") +
  clue("= I started saving 12 months ago, and then bought the car after saving for six months.<br>a week ago: 從現在起算的一週前<br>a week earlier: 從前文所提到的時間起算的一週前") +
  ops([], "earlier")
);

h += card("One more try", ["時間副詞"], "earlier",
  st("Elephants also remember events from the past. When arriving at exactly the same place where a relative died many years [[One more try|earlier]], elephants will pause and silently mourn the lost member of their herd.", "大象也記得過去的事件。當到達許多年前親屬死亡的完全相同的地方時，大象會停下來，默默地哀悼失去的象群成員。") +
  clue("從前文所提到的過去時間(arriving)起算的一段時間前，故用 earlier。") +
  ops([], "earlier")
);

h += card("L15", ["數量詞", "大約"], "A",
  st("At the chosen time, [[L15|some]] 200,000 pilgrims set out from Zhenlan Temple on foot and visit more than 100 temples over the course of nine days.", "在選定的時間，大約二十萬名香客徒步從鎮瀾宮出發，並在九天的行程中參拜了一百多座廟宇。") +
  clue("choose, chose, chosen vt./vi. 選擇 choice n. 選擇") +
  ops([
    ["some", "36%", "+ 數字 + 名詞 = 大約… = about / approximately / roughly. He spent some twelve years of his life in Africa."],
    ["those", "29%", "那20萬人(哪個20萬人？前文並無提到20萬人)"],
    ["when", "36%", "關係副詞，引導形容詞子句(缺主要子句)"],
    ["in which", "4%", "同上 (in which 子句引導形容詞子句)"]
  ], "A")
);

h += passage("L16", [
  [["on foot 表去某地方的方式是用走路的(而非使用交通工具)", "It takes about 30 minutes on foot, or 10 minutes by car.\nThe city is best explored on foot."]]
]);

h += passage("L17", [
  [["during the course of 在…的過程中 = in the course of = throughout the course of = over the course of", "He's seen many changes during the course of his long life.\nWe struck up a conversation, in the course of which it emerged* that he was an aspiring* YouTuber.\n*emerge Vi. (事實)浮現/被知道\n*aspiring 想要在某職業成功的 e.g. an aspiring writer, actor, etc."]]
]);

h += passage("L17 課文", [
  [["They are accompanied every step of the way by a statue of Mazu, which is carried in a sedan chair.", "她們沿途都有媽祖的神像陪伴，神像被抬在神轎裡。"]]
]);

h += passage("L17 (講義重點4)", [
  [["accompany Vt. (O) 陪著(某人)(去某處/去做某事) (X) 與…作伴(使其不孤單)", "I had two tickets, so I asked him to accompany me."],
   ["keep sb company 陪伴某人(以免其孤單)", "I'll keep you company until the train comes."],
   ["spend time with 陪陪… / 和…在一起共度時光 = be with", "I want to spend more time with my family."]]
]);

h += passage("講義重點4(自習)", [
  [[" 如果我只有三個月可活，我會多花時間陪家人。", "If I had only three months to live, I would spend more time with my family."],
   [" Rita的先生這個禮拜不在家，所以我常過去陪她。", "Rita's husband is away for the week, so I often go over and keep her company."],
   [" 14歲以下的孩童需由一名成人陪同。", "Children under 14 must be accompanied by an adult."]]
]);

h += card("L20", ["倒裝句"], "D",
  st("Although the pilgrims’ strength may wane during the long journey, [[L20|never]] do their passion and dedication fade.", "雖然香客們的體力在漫長的旅程中可能會衰退，但他們的熱情和虔誠從未消退。") +
  clue("否定副詞(單/片/子句) + 倒裝句") +
  ops([
    ["in which they", "29%", "在旅程中他們「做」熱情，而虔誠消退？"],
    ["not until they", "14%", "正確用法如下：Not until they discovered their passion did they find true happiness in life."],
    ["not only", "0%", "不只他們的熱情和虔誠減退？"],
    ["never", "57%", ""]
  ], "D")
);

h += passage("L21", [
  [["dedication: the willingness to give a lot of time and energy to something because it is important 願意奉獻的精神", "課文中≒虔誠\nShe thanked the staff for their dedication and enthusiasm. 她感謝全體員工的奉獻精神和工作熱情。"]]
]);

h += passage("請先進入挑戰題2", [
  [["請先進入挑戰題2", ""]]
]);

h += card("L22", ["介系詞片語"], "A",
  st("[[L22|Apart from being / Besides being]] a chance for people to show their devotion to the goddess, this annual festival is a spectacular and heart-warming event.", "除了作為讓人們展現對女神虔誠的機會外，這個一年一度的節日也是一場壯觀且溫馨的盛事。") +
  clue("Apart from being... = Besides being... = In addition to being...") +
  ops([
    ["Besides being", "70%", "除了是…外(包含)"],
    ["Except (that)", "16%", "(conj.) 只不過(有個例外)；除了…外 I love this house, except (that) the kitchen is too small."],
    ["Rather than", "9%", "並非"],
    ["In spite of", "5%", "儘管"]
  ], "A")
);

h += passage("L22 補充", [
  [["L22 apart from / aside from / other than / besides / except / except for 用法整理(講義重點5)", ""]],
  [["devotion = dedication", ""]]
]);

h += card("L24", ["連接詞"], "B",

    ["before", "45%", "(conj.)"],
    ["once", "7%", "(conj.)"],
    ["for which", "26%", ""]
  ], "B")
);

h += passage("L25", [
  [["like no other 與眾不同的；極佳的；無法複製的", "… a scene like no other (scene) = a unique scene"]],
  [["Riding on a sleigh pulled by reindeer is an experience like no other.", ""]],
  [["I love him. He has so much charisma on stage. He plays guitar like no other.", ""]]

h += card("L26", ["分詞構句"], "C",
  st("Throngs of people fill the streets, while the explosive sounds of drums, horns, fireworks, and firecrackers pierce the air. When the statue of Mazu finally emerges from the temple in her sedan chair, the crowd surrounds her, [[L26|excited]] to send her off on her long journey.", "當媽祖的神像終於乘著神轎從廟裡出來時，群眾圍繞著她，興奮地送她踏上漫長的旅程。") +
  clue("the crowd surrounds her, (and the crowd is) excited to send her off on her long journey *主詞相同時可省略 “連接詞+主詞+be”") +
  ops([

    ["exciting", "27%", "他們(群眾)令人興奮？"],
    ["excited", "55%", "(who is) excited 他們(群眾)感到興奮"],
