<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>309 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>309 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h = '';

// --- 補充段落 / 情境閱讀 ---
h += '<h2 id="p1">課文與重點解析</h2>';

h += passage("情境閱讀", [
  [["Every year, more than five million people participate in the Mazu pilgrimage.", "每年，有超過五百萬人參加媽祖遶境。[cite: 9]"]],
  [["It is no exaggeration to say that this event might just be the world’s largest and wildest birthday party.", "毫不誇張地說，這個活動可能正是世界上最大的、最狂熱的生日派對。[cite: 9]"]],
  [["The festivities do not end until the participants have celebrated for nine days and journeyed over 300 kilometers in central Taiwan.", "慶祝活動要等到參與者慶祝了九天，並在台灣中部跋涉了三百多公里後才會結束。[cite: 9]"]],
  [["Undoubtedly, the Mazu pilgrimage is a can’t-miss event for visitors to Taiwan.", "毫無疑問地，媽祖遶境是來台灣的遊客不可錯過的盛事。[cite: 9]"]]
]);

h += passage("重點解析補充", [
  [["participate in = take part in = join in = be involved in (參與活動的準備、進行等；參加比賽)。", "join 加入(組織/人)。join 和 join in 亦可用在「已開始的」活動。"],
   ["attend = go to 上課；參加(只需付出注意力的活動，如 party, concert, wedding, school, class 等)。", "enter = compete in 報名參加(比賽)。[cite: 9]"]],
  [["undoubtedly = doubtless = without (a) doubt 無疑地 (adv.)。", "There is no doubt that + 完整子句 (… 是毫無疑問的)。(X) undoubtly (X) doubtlessly 這兩個字不存在。[cite: 9]"]],
  [["can’t-V 複合形容詞：不可…的；不可能…的。例如：a can't-miss event (不可錯過的盛事)。[cite: 9]"]]
]);

// --- 挑戰題 ---
h += '<h2 id="p2">挑戰題 (課文內容)</h2>';

h += card('1', ['時態'], 'A',
  '<div class="stem"><div class="en">The pilgrimage, which honors the sea goddess Mazu, '+fx("[[1|sets]]")+' out from Dajia’s Zhenlan Temple around her birthday, the twenty-third day of the third month on Taiwan’s lunar calendar.</div><div class="zh">這場尊崇海神媽祖的遶境，在台灣農曆三月二十三日她的生日左右，從大甲鎮瀾宮出發。[cite: 9]</div></div>' +
  clue('不隨時間改變的情況 (每年固定的活動) 用現在簡單式。set out (出發) 無被動式。[cite: 9]') +
  ops([
    ['sets', '出發', '現在簡單式[cite: 9]'],
    ['is set', '', 'set out 無被動式[cite: 9]'],
    ['setting', '', '導致本句缺主要動詞[cite: 9]'],
    ['set', '', '主詞為 The pilgrimage 單數，應加 s[cite: 9]']
  ], 'A')
);

h += passage("情境閱讀", [
  [["The exact date and time, which vary from year to year, are determined earlier. During the Lantern Festival, temple authorities cast two half-moon-shaped wooden blocks to decide the actual schedule.", "確切的日期和時間每年都不一樣，會提前決定。在元宵節期間，廟方會擲出兩塊半月形的木筊來決定實際的行程。[cite: 9]"]]
]);

h += card('2', ['動詞時態'], 'B',
  '<div class="stem"><div class="en">A few months earlier on the Lantern Festival, temple authorities at Zhenlan Temple in Dajia '+fx("[[2|flipped]]")+' two half-moon-shaped wooden blocks to determine the exact starting date and time of the pilgrimage.</div><div class="zh">幾個月前的元宵節，大甲鎮瀾宮的廟方人員擲了兩塊半月形的木筊，來決定遶境確切的出發日期和時間。[cite: 9]</div></div>' +
  clue('句首為 A few months earlier，表示過去時間，故動詞使用過去式 flipped。[cite: 9]') +
  ops([
    ['flip', '', '現在式[cite: 9]'],
    ['flipped', '擲', '過去式[cite: 9]'],
    ['flipping', '', '非主要動詞[cite: 9]'],
    ['to flip', '', '非主要動詞[cite: 9]']
  ], 'B')
);

h += card('3', ['時間副詞', 'ago vs earlier'], 'B',
  '<div class="stem"><div class="en">Six months '+fx("[[3|ago]]")+', I bought a new car. Six months '+fx("[[4|earlier]]")+', I had started saving for it.</div><div class="zh">六個月前，我買了一輛新車。再早六個月前，我已經開始為此存錢了。[cite: 9]</div></div>' +
  clue('ago: 從現在起算的一段時間前；earlier: 從前文所提到的過去時間起算的一段時間前。[cite: 9]') +
  ops([
    ['ago / ago', '', '[cite: 9]'],
    ['ago / earlier', '前 / 更早之前', '[cite: 9]'],
    ['earlier / ago', '', '[cite: 9]'],
    ['earlier / earlier', '', '[cite: 9]']
  ], 'B')
);

h += card('4', ['時間副詞'], 'B',
  '<div class="stem"><div class="en">Elephants also remember events from the past. When arriving at exactly the same place where a relative died many years '+fx("[[5|earlier]]")+', elephants will pause and silently mourn the lost member of their herd.</div><div class="zh">大象也記得過去的事件。當到達許多年前親屬死亡的完全相同的地方時，大象會停下來，默默地哀悼失去的象群成員。[cite: 9]</div></div>' +
  clue('從過去事件 (arriving) 起算的多年前，使用 earlier。[cite: 9]') +
  ops([
    ['ago', '', '[cite: 9]'],
    ['earlier', '更早之前', '[cite: 9]'],
    ['before', '', '[cite: 9]'],
    ['past', '', '[cite: 9]']
  ], 'B')
);

h += card('5', ['數量詞', '大約'], 'A',
  '<div class="stem"><div class="en">At the chosen time, '+fx("[[6|some]]")+' 200,000 pilgrims set out from Zhenlan Temple on foot and visit more than 100 temples over the course of nine days.</div><div class="zh">在選定的時間，大約二十萬名香客徒步從鎮瀾宮出發，並在九天的行程中參拜了一百多座廟宇。[cite: 9]</div></div>' +
  clue('some + 數字 + 名詞 = 大約... (= about / approximately / roughly)。[cite: 9]') +
  ops([
    ['some', '大約', '= about / approximately[cite: 9]'],
    ['those', '', '那20萬人(前文並無提到20萬人)[cite: 9]'],
    ['when', '', '若用when，則整個句子缺乏主要子句[cite: 9]'],
    ['in which', '', '同上[cite: 9]']
  ], 'A')
);

h += passage("情境閱讀", [
  [["They are accompanied every step of the way by a statue of Mazu, which is carried in a sedan chair.", "她們沿途都有媽祖的神像陪伴，神像被抬在神轎裡。[cite: 9]"]]
]);

h += card('6', ['倒裝句'], 'D',
  '<div class="stem"><div class="en">Although the pilgrims’ strength may wane during the long journey, '+fx("[[7|never]]")+' do their passion and dedication fade.</div><div class="zh">雖然香客們的體力在漫長的旅程中可能會衰退，但他們的熱情和虔誠從未消退。[cite: 9]</div></div>' +
  clue('否定副詞 (never) 放句首，後接倒裝句 (do their passion and dedication fade)。[cite: 9]') +
  ops([
    ['in which they', '', '在旅程中他們「做」熱情，而虔誠消退？語意不通[cite: 9]'],
    ['not until they', '', 'Not until they... did they find... (用法錯誤)[cite: 9]'],
    ['not only', '', '不只他們的熱情和虔誠減退？語意不通[cite: 9]'],
    ['never', '從未', '否定副詞倒裝[cite: 9]']
  ], 'D')
);

h += card('7', ['介系詞片語'], 'A',
  '<div class="stem"><div class="en">'+fx("[[8|Apart from being / Besides being]]")+' a chance for people to show their devotion to the goddess, this annual festival is a spectacular and heart-warming event.</div><div class="zh">除了作為讓人們展現對女神虔誠的機會外，這個一年一度的節日也是一場壯觀且溫馨的盛事。[cite: 9]</div></div>' +
  clue('Besides being = Apart from being = In addition to being (除了是…外，包含在內)。[cite: 9]') +
  ops([
    ['Besides being', '除了是...', '包含在內[cite: 9]'],
    ['Except that', '只不過', '有例外之意，語意不合[cite: 9]'],
    ['Rather than', '並非', '語意不合[cite: 9]'],
    ['In spite of', '儘管', '語意不合[cite: 9]']
  ], 'A')
);

h += card('8', ['連接詞'], 'B',
  '<div class="stem"><div class="en">The gathering in front of Zhenlan Temple '+fx("[[9|before]]")+' the pilgrimage begins is a scene like no other.</div><div class="zh">在遶境開始前，鎮瀾宮前聚集的人群是一幅無與倫比的景象。[cite: 9]</div></div>' +
  clue('before 作為連接詞，引導時間副詞子句 (before the pilgrimage begins)。[cite: 9]') +
  ops([
    ['which', '', '[cite: 9]'],
    ['before', '在...之前', '連接詞[cite: 9]'],
    ['once', '一旦', '[cite: 9]'],
    ['for which', '', '[cite: 9]']
  ], 'B')
);

h += card('9', ['分詞構句'], 'C',
  '<div class="stem"><div class="en">When the statue of Mazu finally emerges from the temple in her sedan chair, the crowd surrounds her, '+fx("[[10|excited]]")+' to send her off on her long journey.</div><div class="zh">當媽祖的神像終於乘著神轎從廟裡出來時，群眾圍繞著她，興奮地送她踏上漫長的旅程。[cite: 9]</div></div>' +
  clue('the crowd surrounds her, (and the crowd is) excited to... 省略主詞與 be 動詞，群眾「感到」興奮，用 excited。[cite: 9]') +
  ops([
    ['who excited', '', '應為 who is excited[cite: 9]'],
    ['exciting', '', '群眾令人興奮？語意錯誤[cite: 9]'],
    ['excited', '感到興奮', '(and they are) excited[cite: 9]'],
    ['which is exciting', '', 'which 無適當先行詞[cite: 9]']
  ], 'C')
);

h += card('10', ['轉折語'], 'D',
  '<div class="stem"><div class="en">Some even kneel or lie face down on the pavement to allow the sedan chair to pass over them... '+fx("[[11|Meanwhile]]")+', locals show their hospitality by enthusiastically offering free food, washing facilities, and accommodations to passing pilgrims.</div><div class="zh">有些人甚至跪著或趴在人行道上，讓神轎從他們身上越過... 與此同時，當地人熱情地提供免費食物、盥洗設施和住宿給路過的香客，展現了他們的好客。[cite: 9]</div></div>' +
  clue('Meanwhile = In the meantime (於此同時)。表示同一時間發生的另一件事。[cite: 9]') +
  ops([
    ['Likewise', '同樣地', '[cite: 9]'],
    ['Above all', '最重要的是', '[cite: 9]'],
    ['Even better', '更棒的是', '[cite: 9]'],
    ['Meanwhile', '與此同時', '[cite: 9]']
  ], 'D')
);

h += card('11', ['倒裝句'], 'D',
  '<div class="stem"><div class="en">'+fx("[[12|Rarely can]]")+' such generosity be seen during a religious event. It reflects not only the locals’ dedication to Mazu but also the warmth and humanity that are characteristic of the Taiwanese people.</div><div class="zh">在宗教活動中很少能見到這樣的慷慨。它不僅反映了當地人對媽祖的虔誠，也反映了台灣人特有的溫暖和人情味。[cite: 9]</div></div>' +
  clue('否定副詞 (Rarely) 放句首，需接倒裝句 (can such generosity be seen)。[cite: 9]') +
  ops([
    ['It’s uncommon for + N to VR', '', '不符倒裝結構[cite: 9]'],
    ['It’s unusual that + S V', '', '不符倒裝結構[cite: 9]'],
    ['Only occasionally do', '', '被動應為 Only occasionally is such generosity seen[cite: 9]'],
    ['Rarely can', '很少能', '否定副詞倒裝[cite: 9]']
  ], 'D')
);

h += passage("情境閱讀", [
  [["Over the years, the Mazu pilgrimage has transformed into more than just a religious ritual, and every year it attracts all manner of people—young and old, foreign and Taiwanese.", "這些年來，媽祖遶境已轉變為不僅僅是一種宗教儀式，每年都吸引各式各樣的人——無論老少、外國人和台灣人。[cite: 9]"]],
  [["UNESCO has even recognized Mazu beliefs and customs by designating them as aspects of a protected living culture.", "聯合國教科文組織甚至將媽祖信仰和習俗認定為受保護的活文化的一部分。[cite: 9]"]],
  [["For those who are looking to experience Taiwan’s cultural heritage, participating in the Mazu pilgrimage is essential!", "對於那些想要體驗台灣文化遺產的人來說，參加媽祖遶境是必不可少的！[cite: 9]"]]
]);


// --- 綜合練習 (apart from... 用法整理) ---
h += '<h2 id="p3">講義重點 5 (apart from... 用法整理)</h2>';

h += card('12', ['介系詞'], 'B',
  '<div class="stem"><div class="en">I think she has many good qualities '+fx("[[13|besides]]")+' being very beautiful.</div><div class="zh">我認為她除了非常美麗之外，還有許多優秀的特質。[cite: 9]</div></div>' +
  clue('besides 表「除...之外 (包含)」。[cite: 9]') +
  ops([
    ['except', '', '不包含[cite: 9]'],
    ['besides', '除了...還有', '包含[cite: 9]'],
    ['instead of', '', '取代[cite: 9]'],
    ['except for', '', '不包含[cite: 9]']
  ], 'B')
);

h += card('13', ['介系詞'], 'B',
  '<div class="stem"><div class="en">Everyone in my family went to the concert '+fx("[[14|except]]")+' my sister, who came down with a bad cold.</div><div class="zh">我家裡除了得了重感冒的妹妹之外，每個人都去聽演唱會了。[cite: 9]</div></div>' +
  clue('except 表「除了...之外 (不包含)」，用於同類事物的排除。[cite: 9]') +
  ops([
    ['but for', '', '要不是[cite: 9]'],
    ['except', '除了', '不包含[cite: 9]'],
    ['besides', '', '包含[cite: 9]'],
    ['and', '', '[cite: 9]']
  ], 'B')
);

h += card('14', ['介系詞'], 'A',
  '<div class="stem"><div class="en">'+fx("[[15|Besides]]")+' Hank, my other friends will come too.</div><div class="zh">除了漢克之外，我的其他朋友也會來。[cite: 9]</div></div>' +
  clue('包含漢克在內，其他朋友也會來，故用 Besides。[cite: 9]') +
  ops([
    ['Besides', '除了...還有', '包含[cite: 9]'],
    ['Except for', '', '不包含[cite: 9]'],
    ['Beside', '', '在...旁邊[cite: 9]'],
    ['In addition', '', '應為 in addition to[cite: 9]']
  ], 'A')
);

h += card('15', ['介系詞'], 'B',
