<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>406 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>406 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[([^|\]]*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[([^|\]]+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}
const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

let h = '';

h += '<h2 id="p1">Thinking Ahead ＆ 課文講解</h2>';

h += passage("Thinking Ahead Vocabulary", [
  [["字彙表：1. keep up with (phr. 趕上) ｜ 2. vehicle (n. 車輛) ｜ 3. manage (v. 設法做到) ｜ 4. rearrange (v. 重新安排) ｜ 5. illiterate (adj. 文盲的) ｜ 6. intricate (adj. 錯綜複雜的) ｜ 7. accuracy (n. 準確) ｜ 8. abandon (v. 放棄) ｜ 9. enthusiasm (n. 熱誠) ｜ 10. endurance (n. 耐力)", ""]],
  [["1. The [[|intricate]] plot of the novel was so interesting that I forgot to cook dinner.", "這本小說錯綜複雜的情節太有趣了，以至於我忘了煮晚餐。"]],
  [["2. Watch out for [[|vehicles]] while walking across the road.", "過馬路時要當心車輛。"]],
  [["3. Due to the flight delay, we had to [[|rearrange]] our trip, and we also had to let the hotel know we would be late.", "由於班機延誤，我們必須重新安排行程，也必須通知飯店我們會晚到。"]],
  [["4. In spite of a traffic jam, I [[|managed]] to get there on time. Luckily, I was even three minutes early.", "儘管塞車，我還是設法準時趕到那裡。幸運的是，我甚至還提早了三分鐘。"]],
  [["5. Susan shows [[|enthusiasm]] for politics. Her ambition is to be a mayor.", "蘇珊對政治展現出熱忱。她的抱負是成為一名市長。"]]
]);

h += card("L1", ["字彙選擇", "executes 執行"], "B",
  st("Imagine a modern enterprise that [[L1|executes]] around 400,000 transactions daily with an error rate of merely one in sixteen million.", "想像一家現代企業，每天執行約四十萬筆交易，而失誤率僅為一千六百萬分之一。") +
  clue("around = about = approximately 大約") +
  ops([
    ["operates", "36%", "經營; 運營；操作。The IT department operates several servers to maintain the company's network infrastructure."],
    ["executes", "38%", "執行; 實行。The project manager executes the plan with precision to ensure its success."],
    ["transfers", "7%", "轉移; 轉讓。The company transfers its employees to other branches to meet staffing needs."],
    ["manufactures", "20%", "製造; 生產。The factory manufactures high-quality products that meet international standards."]
  ], "B")
);

h += passage("L2", [
  [["with 表「有」", ""]]
]);

h += passage("L3", [
  [["… one in sixteen million …", "X in Y / X out of Y 皆可表示「比例」"]],
  [["One out of five page views in the US occurs on Facebook.", "在美國，五分之一的頁面瀏覽量是發生在Facebook上。"]],
  [["One in five women in Seoul have gone under the knife as South Korea tops global list of plastic surgery procedures.", "首爾每五個女生就有一個曾接受(整形)手術，因為南韓在全球整形手術(數量)排名第一。"]]
]);

h += passage("L3", [
  [["You might expect only highly advanced computers to be capable of such levels of accuracy, but actually, only simple tools like bicycles and colored pens are used.", "你可能會以為只有高度先進的電腦才有能力達到如此的準確度，但事實上，他們只使用了腳踏車和彩色筆等簡單工具。"]],
  [["be capable of + N/V-ing = be able to + VR 有做⋯的能力", "Ally is capable of handling such an important task."]]
]);

h += card("L6", ["介系詞選擇", "of 在...之中"], "A",
  st("Furthermore, [[L6|of]] this enterprise’s 5,000 employees, 85% are illiterate! What company could this possibly be?", "此外，在這家企業的五千名員工中，有 85% 是文盲！這究竟會是什麼樣的公司呢？") +
  clue("Of its 5,000 employees, 85% are illiterate! = 85% of its 5,000 employees are illiterate!") +
  ops([
    ["of", "39%", ""],
    ["despite", "13%", ""],
    ["beyond", "25%", ""],
    ["with", "23%", ""]
  ], "A")
);

h += card("L9", ["分詞構句", "situated in 座落於"], "D",
  st("It’s the Nutan Mumbai Tiffin Box Suppliers Association, a home-cooked lunch delivery organization [[L9|situated]] in Mumbai, India.", "它是「孟買努坦便當盒供應商協會」，一個位於印度孟買的家常午餐外送組織。") +
  clue("S + be + situated/located + prep. 座落於⋯⋯ The new restaurant is situated by the scenic river, so it is full almost every day.") +
  ops([
    ["that situated", "16%", ""],
    ["which situates", "11%", ""],
    ["situating", "5%", ""],
    ["situated", "68%", "(which/that is) situated"]
  ], "D")
);

h += passage("L9", [
  [["tiffin n. (UK) = lunch", ""]],
  [["L10 home-cooked lunches = lunches (which are) cooked at home (N-p.p. = p.p. + 介 + N)", ""]]
]);

h += card("L13", ["慣用搭配", "due in large part to"], "B",
  st("This company delivers around 200,000 home-made lunches daily to office and factory workers. Its success is [[L13|due]] in large part to its employees, known as dabbawalas.", "這家公司每天為辦公室職員和工廠工人遞送約二十萬份家常便當。它的成功在很大程度上歸功於其被稱為「達巴瓦拉（dabbawalas）」的員工。") +
  clue("in part = partly = to some degree 某種程度上 / 部分(做副詞用) / in large part = to a great/high degree 很大程度上. Success was due in large part to good teamwork. Your salary depends in part on your qualifications.") +
  ops([
    ["because", "2%", ""],
    ["due", "13%", ""],
    ["connected", "46%", ""],
    ["caused", "39%", "be caused by…"]
  ], "B")
);

h += card("L14", ["同位語解釋", "or 也就是"], "B",
  st("A dabbawala, [[L14|or]] “one who carries a box,” picks up lunches from customers’ homes and delivers these meals to their workplaces.", "「達巴瓦拉」，亦即「提便當盒的人」，負責從顧客家中收取午餐，並將這些餐點送到他們的工作場所。") +
  clue("自我挑戰：想想(A)(C)(D)如何改1-2字即可合理，或至少文法正確？") +
  ops([
    ["known for", "25%", "→ (which is) known as"],
    ["or", "29%", "or 也就是"],
    ["meant", "28%", "→ which means / meaning"],
    ["referring", "17%", "→ which refers to / referring to"]
  ], "B")
);

h += passage("L16", [
  [["Since most Mumbai residents live in the suburbs and have to commute long distances to work every day, it’s inconvenient for them to carry their lunches on cramped public transportation.", "由於大多數孟買居民住在郊區，每天必須長途通勤上班，對他們來說，在擁擠的大眾運輸工具上提著便當非常不便。"]],
  [["V. + long distances 移動長距離", "He's used to driving long distances. Women in Third World countries often have to walk long distances to get water."]],
  [["transport n. [U] 運輸(方法或工具) (英) / transportation [U] 運輸(方法或工具) (美)", ""]]
]);

h += card("L20", ["動詞片語辨析", "sit down to 坐下來享用"], "C",
  st("Therefore, dabbawalas provide a useful service by enabling workers to [[L20|sit down to]] healthy, home-made midday meals in their offices.", "因此，達巴瓦拉提供了實用的服務，讓上班族能在辦公室裡坐下來享用健康、家常的午餐。") +
  clue("sit down to + N 坐下來吃/喝…/看(書等…) After a long day at work, I like to sit down to a good book and a cup of tea to relax. 工作了一整天之後，我喜歡坐下來看本好書，喝杯茶放鬆一下。<br>attend to v. 處理,照顧 The teacher asked the students to attend to their tasks.<br>respond to v. 回答,回應 The dog will respond to your commands if you train it well.<br>adapt to v. 適應,調整 It takes time to adapt to a new school.") +
  ops([
    ["attend to", "35%", ""],
    ["respond to", "23%", ""],
    ["sit down to", "22%", ""],
    ["adapt to", "19%", ""]
  ], "C")
);

h += passage("L21", [
  [["a home-made meal = a meal (which is) made at home (N-p.p. = p.p. + 介 + N)", ""]]
]);

h += passage("L23", [
  [["The dabbawalas’ delivery network has fascinated many people because it achieves a high level of efficiency through nothing but smart scheduling and teamwork.", "達巴瓦拉的配送網路令許多人著迷，因為它僅憑聰明的排程與團隊合作，就達到了極高的效率。"]],
  [["nothing but = only / just", ""]]
]);

h += card("L25", ["非限定關係子句 vs. 對等子句", "each of whom / and each of them (複選)"], "B, C",
  st("This is how it works: Each geographical area employs around twenty-five dabbawalas, [[L25|each of whom / and each of them]] collects roughly thirty tiffin boxes.", "它的運作方式如下：每個地理區域僱用約二十五名達巴瓦拉，其中每個人負責收集大約三十個便當盒。") +
  clue("each 相關用法：We each have our own skills. = Each of us has our own skills.<br>The lollipops are ten cents each. = for each one<br>This is how it works (= operates): *Each … = This is the way it works (= operates): *Each … (*冒號後若接完整句子，通常第一個字母大寫)") +
  ops([
    ["each of them", "25%", "少連接詞"],
    ["each of whom", "69%", "☺ each of whom collects = who each collects(X)"],
    ["and each of them", "78%", "☺"],
    ["who each", "22%", "who each collects(X) *who = dabbawalas(複數)，應搭配複數動詞"],
    ["and they each", "41%", "and they each collects(X) *they = dabbawalas(複數)，應搭配複數動詞"]
  ], "BC", "ABCDE")
);

h += card("L28", ["介系詞片語辨析", "according to 根據"], "D",
  st("These boxes are then swiftly sorted [[L28|according to]] their general destinations before being loaded onto trains for delivery. Then, the dabbawalas board their trains and travel with the lunchboxes.", "接著，這些便當盒在裝上火車運送之前，會先根據大致的目的地快速分類。然後，達巴瓦拉會搭上火車，隨同便當盒一起移動。") +
  clue("(A) with/in regard to = regarding 關於(用於開始討論或引起注意) With regard to your question, I think it's important to consider all perspectives. (B) in line with 與...一致 His actions were not in line with company policy. (C) in light of 有鑑於 In light of recent events, we've decided to increase security measures. (D) according to 根據 According to the weather forecast, it will rain tomorrow.") +
  ops([
    ["with regard to", "", ""],
    ["in line with", "", ""],
    ["in light of", "", ""],
    ["according to", "", ""]
  ], "D")
);

h += card("L31", ["介系詞 + 關係代名詞", "to which (go to a location)"], "D",
  st("At each destination train station, these boxes are sorted again. This time they are divided depending on the buildings or more specific locations [[L31|to which]] the boxes must go.", "在每個目的地火車站，這些便當盒會再次被分類。這一次，它們會根據便當盒必須送往的建築物或更具體的位置來進行分配。") +
  clue("This time they are divided depending on the buildings or more specific locations to which the boxes must go. = This time they are divided depending on the buildings or more specific locations where the boxes must go. (*where = 介 + 關代 ( to + which ))") +
  ops([
    ["which", "7%", ""],
    ["in which", "10%", ""],
    ["at which", "4%", ""],
    ["to which", "79%", ""]
  ], "D")
);

h += card("挑戰題", ["否定副詞倒裝挑戰題", "Not until ... + 助/be + S + V"], "D",
  st("Not until the boxes have been sorted swiftly according to their general destinations [[挑戰題|are they loaded]] onto trains for delivery.", "直到這些便當盒根據大致的目的地快速分類完成後，它們才會被裝上火車運送。") +
  clue("L28 These boxes are then swiftly sorted according to their general destinations before(= and then) being loaded onto trains for delivery.<br>= Not until the boxes have been sorted swiftly according to their general destinations(否定副詞子句) are they loaded onto trains for delivery.(倒裝句(助/be + S …))<br>看不懂嗎？試試簡化版(刪除形容詞、副詞、介片等)：Not until the boxes have been sorted swiftly according to their general destinations(否定副詞子句) are they loaded onto trains for delivery.(倒裝句(助/be + S …))") +
  ops([
    ["that they are loaded", "32%", ""],
    ["that are loaded", "27%", ""],
    ["that they loaded", "23%", ""],
    ["are they loaded", "18%", ""]
  ], "D")
);

h += passage("L33", [
  [["depending on在此相似according to，意為「根據」", "The salary varies from NT$30,000 to 40,000, depending on your experience."]]
]);

h += card("L34", ["否定副詞句首倒裝", "Not until ... can each box be..."], "B",
  st("[[L34|Not until]] this second round of sorting has been completed can each tiffin box be delivered to its rightful owner.", "直到這第二輪的分類完成後，每個便當盒才能被送到其真正的主人手中。") +
  clue("Not until this second round of sorting has been completed (not + until引導的副詞子句) can each tiffin box be delivered to its (rightful) owner. (倒裝句)<br>(A) (Ever) since (自從某個時間或事件以來不斷持續) (Ever) since she moved to New York, she has been missing her hometown.<br>(B) Not until (直到某件事發生才...) Not until I moved to a new city did I realize how much I missed my old friends.<br>(C) By the time (到...的時候) By the time I arrived, the party had already started.<br>(D) Now that (既然) Now that you have finished your project, you can take a break.<br>L37 rightful & right 是「正確的」同義字嗎？ rightful = legally or morally right 正當的. The hero eventually gains his rightful place in society. Jealousy is the feeling that someone else has something that rightfully belongs to you.") +
  ops([
    ["Ever since", "19%", ""],
    ["Not until", "39%", ""],
    ["By the time", "31%", ""],
    ["Now that", "11%", ""]
  ], "B")
);

h += passage("L37", [
  [["In the afternoon, the dabbawalas retrace their original routes in order to bring back each empty lunchbox to its owner’s home.", "到了下午，達巴瓦拉會循著原路線折返，以便將每個空便當盒帶回主人的家。"]]
]);

h += passage("L41", [
  [["In a massive system resembling a relay race, each tiffin box is handled by at least three dabbawalas between its owner’s home and workplace.", "在這個宛如接力賽的龐大系統中，每個便當盒在主人住家與工作場所之間至少會經手三名達巴瓦拉。"]],
  [["handle vt. 處理、搬運、應對", "Handle with care. / Fragile. 小心搬運 / 易碎"]]
]);

h += card("L43", ["間接問句（名詞子句）", "how 如何"], "B",
