<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>302 Blackboard</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:20px 16px 40px;color:var(--mut);font-size:.85rem;line-height:1.6;border-top:1px solid var(--line);margin-top:40px;}
footer a{color:var(--acc);text-decoration:none;font-weight:bold;}
footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="top">
  <h1>302 Blackboard</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>
  限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。<br>
  💡 <b>問題回報與建議：</b> Line: etpaul ｜ IG: <a href="https://www.instagram.com/etpaul" target="_blank">@etpaul</a>
</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

let h = '';

// --- 補充段落 / 情境閱讀 ---
h += passage("情境引導", [
  [["How can twenty sticks of dry spaghetti, a yard of tape, a yard of string, and one marshmallow help build a stronger team?", "二十根乾義大利麵條、一碼膠帶、一碼細繩和一顆棉花糖，如何能幫助建立一個更強大的團隊？[cite: 4]"]],
  [["A popular team-building exercise known as the Marshmallow Challenge promises to do just that.", "一項名為「棉花糖挑戰」的受歡迎團隊建立活動，正保證能做到這一點。[cite: 4]"]],
  [["In this challenge, with only the materials mentioned above, teams compete to build the tallest free-standing structure capable of supporting the weight of one marshmallow at the top.", "在這個挑戰中，隊伍們僅能使用上述材料，競爭建造出最高、能獨立站立，且頂端能支撐一顆棉花糖重量的結構。[cite: 4]"]],
  [["With only 18 minutes to complete the task, the teams must learn to collaborate quickly.", "隊伍只有18分鐘來完成任務，他們必須學會快速合作。[cite: 4]"]],
  [["The Marshmallow Challenge, promoted by Canadian technology expert Tom Wujec, has been conducted around the world with architects and engineers, CEOs, lawyers, business graduates, and even kindergarteners.", "由加拿大科技專家 Tom Wujec 推廣的「棉花糖挑戰」，已在世界各地與建築師和工程師、執行長、律師、商科畢業生，甚至幼稚園兒童一起進行過。[cite: 4]"]],
  [["Over the years the challenge has produced some surprising results.", "這些年來，這個挑戰產生了一些令人驚訝的結果。[cite: 4]"]]
]);

// --- 挑戰題1 ---
h += '<h2 id="p1">挑戰題 1</h2>';

h += card('1', ['詞義搭配', '被動語態'], 'B',
  '<div class="stem"><div class="en">The arrow that appears on the screen is '+fx("[[1|called]]")+' a cursor.</div><div class="zh">出現在螢幕上的箭頭被稱為游標。[cite: 4]</div></div>' +
  clue('be called sth 被稱為… = be known as sth[cite: 4]') +
  ops([
    ['named', '被命名為', '通常用於人名、路名、校名等專有名詞[cite: 4]'],
    ['called', '被稱為', '一般、專有名詞皆可[cite: 4]'],
    ['known', '以...為人所知', '需加 “as” 才能接名稱[cite: 4]'],
    ['entitled', '被給予標題', '[cite: 4]']
  ], 'B')
);

// --- 挑戰題2 ---
h += '<h2 id="p2">挑戰題 2</h2>';

h += card('2', ['文法', '動詞與分詞'], 'D',
  '<div class="stem"><div class="en">In Wujec’s study, the average height of the structures constructed '+fx("[[2|was]]")+' 20 inches.</div><div class="zh">在 Wujec 的研究中，建造出的結構平均高度為 20 英吋。[cite: 4]</div></div>' +
  clue('the average height 是主詞 (單數)，of the structures (which were) constructed 是形容詞片語，句子缺乏主要動詞，故選 was。[cite: 4]') +
  ops([
    ['to be', '', '不定詞，非主要動詞[cite: 4]'],
    ['being', '', '分詞，非主要動詞[cite: 4]'],
    ['have been', '', '與單數主詞 the average height 不符[cite: 4]'],
    ['was', '是', '單數過去式動詞[cite: 4]']
  ], 'D')
);

h += card('3', ['慣用語'], 'A',
  '<div class="stem"><div class="en">The group that built the highest structure was, '+fx("[[3|as expected]]")+', architects and engineers.</div><div class="zh">建造出最高結構的群體，正如預期般，是建築師和工程師。[cite: 4]</div></div>' +
  clue('as 表「正如⋯」；as expected 意為「正如被預期的」。[cite: 4]') +
  ops([
    ['as expected', '正如被預期的', '[cite: 4]'],
    ['to expect', '為了預期', '語意不合[cite: 4]'],
    ['as expecting', '正如(主動)預期', 'the group主動預期？語態錯誤[cite: 4]'],
    ['although expected', '雖然被預期', '語意不合[cite: 4]']
  ], 'A')
);

h += passage("補充段落", [
  [["CEOs performed slightly better than average, coming in third.", "執行長的表現略優於平均水準，排名第三。[cite: 4]"]]
]);

h += card('4', ['轉折語'], 'B',
  '<div class="stem"><div class="en">Lawyers, '+fx("[[4|on the other hand]]")+', performed below average, ranking second to last.</div><div class="zh">另一方面，律師的表現低於平均水準，排名倒數第二。[cite: 4]</div></div>' +
  clue('與前句 (CEOs performed slightly better) 成對比，故使用 on the other hand (另一方面/然而)。[cite: 4]') +
  ops([
    ['in addition', '此外', '與前句同性質[cite: 4]'],
    ['on the other hand', '另一方面', '≒ however (與前句成對比)[cite: 4]'],
    ['in other words', '換言之', '[cite: 4]'],
    ['as a result', '因此', '[cite: 4]']
  ], 'B')
);

h += card('5', ['連接詞與介系詞'], 'B',
  '<div class="stem"><div class="en">And '+fx("[[5|although]]")+' they worked to create the best plan, business graduates performed the worst.</div><div class="zh">而且儘管他們努力制定最好的計畫，商科畢業生的表現卻是最差的。[cite: 4]</div></div>' +
  clue('they worked... 為完整子句，需接連接詞 although。[cite: 4]') +
  ops([
    ['despite', '儘管', '為介系詞，後面只能接名詞或動名詞[cite: 4]'],
    ['although', '雖然', '連接詞，後接完整子句[cite: 4]'],
    ['as', '因為/正如', '語意不符[cite: 4]'],
    ['since', '自從/既然', '語意不符[cite: 4]']
  ], 'B')
);

// --- 挑戰題3 ---
h += '<h2 id="p3">挑戰題 3</h2>';

h += card('6', ['連接詞與介系詞'], 'D',
  '<div class="stem"><div class="en">'+fx("[[6|Though]]")+' in poor health, she continued to carry out her duties.</div><div class="zh">雖然健康狀況不佳，她仍繼續履行職責。[cite: 4]</div></div>' +
  clue('in poor health 為形容詞片語。介系詞 (Regardless of / Despite) 後只能接名詞，此處為 Though (she was) in poor health (省略主詞與 be 動詞)。[cite: 4]') +
  ops([
    ['Regardless of', '不論', '介系詞後只能接名詞[cite: 4]'],
    ['As', '因為', '語意不符[cite: 4]'],
    ['Despite', '儘管', '介系詞後只能接名詞[cite: 4]'],
    ['Though', '雖然', '連接詞，可省略相同的「主詞+be動詞」[cite: 4]']
  ], 'D')
);

h += passage("補充段落", [
  [["Amazingly, kindergarteners outperformed most of the adult teams, achieving the second best performance.", "令人驚訝的是，幼稚園兒童勝過了大多數成人隊伍，取得了第二好的成績。[cite: 4]"]]
]);

// --- 挑戰題4 ---
h += '<h2 id="p4">挑戰題 4</h2>';

h += card('7', ['主要動詞'], 'D',
  '<div class="stem"><div class="en">The high ranking of the kindergarten group, whose impressive structures were taller than those of most adult teams, '+fx("[[7|was]]")+' mainly a result of their unique and innovative ideas.</div><div class="zh">幼稚園組的高排名（他們令人印象深刻的結構比大多數成人隊伍的都高），主要是因為他們獨特和創新的想法。[cite: 4]</div></div>' +
  clue('主詞為單數的 The high ranking，中間 whose... 為形容詞子句，全句缺主要動詞，故選 was。[cite: 4]') +
  ops([
    ['as', '作為', '導致本句缺動詞[cite: 4]'],
    ['had', '有', '語意不合 (get a result 得到他們創新的結果？)[cite: 4]'],
    ['thus', '因此', '導致本句缺動詞[cite: 4]'],
    ['was', '是', '單數過去式動詞[cite: 4]']
  ], 'D')
);

h += card('8', ['名詞子句'], 'B',
  '<div class="stem"><div class="en">One reason for this is that kids usually get started with '+fx("[[8|what]]")+' has been given to them right away, whereas adults usually don’t start putting the structure together until they have spent most of the time planning.</div><div class="zh">其中一個原因是，孩子們通常會立刻開始使用「給予他們的東西」，而成人通常在花費大部分時間計畫之後，才開始把結構組合起來。[cite: 4]</div></div>' +
  clue('what = the thing(s) which，引導名詞子句當 with 的受詞。[cite: 4]') +
  ops([
    ['which', '', '前面無適當N可當 which 的先行詞[cite: 4]'],
    ['what', '...的事物', '引導名詞子句[cite: 4]'],
    ['that', '', 'that 前不可有介系詞[cite: 4]'],
    ['it', '', '少連接詞[cite: 4]']
  ], 'B')
);

h += passage("補充段落", [
  [["This leaves no time to adjust the design if it cannot support the marshmallow.", "如果設計無法支撐棉花糖，這將沒有時間來調整設計。[cite: 4]"]]
]);

h += card('9', ['字彙搭配'], 'A',
  '<div class="stem"><div class="en">Another reason is that unlike adults, kindergarteners are quicker to change their methods after '+fx("[[9|failed approaches]]")+'.</div><div class="zh">另一個原因是，不同於成人，幼稚園兒童在作法失敗後，改變方法的速度更快。[cite: 4]</div></div>' +
  clue('failed adj. = unsuccessful (失敗的)；failing adj. (越來越弱或衰退的)。[cite: 4]') +
  ops([
    ['failed approaches', '失敗的作法', '[cite: 4]'],
    ['failing approaches', '越來越弱的作法', '語意不合[cite: 4]'],
    ['approached failures', '被靠近的失敗', '語意不合[cite: 4]'],
    ['approaching failures', '迫近的失敗', '語意不合[cite: 4]']
  ], 'A')
);

h += passage("補充段落", [
  [["They rely on trial and error—if one method doesn’t work, they quickly move on to the next.", "他們依靠反覆試驗——如果一種方法沒用，他們會迅速換下一個。[cite: 4]"]]
]);

h += card('10', ['名詞子句', '名詞修飾'], 'D',
  '<div class="stem"><div class="en">This approach gives them immediate feedback '+fx("[[10|about what]]")+' design elements work to give their structure height and stability.</div><div class="zh">這種作法給予他們關於「什麼設計元素有效」的即時回饋，以賦予他們的結構高度和穩定性。[cite: 4]</div></div>' +
  clue('what design elements work... 引導名詞子句，作為介系詞 about 的受詞。[cite: 4]') +
  ops([
    ['in which', '', '= and in the feedback[cite: 4]'],
    ['that', '', '+ 完整子句 = 名詞子句，當feedback的同位語 (但後方不完整)[cite: 4]'],
    ['when', '', '= and at that time[cite: 4]'],
    ['about what', '關於什麼...', 'what 引導名詞子句當 about 的受詞[cite: 4]']
  ], 'D')
);

h += card('11', ['代名詞'], 'C',
  '<div class="stem"><div class="en">'+fx("[[11|Still another]]")+' reason for their success is that children tend to collaborate freely and naturally.</div><div class="zh">他們成功的「還有一個」原因是，孩子們往往會自由且自然地合作。[cite: 4]</div></div>' +
  clue('列舉總數不明確時：One reason..., another reason..., still another reason... (還有一個)[cite: 4]') +
  ops([
    ['Other', '', 'Other + 複N[cite: 4]'],
    ['The other', '', '用於兩者中剩下的那一個[cite: 4]'],
    ['Still another', '還有一個', '[cite: 4]'],
    ['Others', '', '代名詞，不可再接名詞 reason[cite: 4]']
  ], 'C')
);

h += passage("補充段落", [
  [["They don't waste time deciding who is in charge.", "他們不浪費時間決定誰負責。[cite: 4]"],
   ["Instead, they are more focused on working together to figure out how to build the tallest structure.", "相反地，他們更專注於一起合作，想出如何建造最高的結構。[cite: 4]"]]
]);

h += card('12', ['名詞'], 'B',
  '<div class="stem"><div class="en">The Marshmallow Challenge teaches us that age and experience are not the only routes to '+fx("[[12|success]]")+'.</div><div class="zh">棉花糖挑戰告訴我們，年齡和經驗並不是通往成功的唯一途徑。[cite: 4]</div></div>' +
  clue('the route to + N/Ving (to 在此為介系詞，表通往...的方向)。[cite: 4]') +
  ops([
    ['succeed', '成功(動詞)', 'Vi.，介系詞 to 後須接名詞[cite: 4]'],
    ['success', '成功(名詞)', 'N.[cite: 4]'],
    ['be successful', '成功', '動詞片語[cite: 4]'],
    ['achieve success', '達成成功', 'V. + N.，應改為 achieving success[cite: 4]']
  ], 'B')
);

h += passage("補充段落", [
  [["In order to solve problems, we must roll up our sleeves and get down to work right away, explore and experiment with new ideas, and collaborate effectively.", "為了解決問題，我們必須捲起袖子立刻著手工作，探索並嘗試新想法，以及有效地合作。[cite: 4]"],
   ["In this way, we can surely get the marshmallow to the top.", "這樣一來，我們一定能讓綿花糖站上頂端。[cite: 4]"]]
]);


// --- 課本句型實例 ---
h += '<h2 id="p5">課本句型 1 (until / not until)</h2>';
h += passage("句型提示", [
  [["until 表示『動作直到…才結束』 (e.g. Cathy studied until midnight.)", "not until 表示『動作直到…才發生』 (e.g. Cathy did not go to bed until midnight.)[cite: 4]"]]
]);

h += '<div class="stem"><div class="zh" style="color:inherit">1. Charlotte 直到開始使用螢幕使用時間追蹤裝置才知道她每天花了多少時間在手機上。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Charlotte didn’t know how much time she spent on her phone every day until she started to use Screen Time Tracker.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">2. 直到她開始跟我說話我才認出她來。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|I didn’t recognize her until she started talking to me.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">3. 昨天的會議持續到下午兩點。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The meeting yesterday lasted until 2 p.m. / It was not until 2 p.m. yesterday that the meeting continued.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">4. 直到 Cindy 牙痛，她才去看牙醫。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Cindy didn't go to the dentist until her teeth ached / until she had a toothache.]]")+'<br><small>Not until Cindy\'s teeth ached did she go to the dentist.<br>It was not until Cindy\'s teeth ached that she went to the dentist.</small>[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">5. 直到 Mike 考試不及格，他才開始用功。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|Mike didn't start to study hard until he failed the test.]]")+'<br><small>Not until he failed the test did Mike start to study hard.<br>It was not until he failed the test that Mike started to study hard.</small>[cite: 4]</div></div>';


h += '<h2 id="p6">課本句型 2 (that / those 代替名詞)</h2>';
h += passage("句型提示", [
  [["前面出現過的名詞，單數用 that 取代，複數用 those 取代。", "N ... that/those + 介片 / 關係子句 / 分詞構句[cite: 4]"]]
]);

h += '<div class="stem"><div class="zh" style="color:inherit">1. 紐約市的人口比西雅圖多。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The population in New York City is larger than that of Seattle.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">2. 馬克的月收入比詹姆士還低。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The monthly salary of Mark is lower than that of James.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">3. A班的平均成績比B班高15分。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The average score of Class A is 15 points higher than that of Class B.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">4. 這個學校男學生的數量比女學生多。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The number of male students in this school is larger than that of female students.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">5. 進口車通常比台灣國產車要貴得多。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The prices of imported cars are usually higher than those of cars made in Taiwan.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">6. 我新手機的顏色跟你的手機一模一樣。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The color of my new phone is the same as that of your phone / yours.]]")+'[cite: 4]</div></div>';

h += '<div class="stem"><div class="zh" style="color:inherit">7. 高雄的氣候跟屏東差不多。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b><br>'+fx("[[|The climate in Kaohsiung is similar to that in Pingtung.]]")+'[cite: 4]</div></div>';

document.getElementById('app').innerHTML = h;

const secs=[
  ['p1','挑戰題 1'],
  ['p2','挑戰題 2'],
  ['p3','挑戰題 3'],
  ['p4','挑戰題 4'],
  ['p5','句型 1'],
  ['p6','句型 2']
];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){
  open=!open;
  document.querySelectorAll('details.q').forEach(d=>d.open=open);
  this.textContent=open?'全部收合':'全部展開';
};
</script>
<script src="bookmark.js"></script>
