<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>空中美語 字彙字識+ Levels 3&4 複習卷（第二十七回）Chapter 10 詳解</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>空中美語 字彙字識+ Levels 3&4 複習卷（第二十七回）Chapter 10</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\Vert{}([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 各大題資料與渲染邏輯 ===

const NAV_ITEMS = [
  ['#sec1', 'I. 字彙選擇 (1–10)'],
  ['#sec2', 'II. 選詞填充 (11–15)'],
  ['#sec3', 'III. 克漏字選填 (16–20)'],
  ['#sec4', 'IV. 文意字彙 (21–25)']
];
document.getElementById('nav').innerHTML = NAV_ITEMS.map(x => `<a href="${x[0]}">${x[1]}</a>`).join('');

// 第 I 大題：Multiple Choice (1–10)
const SEC1 = [
  {
    n: 1,
    ans: 'C',
    tags: ['考點：太空與船艦搭配動詞 launch', '詞性需求：過去分詞 V-pp（構成被動語態 was + V-pp）'],
    s: [
      'A cargo ship taking supplies to the International Space Station was [[1|launched]] last year.',
      '一艘運送補給品前往國際太空站的貨運太空船於去年發射升空。'
    ],
    clue: '主詞為 <b>A cargo ship taking supplies to the International Space Station</b>（載運補給品前往國際太空站的貨運船／太空船），後接被動語態 <b>was ___ last year</b>，太空船、衛星、火箭或新船「發射升空／下水啟航」的固定搭配動詞為 <b>launch</b>。',
    ops: [
      ['calculated', 'v. 計算；估算（過去分詞）', '受詞通常是成本、數字或風險（<i>cost / risk / distance</i>），貨運太空船不能被「計算」升空。<br><b>何時才對：</b>The total cost of the project was carefully <u>calculated</u>.（這項計畫的總成本經過仔細計算。）'],
      ['input', 'v. 輸入（過去分詞，三態同形或 inputted）', '指將數據或資料「輸入」電腦（<i>input data into a computer</i>），不搭配太空船。<br><b>何時才對：</b>All the student grades were <u>input</u> into the system yesterday.（所有學生的成績昨天都已輸入系統。）'],
      ['launched', 'v. 發射（火箭／太空船／衛星）；使（船）下水（過去分詞）', '<b>launch a spacecraft / cargo ship / rocket</b> 為標準航太搭配，被動語態 <i>was launched</i> 完全正確。'],
      ['telegraphed', 'v. 打電報；發電報通知（過去分詞）', '指透過電報傳送訊息，無法用來發射實體的貨運太空船。<br><b>何時才對：</b>The urgent news was <u>telegraphed</u> to headquarters immediately.（這則緊急消息立刻透過電報發送至總部。）']
    ]
  },
  {
    n: 2,
    ans: 'D',
    tags: ['考點：犯罪現場情境與動詞片語 search ... for 搭配', '詞性需求：複數可數名詞（對應代名詞 any）'],
    s: [
      "The police searched the crime scene for [[2|weapons]], but they didn't find any.",
      '警方在犯罪現場搜尋凶器（武器），但沒有找到任何一件。'
    ],
    clue: '主詞 <b>The police</b>（警方）搭配動詞片語 <b>searched the crime scene for ___</b>（在犯罪現場搜尋……），警方在案發現場蒐證尋找的對象應為作案「武器／凶器（<b>weapons</b>）」。',
    ops: [
      ['rays', 'n. 光線；射線（複數）', '光線是自然或物理現象（如 <i>sun rays / X-rays</i>），不是警方在犯罪現場翻找卻找不到的實體證物。<br><b>何時才對：</b>Sunglasses protect your eyes from harmful UV <u>rays</u>.（太陽眼鏡能保護你的眼睛免受有害紫外線的傷害。）'],
      ['diagrams', 'n. 圖表；示意圖（複數）', '圖表用於教科書、報告或說明書中，並非犯罪現場調查的典型目標。<br><b>何時才對：</b>The textbook uses clear <u>diagrams</u> to explain how the engine works.（這本教科書使用清晰的圖表來解釋引擎如何運作。）'],
      ['elements', 'n. 要素；元素；成分（複數）', '為抽象概念或化學元素，不合警方搜索實體犯罪現場的語境。<br><b>何時才對：</b>Trust and honesty are key <u>elements</u> of a strong friendship.（信任與誠實是堅定友誼的關鍵要素。）'],
      ['weapons', 'n. 武器；凶器（複數）', '警方在犯罪現場（<i>crime scene</i>）搜尋作案凶器（<i>murder weapons</i>），語意完全吻合。']
    ]
  },
  {
    n: 3,
    ans: 'A',
    tags: ['考點：因果關係與環境地理搭配 industrial areas', '詞性需求：形容詞（修飾名詞 areas，句首字首大寫）'],
    s: [
      '[[3|Industrial]] areas are not suitable for people to live in because of their high levels of pollution.',
      '工業區不適合人們居住，因為那裡的汙染程度很高。'
    ],
    clue: '空格修飾名詞 <b>areas</b>（地區、區域），後半句原因片語指出 <b>because of their high levels of pollution</b>（因為它們的高汙染程度），排放大量汙染且不適合居住的區域即為「工業區（<b>Industrial areas</b>）」。',
    ops: [
      ['Industrial', 'adj. 工業的；產業的', '<b>industrial areas / zones</b>（工業區）因工廠林立而有高汙染（<i>high levels of pollution</i>），不適人居，因果邏輯完全吻合。'],
      ['Technical', 'adj. 技術的；專業的', '常修飾 <i>skills / support / problems / college</i>，無「技術區汙染高」的說法。<br><b>何時才對：</b>The manual is full of <u>technical</u> terms that are hard for beginners to understand.（這本手冊充滿了初學者難以理解的專業術語。）'],
      ['Mental', 'adj. 心理的；精神的；腦力的', '常修飾 <i>health / illness / stress</i>，不修飾地理居住區域且與環境汙染無關。<br><b>何時才對：</b>Getting enough sleep is vital for both physical and <u>mental</u> health.（充足的睡眠對身心健康都至關重要。）'],
      ['Mathematical', 'adj. 數學的；精確的', '修飾 <i>formulas / equations / models</i>，與居住環境及汙染無關。<br><b>何時才對：</b>She solved the complex <u>mathematical</u> problem in just two minutes.（她只花兩分鐘就解開了這道複雜的數學題。）']
    ]
  },
  {
    n: 4,
    ans: 'B',
    tags: ['考點：工具介系詞 With 與視覺觀測語境', '詞性需求：單數可數名詞（所有格 my 後）'],
    s: [
      'With my [[4|telescope]], I can easily spot many of the city landmarks from a distance.',
      '有了我的望遠鏡，我可以輕易地從遠處看到許多城市地標。'
    ],
    clue: '句首工具片語 <b>With my ___</b>（藉助我的……），主要子句說明功能為 <b>spot many of the city landmarks from a distance</b>（從遠處看見許多城市地標），能從遠距離清楚觀測景物的光學儀器為 <b>telescope</b>（望遠鏡）。',
    ops: [
      ['fax', 'n. 傳真；傳真機', '用於傳送書面文件，無法用來從遠處觀測城市地標。<br><b>何時才對：</b>Please send me the signed contract by <u>fax</u> or email.（請透過傳真或電子郵件將簽署好的合約寄給我。）'],
      ['telescope', 'n. 望遠鏡', '用於遠距離觀看天體或遠方景物，完全呼應 <i>spot ... from a distance</i>（從遠處看到……）。'],
      ['ray', 'n. 光線；射線', '光線不是個人持有並用來遠眺地標的觀測工具。<br><b>何時才對：</b>A single <u>ray</u> of sunlight shone through the dark clouds.（一道陽光穿透烏雲照耀下來。）'],
      ['chemistry', 'n. 化學（不可數名詞）', '學科名稱，且不可數，不能用來從遠處觀看地標。<br><b>何時才對：</b>We did an interesting experiment in <u>chemistry</u> class today.（我們今天在化學課做了一個有趣的實驗。）']
    ]
  },
  {
    n: 5,
    ans: 'A',
    tags: ['考點：今昔科技產品對比 used to ... but now ...', '詞性需求：形容詞（修飾名詞 dictionaries，句首字首大寫）'],
    s: [
      '[[5|Electronic]] dictionaries used to be very popular, but now people are using online ones.',
      '電子字典過去非常流行，但現在人們都使用線上字典了。'
    ],
    clue: '空格後接名詞 <b>dictionaries</b>（字典），且後半句對比 <b>used to be very popular, but now people are using online ones</b>（過去很流行，但現在人們改用線上字典），在網路普及前盛行的實體數位查詢工具為「電子字典（<b>Electronic dictionaries</b>）」。',
    ops: [
      ['Electronic', 'adj. 電子的', '<b>electronic dictionaries</b>（電子字典／翻譯機）與後文的 <i>online ones</i>（線上字典）形成科技演進的清晰對比。'],
      ['Nuclear', 'adj. 核子的；原子能的', '常修飾 <i>energy / power / weapons</i>，世上沒有「核子字典」。<br><b>何時才對：</b>Many countries are debating the safety of <u>nuclear</u> power.（許多國家正在爭論核能的安全性。）'],
      ['Industrial', 'adj. 工業的', '不與 <i>dictionaries</i> 搭配來對比線上字典。<br><b>何時才對：</b>The <u>Industrial</u> Revolution began in Great Britain in the 18th century.（工業革命於十八世紀始於英國。）'],
      ['Visual', 'adj. 視覺的', '雖有圖解字典（<i>visual dictionaries</i>），但與「過去流行、現在被線上字典取代」的科技載體更替無直接對比。<br><b>何時才對：</b>The director is famous for his stunning <u>visual</u> style.（這位導演以其驚豔的視覺風格聞名。）']
    ]
  },
  {
    n: 6,
    ans: 'B',
    tags: ['考點：設備故障慣用搭配 technical problems', '詞性需求：形容詞（修飾名詞 problems）'],
    s: [
      'Some teachers are unable to solve [[6|technical]] problems with the language lab equipment, so they often need assistance.',
      '有些老師無法解決語言教室設備的技術問題，所以他們常需要協助。'
    ],
    clue: '受詞為 <b>___ problems with the language lab equipment</b>（語言教室設備的……問題），結果子句為 <b>need assistance</b>（需要技術支援／協助），機器或電腦設備操作故障的標準搭配為 <b>technical problems</b>（技術問題）。',
    ops: [
      ['industrial', 'adj. 工業的', '學校語言教室設備故障屬於技術操作問題，而非重工業或產業問題。<br><b>何時才對：</b>The factory was fined for dumping <u>industrial</u> waste into the river.（該工廠因將工業廢棄物傾倒進河裡而被罰款。）'],
      ['technical', 'adj. 技術上的；機械操作的', '<b>technical problems / difficulties</b> 指機器、軟硬體或設備運作上的技術故障，完全契合 <i>language lab equipment</i>。'],
      ['nuclear', 'adj. 原子核的；核能的', '學校語言教室不可能出現「核子問題」。<br><b>何時才對：</b>The treaty aims to prevent the spread of <u>nuclear</u> weapons.（該條約旨在防止核武擴散。）'],
      ['scientific', 'adj. 科學的', '<i>scientific problems</i> 指科學研究或理論上的難題，而非日常教學設備故障。<br><b>何時才對：</b>The research team is looking for a <u>scientific</u> explanation for the phenomenon.（研究團隊正在為該現象尋找科學解釋。）']
    ]
  },
  {
    n: 7,
    ans: 'D',
    tags: ['考點：不及物動詞與介系詞 with 搭配 experiment with', '詞性需求：現在分詞 V-ing（構成現在進行式 is + V-ing）'],
    s: [
      'The cook is [[7|experimenting]] with a new dish he wants to serve at his restaurant.',
      '這位廚師正在試做（研發實驗）一道他想在自己餐廳供應的新菜色。'
    ],
    clue: '主詞為 <b>The cook</b>（廚師），空格後緊接介系詞片語 <b>with a new dish he wants to serve at his restaurant</b>（用一道他想在餐廳端出的新菜色……），不及物動詞搭配 <b>with</b> 表示「嘗試、試用新方法或新食材」的片語為 <b>experiment with</b>。',
    ops: [
      ['bombing', 'v. 轟炸；炸毀（現在分詞）', '及物動詞，不接 <i>with a new dish</i>，且廚師不會「轟炸」新菜色。<br><b>何時才對：</b>Warplanes were seen <u>bombing</u> enemy targets near the border.（有人目擊戰機正在轟炸邊境附近的敵方目標。）'],

      ['submarine', 'n. 潛水艇', '雖同為 <i>s_____e</i>，但潛水艇是大型船艦，無法從網路上下載。<br><b>何時才對：</b>The <u>submarine</u> stayed underwater for three weeks.（這艘潛水艇在水下停留了三個星期。）']
    ]
  }
];
