<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>英文 3 進階卷・第 2 回｜Lesson 2 The Marshmallow Challenge（302大卷詳解）</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>302大卷詳解</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

/* === I. 文意字彙與詞類變化 === */
const h1 = '<h2 id="p1">I. 文意字彙與詞類變化（配分 20%，每題 2 分）</h2>'
+ card(1, ["考點：名詞語意（同義替換）", "詞性需求：單數可數名詞"], "route",
  '<div class="stem"><div class="en">'+fx("Instead of taking the shortest way home, I chose a different [[1|route]] with less traffic.")+'</div><div class="zh">我沒有選擇回家最短的路，而是選了一條交通量較少的不同路線。</div></div>'
  + clue('"a different ___ with less traffic" 中，with less traffic（交通量較少）修飾的必須是「一條路」，指向 route 而非抽象的「方法」。')
  + '<h4>正解解析＆易混淆字形：何時才對</h4><p style="margin:2px 0"><b>route</b>（n. 路線）作動詞 chose 的受詞 "a different route"。句首 "Instead of taking the shortest way"（不走最短的路）與 route 語意呼應——way 與 route 同指「路線」。<br><b>易混淆字：routine</b>（n. 例行公事）何時才對：<i>Exercise has become part of my daily routine.</i>（運動已成為我日常作息的一部分。）</p>')

+ card(2, ["考點：不定詞需接原形動詞", "詞性需求：原形及物動詞"], "explore",
  '<div class="stem"><div class="en">'+fx("Space technology enables us to [[2|explore]] the universe beyond the Earth so that we can discover more about other planets.")+'</div><div class="zh">太空科技使我們能夠探索地球以外的宇宙，進而發現更多關於其他行星的事。</div></div>'
  + clue('"enables us to ___" 的 to 是不定詞記號，後面一定是原形動詞；後半句 "discover more about other planets"（發現更多行星資訊）呼應「探索」的語意。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0"><b>enable sb. to V</b>（使某人能夠做...）之後須接原形動詞，<b>explore</b>（v. 探索）+ the universe（受詞），語意通順。<br><b>名詞形：exploration</b>（n. 探索）何時才對：<i>Space exploration requires advanced technology.</i>（太空探索需要先進的科技。）</p>')

+ card(3, ["考點：形容詞語意＋前置修飾", "詞性需求：形容詞"], "slight",
  '<div class="stem"><div class="en">'+fx("The company didn't make much money last year. There was only a [[3|slight]] increase in sales.")+'</div><div class="zh">這家公司去年並沒有賺很多錢，銷售額只有些微的成長。</div></div>'
  + clue('前句 "didn\'t make much money"（沒賺很多錢）已限定成長幅度很小，故空格須填表「程度小」的形容詞修飾名詞 increase。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0"><b>slight</b>（adj. 些微的）修飾名詞 increase，構成 a slight increase（些微的成長）。<br><b>副詞形：slightly</b>（adv. 稍微、些微地）何時才對：<i>Sales increased slightly last year.</i>（去年銷售額稍微成長，修飾動詞 increased。）</p>')

+ card(4, ["考點：動詞固定搭配 promise to V＋過去式", "詞性需求：過去式動詞"], "promised",
  '<div class="stem"><div class="en">'+fx("At the wedding, Frank [[4|promised]] to always be there for his wife and support her through thick and thin, no matter what happened in life.")+'</div><div class="zh">在婚禮上，Frank 承諾無論人生發生什麼事，都會永遠陪伴妻子、與她同甘共苦。</div></div>'
  + clue('空格後方直接接 "to always be there"，to 前面的動詞必須能接不定詞受詞；"At the wedding" 與從屬子句 "what happened" 皆提示過去時間點。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0"><b>promise to V</b>（承諾要做...）為固定搭配，過去時間點須用過去式 <b>promised</b>。through thick and thin 為慣用語「同甘共苦、無論順境逆境」。<br><b>形容詞形：promising</b>（adj. 有前途的、有希望的）何時才對：<i>She is a promising young architect.</i>（她是位很有前途的年輕建築師。）</p>')

+ card(5, ["考點：形容詞語意", "詞性需求：形容詞"], "unique",
  '<div class="stem"><div class="en">'+fx("Peter's [[5|unique]] way of thinking allows him to put forward ideas that are different from his friends'.")+'</div><div class="zh">Peter 獨特的思考方式讓他能夠提出與朋友們不同的想法。</div></div>'
  + clue('所有格 Peter\'s 與名詞片語 way of thinking 之間需填形容詞；後半句 "different from his friends\'"（與朋友們不同）正是 unique（獨一無二）的語意證據。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0"><b>unique</b>（adj. 獨特的）修飾 way of thinking（思考方式）。put forward 意為「提出（想法、建議）」。<br><b>名詞形：uniqueness</b>（n. 獨特性）何時才對：<i>The uniqueness of his design attracted many buyers.</i>（他設計的獨特性吸引了許多買家。）</p>')

+ card(6, ["考點：名詞語意＋複數形式", "詞性需求：複數可數名詞"], "materials",
  '<div class="stem"><div class="en">'+fx("The author collected people's stories and used them as [[6|materials]] for his books.")+'</div><div class="zh">這位作者蒐集人們的故事，並將它們作為他寫書的素材。</div></div>'
  + clue('前面 them 指複數的 stories（故事們），對應的素材也應以複數 materials 呈現，語意上與可數的「多篇故事」相配。')
  + '<h4>正解解析＆詞類用法：何時才對</h4><p style="margin:2px 0"><b>materials</b>（n. 材料、素材）作介系詞 as 的受詞，"use A as B"（把 A 當作 B 使用）為固定句型。<br><b>形容詞用法：material</b>（adj. 物質的、實體的）何時才對：<i>Spiritual happiness is more important than material wealth.</i>（心靈的快樂比物質財富更重要。）</p>')

+ card(7, ["考點：動詞語意＋被動語態 needs to be p.p.", "詞性需求：過去分詞 (p.p.)"], "adjusted",
  '<div class="stem"><div class="en">'+fx("Amanda's watch needs to be [[7|adjusted]] by one hour every time she flies from Taiwan to Japan.")+'</div><div class="zh">Amanda 每次從台灣飛到日本時，她的手錶都需要調整一小時。</div></div>'
  + clue('"needs to be ___ted" 中的 be 已表明後面須接過去分詞（被動語態）；"by one hour"（相差/調動一小時）是 adjust 的典型搭配。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0">手錶是被「調整」的對象，<b>need to be + p.p.</b> 為被動句型，故填入過去分詞 <b>adjusted</b>。<br><b>名詞形：adjustment</b>（n. 調整、適應）何時才對：<i>We need to make a few minor adjustments to the schedule.</i>（我們需要對行程做一些微幅調整。）</p>')

+ card(8, ["考點：詞類變化 rely (v.) → reliable (adj.)", "詞性需求：形容詞"], "reliable",
  '<div class="stem"><div class="en">'+fx("The Internet is not always a [[8|reliable]] (rely) source of information because anyone can publish fake news and spread it online.")+'</div><div class="zh">網路並非總是可靠的資訊來源，因為任何人都可以發布假新聞並在網路上散播。</div></div>'
  + clue('a + ___ + N (source) 的結構明確要求形容詞；後半句「假新聞散播」說明網路資訊「不可靠」，語意對應 reliable 的反面情境。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0">空格在冠詞 a 和名詞 source 之間，須填形容詞修飾 source，動詞 rely（依賴）去 y 加 -able 轉為形容詞 <b>reliable</b>（可靠的）。<br><b>動詞原形：rely</b>（v. 依賴，須搭配 on）何時才對：<i>You cannot always rely on the Internet for accurate news.</i>（你不能總是依賴網路獲取正確新聞。）</p>')

+ card(9, ["考點：詞類變化 stability (n.) → stable (adj.)", "詞性需求：形容詞"], "stable",
  '<div class="stem"><div class="en">'+fx("Kate and Nick keep going out with each other in hopes of developing a [[9|stable]] (stability) relationship.")+'</div><div class="zh">Kate 和 Nick 持續交往，希望能發展出一段穩定的關係。</div></div>'
  + clue('a + ___ + relationship 的結構要求形容詞；develop a stable relationship（發展穩定關係）為常見固定用法。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0">空格修飾名詞 relationship，須為形容詞，名詞 stability（穩定性，n.）須還原為形容詞 <b>stable</b>（穩定的）。<br><b>名詞原形：stability</b>（n. 穩定、穩固）何時才對：<i>Adding a triangular base will increase the stability of the structure.</i>（加上三角形底座會增加結構的穩定性。）</p>')

+ card(10, ["考點：詞類變化 architect (人) → architecture (事物)", "詞性需求：不可數名詞（表事物）"], "architecture",
  '<div class="stem"><div class="en">'+fx("Many visitors come to this historic site to admire its fine [[10|architecture]] (architect).")+'</div><div class="zh">許多遊客來到這個歷史遺址欣賞它精美的建築。</div></div>'
  + clue('its fine ___ 中 fine 是形容詞，其後與 admire（欣賞）的受詞都指向歷史遺址「可被欣賞的事物／建築風格」，而非「人」，故排除 architect 本身。')
  + '<h4>正解解析＆詞類家族：何時才對</h4><p style="margin:2px 0">admire 的受詞須為表事物的名詞，architect（建築師，指「人」）須轉為 <b>architecture</b>（建築設計、建築風格，不可數名詞），fine architecture（精美的建築）語意通順。<br><b>指人名詞：architect</b>（n. 建築師）何時才對：<i>The famous architect designed this historic building.</i>（那位知名建築師設計了這棟歷史建築。）</p>');

/* === II. 綜合測驗 === */
const T2 = [
  [
    ["I'm here reporting live at the first-ever Marshmallow Challenge event in Boston.", "我正在波士頓現場報導有史以來第一場棉花糖挑戰賽。"],
    ["This event is organized by Canadian author Tom Wujec, who is attempting to raise the popularity of the challenge.", "這項活動是由加拿大作家 Tom Wujec 所籌辦，他致力於提高這項挑戰的知名度。"],
    ["Wujec's hope is that companies [[11|around the world]] will use the Marshmallow Challenge as a team-building exercise.", "Wujec 希望世界各地的公司都能將棉花糖挑戰運用作為團隊建立活動。"]
  ],
  [
    ["The rules of the challenge are simpler than [[12|those]] of many other games.", "這項挑戰的規則比許多其他遊戲的規則簡單。"],
    ["Each team gets a few sticks of spaghetti, one roll of tape, a meter of string, and a marshmallow.", "每一隊會拿到幾根義大利麵條、一捲膠帶、一公尺長的線，以及一顆棉花糖。"],
    ["They must [[13|construct]] a free-standing structure with the spaghetti, tape, and string in just eighteen minutes.", "他們必須在僅僅十八分鐘內，用義大利麵、膠帶和線建造出一個能夠獨立站立的結構。"],
    ["Also, the challenge is [[14|not]] complete [[14|until]] the team succeeds in placing the marshmallow on top of their structure.", "此外，直到該隊成功將棉花糖放上結構頂端之前，這項挑戰都不算完成。"],
    ["When the time is up, the team with the tallest structure holding the marshmallow is declared the winner.", "時間一到，結構最高且支撐住棉花糖的隊伍便獲宣布為贏家。"]
  ],
  [
    ["The Marshmallow Challenge [[15|has been held]] a number of times in the past few years.", "棉花糖挑戰在過去幾年中已被舉辦過許多次。"],
    ["However, [[16|unlike]] previous challenges in which teams were formed according to age or sex, Wujec has divided up his teams based on profession this time.", "然而，不同於先前依年齡或性別分組的挑戰，Wujec 這次是依職業來將隊伍分組。"],
    ["Competing today are five teams: lawyers, CEOs, architects and engineers, business [[17|graduates]], and kindergarten students.", "今天參賽的五支隊伍分別是：律師、執行長、建築師與工程師、商學系畢業生，以及幼稚園學童。"]
  ],
  [
    ["The results are surprising.", "結果令人驚訝。"],
    ["As expected, the architects and engineers won.", "正如預期，建築師與工程師隊獲勝。"],
    ["However, incredibly, the kindergartners finished second, proving that age and experience are not the most important [[18|elements]] of teamwork.", "然而，令人難以置信的是，幼稚園學童隊竟拿下第二名，證明了年齡和經驗並非團隊合作中最重要的要素。"],
    ["It seems that the secret of the children's success is their willingness to engage in [[19|trial and error]].", "看來孩子們成功的祕訣，在於他們願意進行反覆嘗試與試誤。"],
    ["Instead of spending a lot of time talking and planning at the beginning, they [[20|get down to]] work straight away.", "他們不是一開始就花大量時間討論和規劃，而是直接動手開始做。"]
  ],
  [
    ["This is Tom Dickson reporting live from Boston.", "以上是 Tom Dickson 在波士頓的現場報導。"],
    ["Now, back to you in the studio.", "現在把畫面交還給攝影棚主播。"]
  ]
];

const h2 = '<h2 id="p2">II. 綜合測驗（配分 20%，第 11–20 題，每題 2 分）</h2>'
+ passage("綜合測驗全文（第 11–20 題）", T2)

function w3(n,tags,ans,slot,clueT,cu){
  const li=Object.keys(WB).map(k=>{
    const w=WB[k];
    let txt=k==ans
      ? '✔ 本格唯一符合「'+slot+'」且語意通順者。'+(cu&&cu[k]?' '+cu[k]:'')
      : (cu&&cu[k]?cu[k]:w[1]+'（'+w[2]+'）：本格需要「'+slot+'」，此字詞性／形式或語意不符。何時才對：'+w[3]);
    return '<li class="'+(k==ans?'ok':'no')+'"><b>('+k+') '+w[0]+'</b> <small>'+w[1]+'</small> <i>'+(k==ans?'✔ 正解':'✘ 誤答')+'</i><br>'+txt+'</li>';
  }).join('');
  return card(n,tags,'('+ans+') '+WB[ans][0],stem(n)+clue(clueT)+'<ul class="op">'+li+'</ul>');
}

    [S4_OPTS[2][0], S4_OPTS[2][1], "Concentration 是翻牌配對記憶遊戲，比的是記憶位置與翻新牌策略，而非「預測對手動向（anticipate your opponent's moves）」，與上下文完全無關。"],
    [S4_OPTS[3][0], S4_OPTS[3][1], "已用於第 31 題說明基本勝負規則。"],
    [S4_OPTS[4][0], S4_OPTS[4][1], "說明研究者總結「成人整體表現最佳是因為有找出新牌的有效策略」，既解釋了本段首句「成人表現略優」的原因，又與下一句 \"The younger children, however, were best at remembering the locations of cards.\"（成人贏在翻新牌策略 ↔ 然而小孩最擅長記位置）形成完美轉折對比。"]
  ], "E"))

+ card(34, ["考點：篇章連貫（全文總結句＋呼應下句 did not necessarily beat）", "詞性需求：完整句子（以 These studies 總結前兩段研究）"], "B",
  stem(34)
  + clue('此處為全文最後一段的首句（結論段），前兩段已分別介紹完 the first study 與 the second study，故可用 "These studies..." 統整；且下一句 "Although the children did not necessarily beat the adults, they performed quite well..." 直接呼應「兩者表現其實相當接近（closely matched）」。')
  + ops([
    [S4_OPTS[0][0], S4_OPTS[0][1], "已用於第 32 題。"],
    [S4_OPTS[1][0], S4_OPTS[1][1], "以 \"These studies of the game Concentration\" 回指前兩段介紹完的兩項研究，總結出「兒童與成人的表現水準相當接近（quite closely matched）」，緊接著下一句補充「雖然孩子不一定贏過成人，但在需要記憶力的領域表現得很好」，前後文意緊密咬合。"],
    [S4_OPTS[2][0], S4_OPTS[2][1], "全文都在探討「成人與兒童在翻牌記憶遊戲中的記憶力與策略表現比較」，從頭到尾都與「預測對手動向」無關，故 (C) 為全篇唯一不使用的干擾選項。"],
    [S4_OPTS[3][0], S4_OPTS[3][1], "已用於第 31 題。"],
    [S4_OPTS[4][0], S4_OPTS[4][1], "已用於第 33 題。"]
  ], "B"));

/* === V. 翻譯 === */
const h5 = '<h2 id="p5">V. 翻譯（配分 20%，第 35 題 6 分，第 36–37 題各 7 分）</h2>'
+ card(35, ["考點：not...until...（直到…才…）＋how to V", "詞性需求：完整英文句子"], "見下方參考譯文",
  '<div class="stem"><div class="zh" style="color:inherit">Vivian 直到去年上大學才學會如何騎機車。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[35|Vivian didn't learn how to ride a scooter until she went to college last year.]]")+'</div></div>'
  + clue('1.「直到…才…」對應核心句型 <b>not... until...</b>（didn\'t learn... until she went...）。<br>2.「學會如何騎機車」譯為 <b>learn how to ride a scooter</b>。<br>3. 時間副詞 "last year" 修飾的是「去年上大學（went to college last year）」這個時間節點，請放在 until 子句句尾。')
  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 誤寫 <i>Vivian learned how to ride a scooter until she went to college last year.</i>（漏掉否定字 didn\'t：learn 是瞬間／達成動詞，若不加 not，變成「在上大學前一直學會騎車，上大學就不學會了」，語意不通。何時才可用肯定句 + until：延續性動詞如 <i>Vivian lived at home until she went to college last year.</i>）<br>✘ 誤寫 <i>ride a motorcycle</i> 雖可通，但台灣日常所稱的「（踏板式）機車」最道地用字為 <b>scooter</b>。</p>')

+ card(36, ["考點：現在完成式被動（has been + p.p.）＋不定詞表目的", "詞性需求：完整英文句子"], "見下方參考譯文",
  '<div class="stem"><div class="zh" style="color:inherit">一所新的小學已經被設立，用來實驗教育的創新理念。</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[36|A new elementary school has been set up to experiment with innovative ideas in education.]]")+'</div></div>'
  + clue('1.「一所新的小學」譯為 <b>A new elementary school</b>（或 primary school）。<br>2.「已經被設立」需用現在完成式被動語態 <b>has been set up</b>（或 has been established / founded）。<br>3.「用來實驗教育的創新理念」以不定詞表目的 <b>to experiment with innovative ideas in education</b>。')
  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 誤寫 <i>has set up</i>（漏掉 been 變成主動語態，但「學校」不能自己設立自己，必須用被動 <b>has been set up</b>；注意 set 三態同形 set-set-set）。<br>✘ 誤寫 <i>experiment innovative ideas</i>（experiment 作動詞「進行實驗、嘗試」時為不及物動詞，後接實驗對象必須加介系詞 <b>with</b> 或 <b>on</b>，針對想法／理念固定搭配 <b>experiment with + N</b>）。</p>')

+ card(37, ["考點：指示代名詞 that 代替單數名詞＋比較句型", "詞性需求：完整英文句子（題目限定以指示代名詞造句）"], "見下方參考譯文",
  '<div class="stem"><div class="zh" style="color:inherit">它的學生人數比一所普通學校的學生少。（請以指示代名詞造句）</div><div class="en" style="margin-top:6px"><b>參考譯文：</b>'+fx("[[37|The number of its students is smaller than that of the students in an average school.]]")+'</div></div>'
  + clue('1.「…的數量／人數」為 <b>The number of + 複數名詞</b>，主詞核心字是單數的 <b>number</b>，故動詞必須用單數 <b>is</b>。<br>2. 形容「人數（number）較少」英文習慣用 <b>smaller</b>（或 lower），不用 fewer。<br>3. 比較對象也是「學生人數（the number of the students）」，為避免重複單數名詞 the number，須用單數指示代名詞 <b>that</b> 代替（亦可簡寫為 <i>smaller than that in an average school</i> 或 <i>smaller than that of an average school</i>）。')
  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 誤寫 <i>The number of its students are fewer than...</i>（兩處錯誤：① 主詞是單數的 The number 而非 students，動詞須用 <b>is</b>；② 形容「數字（number）的大小」應用 <b>smaller / larger</b>，fewer 只能直接修飾複數可數名詞，如 <i>It has fewer students than an average school.</i>）<br>✘ 誤寫 <i>...smaller than those of...</i>（代名詞單複數錯誤：代替的是單數的 <b>the number</b>，故須用單數指示代名詞 <b>that</b>；若代替複數名詞如第 12 題的 the rules 才用 those。）</p>');

/* === VI. 混合題 === */
const T6 = [
  [
    ["Months ago, posts showing how a person looks now and looked ten years ago popped up on social networking websites like Instagram, Twitter, and Facebook.", "幾個月前，展示一個人現在與十年前樣貌的貼文，開始在 Instagram、Twitter 和 Facebook 等社群網站上湧現。"],
    ["The rules to participate couldn't have been easier: users simply had to make a comparison by posting two profile photos side by side, a decade-old one on the left and a recent one on the right.", "參加規則再簡單不過：使用者只需將兩張大頭照並排張貼，十年前的照片放左邊，近期的照片放右邊，做出對比即可。"],
    ["The main challenge of this exercise was having to face the effects of time on oneself.", "這項活動的主要挑戰在於必須面對時間在自己身上留下的痕跡。"],
    ["Users might have received feedback like \"even more gorgeous\" or \"age-defying\" from followers, at which some felt a sense of pride, while some knew these compliments were simply white lies.", "使用者可能會收到追蹤者像是「變得更迷人了」或「凍齡」之類的回饋，有些人對此感到驕傲，有些人則知道這些讚美只是善意的謊言。"],
    ["Even if they did not really look older than before, they felt older in their hearts.", "即使他們外表看起來其實沒有真的比以前老，他們在內心裡卻覺得自己老了。"]
  ],
  [
    ["Some psychologists were concerned about these posts, claiming they might leave a person feeling hopeless and depressed.", "有些心理學家對這類貼文感到憂心，認為它們可能會讓人感到絕望和沮喪。"],
    ["The seemingly positive comments could appear to be nothing but cold comfort.", "這些看似正面的留言，可能只不過是無濟於事的表面安慰。"],
    ["Some psychologists held a different view, though.", "不過，也有些心理學家持不同看法。"],
    ["Instead of [[38|refuting]] the effects of the ten-year challenge, they viewed it as an opportunity to show a person's maturity and self-growth.", "他們不去反駁／否定這項十年挑戰帶來的影響，反而將其視為展現一個人成熟與自我成長的機會。"],
    ["With a healthy mindset, one could strengthen one's sense of well-being and enjoy the wisdom that comes with aging.", "抱持健康的心態，人可以增強自身的幸福感，並享受隨著老化而來的智慧。"]
  ],
  [
    ["Indeed, if people taking on the challenge have learned to celebrate aging rather than deny it, old age can be seen as just as valuable, significant, and meaningful as youth, which is exactly what one movement advocates: \"Be Bold, Claim Old.\"", "事實上，如果參與這項挑戰的人已學會「慶祝／讚頌」老化而非否認老化，那麼老年便能被視為和年輕一樣有價值、重要且有意義，這正是某個運動所提倡的：「勇敢擁抱年老」（Be Bold, Claim Old）。"],
    ["Perhaps the real challenge lies not in physical change but in psychological growth.", "或許，真正的挑戰不在於外表的改變，而在於心理層面的成長。"]
  ]
];

const h6 = '<h2 id="p6">VI. 混合題（配分 12%，第 38–40 題，每格 4 分）</h2>'
+ passage("混合題閱讀文章（第 38–40 題）", T6)
+ card(38, ["考點：字彙定義配對（依上下文推敲字義）", "詞性需求：動名詞（照抄原文單字形式）"], "refuting",
  '<div class="stem"><div class="en">Which word in the second paragraph means "stating that something does not exist or is untrue"?<br>Answer: '+fx("[[|refuting]]")+'</div><div class="zh">第二段中哪個字的意思是「表示某事不存在或並非真實」？</div></div>'
  + stem(38)
  + clue('題幹定義為 "stating that something does not exist or is untrue"（聲稱某事不存在或不是真的＝反駁、否定）；檢視第二段第 4 句 "Instead of refuting the effects of the ten-year challenge, they viewed it as an opportunity..."（與其反駁／否定十年挑戰的影響，他們反而視之為機會），與第三段同義結構 "celebrate aging rather than deny it" 中的 deny 相互呼應。')
  + '<h4>正解解析＆字形注意</h4><p style="margin:2px 0"><b>refuting</b>（原形動詞為 <b>refute</b>，意為「反駁、駁斥、否定某事屬實」）。從原文摘錄單字題請務必照抄第二段出現的原字形 <b>refuting</b>，勿自行改為原形動詞。</p>')

+ card(39, ["考點：細節理解＋全文比對判斷是非（多選題）", "詞性需求：多選題（選二個正確敘述）"], "A、B",
  '<div class="stem"><div class="en">Which of the following statements are true about the ten-year challenge? (Choose TWO)</div><div class="zh">關於「十年挑戰」，下列哪些敘述為真？（請選兩項）</div></div>'
  + clue('逐一將六個選項與文章三段內容比對：注意正反兩派反應（第一、二段）以及第三段 "Be Bold, Claim Old" 標語的宗旨。')
  + ops([
    ["The impact of the challenge depended on how individuals perceived aging.", "這項挑戰帶來的影響取決於個人如何看待老化。", "第一段提到有人感到驕傲、有人覺得讚美只是善意謊言而心裡覺得老；第二、三段更指出心態不同會決定它是帶來絕望沮喪，還是促進自我成長與幸福感（\"With a healthy mindset...\" / \"if people... have learned to celebrate aging rather than deny it\"），完全符合原文。"],
    ["The phrase \"Be Bold, Claim Old\" promotes a positive perspective on aging.", "「勇敢擁抱年老（Be Bold, Claim Old）」這句標語提倡正向看待老化的觀點。", "第三段明確指出，若學會讚頌老化，老年就與青春一樣有價值且有意義，\"which is exactly what one movement advocates: \'Be Bold, Claim Old.\'\"，完全符合原文。"],
    ["The challenge was designed to prove that people always look better as they age.", "這項挑戰的設計目的是為了證明人越老總是越好看。", "文章並未說挑戰是為了證明人越老越好看；第一段甚至指出許多人知道「變得更迷人」只是善意的謊言（white lies），且心裡覺得自己變老了（\"they felt older in their hearts\"）。"],
    ["The main purpose of the challenge was to promote medication for mental health.", "這項挑戰的主要目的是推廣心理健康藥物。", "全文完全沒有提到任何藥物（medication），屬無中生有的錯誤敘述。"],
    ["Participants in the challenge were required to write an essay reflecting on their experience.", "挑戰的參與者被要求撰寫一篇文章來反思自己的經驗。", "第一段說明參加規則再簡單不過：只需並排張貼兩張大頭照（\"posting two profile photos side by side\"），完全沒有要求寫反思文章。"],
    ["An overwhelming majority of psychologists agreed that the challenge was harmful to participants' mental health.", "絕大多數的心理學家都同意這項挑戰對參與者的心理健康有害。", "第二段先說 \"Some psychologists were concerned...\"（有些心理學家擔憂），接著馬上說 \"Some psychologists held a different view, though.\"（不過也有些心理學家持不同看法），可見看法分歧，並非「絕大多數（an overwhelming majority）」都認為有害。"]
  ], "AB"))

+ card(40, ["考點：文意摘要填空＋詞性轉換（名詞→原形V／原形V→動名詞）", "詞性需求：(1) 原形及物動詞 (2) 動名詞 (V-ing)"], "(1) compare ／ (2) celebrating",
  '<div class="stem"><div class="zh" style="color:inherit;margin-bottom:6px">請從文章中找出最適當的單詞填入空格，並視句型結構需要做適當的字形變化（每格限填一詞）：</div><div class="en">(1) A social media trend encouraged users to '+fx("[[|compare]]")+' their current appearance with how they looked a decade ago, which sparked mixed psychological reactions.<br>(2) While some worried about its negative effects, others saw it as a chance for growth, emphasizing the importance of '+fx("[[|celebrating]]")+' aging instead of denying it.</div><div class="zh" style="margin-top:6px">（1）一股社群媒體風潮鼓勵使用者將自己現在的外貌與十年前的樣子進行比較，這引發了正反不一的心理反應。<br>（2）雖然有些人擔心其負面影響，但其他人將其視為成長的機會，強調慶祝（讚頌）老化而非否認老化的重要性。</div></div>'
  + clue('<b>第 (1) 格：</b>句型為 "encouraged users to ___ their current appearance with..."，不定詞 to 後須接<b>原形動詞</b>，且與後方介系詞 with 構成 "compare A with B"（將 A 與 B 作比較）；對應第一段第 2 句的名詞 "make a <b>comparison</b>"，須將名詞 comparison 轉為動詞原形 <b>compare</b>。<br><b>第 (2) 格：</b>句型為 "the importance of ___ aging instead of denying it"，介系詞 of 後須接<b>動名詞（V-ing）</b>，且與後方 "instead of denying it" 對仗；對應第三段第 1 句的 "learned to <b>celebrate</b> aging rather than deny it"，須將原形動詞 celebrate 轉為動名詞 <b>celebrating</b>。')
  + '<h4>常見錯誤：何時才對／錯在哪</h4><p style="margin:2px 0">✘ 第 (1) 格誤填 <i>comparison</i>（未做詞類變化：原文 "make a comparison" 是名詞，但本題在 "encouraged users to ___" 的不定詞 to 之後，必須改為原形動詞 <b>compare</b>）。<br>✘ 第 (2) 格誤填 <i>celebrate</i>（未做詞形變化：原文在 "learned to celebrate" 的不定詞 to 後用原形，但本題在 "the importance of ___" 的介系詞 of 之後，必須改為動名詞 <b>celebrating</b>，才能與後方的動名詞 denying 對稱）。</p>');

// 最後掛載至 #app 與 #nav：
document.getElementById('app').innerHTML = h1+h2+h3+h4+h5+h6;
const secs=[['p1','I 字彙'],['p2','II 綜合'],['p3','III 選填'],['p4','IV 篇章'],['p5','V 翻譯'],['p6','VI 混合']];
document.getElementById('nav').innerHTML=secs.map(s=>'<a href="#'+s[0]+'">'+s[1]+'</a>').join('')+'<button id="tg">全部收合</button>';
let open=true;
document.getElementById('tg').onclick=function(){open=!open;document.querySelectorAll('details.q').forEach(d=>d.open=open);this.textContent=open?'全部收合':'全部展開';};
</script>
