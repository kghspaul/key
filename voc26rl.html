<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>空中美語 字彙字識+ Levels 3&4 複習卷（第二十六回）Chapter 9-2 詳解</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>空中美語 字彙字識+ Levels 3&4 複習卷（第二十六回）Chapter 9-2</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\Vert{}([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 各大題資料與渲染邏輯 ===

const NAV_ITEMS = [
  ['#sec1', 'I. 字彙選擇 (1–10)'],
  ['#sec2', 'II. 選詞填充 (11–15)'],
  ['#sec3', 'III. 文意字彙 (16–20)'],
  ['#sec4', 'IV. 縱橫字謎 (21–25)']
];
document.getElementById('nav').innerHTML = NAV_ITEMS.map(x => `<a href="${x[0]}">${x[1]}</a>`).join('');

// 第 I 大題：Multiple Choice (1–10)
const SEC1 = [
  {
    n: 1,
    ans: 'D',
    tags: ['考點：慣用搭配 let out a sigh of relief', '詞性需求：單數可數名詞 (子音開頭)'],
    s: [
      'Tina let out a(n) [[1|sigh]] of relief when she heard her child was safe and sound.',
      '當蒂娜聽到她的孩子平安無事時，她鬆了一口氣。'
    ],
    clue: '空格前有動詞片語 <b>let out a(n)</b>（發出……），後接介系詞片語 <b>of relief</b>（鬆了一口氣／寬慰），且從屬子句指出孩子 <b>safe and sound</b>（安然無恙），构成固定搭配 <b>let out / heave / breathe a sigh of relief</b>（鬆了一口氣）。',
    ops: [
      ['twist', 'n. 轉變；轉折；扭轉', '搭配 <i>a twist of fate</i>（命運的轉折），不與 <i>let out ... of relief</i> 搭配。<br><b>何時才對：</b>The movie ended with a surprising <u>twist</u>.（這部電影以驚人的轉折作結。）'],
      ['operation', 'n. 手術；運作', '語意與「聽到孩子平安而發出寬慰聲」完全不符，須搭配 <i>perform / undergo an operation</i>（動／接受手術）。<br><b>何時才對：</b>The doctor performed an emergency <u>operation</u> on the patient.（醫生為病患進行了緊急手術。）'],
      ['yawn', 'n. 哈欠', '打哈欠表示疲倦或無聊（<i>let out a yawn</i>），與 <i>of relief</i>（放心、鬆一口氣）語意衝突。<br><b>何時才對：</b>Bored by the long lecture, Max stifled a <u>yawn</u>.（對冗長的演講感到無聊，麥克斯忍住了一個哈欠。）'],
      ['sigh', 'n. 嘆息；嘆氣', '<b>let out a sigh of relief</b> 為標準慣用語，意為「鬆了一口氣」，完全契合聽到孩子平安無事（<i>safe and sound</i>）的語境。']
    ]
  },
  {
    n: 2,
    ans: 'B',
    tags: ['考點：名詞搭配與前後因果對比', '詞性需求：形容詞（修飾名詞 food）'],
    s: [
      "My mom likes to eat [[2|organic]] food; it's usually more expensive, but she believes it's healthier.",
      '我媽媽喜歡吃有機食品；它通常比較貴，但她相信這比較健康。'
    ],
    clue: '空格後接名詞 <b>food</b>（食物），分號後說明其特徵為 <b>more expensive</b>（較昂貴）且 <b>healthier</b>（較健康），與 <b>food</b> 構成固定複合詞 <b>organic food</b>（有機食品）。',
    ops: [
      ['sexual', 'adj. 性的；性別的', '不能用來修飾食物（<i>food</i>）。<br><b>何時才對：</b>The school provides courses on gender equality and <u>sexual</u> education.（學校提供性別平等與性教育課程。）'],
      ['organic', 'adj. 有機的；不使用化學農藥的', '<b>organic food</b>（有機食物）符合「價格較高但被認為較健康」的常理與語境。'],
      ['physical', 'adj. 身體的；肉體的；物理的', '多修飾 <i>health / exercise / examination</i>，不構成 <i>physical food</i>。<br><b>何時才對：</b>Regular <u>physical</u> exercise helps reduce stress.（規律的身體運動有助於減輕壓力。）'],
      ['pregnant', 'adj. 懷孕的', '僅能修飾人或雌性動物（如 <i>a pregnant woman</i>），不可修飾食物。<br><b>何時才對：</b>Doctors advise <u>pregnant</u> women to avoid alcohol.（醫生建議孕婦避免飲酒。）']
    ]
  },
  {
    n: 3,
    ans: 'D',
    tags: ['考點：動詞語意與使役結果搭配', '詞性需求：原形及物動詞（不定詞 to 後）'],
    s: [
      "Amy likes to [[3|tickle]] her little brother to make him laugh while they're playing.",
      '艾咪在和弟弟玩耍時，喜歡搔他的癢逗他笑。'
    ],
    clue: '空格後接直接受詞 <b>her little brother</b>，且目的不定詞為 <b>to make him laugh while they\'re playing</b>（在玩耍時逗他發笑），唯有「搔癢（<b>tickle</b>）」會直接引發他人發笑。',
    ops: [
      ['sigh', 'v. 嘆氣', '不及物動詞，後方不可直接加受詞 <i>her little brother</i>，且嘆氣不會讓人發笑。<br><b>何時才對：</b>She <u>sighed</u> deeply when she saw the pile of homework.（看到成堆的作業時，她深深嘆了口氣。）'],
      ['toss', 'v. 扔；拋；擲', '把弟弟「扔出去」不符合日常安全玩耍逗笑的語境，通常受詞為球、硬幣或沙拉（<i>toss a ball / coin</i>）。<br><b>何時才對：</b>He <u>tossed</u> the keys onto the kitchen table.（他把鑰匙扔到廚房桌上。）'],
      ['tug', 'v. 用力拉；猛扯', '「用力拉扯」弟弟不會是逗他開懷大笑的典型動作，且常搭配介系詞 <i>at / on</i>。<br><b>何時才對：</b>The little boy <u>tugged</u> at his mother\'s sleeve to get her attention.（小男孩拉了拉媽媽的袖子以引起她的注意。）'],
      ['tickle', 'v. 搔癢；呵癢', '及物動詞，<b>tickle sb. to make sb. laugh</b>（搔某人癢逗某人笑）完全符合上下文邏輯。']
    ]
  },
  {
    n: 4,
    ans: 'A',
    tags: ['考點：醫藥計量單位搭配', '詞性需求：單數可數名詞（one 後）'],
    s: [
      'Take one [[4|tablet]] of this medicine after your meal to relieve your headache.',
      '飯後服用一片這種藥，以緩解你的頭痛。'
    ],
    clue: '祈使句開頭動詞為 <b>Take</b>（服用），後接 <b>one ___ of this medicine after your meal to relieve your headache</b>（飯後服用一___這種藥來緩解頭痛），需要表示「藥片、錠劑」的名詞。',
    ops: [
      ['tablet', 'n. 藥片；錠劑；平板電腦', '<b>take one tablet of medicine</b>（服用一片／一錠藥）為標準醫療用詞。'],
      ['feather', 'n. 羽毛', '指鳥類羽毛，不可作為藥物的服用單位。<br><b>何時才對：</b>A peacock\'s tail <u>feathers</u> are bright and colorful.（孔雀的尾羽鮮豔多彩。）'],
      ['thumb', 'n. （手的）拇指', '為人體部位，與服藥單位無關。<br><b>何時才對：</b>He hit his <u>thumb</u> with a hammer by accident.（他不小心用鐵鎚敲到了自己的大拇指。）'],
      ['wrist', 'n. 手腕', '為人體部位，不可填入藥物計量結構。<br><b>何時才對：</b>She wears a silver bracelet on her left <u>wrist</u>.（她在左手腕上戴著一條銀手鍊。）']
    ]
  },
  {
    n: 5,
    ans: 'C',
    tags: ['考點：易混淆字 visible vs. visual 與因果句型', '詞性需求：主詞補語形容詞（be 動詞 is 後）'],
    s: [
      'This insect is so tiny that it is only [[5|visible]] under a microscope.',
      '這隻昆蟲是如此微小，以至於只有在顯微鏡下才看得見。'
    ],
    clue: '句型 <b>so tiny that ...</b>（如此微小以至於……）搭配介系詞片語 <b>only ___ under a microscope</b>（只有在顯微鏡下才……），表示這隻昆蟲肉眼看不見、僅在顯微鏡下「可被看見的（<b>visible</b>）」。',
    ops: [
      ['nutritious', 'adj. 營養豐富的', '與昆蟲體積微小（<i>so tiny</i>）及顯微鏡（<i>under a microscope</i>）毫無邏輯關聯。<br><b>何時才對：</b>Oatmeal with fresh fruit makes a <u>nutritious</u> breakfast.（燕麥片加新鮮水果是營養豐富的早餐。）'],
      ['physical', 'adj. 身體的；實體的', '昆蟲本身即為實體，不會「只有在顯微鏡下才是實體的」。<br><b>何時才對：</b>There is no <u>physical</u> evidence linking him to the crime.（沒有任何實質物證將他與這起犯罪連結起來。）'],
      ['visible', 'adj. 看得見的；可見的', '字尾 <i>-ible</i> 表「能夠被……的」，<b>visible under a microscope</b> 意為「在顯微鏡下才看得見」，完美呼應前文 <i>so tiny</i>。'],
      ['visual', 'adj. 視覺的；視力的（常置於名詞前）', '<i>visual</i> 指「與視覺相關的」（如 <i>visual aids</i> 視覺教具、<i>visual effects</i> 視覺效果），不可作補語表示某物「可被看見」。<br><b>何時才對：</b>The teacher used <u>visual</u> aids to explain the complex concept.（老師使用視覺教具來解釋這個複雜的概念。）']
    ]
  },
  {
    n: 6,
    ans: 'A',
    tags: ['考點：生理反應動詞與因果邏輯', '詞性需求：現在分詞 V-ing（構成過去進行式 was V-ing）'],
    s: [
      "Ned was [[6|yawning]] throughout the class because he didn't get much sleep last night.",
      '奈德整堂課都在打哈欠，因為他昨晚沒睡好。'
    ],
    clue: '原因副詞子句 <b>because he didn\'t get much sleep last night</b>（因為他昨晚沒睡多少覺）直接點出睡眠不足的生理反應，搭配時間副詞片語 <b>throughout the class</b>（整堂課期間），應選「打哈欠（<b>yawning</b>）」。',
    ops: [
      ['yawning', 'v. 打哈欠（現在分詞）', '睡眠不足（<i>didn\'t get much sleep</i>）導致上課期間一直打哈欠，語意完全吻合。'],
      ['yelling', 'v. 喊叫；大吼（現在分詞）', '睡眠不足不會使人在整堂課大吼大叫。<br><b>何時才對：</b>The coach was <u>yelling</u> instructions from the sideline.（教練在場邊大聲喊叫下達指示。）'],
      ['punching', 'v. 用拳猛擊（現在分詞）', '及物動詞缺受詞，且與沒睡飽無關。<br><b>何時才對：</b>The boxer spent an hour <u>punching</u> the heavy bag.（那位拳擊手花了一小時擊打沙包。）'],
      ['sucking', 'v. 吸；吮（現在分詞）', '與睡眠不足無因果關係。<br><b>何時才對：</b>The baby fell asleep while <u>sucking</u> on a pacifier.（嬰兒吸著奶嘴睡著了。）']
    ]
  },
  {
    n: 7,
    ans: 'B',
    tags: ['考點：動作動詞與受詞 the top of the bottle 搭配', '詞性需求：原形及物動詞（have to 後）'],
    s: [
      'You just have to [[7|twist]] the top of the bottle a bit harder to get it off.',
      '你只需要再稍微用力轉一下瓶蓋，就能把它打開。'
    ],
    clue: '受詞為 <b>the top of the bottle</b>（瓶蓋），後接副詞 <b>a bit harder</b>（再用力一點）與目的不定詞 <b>to get it off</b>（把它取下／打開），旋開瓶蓋的標準動詞為 <b>twist</b>（扭、轉）。',
    ops: [
      ['tickle', 'v. 搔癢', '受詞必須是人或動物，不能搔瓶蓋的癢。<br><b>何時才對：</b>The grass <u>tickled</u> my bare feet as I walked across the lawn.（我走過草坪時，青草搔得我赤腳發癢。）'],
      ['twist', 'v. 扭；轉；旋開', '<b>twist the top/cap of the bottle</b>（旋轉瓶蓋）完全符合把瓶蓋轉下（<i>get it off</i>）的物理動作。'],
      ['stroke', 'v. 輕撫；撫摸', '「輕撫」瓶蓋無法搭配 <i>a bit harder</i> 來將瓶蓋取下。<br><b>何時才對：</b>She gently <u>stroked</u> the cat\'s soft fur.（她溫柔地撫摸貓咪柔軟的毛。）'],
      ['scream', 'v. 尖叫', '多為不及物動詞，無法直接加受詞 <i>the top of the bottle</i> 來打開瓶蓋。<br><b>何時才對：</b>The children <u>screamed</u> with excitement on the roller coaster.（孩子們在雲霄飛車上興奮地尖叫。）']
    ]
  },
  {
    n: 8,
    ans: 'A',
    tags: ['考點：片語動詞 swell up 與運動傷害語境', '詞性需求：過去式不及物動詞（與 twisted 時態一致）'],
    s: [
      'Sherry twisted her ankle, and it [[8|swelled]] up like a golf ball.',
