<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>306 Vocabulary New 考題詳解[cite: 1]</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>306 Vocabulary New 考卷詳解</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav">
  <a href="#part1">I. Complete the sentences</a>
  <a href="#part2">II. Fill in a word</a>
</nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位[cite: 1]。</footer>

<script>
const L="ABCDEFGHIJ";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\Vert{}([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEFGHIJ';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEFGHIJ'?'('+L[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// 建立共用字典
const dict10 = [
  ["slope", "n. 斜坡/坡道", "此字表示傾斜的地形。何時才對：The ball rolled down the grassy slope."],
  ["crop", "n. 農作物", "此字指農田種植的作物。何時才對：Corn is a staple crop in this country."],
  ["outsider", "n. 局外人", "此字指不屬於某群體的人。何時才對：As an outsider, he didn't understand their inside jokes."],
  ["dilemma", "n. 進退兩難的困境", "此字指面臨困難的抉擇。何時才對：She faced a moral dilemma."],
  ["nevertheless", "adv. 儘管如此/然而", "此為轉折語氣副詞。何時才對：It was raining; nevertheless, we went for a walk."],
  ["awe", "n. 敬畏", "此字指驚嘆與敬畏之情。何時才對：We stared at the majestic mountains in awe."],
  ["path", "n. 小徑/路線", "此字指供人行走的道路。何時才對：Follow the forest path to reach the cabin."],
  ["smooth", "adj. 平滑的/順利的", "此字形容表面沒有凸起或事情順利。何時才對：The surface of the ice is very smooth."],
  ["peculiar", "adj. 奇怪的/特有的", "此字形容事物奇特或獨特。何時才對：There is a peculiar smell in the kitchen."],
  ["confront", "v. 面對/對抗", "此字指勇敢面對困難或敵人。何時才對：You must confront your fears."]
];

function getOpsFor(ansIndex) {
    return dict10.map((item, index) => {
        if (index === ansIndex) {
            return [item[0], item[1], "符合句意與詞性。"];
        } else {
            return [item[0], item[1], "語意或詞性不符。錯在哪裡：本句上下文不需要此意。" + item[2].split("何時才對：")[1] ? ("何時才對：附例句 - " + item[2].split("何時才對：")[1]) : ""];
        }
    });
}

// 第一大題資料
SENT['1'] = ["The skiers carefully made their way down the steep, snowy [[1|slope]].", "滑雪者小心翼翼地沿著陡峭、被雪覆蓋的坡道往下走。"];
SENT['2'] = ["Wheat is a vital [[2|crop]] that farmers in this region depend on for their livelihood.", "小麥是這個地區的農民賴以為生的重要農作物。"];
SENT['3'] = ["Since she had just moved to the tight-knit community, Jane felt like an [[3|outsider]] at the local festival.", "因為珍剛搬到這個關係緊密的社區，她在當地慶典上感覺自己像個局外人。"];
SENT['4'] = ["The manager was caught in a [[4|dilemma]] between cutting the budget or firing some employees.", "經理陷入了縮減預算或解雇部分員工的進退兩難困境中。"];
SENT['5'] = ["The weather was freezing cold; [[5|nevertheless]], the dedicated fans still showed up for the outdoor concert.", "天氣非常寒冷；儘管如此，死忠的粉絲依然出席了這場戶外演唱會。"];
SENT['6'] = ["The audience watched in [[6|awe]] as the acrobat performed a death-defying stunt high above the stage.", "當雜技演員在舞臺高處表演玩命特技時，觀眾敬畏地看著。"];
SENT['7'] = ["If you follow this winding stone [[7|path]], you will eventually reach the beautiful secret garden.", "如果你沿著這條蜿蜒的石頭小徑走，最終會到達那座美麗的祕密花園。"];
SENT['8'] = ["The baby's skin was incredibly soft and [[8|smooth]] to the touch.", "嬰兒的皮膚摸起來難以置信地柔軟且平滑。"];
SENT['9'] = ["It was quite [[9|peculiar]] that my dog, who usually loves eating, completely ignored his favorite treats today.", "我的狗通常很愛吃，今天卻完全不理會牠最愛的零食，這真的很奇怪。"];
SENT['10'] = ["The brave leader urged his team to [[10|confront]] the upcoming challenges instead of running away from them.", "勇敢的領導者敦促他的團隊去面對即將到來的挑戰，而不是逃避它們。"];

// 第二大題資料
SENT['11'] = ["The vase was placed too close to the edge of the table, causing it to [[11|tumbled]] [[12|off]] and shatter into pieces.", "花瓶放得太靠近桌子邊緣，導致它摔落並碎成碎片。"];
SENT['13'] = ["After falling off his skateboard, Tommy [[13|got]] some [[14|bumps]] and [[15|bruises]], but he wasn't seriously hurt.", "從滑板上摔下來後，湯米受了些碰撞和瘀青，但他傷得不重。"];
SENT['16'] = ["The new smartphone model [[16|is]] clearly [[17|superior]] [[18|to]] the older version in terms of battery life and camera quality.", "在電池續航力和相機品質方面，新款智慧型手機明顯優於舊版。"];
SENT['19'] = ["The wealthy businessman always spoke to his employees with a clear [[19|sense]] [[20|of]] [[21|superiority]].", "這位富有的商人總是帶著明顯的優越感對員工說話。"];
SENT['22'] = ["The experienced captain was able to safely [[22|navigate]] [[23|through]] the dangerous rocks in the shallow water.", "經驗豐富的船長能夠安全地航行穿過淺水區危險的岩石。"];
SENT['24'] = ["The popular television series [[24|was]] beautifully [[25|adapted]] [[26|from]] a famous historical novel written in the 19th century.", "這部大受歡迎的電視影集是從一本寫於19世紀的著名歷史小說優美地改編而來。"];
SENT['27'] = ["The kind-hearted baker [[27|took]] [[28|pity]] [[29|on]] the homeless man and gave him some fresh warm bread.", "好心的麵包師傅同情那位無家可歸的男子，給了他一些新鮮溫暖的麵包。"];
SENT['30'] = ["The referee had to step in immediately before a violent [[30|confrontation]] [[31|broke]] [[32|out]] between the two angry players.", "在兩名憤怒的球員爆發暴力衝突前，裁判必須立刻介入。"];
SENT['33'] = ["The nervous student felt her face turn red [[33|under]] the strict teacher's intense [[34|gaze]].", "在嚴格老師強烈的注視下，緊張的學生感覺自己的臉變紅了。"];
SENT['35'] = ["The excited family packed their luggage into the car and [[35|set]] [[36|off]] for their summer vacation at dawn.", "興奮的一家人把行李裝進車裡，並在黎明時分出發去放暑假。"];
SENT['37'] = ["It takes a lot of patience and love to properly [[37|care]] [[38|for]] an elderly dog with medical issues.", "要妥善照顧一隻有醫療問題的老狗，需要大量的耐心和愛心。"];
SENT['39'] = ["The moment I first [[39|laid]] [[40|eyes]] [[41|on]] the breathtaking ocean view, I knew I wanted to live there.", "當我第一眼看到那令人屏息的海景時，我就知道我想住在那裡。"];
SENT['42'] = ["My alarm didn't go off, I spilled coffee on my shirt, and [[42|worst]] [[43|of]] [[44|all]], I missed the most important meeting of the year.", "我的鬧鐘沒響，我把咖啡灑在襯衫上，最糟的是，我錯過了年度最重要的會議。"];
SENT['45'] = ["I helped my neighbor fix her roof, and she baked me a delicious chocolate cake [[45|in]] [[46|return]].", "我幫鄰居修屋頂，作為回報，她烤了一個美味的巧克力蛋糕給我。"];
SENT['47'] = ["They decided to move to a safer and quieter neighborhood [[47|for]] [[48|the]] [[49|sake]] [[50|of]] their children's education.", "為了孩子們的教育著想，他們決定搬到一個更安全、更安靜的社區。"];

let html = '<h2 id="part1">I. Complete the following sentences</h2>';

const part1Clues = [
  "句子中的 `down the steep, snowy` 提示需要一個與下坡地形相關的名詞。",
  "`Wheat` (小麥) 和 `farmers` (農民) 提示這是一個農作物的名詞。",
  "`tight-knit community` (關係緊密的社區) 和 `felt like an...` 提示她感覺自己不屬於這個群體。",
  "`between cutting... or firing...` (在縮減預算或解雇員工之間) 提示經理面臨困難的兩難抉擇。",
  "`freezing cold` (極冷) 和 `still showed up` (依然出現) 之間是語意轉折，需填入轉折副詞。",
  "`watched in...` 和 `death-defying stunt` (玩命特技) 提示觀眾充滿驚嘆與敬畏。",
  "`winding stone` (蜿蜒的石頭...) 和 `reach the garden` 提示需填入路徑名詞。",
  "`soft and ... to the touch` (摸起來柔軟且...) 提示需要一個形容詞來描述嬰兒皮膚的平滑。",
  "`usually loves eating` 與 `completely ignored` 形成強烈對比，因此這件事是很「奇怪的」。",
  "`instead of running away` (而不是逃跑) 提示勇敢的領導者會要求團隊「面對」挑戰。"
];

for(let i=1; i<=10; i++){
  html += card(
    i, 
    ['考點：語意搭配與上下文推理', '詞性需求：見各題詳解'], 
    dict10[i-1][0], 
    stem(i) + clue(part1Clues[i-1]) + ops(getOpsFor(i-1), L[i-1], L)
  );
}

html += '<h2 id="part2">II. Fill in a word from the list. Make changes if necessary.</h2>';
const part2Clues = [
  "**tumbled off**: 指「從...摔落」。因花瓶太靠近邊緣而摔下。",
  "**got bumps and bruises**: 固定片語，指「受到碰撞與瘀青」。",
  "**is superior to**: 形容詞片語 `be superior to` 表示「優於...」。",
  "**sense of superiority**: 名詞片語，指「優越感」。",
  "**navigate through**: 動詞片語，指「航行穿過/導航通過」危險區域。",
  "**was adapted from**: 被動語態片語 `be adapted from`，表示「改編自...」。",
  "**took pity on**: 動詞片語 `take pity on sb`，表示「同情某人」。",
  "**confrontation broke out**: `break out` 意為「爆發」，此處搭配主詞 confrontation (衝突)。",
  "**under ... gaze**: 介系詞搭配 `under one's gaze`，表示「在某人的注視之下」。",
  "**set off**: 動詞片語，意為「出發/啟程」。",
  "**care for**: 動詞片語，意為「照顧」，等同於 take care of。",
  "**laid eyes on**: 動詞片語 `lay eyes on`，表示「看見/把目光投向」。",
  "**worst of all**: 轉折片語，表示「最糟糕的是」。",
  "**in return**: 副詞片語，表示「作為回報」。",
  "**for the sake of**: 介系詞片語，表示「為了...的緣故/利益」。"
];

const part2Starts = [11, 13, 16, 19, 22, 24, 27, 30, 33, 35, 37, 39, 42, 45, 47];
for(let j=0; j<part2Starts.length; j++){
  let n = part2Starts[j];
  html += card(
    n + (n !== part2Starts[j+1]-1 && j !== part2Starts.length-1 ? ('~'+ (part2Starts[j+1]-1)) : (j === part2Starts.length-1 ? '~50' : '')), 
    ['考點：片語與慣用語', '詞性需求：依片語結構而定'], 
    '見題幹黃底處', 
    stem(n) + clue(part2Clues[j])
  );
}

document.getElementById('app').innerHTML = html;
</script>
<script src="bookmark.js"></script>
</body>
</html>
