<title>高雄女中 115學年度第1學期第1次定期考查 高二英文科詳解</title>
<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}

main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}

ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>高雄女中 115學年度第1學期第1次定期考查 高二英文科詳解</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 一、單字、慣用語選擇 (1-16) ===
const SEC1 = [
  [1, ["考點：名詞搭配詞與語意", "詞性需求：不可數名詞（作複合名詞修飾語）"], "A",
   ["Rapid advancements in artificial intelligence are significantly changing youth [[1|employment]] opportunities in the dynamic labor market across developed nations.", "人工智慧的快速發展正顯著改變已開發國家動態勞動市場中的青年就業機會。"],
   "空格位於名詞 <b>youth</b> 與 <b>opportunities</b>（機會）之間，且後方介系詞片語明確點出語境為 <b>in the dynamic labor market</b>（在動態的勞動市場中）。「就業機會」的標準英文搭配詞為 <b>employment opportunities</b>。",
   [
     ["employment", "n. 就業；雇用", "與後方 opportunities 構成常見搭配詞 <b>employment opportunities</b>（就業機會），完全呼應後文的 labor market（勞動市場）。"],
     ["corporation", "n. 大企業；公司", "語意不合。「青年公司機會」在邏輯上不通。<br><b>何時才對：</b>He works for a multinational <u>corporation</u> based in Tokyo.（他在一家總部設於東京的跨國企業工作。）"],
     ["implication", "n. 含意；可能引發的後果", "常搭配 have implications for...，不與 opportunities 連用。<br><b>何時才對：</b>The new law has serious <u>implications</u> for small businesses.（這項新法律對小型企業有深遠的影響。）"],
     ["craftsmanship", "n. 工藝；精湛技藝", "指手工藝技術，與人工智慧改變勞動市場機會無關。<br><b>何時才對：</b>The antique watch is admired for its fine <u>craftsmanship</u>.（這支古董錶因其精湛工藝而備受讚賞。）"]
   ]
  ],
  [2, ["考點：形容詞搭配詞与情緒反應", "詞性需求：形容詞（主詞補語）"], "B",
   ["The passengers were [[2|pale]] with fright when the plane suddenly dropped several hundred feet.", "當飛機突然急降數百英尺時，乘客們嚇得臉色發白。"],
   "空格後緊接介系詞片語 <b>with fright</b>（因為恐懼），描述當飛機驟降時乘客外表的生理反應。英文慣用搭配 <b>pale with fright / fear / shock</b> 表示「嚇得臉色蒼白」。",
   [
     ["terminal", "adj. 晚期的；末端的", "多用來修飾疾病（如 terminal cancer）或航廈，不能形容人因驚嚇而產生的表情。<br><b>何時才對：</b>The patient was diagnosed with a <u>terminal</u> illness.（該病患被診斷出罹患絕症。）"],
     ["pale", "adj. 蒼白的", "構成慣用搭配 <b>be/turn pale with fright</b>（嚇得臉色發白），符合飛機驟降的驚悚情境。"],
     ["hollow", "adj. 空心的；空洞的", "指物體內部中空或雙頰凹陷、聲音空洞，不與 with fright 搭配形容瞬間驚嚇。<br><b>何時才對：</b>The old tree trunk is completely <u>hollow</u> inside.（這棵老樹幹裡面完全是空心的。）"],
     ["prompt", "adj. 迅速的；立即的", "形容行動或回覆很及時，與恐懼無關。<br><b>何時才對：</b>Thank you for your <u>prompt</u> reply to my email.（感謝您迅速回覆我的電子郵件。）"]
   ]
  ],
  [3, ["考點：介系詞搭配與名詞語意", "詞性需求：複數可數名詞"], "D",
   ["Asking elementary school students to write a 1,000-word essay might be beyond their [[3|capabilities]], so the idea should be reconsidered.", "要求小學生寫一篇一千字的文章可能超出他們的能力範圍，所以這個想法應該重新考慮。"],
   "主詞為「要求小學生寫一千字作文」，空格前有介系詞片語 <b>beyond their...</b>（超出他們的……），後方結果子句 <b>so the idea should be reconsidered</b>（因此該想法應重新考慮）說明這件事難度太高，構成慣用搭配 <b>beyond one's capability / capabilities</b>（超出某人的能力範圍）。",
   [
     ["feasts", "n. 盛宴；宴會", "語意完全無關。<br><b>何時才對：</b>The royal wedding was celebrated with grand <u>feasts</u>.（這場皇室婚禮以盛大的宴會慶祝。）"],
     ["aspects", "n. 層面；方面", "常搭配 in every aspect，不與 beyond one's 連用表能力不及。<br><b>何時才對：</b>We must consider all <u>aspects</u> of the problem before deciding.（做決定前我們必須考量問題的所有層面。）"],
     ["generations", "n. 世代；代", "語意不合，小學生寫長文並非「超出世代」。<br><b>何時才對：</b>This traditional recipe has been passed down through <u>generations</u>.（這份傳統食譜已代代相傳。）"],
     ["capabilities", "n. 能力；才能", "構成標準片語 <b>beyond one's capabilities</b>（超出某人的能力），符合小學生無法負荷千字長文的語境。"]
   ]
  ],
  [4, ["考點：動詞特殊用法（promise to V）", "詞性需求：第三人稱單數現在式動詞"], "B",
   ["With so many outstanding players competing in the tournament, today's semi-final [[4|promises]] to be an exciting game.", "有這麼多優秀選手在錦標賽中同場競技，今天的準決賽可望成為一場精彩的比賽。"],
   "前句 <b>With so many outstanding players competing</b>（有這麼多優秀選手參賽）提供正面預期，主詞為 <b>today's semi-final</b>（今天的準決賽），後接不定詞 <b>to be an exciting game</b>。動詞 <b>promise</b> 除以「人」為主詞表「承諾」外，以「事物」為主詞接 <b>to V</b> 時，意為「很有可能、可望、預示著會……」。",
   [
     ["fails", "v. 未能做到；失敗", "<b>fail to be</b> 意為「未能成為」，與前文「有眾多優秀選手參賽」的正面條件完全矛盾。<br><b>何時才對：</b>He never <u>fails</u> to impress the judges with his violin skills.（他的小提琴琴藝總能讓評審留下深刻印象。）"],
     ["promises", "v. 預示；可望；很有可能", "構成 <b>sth. promises to be...</b>（某事可望成為……／預示著會是……），完美銜接前因後果。"],
     ["agrees", "v. 同意", "主詞必須是有意識的「人」或「團體」，比賽（semi-final）本身不會「同意」成為精彩賽事。<br><b>何時才對：</b>The committee <u>agrees</u> to fund the research project.（委員會同意資助這項研究計畫。）"],
     ["determines", "v. 決定；查明", "若表「下定決心做某事」需以人為主詞且常用被動 <b>be determined to V</b>，事物本身不可用主動 determines to be。<br><b>何時才對：</b>Your attitude largely <u>determines</u> your success in life.（你的態度在很大程度上決定了你人生的成功。）"]
   ]
  ],
  [5, ["考點：上下文邏輯與名詞語意", "詞性需求：單數／不可數名詞"], "A",
   ["The virus left farmers with no choice but to carry out the [[5|slaughter]] of thousands of chickens to prevent further spread.", "這種病毒讓農民別無選擇，只能撲殺數千隻雞以防止疫情進一步擴散。"],
   "句首主詞為 <b>The virus</b>（病毒），句尾目的為 <b>to prevent further spread</b>（防止進一步擴散），動詞片語為 <b>carry out the... of thousands of chickens</b>（對數千隻雞執行……）。為防範禽流感等病毒擴散，農民必須「撲殺、屠宰」雞隻。",
   [
     ["slaughter", "n. 撲殺；屠宰；屠殺", "指大量宰殺動物（或殘殺人類），<b>carry out the slaughter of...</b> 符合防疫撲殺家禽的語境。"],
     ["swing", "n. 擺動；轉變；鞦韆", "語意不合，無法對雞隻執行擺動。<br><b>何時才對：</b>The golf coach helped him improve his <u>swing</u>.（高爾夫教練幫他改善揮桿動作。）"],
     ["grip", "n. 緊握；掌控", "常搭配 lose/keep a grip on，與撲殺雞隻無關。<br><b>何時才對：</b>Keep a tight <u>grip</u> on the rope so you don't fall.（緊緊抓住繩子以免跌倒。）"],
     ["pandemic", "n. 大流行病", "農民是為了防堵疫情，不可能「對雞隻執行大流行病（carry out the pandemic of chickens）」。<br><b>何時才對：</b>The COVID-19 <u>pandemic</u> changed the way people work worldwide.（新冠疫情大流行改變了全球人類的工作方式。）"]
   ]
  ],
  [6, ["考點：情緒形容詞與並列結構", "詞性需求：形容詞（主詞補語）"], "D",
   ["After their daughter was killed by her violent boyfriend, the family felt completely [[6|miserable]] and struggled with deep sadness.", "在女兒被暴力男友殺害後，這家人感到徹底悲痛欲絕，並在深沉的悲傷中掙扎。"],
   "時間副詞子句指出 <b>daughter was killed</b>（女兒遇害），且對等連接詞 <b>and</b> 後方搭配 <b>struggled with deep sadness</b>（在深沉悲傷中掙扎），故空格必須填入與「極度悲傷、痛苦」同向的形容詞。",
   [
     ["compelling", "adj. 引人入勝的；令人信服的", "多用來形容故事、證據或理由，不可形容喪女家屬的悲痛心情。<br><b>何時才對：</b>The lawyer presented a <u>compelling</u> argument in court.（律師在法庭上提出了令人信服的論點。）"],
     ["reckless", "adj. 魯莽的；不計後果的", "形容人的行為粗心大意（如酒駕），非遭遇不幸後的悲傷情緒。<br><b>何時才對：</b>He was arrested for <u>reckless</u> driving on the highway.（他因在高速公路上魯莽駕駛而被捕。）"],
     ["resourceful", "adj. 足智多謀的；隨機應變的", "為正面形容詞，指善於解決問題，與悲劇語境相反。<br><b>何時才對：</b>She is a <u>resourceful</u> manager who always finds solutions in a crisis.（她是一位足智多謀的經理，總能在危機中找到解決方案。）"],
     ["miserable", "adj. 悲慘的；痛苦萬分的", "形容人極度難過痛苦，與後方 struggled with deep sadness 完美呼應。"]
   ]
  ],
  [7, ["考點：讓步子句邏輯與程度副詞", "詞性需求：副詞（修飾副詞 well）"], "B",
   ["Despite having only a few weeks to prepare, the students performed [[7|remarkably]] well at the school's anniversary celebration, earning loud applause from the audience.", "儘管只有幾週的時間準備，學生們在學校校慶上的表現卻異常出色，贏得了觀眾熱烈的掌聲。"],
   "句首 <b>Despite having only a few weeks to prepare</b>（儘管只有幾週準備）為讓步語氣，且句尾結果分詞構句為 <b>earning loud applause</b>（贏得熱烈掌聲），可知空格修飾副詞 <b>well</b> 時，需表達「驚人地、非常地」好。",
   [
     ["slightly", "adv. 稍微；略微", "若僅表現「稍微好」，與「儘管準備時間極短」的轉折張力以及「贏得熱烈掌聲」的結果不符。<br><b>何時才對：</b>Today's temperature is <u>slightly</u> higher than yesterday's.（今天的氣溫比昨天稍微高一點。）"],
     ["remarkably", "adv. 非凡地；驚人地；出色地", "<b>perform remarkably well</b>（表現極為出色），凸顯準備時間短卻大獲成功的反差。"],
     ["essentially", "adv. 本質上；基本上", "不作程度副詞修飾表現好壞。<br><b>何時才對：</b>The two smartphones are <u>essentially</u> the same in hardware.（這兩支智慧型手機在硬體上本質是相同的。）"],
     ["eventually", "adv. 最終；終於", "強調漫長過程後的最終結果，不可用來修飾副詞 well 的程度。<br><b>何時才對：</b>After hours of searching, they <u>eventually</u> found the lost dog.（經過數小時的尋找，他們終於找到了走失的狗。）"]
   ]
  ],
  [8, ["考點：過去分詞片語作後位修飾與因果搭配", "詞性需求：過去分詞片語"], "D",
   ["The sudden change in weather [[8|attributed to]] rising global temperatures has affected farming communities across the region.", "歸因於全球氣溫上升的氣候驟變，已經影響了該地區的農村社區。"],
   "本句主詞為 <b>The sudden change in weather</b>，主要動詞為後方的 <b>has affected</b>，因此空格至 temperatures 為過去分詞片語修飾前面的氣候驟變。後面名詞 <b>rising global temperatures</b>（全球氣溫上升）是造成前面「氣候驟變」的「原因」，故用 <b>(which is) attributed to + 原因</b>（被歸因於……）。",
