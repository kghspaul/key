<body>
<div class="top">
  <h1>301-303龍騰複習卷詳解</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 各大題資料與渲染邏輯 ===

// I. 字彙與慣用語 (1-15)
const VOC=[
  [1,["考點：建築設計語境搭配 (pyramid / designed by / Ieoh Ming Pei)","詞性需求：單數可數名詞 (n.)"],"C",
    ["The pyramid at the entrance of the Louvre Museum in Paris was designed by a famous Chinese-American [[1|architect]] named Ieoh Ming Pei.","巴黎羅浮宮博物館入口處的金字塔是由一位名叫貝聿銘（Ieoh Ming Pei）的著名華裔美籍建築師所設計的。"],
    "主詞為建築構造 <code>The pyramid at the entrance of the Louvre Museum</code>（羅浮宮入口處的金字塔），動詞為被動語態 <code>was designed by</code>（由……設計），且後方人物為知名建築師 <code>Ieoh Ming Pei</code>（貝聿銘），故專門設計建築物的人稱為 <code>architect</code>（建築師）。",
    [
      ["graduate","n. 大學畢業生","「畢業生」並非負責設計博物館金字塔的專業頭銜。<br><b>何時才對：</b><i>The company hired twenty college graduates this summer.</i>"],
      ["champion","n. 冠軍；擁護者","用於體育競賽或社會倡議，不搭配 <code>was designed by</code>（設計建築）。<br><b>何時才對：</b><i>She became the world boxing champion at the age of twenty.</i>"],
      ["architect","n. 建築師","符合「設計羅浮宮玻璃金字塔的華裔美籍建築師貝聿銘」之專業身分與 <code>designed by</code> 搭配。"],
      ["employee","n. 受僱者；員工","貝聿銘是受託設計的大師而非一般「員工」，且無法呼應 <code>The pyramid ... was designed by</code>。<br><b>何時才對：</b><i>All employees are required to wear ID badges in the office.</i>"]
    ]
  ],
  [2,["考點：及物動詞語意＋名詞子句受詞 (that S + V)","詞性需求：過去式及物動詞 (V-ed)"],"B",
    ["In Katie’s medical report, the doctor [[2|mentioned]] that she had a heart problem and should avoid heavy exercise.","在凱蒂的醫療報告中，醫生提到她有心臟問題，且應該避免劇烈運動。"],
    "介系詞片語 <code>In Katie's medical report</code>（在凱蒂的醫療報告中）點出書面陳述語境，空格後直接接 <code>that</code> 引導的名詞子句 <code>that she had a heart problem...</code> 作受詞。四個選項中只有 <code>mentioned</code>（提及、說到）能以「人（<code>the doctor</code>）」為主詞並直接接 <code>that 子句</code> 表達在報告中「提到」某病情。",
    [
      ["contacted","v. 聯繫；聯絡","及物動詞 <code>contact</code> 後方必須接「人（受詞）」而非直接接 <code>that 子句</code>（不可說 <i>*contacted that...</i>）。<br><b>何時才對：</b><i>The doctor contacted Katie immediately after seeing her test results.</i>"],
      ["mentioned","v. 提到；提及","及物動詞，可直接接 <code>that 子句</code>（<code>mentioned that + S + V</code>），契合在醫療報告中「指出、提到」病況的語境。"],
      ["equipped","v. 配備；裝備","用法為 <code>equip A with B</code>，後面不可接 <code>that 子句</code>。<br><b>何時才對：</b><i>The ambulance is equipped with advanced medical devices.</i>"],
      ["reduced","v. 減少；降低","受詞應為數量、成本、風險等名詞，不可接 <code>that 子句</code>。<br><b>何時才對：</b><i>Regular exercise reduced her risk of heart disease.</i>"]
    ]
  ],
  [3,["考點：反義對比線索 (produced in a laboratory vs. real meat)","詞性需求：形容詞 (adj.)"],"D",
    ["Some consumers claim that [[3|artificial]] meat produced in a laboratory tastes as good as real meat.","有些消費者聲稱，在實驗室裡生產的人造肉嚐起來跟真肉一樣美味。"],
    "空格修飾名詞 <code>meat</code>（肉），後面過去分詞片語 <code>produced in a laboratory</code>（在實驗室中製造的）說明其非自然生長，且句尾比較對象 <code>as good as real meat</code>（跟「真肉」一樣好吃）中的 <code>real</code>（真正的、天然的）直接提示空格需填其反義詞 <code>artificial</code>（人造的）。",
    [
      ["corporate","adj. 企業的；法人的","「企業的肉」語意不通，且無法與 <code>produced in a laboratory</code> 及 <code>real meat</code> 對比。<br><b>何時才對：</b><i>They are trying to improve the company's corporate image.</i>"],
      ["beneficial","adj. 有益的","雖可修飾食物，但無法精準對應「在實驗室製造」與「真肉（<code>real meat</code>）」的真假／天然與人造對比。<br><b>何時才對：</b><i>A balanced diet is beneficial to your health.</i>"],
      ["frail","adj. 虛弱的；脆弱的","通常形容年長者身體虛弱或器物易碎，不可修飾 <code>meat</code>。<br><b>何時才對：</b><i>His frail health prevented him from traveling abroad.</i>"],
      ["artificial","adj. 人造的；人工的","<code>artificial meat</code>（人造肉）直接呼應 <code>produced in a laboratory</code>，並與句尾 <code>real meat</code> 形成完美對比。"]
    ]
  ],
  [4,["考點：轉折詞 (instead) 前後語意對比","詞性需求：不可數名詞 (n.)"],"A",
    ["As a soldier, Mark never regards the five-thousand-meter race as [[4|torture]]; instead, he thinks that it is a necessary part of his training.","身為一名軍人，馬克從不把五千公尺賽跑視為一種折磨；相反地，他認為這是他訓練中必要的一部分。"],
    "動詞片語 <code>regards A as B</code>（把 A 視為 B）中，A 為高體能負荷的「五千公尺長跑（<code>the five-thousand-meter race</code>）」，分號後以轉折副詞 <code>instead</code>（相反地）帶出正面態度「認為是訓練必要的一部分」，可見一般人常把跑五千公尺當作痛苦的「酷刑、折磨（<code>torture</code>）」，而馬克從不這麼認為。",
    [
      ["torture","n. 折磨；酷刑","常比喻極度辛苦或痛苦的體能訓練或差事，完美契合「五千公尺長跑」的體感。"],
      ["theft","n. 偷竊；竊盜罪","「把五千公尺賽跑視為偷竊」語意荒謬。<br><b>何時才對：</b><i>He reported the theft of his bicycle to the police.</i>"],
      ["fright","n. 驚嚇；恐懼","跑五千公尺是體力上的「煎熬／折磨（<code>torture</code>）」，而非突如其來的「驚嚇（<code>fright</code>）」。<br><b>何時才對：</b><i>The loud thunder gave the little girl quite a fright.</i>"],
      ["misery","n. 悲慘境遇；窮困不幸","<code>misery</code> 指長期處於貧困、喪親或災難中的「悲慘生活境遇」，不指單項體能跑步測驗。<br><b>何時才對：</b><i>The war brought untold misery to millions of refugees.</i>"]
    ]
  ],
  [5,["考點：不及物動詞搭配 (rank among the + 最高級)","詞性需求：第三人稱單數現在式動詞 (V-s)"],"A",
    ["Since the hotpot restaurant provides delicious food and high-quality service, it [[5|ranks]] among the finest in our town.","由於這家火鍋店提供美味的食物與高品質的服務，它在我們鎮上名列前茅（位居最優秀的餐廳之列）。"],
    "從屬子句 <code>Since...</code> 說明火鍋店食物美味、服務優質（因），主要子句空格後接介系詞片語 <code>among the finest in our town</code>（在我們鎮上最頂尖的餐廳之列）；固定搭配 <code>rank among...</code> 表示「名列……之中、排名在……之列」。",
    [
      ["ranks","v. 名列；排名；位居","構成固定搭配 <code>rank among the finest / best</code>（名列最優秀之列），因果邏輯順暢。"],
      ["flexes","v. 彎曲（關節）；收縮（肌肉）","餐廳不會「彎曲或收縮肌肉」。<br><b>何時才對：</b><i>The bodybuilder flexed his muscles in front of the mirror.</i>"],
      ["freezes","v. 結冰；凍結","火鍋店「在最頂尖餐廳中結冰」語意不通。<br><b>何時才對：</b><i>Water freezes at zero degrees Celsius.</i>"],
      ["banishes","v. 放逐；驅逐","及物動詞，後方須接受詞（搭配 <code>banish sb. from...</code>），語法與語意皆不合。<br><b>何時才對：</b><i>The king banished the traitor from the kingdom forever.</i>"]
    ]
  ],
  [6,["考點：因果連詞 (so) 與讓步細節 (just because of a few minor errors)","詞性需求：形容詞 (adj.)"],"D",
    ["We have spent a lot of time and money on this experiment, so it would be [[6|ridiculous]] to give it up just because of a few minor errors.","我們已經在這個實驗上花費了大量的時間與金錢，所以如果只因為幾個小錯誤就放棄它，那將會是荒謬可笑的。"],
    "前半句指出「已經投入大量時間與金錢（<code>spent a lot of time and money</code>）」，後半句假設「只因為幾個微不足道的小錯誤就放棄（<code>to give it up just because of a few minor errors</code>）」，兩相對比可知這樣做極不合理、非常「荒謬可笑的（<code>ridiculous</code>）」。",
    [
      ["generous","adj. 慷慨的；大方的","半途放棄實驗與「慷慨大方」無關。<br><b>何時才對：</b><i>It was very generous of you to pay for everyone's dinner.</i>"],
      ["furious","adj. 狂怒的","<code>furious</code> 的主詞必須是「人」（如 <i>He was furious...</i>），不可用於虛主詞句型 <code>it would be furious to V</code>。<br><b>何時才對：</b><i>The professor was furious when the students ruined the experiment.</i>"],
      ["unique","adj. 獨特的；獨一無二的","因小錯而放棄大筆心血是「荒謬愚蠢」而非正面的「獨一無二」。<br><b>何時才對：</b><i>Each person's fingerprints are completely unique.</i>"],
      ["ridiculous","adj. 荒謬的；可笑的；不合理的","適用虛主詞句型 <code>It is/would be ridiculous to V</code>，精準表達「因小失大、輕言放棄」的不合理。"]
    ]
  ],
  [7,["考點：比較分詞片語 (Compared with...) 搭配程度副詞","詞性需求：副詞 (adv.)"],"B",
    ["Compared with the male workers at this company, the female workers doing the same jobs receive [[7|relatively]] low pay.","與這家公司的男性員工相比，從事相同工作的女性員工領到相對較低的薪資。"],
    "句首分詞構句 <code>Compared with the male workers...</code>（與男性員工「相比」之下）明確建立比較基準，空格位於形容詞 <code>low</code> 之前，需填表「相對而言、比較起來」的副詞 <code>relatively</code> 來修飾 <code>low</code>。",
    [
      ["naturally","adv. 自然地；天生地","男女同工不同酬並非「天生地、理所當然地」低薪。<br><b>何時才對：</b><i>Speaking in public doesn't come naturally to everyone.</i>"],
      ["relatively","adv. 相對地；比較而言","與句首 <code>Compared with...</code>（與……相比）直接呼應，修飾形容詞 <code>low</code>（相對較低的）。"],
      ["consistently","adv. 一貫地；始終如一地","強調時間上的持續一致，無法呼應句首「與男員工相比（<code>Compared with</code>）」的橫向對比關係。<br><b>何時才對：</b><i>Our team has consistently performed well over the past five years.</i>"],
      ["effectively","adv. 有效地；實際上","不可用來修飾负面狀態形容詞 <code>low (pay)</code>。<br><b>何時才對：</b><i>The new medicine can effectively reduce pain.</i>"]
    ]
  ],
  [8,["考點：M型社會定義與後文解釋 (uneven / super-rich vs. very poor)","詞性需求：單數名詞 (n.)"],"C",
    ["In an M-shaped society, the [[8|distribution]] of wealth is uneven; some people are super-rich, while others are very poor.","在 M 型社會中，財富的分配是不均勻的；有些人超級富有，而另一些人卻非常貧窮。"],
    "空格位於 <code>the ___ of wealth is uneven</code>（財富的……是不均的），且分號後進一步解釋「有人極富、有人極貧」，這是經濟學與社會學標準搭配詞 <code>the distribution of wealth</code>（財富分配）。",
    [
      ["hesitation","n. 猶豫；躊躇","財富沒有「猶豫不均」的說法。<br><b>何時才對：</b><i>She agreed to help the poor family without hesitation.</i>"],
      ["innovation","n. 創新；革新","「財富的創新是不均的」語意不通。<br><b>何時才對：</b><i>Technological innovation has changed the way we communicate.</i>"],
      ["distribution","n. 分配；分佈","<code>the distribution of wealth</code>（財富分配）完美搭配表語 <code>uneven</code>（不均勻的）及後句貧富差距的說明。"],
      ["graduation","n. 畢業","與財富不均毫無關聯。<br><b>何時才對：</b><i>He plans to find a job right after graduation from college.</i>"]
    ]
  ],

    "1. <b>「但事實上」</b>：轉折片語 <code>But in fact,</code>（或 <code>However, in fact,</code>）。<br>2. <b>「吃太多糖的人」</b>：先行詞 <code>people</code> 後接關係子句 <code>who eat too much sugar</code>。<br>3. <b>「比……更有可能生病」</b>：使用比較級句型 <code>are more likely to get/become sick than...</code>。<br>4. <b>「那些吃太多脂肪的人」</b>：為避免重複前面的複數名詞 <code>people</code>，依提示使用複數指示代名詞 <b><code>those</code></b>（＝ <code>the people</code>），後接關係子句 <code>who eat too much fat</code>。",
    "`[[|But in fact, people who eat too much sugar are more likely to get sick than those who eat too much fat.]]`"
  ],
  [48,["考點：By the time + 過去簡單式，主要子句搭配過去完成式 (had + p.p.)","詞性需求：完整英文句子"],"By the time we were aware of the disease, it had already spread throughout the neighborhood.",
    "當我們察覺到這個疾病時，它早已在社區中傳播開來。（By the time....）",
    "1. <b>「當我們察覺到這個疾病時」</b>：依提示使用時間連接詞片語 <code>By the time</code>（到……的時候），引導<b>過去簡單式</b>子句 <code>we were aware of the disease</code>（或 <code>we noticed / realized the disease</code>）。<br>2. <b>「它早已在社區中傳播開來」</b>：因為「疾病傳播」發生在過去「我們察覺」之前（過去的過去），主要子句必須使用<b>過去完成式</b> <code>it had already spread</code>（注意 <code>spread</code> 三態同形：<code>spread-spread-spread</code>），搭配地點片語 <code>throughout / in the neighborhood (or community)</code>。",
    "`[[|By the time we were aware of the disease, it had already spread throughout the neighborhood.]]`"
  ],
  [49,["考點：虛受詞句型 (find + it + adj. + to V) ＋ 對等不定詞 (report ... and seek ...)","詞性需求：完整英文句子"],"Therefore, we found it necessary to report the situation to the government and seek help.",
    "因此，我們認為有必要向政府報告狀況並尋求幫助。（...find it...）",
    "1. <b>「因此」</b>：因果轉承副詞 <code>Therefore,</code>（或 <code>Thus, / As a result,</code>）。<br>2. <b>「我們認為有必要……」</b>：承接上題第 48 題的過去時態，並依提示使用五動詞<b>虛受詞句型</b> <code>we found it necessary to V</code>（若依中文現在式寫 <code>we find it necessary to V</code> 亦可，但題組連貫以過去式 <code>found</code> 最佳）。<br>3. <b>「向政府報告狀況並尋求幫助」</b>：在真正受詞不定詞 <code>to</code> 後平行連接兩個原形動詞片語：<code>report the situation (or condition) to the government</code> 以及 <code>and seek (or ask for) help</code>。",
    "`[[|Therefore, we found it necessary to report the situation to the government and seek help.]]`"
  ]
];
