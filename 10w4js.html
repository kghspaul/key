<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALL+ 互動英語 2026/10 Week 4 (Units 12-14) 週考＆洞洞卷詳解</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>ALL+ 互動英語 2026/10 Week 4 (Units 12–14) 週考＆隨堂洞洞卷詳解</h1>
  <p>🎧 <strong>聽力音檔連結：</strong><a href="https://drive.google.com/open?id=1VVSCB9Rd8Ppd9LJMtDtKlAAQ7yPmka9e&usp=drive_fs" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700;text-decoration:underline">點此開啟聽力測驗音檔</a></p>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 共用字庫定義 ===
const BANK_R_CLOZE = [
  ['(A) mashed','adj. / v. p.p. 搗碎的；壓成泥的','修饰名詞 sweet potatoes，表「搗成泥的地瓜（地瓜泥）」。<b>何時才對：</b>We had <b>mashed</b> potatoes and roast chicken for dinner.（我們晚餐吃了馬鈴薯泥和烤雞。）'],
  ['(B) recommend','v. 推薦','搭配助動詞 would 與介系詞 to（recommend sth to sb 向某人推薦某物）。<b>何時才對：</b>Can you <b>recommend</b> a good restaurant near the station?（你能推薦車站附近的好餐廳嗎？）'],
  ['(C) unfamiliar','adj. 不熟悉的','搭配 be unfamiliar with + N（對……不熟悉）。<b>何時才對：</b>Many tourists are <b>unfamiliar</b> with local customs.（許多遊客對當地習俗不熟悉。）'],
  ['(D) appeal','v. 吸引；投其所好','不及物動詞，固定搭配介系詞 to（appeal to sb 吸引某人）。<b>何時才對：</b>Bright colors often <b>appeal</b> to young children.（鮮豔的色彩往往能吸引幼童。）'],
  ['(E) experience','v. 體驗；經歷','接在不定詞 to 之後作原形及物動詞，受詞為 Taiwan’s friendly and energetic local culture。<b>何時才對：</b>Traveling abroad allows us to <b>experience</b> different ways of life.（出國旅遊讓我們能體驗不同的生活方式。）'],
  ['(F) affordable','adj. 價格實惠的；負擔得起的','與形容詞 delicious 對等連接（delicious and affordable snacks 美味又平價的小吃）。<b>何時才對：</b>This store sells stylish clothes at <b>affordable</b> prices.（這家店以實惠的價格販售時髦服飾。）'],
  ['(G) crispy','adj. 酥脆的','作連綴動詞 becomes 的主詞補語，與後句的 soft and chewy（外酥內軟Q）形成對比。<b>何時才對：</b>Bake the pizza until the crust is golden and <b>crispy</b>.（將披薩烤到餅皮呈現金黃酥脆。）']
];
function opsBankR(ans){return ops(BANK_R_CLOZE, ans, 'ABCDEFG');}

const BANK_H_U12 = [
  ['seeking','v-ing 尋求；請教','與前方的 using 對等（from using a grammar checker or seeking a teacher’s advice）。<b>何時才對：</b>Don’t be afraid of <b>seeking</b> help when you face difficulties.（遇到困難時別害怕尋求協助。）'],
  ['transparency','n. 透明度；公開透明','與抽象名詞 honesty 對等（honesty and transparency 誠實與公開透明）。<b>何時才對：</b>The public demanded greater <b>transparency</b> in government spending.（民眾要求政府支出有更高的透明度。）'],
  ['flag','v. 標記；標示（問題或警告）','主詞為複數代名詞 They（指檢測工具），搭配 flag A as B（將 A 標記為 B）。<b>何時才對：</b>The security system will <b>flag</b> any suspicious login attempts.（安全系統會標記任何可疑的登入嘗試。）'],
  ['reflect','v. 反映；展現','接在 be meant to 之後用原形動詞（reflect a student’s growth 反映學生的成長）。<b>何時才對：</b>A person’s actions often <b>reflect</b> their true values.（一個人的行為往往反映出其真實價值觀。）'],
  ['brainstorm','v. 腦力激盪；集思廣益','與原形動詞 organize、improve 對等並列（use AI to organize..., brainstorm ideas, or improve...）。<b>何時才對：</b>Let’s <b>brainstorm</b> some creative ideas for the school festival.（我們來為校慶腦力激盪一些有創意的點子吧。）'],
  ['defaulting','v-ing 預設採用；動輒訴諸於','接在介系詞片語 rather than 之後用動名詞，搭配介系詞 to（defaulting to punishment 動輒訴諸處罰）。<b>何時才對：</b>Instead of <b>defaulting</b> to anger, try to listen to the other side.（與其動輒發怒，不如試著傾聽對方的想法。）'],
  ['submissions','n. 繳交的作品／申請文件（複數）','接在所有格 applicants’ 之後作受詞，後接原形動詞 look，故用複數名詞。<b>何時才對：</b>All essay <b>submissions</b> must be handed in by Friday.（所有繳交的論文都必須在週五前呈交。）'],
  ['guidance','n. 引導；指導','作及物動詞 need 的受詞，與後方的名詞 fear 對比（need guidance, not fear）。<b>何時才對：</b>Under the teacher’s <b>guidance</b>, her English improved rapidly.（在老師的指導下，她的英文進步神速。）'],
  ['refine','v. 精煉；改進；潤飾','接在使役／準使役動詞 help them 之後用原形動詞（refine works 精修作品）。<b>何時才對：</b>The engineer continued to <b>refine</b> the design to make it safer.（工程師持續精進這項設計以使其更安全。）'],
  ['blurs','v. 使模糊（第三人稱單數）','主詞為單數名詞 AI，搭配片語 blur the line between A and B（模糊 A 與 B 之間的界線）。<b>何時才對：</b>Working from home often <b>blurs</b> the boundary between work and personal life.（在家工作常模糊了工作與私人生活的界線。）']
];
function opsBankU12(ansKey){
  return '<ul class="op">'+BANK_H_U12.map(o=>{
    const k=(o[0].toLowerCase()===ansKey.toLowerCase());
    return '<li class="'+(k?'ok':'no')+'"><b>'+o[0]+'</b> <small>'+o[1]+'</small> <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';
  }).join('')+'</ul>';
}

const BANK_H_U13 = [
  ['crowded into','v. p.p. 被擠進……','接在被動動名詞 being 之後（being crowded into a small box 被擠進狹小盒子裡）。<b>何時才對：</b>Hundreds of fans were <b>crowded into</b> the small concert hall.（數百名歌迷被擠進小小的音樂廳裡。）'],
  ['combined with','v. p.p. 結合……；加上……','位於句首作過去分詞構句（Combined with strong steel cables... 結合堅固的鋼纜……）。<b>何時才對：</b><b>Combined with</b> regular exercise, a balanced diet keeps you healthy.（結合規律運動，均衡飲食能讓你保持健康。）'],
  ['catching on','v-ing 流行起來；受到歡迎','與過去進行式助動詞 were 構成 were catching on（正逐漸普及／流行起來）。<b>何時才對：</b>Electric scooters are quickly <b>catching on</b> in many big cities.（電動滑板車在許多大城市正迅速流行起來。）'],
  ['levels','n. 樓層；高度（複數）','接在介系詞 between 之後須用複數可數名詞（move goods between levels 在不同樓層／高低處之間運送貨物）。<b>何時才對：</b>The shopping mall has five <b>levels</b>, including an underground parking lot.（這間購物中心有五個樓層，包含地下停車場。）'],
  ['snapped','v. （啪地一聲）繃斷、斷裂（過去式）','於條件子句 if a lifting rope snapped 中作過去式不及物動詞，表「纜繩斷裂」。<b>何時才對：</b>The guitar string suddenly <b>snapped</b> while he was playing.（他彈奏時吉他弦突然斷了。）'],
  ['drag on','v. 拖延；顯得漫長難熬','接在 seemed to 之後用原形動詞片語（drag on for too long 拖得太漫長）。<b>何時才對：</b>The boring meeting seemed to <b>drag on</b> forever.（那場無聊的會議似乎永無止境地拖下去。）'],
  ['come into','v. p.p. 進入；開始發揮（搭配 come into one’s own）','接在過去完成式助動詞 had 之後，構成固定片語 had come into their own（真正發揮所長／大放異彩）。<b>何時才對：</b>As a leader, she really <b>came into</b> her own during the crisis.（身為領導者，她在危機期間真正展現出自己的實力。）'],
  ['shaping','v-ing 塑造；形塑','接在介系詞 in 之後用動名詞（play a major role in shaping modern cities 在塑造現代城市中扮演重要角色）。<b>何時才對：</b>Parents play a vital role in <b>shaping</b> a child’s character.（父母在塑造孩子的性格上扮演關鍵角色。）'],
  ['accessibility','n. 無障礙環境；可及性','作複合名詞修飾語，accessibility rules 指「無障礙法規」。<b>何時才對：</b>New public buildings must meet strict <b>accessibility</b> standards for wheelchair users.（新建公共建築必須符合輪椅使用者的嚴格無障礙標準。）'],
  ['powered','v. p.p. 由……提供動力','過去分詞片語後位修飾名詞 elevators（elevators powered by steam 由蒸汽驅動的電梯）。<b>何時才對：</b>This eco-friendly house is entirely <b>powered</b> by solar energy.（這棟環保房屋完全由太陽能供電。）']
];
function opsBankU13(ansKey){
  return '<ul class="op">'+BANK_H_U13.map(o=>{
    const k=(o[0].toLowerCase()===ansKey.toLowerCase());
    return '<li class="'+(k?'ok':'no')+'"><b>'+o[0]+'</b> <small>'+o[1]+'</small> <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';
  }).join('')+'</ul>';
}

let html = '';

// ==========================================
// 第一部分：聽力測驗 (L1 - L12)
// ==========================================
html += '<h2 id="sec-listen">第一部分：聽力測驗（Listen & Comprehend）</h2>';

// 一、看圖辨義 L1, L2
html += passage('一、看圖辨義：第 L1 題聽力原文與圖片情境 (U13)', [
  [
    ['Ryan is an [[101|architect]].','瑞恩是一位建築師。'],
    ['He designs buildings for people to live and work in.','他設計供人們居住與工作的建築物。'],
    ['Before construction begins, he draws detailed plans and creates models.','在施工開始之前，他會繪製詳細的藍圖並製作模型。'],
    ['He also meets with engineers and clients to discuss ideas and solve problems.','他也會與工程師和客戶會面，討論想法並解決問題。'],
    ['His goal is to make every building safe, useful, and attractive for the people who use it every day.','他的目標是讓每棟建築物對每天使用它的人而言既安全、實用又美觀。'],
    ['Q: Which picture shows Ryan’s work?','問題：哪張圖片顯示了瑞恩的工作？']
  ],
  [
    ['[圖片情境對照] (A) A person is drawing floor plans with a pencil and compasses next to an architectural model. (B) A real estate agent in a suit is showing a house to a couple. (C) A construction worker wearing a hard hat is tying steel bars at a building site. (D) A security guard is monitoring multiple surveillance screens.','【圖片情境】（A）一人拿鉛筆與圓規繪製平面圖，旁邊放著建築模型。（B）穿西裝的房仲正帶一對情侶看房。（C）戴安全帽的建築工人在工地綁鋼筋。（D）一名保全人員正在監看多台監視器螢幕。（註：原卷解答標示為 B，但依聽力文意 draws detailed plans and creates models，圖 A 為繪製建築平面圖與模型，圖 B 為與客戶會面介紹房屋，解析中特別雙向說明。）']
  ]
]);

html += card('L1', ['考點：聽力看圖辨義（職業與工作內容）', '詞性需求：名詞／情境對應'], 'B (依原卷解答標示；若依畫圖與模型細節亦對應 A)',
  stem('101') +
  clue('聽力原文明確提到 <b>Ryan is an architect</b>（瑞恩是建築師），工作內容包含「繪製詳細平面圖與製作模型（draws detailed plans and creates models）」以及「與工程師和客戶會面（meets with engineers and clients）」。原卷標準解答給 <b>(B)</b>（對應與客戶會面看屋的情境）；若從「繪製平面圖與建築模型」的視覺細節切入，圖 <b>(A)</b> 桌上有圓規、建築平面設計圖與房屋模型亦高度吻合，教學時可提醒學生留意兩圖的對應點。') +
  ops([
    ['Picture (A): Drawing architectural plans and building models','繪製建築平面圖與房屋模型','對應原文「he draws detailed plans and creates models（他繪製詳細的設計圖並製作模型）」，畫面中有建築模型、圓規與平面圖。（註：原卷標準答案標為 B，但 A 畫面細節完全符合建築師在施工前畫圖做模型的描述）。'],
    ['Picture (B): Meeting with clients in front of a building','在建築物前與客戶會面討論','<b>原卷標準答案。</b>對應原文「He also meets with... clients to discuss ideas（他也會與客戶會面討論想法）」以及「make every building safe, useful, and attractive for the people who use it」。'],
    ['Picture (C): A construction worker tying steel bars','建築工人在工地綁鋼筋','原文提到「Before construction begins（在施工開始之前）」他是設計者（architect），而非在工地現場綁鋼筋的建築工人（construction worker）。<b>何時才對：</b>The <b>construction worker</b> wore a helmet and tied steel bars on the site.'],
    ['Picture (D): A security guard watching monitors','保全人員監看螢幕','畫面為監控攝影機畫面的保全人員（security guard），與建築設計無關。<b>何時才對：</b>The <b>security guard</b> kept his eyes on the surveillance screens all night.']
  ], 'B')
);

html += card('L12', ['考點：細節事實核對（TRUE statement）', '詞性需求：完整子句'], 'B',

html += card('R1', ['考點：固定搭配 suffer the consequences（承受後果）', '詞性需求：複數名詞（作受詞）'], 'D',

  clue('前半句為「因」：<b>Humans have been damaging the environment</b>（人類一直在破壞環境）；後半句為「果」：<b>global warming is one of them</b>（全球暖化是其中之一）。且動詞 <b>suffer</b> 常與名詞 <b>consequences</b> 構成固定搭配 <b>suffer the consequences</b>（承受惡果／自食其果），故選 <b>(D)</b>。') +
  ops([
    ['pioneers','n. 先驅；開拓者','語意不合：全球暖化不是「先驅」，且「承受先驅」語意不通。<b>何時才對：</b>The Wright brothers were <b>pioneers</b> in the field of aviation.（萊特兄弟是航空領域的先驅。）'],

    ['consequences','n. 後果；結果（常指不良後果）','搭配片語 <b>suffer the consequences</b>（承擔後果），且代名詞 them 指代複數名詞 consequences（全球暖化正是破壞環境的後果之一）。']

);

html += card('R2', ['考點：不及物動詞 soar（暴增；高飛）與前後因果', '詞性需求：過去式不及物動詞'], 'B',
  stem('202') +

    ['granted','v. 准予；授予','用法與語意不合：grant 為及物動詞（grant sb sth），不能單獨作 The company’s sales granted。<b>何時才對：</b>The bank <b>granted</b> him a loan to start his own restaurant.（銀行核准了他創業開餐廳的貸款。）'],
    ['constructed','v. 建造；興建','主詞為 sales（銷售額），銷售額無法「建造」。<b>何時才對：</b>The city government <b>constructed</b> a new bridge across the river.（市政府在河上興建了一座新橋。）']

html += card('R3', ['考點：名詞搭配 give sb the illusion of...（給某人……的錯覺）', '詞性需求：單數名詞'], 'B',

html += card('2', ['考點：從屬連接詞辨析（While 表「雖然／儘管」讓步對比）', '詞性需求：從屬連接詞'], 'While',

html += card('37', ['考點：與過去事實相反之假設語氣（Had it not been for...）', '詞性需求：情態助動詞 + have + p.p.'], 'would never have been',
  stem('37') +
  clue('句首為典型的「與過去事實相反」假設語氣倒裝片語：<b>Had it not been for this technology</b>（＝ <i>If it had not been for this technology</i>，要不是當時有這項科技）。既然條件子句是與「過去事實相反（Had + S + p.p.）」，主要子句必定搭配「<b>would / could / might + (never/not) + have + p.p.</b>」，故選 <b>would never have been</b>。') +
  ops([
    ['will have been','未來完成式（時態與語氣皆錯）','will have been 用於預測未來某時點將完成的動作，不能搭配過去假設語氣 Had it not been for...。<b>何時才對：</b>By next month, my father <b>will have been</b> working at this company for thirty years.（到下個月為止，我父親在這家公司工作就滿三十年了。）'],
    ['would be','與現在事實相反（時間不一致）','would be 用於與「現在」事實相反的結果（搭配 Were it not for...），但後句有過去式动词 soared（buildings that soared far higher），講的是 1930 年代過去的歷史事實，故必須用過去完成假設。<b>何時才對：</b>Were it not for the air conditioner, the classroom <b>would be</b> unbearably hot right now.（要不是有冷氣，現在教室裡一定熱得讓人受不了。）'],
    ['would never have been','與過去事實相反之結果子句（would never have + p.p.）','完美呼應句首的過去相反倒裝子句 <b>Had it not been for this technology</b>。']
  ], 'C')
);

html += card('38', ['考點：單字拼寫（soared 高聳；聳立）', '詞性需求：過去式不及物動詞'], 'soared',

  clue('題幹給出中文提示「<b>高聳</b>」，位於修飾 buildings 的關係子句中（buildings that ____ far higher than ever before）。描述 1930 年代過去建造的大樓「高聳入雲」，時態與前文一致用過去式 <b>soared</b>。') +

    ['sore / sour','adj. 痠痛的 / adj. 酸的（發音或拼字易混淆）','soar（s-o-a-r）才是動詞「高飛、高聳、暴增」；sore 是「疼痛的（如 a sore throat）」。<b>何時才對：</b>My legs were <b>sore</b> after climbing thirty flights of stairs.（爬了三十層樓梯後，我的雙腿非常痠痛。）']

html += card('39', ['考點：單字拼寫与後位修飾（enormous enough to V）', '詞性需求：形容詞'], 'enormous',

    ['enormously','adv. 非常；極大地（詞性誤判）','此處是修飾前方名詞 an elevator（即 an elevator [which is] enormous enough to...），故須用形容詞而非副詞。<b>何時才對：</b>High-speed elevators have proved <b>enormously</b> useful in modern supertall towers.（高速電梯在現代超高摩天大樓中已被證明極為實用。）']

html += card('40', ['考點：單字拼寫（utilize 使用；運用）', '詞性需求：複數現在式及物動詞'], 'utilize',

  ops([

);

html += card('41', ['考點：文意選填與片語 drag on（拖延；顯得漫長難熬）', '詞性需求：原形動詞片語'], 'drag on',

html += card('43', ['考點：文意選填與被動動名詞（being crowded into a small box）', '詞性需求：過去分詞片語（crowded into）'], 'crowded into',

  clue('空格位於被動動名詞 <b>of being ____ a small box</b>（被擠進一個小盒子裡的不適感）中。be 動詞 <b>being</b> 後接過去分詞表被動，且後方有空間名詞 <b>a small box</b>，故選填帶有方向介系詞的 <b>crowded into</b>。') +

html += card('44', ['考點：文意選填（accessibility rules 無障礙法規）', '詞性需求：不可數名詞（作修飾語）'], 'accessibility',
  stem('44') +
  clue('空格位於名詞 <b>rules</b> 之前作修飾語，後文解釋原因為：<b>require doors to remain open long enough for everyone to enter safely</b>（要求電梯門必須維持開啟夠久，以利所有人［如行動不便者或推輪椅者］安全進入）。保障所有人皆能無礙通行與使用的規定即為「無障礙法規（<b>accessibility</b> rules）」，故選填 <b>accessibility</b>。') +

html += card('45', ['考點：單字拼寫與雙受詞動詞（grants passengers a sense of control）', '詞性需求：第三人稱單數現在式動詞'], 'grants',

  clue('題幹給出中文提示「<b>給予</b>」，主詞為單數代名詞 <b>it</b>（指關門按鈕），後方帶雙受詞 <b>passengers</b>（間接受詞）與 <b>a sense of control</b>（直接受詞：一種掌控感）。表一般事實且主詞為第三人稱單數 it，故動詞 grant 必須加 -s 寫成 <b>grants</b>。') +
  ops([
    ['grants','v. 給予；賦予；准予（第三人稱單數）','主詞為單數 it，現在簡單式字尾須加 -s（it grants sb sth 給予某人某事物）。'],
    ['grant','v. 原形給予（漏字尾 -s，主詞動詞不一致）','主詞為單數代名詞 it，不可用原形動詞。<b>何時才對：</b>In stories, genies usually <b>grant</b> people three wishes.（在故事裡，精靈通常會滿足人們三個願望。）']
  ], 'A')
);

html += card('46', ['考點：文意選填與過去分詞構句（Combined with... 結合……）', '詞性需求：過去分詞片語（句首大寫）'], 'Combined with',
  stem('46') +
  clue('空格位於句首，後接名詞片語 <b>strong steel cables and automatic safety brakes,</b> 逗號後為主要子句主詞 <b>these small details</b>。小細節「與堅固鋼纜及自動安全煞車結合在一起（be combined with...）」，省略從屬連接詞與被動助動詞後，以過去分詞片語 <b>Combined with</b> 置於句首（注意句首 C 須大寫）。') +
  opsBankU13('Combined with')
);

html += passage('洞洞卷 U14：Writing About a Personal Preference: My Favorite Night Market Snack（第 47–50 題）', [
  [
    ['Taiwan’s night markets are [[47|beloved]]深受喜愛的 for street food.','台灣的夜市以街頭小吃而深受喜愛。'],

html += card('47', ['考點：單字拼寫（beloved 深受喜愛的）', '詞性需求：形容詞'], 'beloved',

  clue('題幹給出中文提示「<b>深受喜愛的</b>」，位於 <b>are ____ for street food</b>（因街頭小吃而深受喜愛）中，故填入形容詞 <b>beloved</b>。') +
  ops([
    ['beloved','adj. 深受喜愛的；摯愛的','be beloved for + N 表「因……而廣受喜愛」。'],
    ['belove','無此獨立形容詞用法（漏字尾 d）','必須完整拼出過去分詞形態的形容詞 <b>beloved</b>（發音常讀作三音節 /bɪˈlʌvɪd/ 或雙音節 /bɪˈlʌvd/）。<b>何時才對：</b>Bubble tea is a <b>beloved</b> Taiwanese drink around the globe.（珍珠奶茶是全球深受喜愛的台灣飲品。）']

html += card('48', ['考點：非限定關係子句（數量詞 + of + 關係代名詞 whom / which）', '詞性需求：受格關係代名詞（指人）'], 'whom',
  stem('48') +
  clue('觀察標點符號與句型結構：前半句為完整主要子句（...popular among <b>international tourists,</b>），逗號後為 <b>many of ____ see them as places...</b>（有動詞 see，卻無連接詞 and）。因為逗號不能直接連接兩個獨立子句，當沒有連接詞 <b>and</b> 時，必須使用「<b>關係代名詞</b>」來兼具連接子句的功能；且先行詞為逗號前的「人（<b>international tourists</b> 國際觀光客）」，置於介系詞 <b>of</b> 之後作受格，故必須選指人的受格關係代名詞 <b>whom</b>。') +
  ops([
    ['whom','pron. 受格關係代名詞（先行詞為人：international tourists）','逗號後無連接詞 and，需用關係代名詞引導非限定形容詞子句，先行詞為 tourists（人），接在介系詞 of 後用 whom（many of whom = and many of them）。'],
    ['which','pron. 關係代名詞（先行詞為事物，對象錯誤）','雖然 which 也是關係代名詞，但本句的意思是「其中許多『觀光客』將夜市（them）視為必訪之地」，先行詞是人（international tourists）而非事物，故不可用 which。<b>何時才對：</b>Taiwan has hundreds of night markets, many of <b>which</b> stay open until midnight.（台灣有數百個夜市，其中許多都營業到午夜。）'],
    ['them','pron. 人稱代名詞受格（缺少連接詞，造成逗號連接錯誤 Comma Splice）','因為逗號前沒有對等連接詞 <b>and</b>，若直接填 many of them see... 會變成兩個獨立子句只用逗號隔開的文法錯誤。<b>何時才對：</b>Night markets attract many international tourists, <b>and</b> many of <b>them</b> love stinky tofu.（若有連接詞 and，才能用 them。）'],
    ['those','pron. 指示代名詞（缺少連接詞，文法錯誤）','與 them 相同，指示代名詞 those 無法連接兩個子句。<b>何時才對：</b><b>Those</b> who enjoy street food will definitely fall in love with Tainan.（喜歡街頭美食的人一定會愛上台南。）']
  ], 'A')
);

html += card('49', ['考點：單字拼寫（delightful 令人愉悅的；討人喜歡的）', '詞性需求：形容詞'], 'delightful',

    ['delighted','adj. 感到高興的；欣喜的（主詞須為人）','delighted 用來形容「人感到高興的（如 I am delighted to meet you）」，不能用來修飾食物 treats。<b>何時才對：</b>The foreign tourists were <b>delighted</b> to try sweet potato balls for the first time.（外國觀光客第一次品嚐地瓜球感到非常開心。）']
