let appHtml = '';
let qNum = 1;

// 針對 | 單字 | 句子 | 格式進行切分
const lines = rawData.split('\n').map(l => l.trim()).filter(l => l.length > 0 && l.startsWith('|'));

for (let i = 0; i < lines.length; i++) {
  let line = lines[i];
  let parts = line.split('|').map(p => p.trim()).filter(p => p.length > 0);
  
  if (parts.length >= 2) {
    let currentWord = parts[0].replace('10w4', ''); // 清除可能殘留的週次標記
    let sentenceData = parts[1];
    
    // 使用正則表達式尋找第一個中文字元的索引，以便準確分割中英文句子
    let zhStartIndex = sentenceData.search(/[\u4e00-\u9fa5]/);
    let en = sentenceData;
    let zh = '';
    
    if (zhStartIndex !== -1) {
        en = sentenceData.substring(0, zhStartIndex).trim();
        zh = sentenceData.substring(zhStartIndex).trim();
    }
    
    // 自動將帶有底線的字彙 (如 p____y) 轉換成黃底挖空填空標籤
    en = en.replace(/[a-zA-Z0-9]*_+[a-zA-Z0-9]*/g, '[[|' + currentWord + ']]');
    
    let body = '<div class="para"><div class="s"><div class="en">' + fx(en) + '</div><div class="zh">' + zh + '</div></div></div>';
    let clueHtml = clue('本題測驗單字「<b>' + currentWord + '</b>」。請根據句意「' + zh + '」推敲，填入正確的字彙。');
    
    appHtml += card(qNum++, ['文意字彙', '詞性需求：單字'], currentWord, body + clueHtml);
  }
}
