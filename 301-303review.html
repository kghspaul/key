<div class="top">
  <h1>301-303作業複習卷詳解</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>

<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCD';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab.length<=4?'('+L[i]+') ':lab.length<=6?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

/* === 第一大題：文法選擇（課本句型） === */
let h1 = '<section id="p1"><h2>一、文法選擇（課本句型）</h2>';
const s1Data = [
  {n:1, tags:["考點：It appears that 句型","詞性需求：動詞"], ans:"A",

   clue:"句首虛主詞 It 配後方 that 子句，表達「似乎、看來……」，固定句型為 It appears / seems that + S + V。",
   ops:[
     ["appears","似乎、看來","符合 It appears that 子句句型。何時才對：It appears that he is honest."],
     ["finds","發現、覺得","通常接名詞受詞或虛受詞句型 S + find + it + adj. + to VR，不接 It finds that 子句。何時才對：He finds it hard to speak English."],
     ["likes","喜歡","及物動詞，主詞為人，不可接 It likes that。何時才對：He likes to play baseball."],
     ["looks","看起來","接子句時需搭配 as if 或 like (It looks as if/like...)，不單獨搭配 that 子句。何時才對：It looks like rain."]
   ]},
  {n:2, tags:["考點：虛受詞 it 句型","詞性需求：虛受詞代名詞"], ans:"D",

     ["this","指示代名詞（這）","不可充當引導不定詞的虛受詞。何時才對：This is my favorite book."],
     ["that","指示代名詞（那）","不可充當引導不定詞的虛受詞。何時才對：That sounds great."],
     ["which","關係代名詞","引導關係子句，非虛受詞。何時才對：He told a joke, which made us laugh."],

   clue:"主詞 + feel/find/consider + it (虛受詞) + N (受詞補語) + to VR (真受詞)。feel 可用於此虛受詞結構。",

     ["describes","描述","受詞通常為人事物，接補語時習慣用 describe A as B。何時才對：She described the scene as chaotic."],
     ["feels","覺得、認為","可接 it + 名詞/形容詞 + to VR 結構。何時才對：She feels it a duty to help."],

  {n:6, tags:["考點：not...until 句型","詞性需求：副詞/連接詞組合"], ans:"A",
   en:"The girl was grounded. She [[6|couldn't leave; until]] she got her dad's permission.",
   zh:"女孩被禁足了。直到獲得爸爸的允許，她才能出門。",
   clue:"not... until... 表「直到……才……」，搭配過去式 couldn't leave + until。",
   ops:[
     ["couldn't leave; until","直到……才能離開","語意與文法完全正確，表示直到獲准才能離開。何時才對：I didn't leave until he arrived."],
     ["could leave; until","能離開；直到","語意顛倒，變成一直可以離開直到得到許可為止。何時才對：You may stay until noon."],
     ["had left; without","已經離開；沒有","語意不通，且時態前後不符。何時才對：She left without saying goodbye."],

  {n:7, tags:["考點：not...until 時態配合","詞性需求：主要子句未來式＋副詞子句完成式"], ans:"D",

  {n:8, tags:["考點：代名詞 those 代替複數名詞","詞性需求：指示代名詞"], ans:"C",

let h5 = '<section id="p5"><h2>五、文意選填</h2>';

// 文意選填 1 詞庫
const WB1 = {
  A: ["punished", "處罰、懲罰", "動詞過去式／過去分詞", "She punished her son for lying."],
  B: ["at a time", "在……的時候", "時間副詞片語", "He arrived at a time when we were busy."],
  C: ["as a result", "因此、結果", "副詞轉折片語", "He didn't study; as a result, he failed."],
  D: ["tortured", "折磨、虐待", "過去分詞／被動動詞", "The prisoner was tortured by his captors."],
  E: ["humankind", "人類", "名詞（單數／集合）", "Climate change threatens all humankind."],
  F: ["slaughter", "屠殺、殺戮", "動詞原形", "The wolves slaughter the sheep at night."],
  G: ["enabled", "使……能夠", "動詞過去式（及物）", "The grant enabled her to study abroad."],
  H: ["about", "關於、對於", "介系詞", "He was very angry about the bad news."],
  I: ["underneath", "在……之下", "介系詞", "The cat hid underneath the bed."],
  J: ["on", "在……之上", "介系詞", "There is no place like this on earth."]
};
function w3_1(n, tags, ans, slot, clueT){
  const li = Object.keys(WB1).map(k=>{
    const w = WB1[k];
    let txt = k===ans ? '✔ 本格唯一符合「'+slot+'」且前後文語意完美契合者。' : w[1]+'（'+w[2]+'）：本格文法/語意需要「'+slot+'」，此選項詞性不合或語意矛盾。何時才對例句：'+w[3];
    return '<li class="'+(k===ans?'ok':'no')+'"><b>('+k+') '+w[0]+'</b> <small>'+w[1]+'</small> <i>'+(k===ans?'✔ 正解':'✘ 誤答')+'</i><br>'+txt+'</li>';
  }).join('');
  return card(n, tags, '('+ans+') '+WB1[ans][0], stem(n)+clue(clueT)+'<ul class="op">'+li+'</ul>');
}
