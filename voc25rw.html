<style>

body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}

h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}

ul.op{list-style:none;margin:6px 0 0;padding:0}

li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}

<body>
<div class="top">
  <h1>空中美語 英文字彙字識+ Levels 3&4 複習卷 (第二十五回) Chapter 9-1</h1>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 第一大題：I. Multiple Choice (40%) ===
const sec1 = [
  [
    "I-1",
    ["考點：日常生活動詞搭配（如廁沖水）", "詞性需求：原形及物動詞（不定詞 to 後）"],
    "(C) flush",
    ["Don't forget to [[1|flush]] the toilet after you are done using it.", "上完廁所後，別忘了沖馬桶。"],
    "受詞為 <b>the toilet</b>（馬桶），時間副詞子句為 <b>after you are done using it</b>（在你使用完之後）。日常生活的固定搭配中，「沖馬桶」即為 <b>flush the toilet</b>。",
    [
      ["gaze", "v. [I] 凝視、注視", "語意與文法皆不合。gaze 為不及物動詞，後接受詞需加介系詞 at/into/upon，且使用完馬桶後提醒「別忘了凝視馬桶」違反常理。<br><b>何時才對：</b>後接介系詞 <b>at</b> 描述專注凝視某物時，例如：<i>She sat by the window and gazed at the stars.</i>（她坐在窗邊凝視著繁星。）"],
      ["glimpse", "v. [T] 瞥見、看一眼", "語意不合。glimpse 指短暫或無意間「瞥見」，不與 the toilet 搭配作為上完廁所的必要動作。<br><b>何時才對：</b>描述匆匆一瞥某人或某景物時，例如：<i>I glimpsed her face in the crowd before she disappeared.</i>（在她消失之前，我在人群中瞥見了她的臉龐。）"],
      ["flush", "v. [T/I] 沖（馬桶）；沖洗；臉紅", "語意與搭配完全正確。<b>flush the toilet</b> 是「沖馬桶」最道地的固定說法。"],
      ["frown", "v. [I] 皺眉", "文法與語意皆錯。frown 為不及物動詞（常搭配 at/on），不能直接加受詞 the toilet，也不會對馬桶皺眉。<br><b>何時才對：</b>描述因不滿、困惑或憂慮而皺起眉頭時，例如：<i>The teacher frowned at the noisy students.</i>（老師對著吵鬧的學生皺起眉頭。）"]
    ]
  ],
  [
    "I-2",
    ["考點：人體部位詞彙＋行走情境", "詞性需求：單數可數名詞（所有格 her 後）"],
    "(B) heel",
    ["Jim didn't notice the woman in front of him and stepped on her [[2|heel]].", "吉姆沒注意到走在他前面的女子，結果踩到了她的腳後跟。"],
    "前半句指出「Jim 沒注意到走在他正前方的女子（didn't notice the woman in front of him）」，後半句動作是 <b>stepped on her ___</b>（踩到了她的……）。走在別人後面太近而不小心踩到的身體部位，自然是對方的「腳後跟（heel）」。",
    [
      ["breeze", "n. [C] 微風", "語意不合。微風是無形的空氣流動，不是女子的身體部位，也無法「被踩到（stepped on）」。<br><b>何時才對：</b>描述涼爽宜人的輕風時，例如：<i>A cool breeze blew gently from the ocean.</i>（一陣涼爽的微風從海面上輕拂而來。）"],
      ["heel", "n. [C] 腳後跟、踵；鞋跟", "語意完全正確。跟在別人後方行走沒注意距離時，最容易踩到對方的 <b>heel</b>（腳後跟／鞋跟）。"],
      ["bull", "n. [C] 公牛", "語意不合。一般行人走在路上不會隨身帶著一頭公牛讓人踩到。<br><b>何時才對：</b>描述農場公牛或鬥牛情境時，例如：<i>The angry bull charged across the field.</i>（那頭憤怒的公牛衝過田野。）"],
      ["kidney", "n. [C] 腎臟", "語意矛盾。腎臟是位於人體腹腔深處的內部器官，走路時不可能直接踩到別人的腎臟。<br><b>何時才對：</b>討論內臟器官或醫療移植時，例如：<i>Drinking plenty of water helps keep your kidneys healthy.</i>（多喝水有助於保持腎臟健康。）"]
    ]
  ],
  [
    "I-3",
    ["考點：常見時間慣用語（in the blink of an eye）", "詞性需求：單數名詞（the ___ of an eye）"],
    "(D) blink",
    ["In the [[3|blink]] of an eye, the cat had run around the corner and out of sight.", "一眨眼之間，那隻貓已經跑過轉角、消失得無影無蹤了。"],
    "句首介系詞片語為 <b>In the ___ of an eye</b>（在眼睛的一……之間），後方主要子句描述貓極快地跑過轉角並消失在視線外（out of sight）。眼睛能做出的極短暫動作即為「眨眼（blink）」，構成高頻慣用語 <b>in the blink of an eye</b>（轉眼間、一眨眼工夫）。",
    [
      ["chin", "n. [C] 下巴", "語意與搭配錯誤。下巴不是眼睛的動作，沒有 in the chin of an eye 的說法。<br><b>何時才對：</b>描述臉部最下方的部位時，例如：<i>He rested his chin in his hands while thinking.</i>（他思考時用雙手托著下巴。）"],
      ["chest", "n. [C] 胸膛、胸部", "語意與搭配錯誤。胸膛與 of an eye 無法搭配。<br><b>何時才對：</b>描述人體軀幹上半部或箱子時，例如：<i>He crossed his arms over his chest.</i>（他雙臂交叉抱在胸前。）"],
      ["breast", "n. [C] 乳房、胸部", "語意與搭配錯誤。無法與 of an eye 構成描述時間短暫的片語。<br><b>何時才對：</b>描述人體胸部或禽鳥胸肉時，例如：<i>She cooked grilled chicken breast for dinner.</i>（她晚餐做了烤雞胸肉。）"],
      ["blink", "n. [C] 眨眼", "語意與慣用搭配完全正確。<b>in the blink of an eye</b> 為固定片語，意為「一眨眼之間、瞬間」，形容事情發生得極為迅速。"]
    ]
  ],
  [
    "I-4",
    ["考點：臉部表情詞彙＋拍照情境對比", "詞性需求：單數可數名詞（指示形容詞 that 後）"],
    "(C) frown",
    ["Wipe that [[4|frown]] off your face and smile for the camera.", "收起你臉上的愁容（別皺眉頭了），對著鏡頭笑一個。"],
    "句中動詞片語 <b>Wipe that ___ off your face</b> 字面為「把那個……從你臉上擦掉」（口語指「收起臉上的某種表情」），且後半句要求 <b>and smile for the camera</b>（對著鏡頭微笑）。與 <b>smile</b>（微笑）形成相反對比、可以從臉上「收起來」的不悅表情，就是 <b>frown</b>（皺眉、愁容）。",
    [
      ["flesh", "n. [U] （人或動物的）肉、果肉", "語意駭人且文法不合。拍照時不可能叫別人「把臉上的肉擦掉」，且 flesh 為不可數名詞。<br><b>何時才對：</b>描述動物肌肉組織或水果果肉時，例如：<i>Watermelons have sweet red flesh inside.</i>（西瓜裡面有甜美的紅色果肉。）"],
      ["fist", "n. [C] 拳頭", "語意不合。拳頭是手部動作，不長在臉上，無法搭配 off your face。<br><b>何時才對：</b>描述握拳或揮拳動作時，例如：<i>He banged his fist on the table in anger.</i>（他生氣地用拳頭猛捶桌子。）"],
      ["frown", "n. [C] 皺眉、愁容", "語意與搭配完全正確。口語常說 <b>Wipe that frown/smile off your face!</b>（收起你臉上的臭臉／笑容！），此處收起皺眉（frown）才能換上微笑（smile）拍照。"],
      ["chin", "n. [C] 下巴", "語意不合。下巴是固定的五官骨骼部位，無法從臉上「抹去（wipe off）」。<br><b>何時才對：</b>描述刮鬍子、抬下巴或撞到下巴時，例如：<i>Keep your chin up—things will get better soon!</i>（別氣餒［抬起下巴］——事情很快就會好轉的！）"]
    ]
  ],
  [
    "I-5",
    ["考點：固定動詞片語（catch a glimpse of）", "詞性需求：單數名詞（catch a ___ of）"],
    "(B) glimpse",
    ["The fans have waited for hours to catch a [[5|glimpse]] of the movie star.", "粉絲們已經苦等了好幾個小時，就為了瞥見那位電影明星一眼。"],
    "主詞 <b>The fans</b>（粉絲們）等了數小時，目的不定詞為 <b>to catch a ___ of the movie star</b>。英文核心片語 <b>catch a glimpse of + 人/物</b> 意為「瞥見……一眼、一睹……的風采」，完全符合粉絲守候多時只想親眼看到巨星一面的語境。",
    [
      ["blink", "n. [C] 眨眼", "搭配錯誤。blink 不與 catch a ___ of 搭配表示「看某人一眼」。<br><b>何時才對：</b>用於片語 <b>in the blink of an eye</b>（一眨眼之間，見第 I-3 題）。"],
      ["glimpse", "n. [C] 一瞥、短暫的看見", "語意與搭配完全正確。<b>catch a glimpse of...</b> 為高中必考片語，指「短暫瞥見……、一睹……」。"],
      ["dose", "n. [C] （藥物的）一劑、一服", "語意不合。粉絲等明星不是為了「服用一劑電影明星」。<br><b>何時才對：</b>描述服藥劑量時，例如：<i>Take one dose of cough syrup every six hours.</i>（每六小時服用一劑止咳糖漿。）"],
      ["cough", "n. [C] 咳嗽", "語意與搭配錯誤。英文不說 catch a cough of someone（感冒是 catch a cold）。<br><b>何時才對：</b>描述咳嗽症狀時，例如：<i>She has had a bad cough for three days.</i>（她已經嚴重咳嗽三天了。）"]
    ]
  ],
  [
    "I-6",
    ["考點：人體呼吸器官詞彙＋因果關係", "詞性需求：單數可數名詞（his left ___，搭配 was）"],
    "(B) lung",
    ["Hank has breathing problems because his left [[6|lung]] was damaged in an accident.", "漢克有呼吸方面的問題，因為他的左肺在一場意外中受損了。"],
    "主要子句明確點出症狀：<b>Hank has breathing problems</b>（漢克有呼吸困難的問題），原因子句指出「他的左邊某器官在意外中受損（his left ___ was damaged）」。人體成對（分左右）且直接負責「呼吸（breathing）」的器官就是「肺臟（lung）」。",
    [
      ["heel", "n. [C] 腳後跟", "語意不合。左腳跟受傷會影響走路（walking problems），不會導致呼吸困難（breathing problems）。<br><b>何時才對：</b>描述走路踩到腳後跟或腳底疼痛時，例如：<i>My new shoes are rubbing against my left heel.</i>（我的新鞋一直磨到我的左腳後跟。）"],
      ["lung", "n. [C] 肺、肺臟", "語意完全正確。人類有左肺與右肺（left and right lungs），左肺受損（his left lung was damaged）會直接造成呼吸困難（breathing problems）。"],
      ["limb", "n. [C] 肢（手臂或腿）", "語意不合。四肢受傷會影響行動，不會直接造成呼吸問題，且一般會直接說 left arm 或 left leg。<br><b>何時才對：</b>描述四肢或大樹枝幹時，例如：<i>Stretching warms up your muscles and limbs before exercise.</i>（伸展運動能在運動前讓你的肌肉與四肢暖和起來。）"],
      ["kidney", "n. [C] 腎臟", "語意不合。腎臟負責過濾血液與排泄尿液，並非呼吸器官。<br><b>何時才對：</b>描述泌尿與代謝系統疾病時，例如：<i>He donated his left kidney to save his brother's life.</i>（他捐出了左腎來挽救弟弟的性命。）"]
    ]
  ],
  [
    "I-7",
    ["考點：動物掠食情境＋名詞字義辨析", "詞性需求：不可數名詞（所有格 its 後作 ate 的受詞）"],
    "(D) flesh",
    ["The tiger caught the deer, killed it, and ate its [[7|flesh]] while it was still warm.", "老虎抓住了那隻鹿，將牠咬死，並趁著還溫熱時吃掉牠的肉。"],
    "主詞 <b>The tiger</b>（老虎）為肉食性猛獸，連續動作為 <b>caught the deer, killed it, and ate its ___</b>（抓住鹿、殺死牠，並吃掉牠的……）。老虎獵殺鹿之後所啃食的部位自然是鹿身上的「肉（flesh）」。",
    [
