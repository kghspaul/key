<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALL+ 互動英語 2026/10 Week 3 (Units 8–11) 雙卷整合詳解</title>
<style>
:root{--bg:#faf8f4;--fg:#222;--card:#fff;--line:#e4ded3;--acc:#9a3b2e;--ok:#1f7a4d;--no:#b3261e;--mut:#6b6558;--hl:#fff1c9}
@media(prefers-color-scheme:dark){:root{--bg:#161512;--fg:#e8e4da;--card:#201f1b;--line:#3a372f;--acc:#e08a78;--ok:#6fcf9a;--no:#f08a82;--mut:#a39d8f;--hl:#4a3f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.top{max-width:900px;margin:auto;padding:28px 18px 10px}
.top h1{margin:0 0 4px;font-size:1.6rem;color:var(--acc)}
.top p{margin:2px 0;color:var(--mut);font-size:.92rem}
nav{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px 12px}
nav a,nav button{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);text-decoration:none;font:inherit;font-size:.88rem;cursor:pointer}
nav a:hover,nav button:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:0 16px 70px}
h2{margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--acc);font-size:1.3rem}
h3{margin:0 0 8px;font-size:1.05rem;color:var(--acc)}
.pas,.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:14px 0}
.para{margin-bottom:14px}
.s{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--line)}
.en{font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.zh{color:var(--mut);font-size:.93rem}
.note{color:var(--mut);font-size:.85rem;margin:6px 0 0}
.bl{background:var(--hl);border-bottom:2px solid var(--acc);padding:0 4px;border-radius:3px;font-weight:600}
.bl sup{color:var(--acc);margin-right:3px;font-size:.7em}
.bank{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;margin-bottom:8px}
details.q>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
details.q>summary::-webkit-details-marker{display:none}
.n{background:var(--acc);color:#fff;border-radius:6px;padding:0 10px;font-weight:700;font-size:1.05rem}
.tag{font-size:.78rem;border:1px solid var(--acc);color:var(--acc);border-radius:99px;padding:0 9px;line-height:1.6}
.tag.pos{border-color:var(--ok);color:var(--ok)}
.ans{margin-left:auto;font-weight:700;color:var(--ok)}
.qb{margin-top:10px}
.stem{margin-bottom:8px;padding:8px 10px;background:var(--bg);border-radius:6px}
.clue{margin:8px 0;padding:8px 12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:0 6px 6px 0}
.clue h4,.qb h4{margin:0 0 2px;font-size:.92rem;color:var(--acc)}
ul.op{list-style:none;margin:6px 0 0;padding:0}
ul.op li{padding:7px 10px;margin:5px 0;border-radius:6px;border:1px solid var(--line);font-size:.95rem}
ul.op li.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
ul.op li.no{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
ul.op i{font-style:normal;font-weight:700;font-size:.82rem}
li.ok i{color:var(--ok)}li.no i{color:var(--no)}
small{color:var(--mut)}
footer{max-width:900px;margin:auto;padding:0 16px 40px;color:var(--mut);font-size:.82rem}
</style>
</head>
<body>
<div class="top">
  <h1>ALL+ 互動英語 2026/10 Week 3 (Units 8–11) 雙卷整合詳解</h1>
  <p>🎧 <strong>聽力音檔連結：</strong><a href="https://drive.google.com/open?id=1sUJR-dud77-x_9bim_CfGk-rGbJkbITF&usp=drive_fs" target="_blank" rel="noopener" style="color:var(--acc);font-weight:700;text-decoration:underline">點此開啟 Google Drive 聽力測驗音檔</a></p>
  <p>每題含：考點標籤 → 題幹逐句中英對照 → 解題線索 → 正解與全部誤答分析（含「這個字何時才會是對的」）</p>
  <p>圖例：<span class="bl">黃底</span> ＝ 正確答案填入處 ｜ <span class="tag">考點</span> <span class="tag pos">詞性需求</span></p>
</div>
<nav id="nav"></nav>
<main id="app"></main>
<footer>限定用途教學教材。本詳解為教學輔助，題目版權屬原出版單位。</footer>

<script>
const L="ABCD";
const fx=s=>s.replace(/^\*([A-Z][^*]*)\*/,'<i>$1</i>').replace(/ \*([A-Z][^*]*)\*\./,' <i>$1</i>.').replace(/\[\[(\d*)\|([^\]]+)\]\]/g,(m,n,a)=>'<span class="bl">'+(n?'<sup>'+n+'</sup>':'')+a+'</span>');
const SENT={};
function passage(title,paras,note){
  paras.forEach(p=>p.forEach(s=>{let m,r=/\[\[(\d+)\|/g;while((m=r.exec(s[0])))SENT[m[1]]=s;}));
  return '<section class="pas"><h3>'+title+'</h3>'+paras.map(p=>'<div class="para">'+p.map(s=>'<div class="s"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>').join('')+'</div>').join('')+(note?'<p class="note">'+note+'</p>':'')+'</section>';
}
function stem(n){const s=SENT[n];return s?'<div class="stem"><div class="en">'+fx(s[0])+'</div><div class="zh">'+s[1]+'</div></div>':'';}
const clue=t=>'<div class="clue"><h4>解題線索</h4>'+t+'</div>';
function ops(list,ans,lab){lab=lab||'ABCDEF';return '<ul class="op">'+list.map((o,i)=>{const k=ans.indexOf(lab[i])>=0;return '<li class="'+(k?'ok':'no')+'"><b>'+(lab==='ABCDEF'&&list.length<=4?'('+L[i]+') ':lab==='ABCDEF'?'('+'ABCDEF'[i]+') ':'')+o[0]+'</b>'+(o[1]?' <small>'+o[1]+'</small>':'')+' <i>'+(k?'✔ 正解':'✘ 誤答')+'</i><br>'+o[2]+'</li>';}).join('')+'</ul>';}
function card(n,tags,ans,body){
  return '<details class="q" id="q'+n+'" open><summary><span class="n">'+n+'</span>'+tags.map(t=>'<span class="tag'+(t.indexOf('詞性')==0?' pos':'')+'">'+t+'</span>').join('')+'<span class="ans">答案：'+ans+'</span></summary><div class="qb">'+body+'</div></details>';
}

// === 各大題資料與渲染邏輯 ===
const st=(en,zh)=>'<div class="stem"><div class="en">'+fx(en)+'</div><div class="zh">'+zh+'</div></div>';

const SECS=[
  {id:'sec-l',t:'卷一：聽力測驗 (L1–L12)'},
  {id:'sec-rv',t:'卷一：閱讀詞彙 (R1–R5)'},
  {id:'sec-rc',t:'卷一：綜合測驗 (R6–R12)'},
  {id:'sec-rr',t:'卷一：閱讀測驗 (R13–R15)'},
  {id:'sec-rt',t:'卷一：中譯英 (R16–R17)'},
  {id:'sec-v1',t:'卷二：洞洞卷文意字彙 (V1–V10)'},
  {id:'sec-v2',t:'卷二：洞洞卷詞類變化 (V11–V15)'},
  {id:'sec-c1',t:'卷二：克漏字 (一) 巨石陣 (V16–V20)'},
  {id:'sec-c2',t:'卷二：克漏字 (二) 咖啡因與小睡 (V21–V25)'},
  {id:'sec-wf',t:'卷二：文意選填 變色龍 (V26–V35)'},
  {id:'sec-tr',t:'卷二：洞洞卷中譯英 (V36–V39)'}
];

document.getElementById('nav').innerHTML=SECS.map(s=>'<a href="#'+s.id+'">'+s.t+'</a>').join('');

let H='';

// ==================== 卷一：聽力測驗 ====================
H+='<h2 id="sec-l">第一部分：聽力測驗 (Listening Comprehension)</h2>';

H+=passage('一、看圖辨義（第 L1–L2 題共用情境圖）',[
  [['[Image Description] A male staff member wearing an ID badge bursts through the classroom door shouting, "There’s a fire!" while the female teacher at the podium stops teaching in shock and the students turn around to look at him.','【圖片情境】一名配戴識別證的男性教職員衝進教室門口大喊：「失火了！」，講台上的女老師驚訝地停下授課，台下學生們也紛紛轉頭看向門口。']]
]);

H+=card('L1',['考點：圖片情境與核心動詞 disrupt 辨析','詞性需求：完整敘述句'],'D',
  st('What can we see in the picture? → [[L1|Someone has just disrupted the class.]]','我們在圖片中可以看到什麼？ → 某人剛剛打斷了課堂。')+
  clue('圖中原本正在上課的老師手拿課本停下動作，學生也轉頭看向衝進門大喊「There’s a fire!」的男子，顯示課堂進行被突發狀況「中斷、打亂（disrupted）」。')+
  ops([
    ['The teacher is giving instructions.','老師正在下達指示。','語意不符：講台上的老師一臉錯愕看著門口，說話的人是衝進來的男士而非老師。<br><b>何時才對：</b>Before the chemistry experiment began, the teacher was giving safety instructions to the class.'],
    ['People in the classroom are panicking.','教室裡的人們正在驚慌失措。','語意誇大：圖中學生僅轉頭觀看、老師面露驚訝，並未出現四處逃竄或尖叫的恐慌（panicking）場面。<br><b>何時才對：</b>People in the theater started panicking when the lights suddenly went out.'],
    ['The students are ignoring the situation.','學生們正無視這個狀況。','語意矛盾：學生們已經轉過頭注視門口大喊的男子，並非視而不見（ignoring）。<br><b>何時才對：</b>Despite the loud noise outside, the students kept writing and ignored the situation.'],
    ['Someone has just disrupted the class.','某人剛剛打斷了課堂。','正確：動詞 <code>disrupt</code> 指「使中斷、擾亂」，精準描述男子突然衝入通報火警而打斷上課的情境。']
  ],'D')
);

H+=card('L2',['考點：看圖推論與緊急事件字彙','詞性需求：完整敘述句'],'A',
  st('What do we know from the picture? → [[L2|An emergency is happening.]]','我們從圖片中可以得知什麼？ → 一場緊急狀況正在發生。')+
  clue('對話框明確寫出驚嘆句 <code>"There’s a fire!"</code>（失火了！），且通報者神情焦急，直接對應名詞 <code>emergency</code>（緊急情況）。')+
  ops([
    ['An emergency is happening.','一場緊急狀況正在發生。','正確：火災（fire）屬於典型的緊急危難事件（emergency）。'],
    ['A false alarm is being announced.','正在宣布這是一場烏龍警報。','語意相反：男子大喊「失火了！」，並非宣布誤報（false alarm）。<br><b>何時才對：</b>Everyone returned to the building after the fire department confirmed it was a false alarm.'],
    ['A natural disaster is occurring.','一場自然災害正在發生。','語意不符：教室失火屬於意外事故，並非地震、颱風等天災（natural disaster）。<br><b>何時才對：</b>When a natural disaster like an earthquake occurs, you should protect your head immediately.'],
    ['A safety drill is in progress.','一場安全演習正在進行中。','語意不符：從男子驚慌闖入與老師錯愕的表情可知這是突發真火警，而非預先安排的演習（drill）。<br><b>何時才對：</b>All students walked calmly to the playground while the annual safety drill was in progress.']
  ],'A')
);

H+=passage('一、看圖辨義（第 L3 題情境圖）',[
  [['[Image Description] A woman wearing black protective gloves is gesturing toward a dragon-patterned vase on a mat and saying, "It’s over 500 years old," while a man beside her strokes his chin thoughtfully.','【圖片情境】一名戴著黑色防護手套的女子雙手朝向墊子上的龍紋花瓶展示並說：「它已經超過五百年歷史了」，身旁的男子則托著下巴仔細端詳。']]
]);

H+=card('L3',['考點：圖片細節與同義字轉換 (over 500 years old = antique)','詞性需求：完整敘述句'],'C',
  st('What do we know about the woman? → [[L3|She is showing a man an antique vase.]]','關於這位女子，我們知道什麼？ → 她正在向一名男子展示一個古董花瓶。')+
  clue('女子說話內容 <code>"It’s over 500 years old."</code>（它超過五百年歷史了）直接對應形容詞/名詞 <code>antique</code>（古董的；古董），且她雙手張開正在向身旁男子介紹展示（showing）。')+
  ops([
    ['She is purchasing a valuable vase.','她正在購買一個貴重花瓶。','語意不符：女子戴著專業手套向男子解說花瓶歷史，身分應為展示人員或鑑定師，且圖中無金錢交易動作。<br><b>何時才對：</b>She is at the checkout counter purchasing a valuable vase with her credit card.'],
    ['She is holding a delicate vase carefully.','她正小心翼翼地捧著一個脆弱的花瓶。','細節不符：花瓶穩穩放在桌墊上，女子的雙手張開在花瓶兩側，並未實際「拿著/捧著（holding）」花瓶。<br><b>何時才對：</b>She is holding a delicate vase carefully with both hands so she won’t drop it.'],
    ['She is showing a man an antique vase.','她正在向一名男子展示一個古董花瓶。','正確：<code>over 500 years old</code> 等同於 <code>antique</code>，且動作正是向男子展示介紹。'],
    ['She is restoring a damaged vase.','她正在修復一個受損的花瓶。','語意不符：圖中花瓶完好無損，女子也沒有使用任何修復工具（restoring）。<br><b>何時才對：</b>The museum expert is carefully restoring a damaged vase with special glue.']
  ],'C')
);

H+=card('L4',['考點：聽力對答與動詞 plunge 語意理解','詞性需求：疑問回應句'],'D',
  st('Nicole plunged into the pool with her shirt on. → [[L4|Really? Why did she jump in?]]','妮可穿著襯衫就縱身跳進游泳池裡了。 → 真的嗎？她為什麼跳進去？')+
  clue('題幹關鍵片語動詞 <code>plunged into the pool</code> 意為「縱身跳進泳池」，對應 (D) 的同義動作 <code>jump in</code>，且因為她「穿著襯衫（with her shirt on）」跳水很反常，追問原因最合邏輯。')+
  ops([
    ['I know. She’s taking a few pictures.','我知道。她正在拍幾張照片。','語意矛盾：人已經跳進泳池水裡了，不可能還在岸邊拍照。<br><b>何時才對：</b>Nicole is standing by the pool with her camera. → I know. She’s taking a few pictures.'],
    ['That’s right. She’s relaxing by the pool.','沒錯。她正在泳池畔放鬆休息。','語意矛盾：<code>plunged into the pool</code> 是跳入水中，而非在池畔休息（by the pool）。<br><b>何時才對：</b>Nicole is lying on a deck chair right now. → That’s right. She’s relaxing by the pool.'],
    ['Yeah. She left her shirt by the pool.','對啊。她把襯衫留在泳池邊了。','細節相反：題幹明確說 <code>with her shirt on</code>（穿著襯衫），並未脫下留在池邊。<br><b>何時才對：</b>Nicole took off her top before swimming. → Yeah. She left her shirt by the pool.'],
    ['Really? Why did she jump in?','真的嗎？她為什麼跳進去？','正確：以 <code>jump in</code> 呼應 <code>plunged into the pool</code>，並對穿著衣服跳水的舉動表達驚訝與詢問。']
  ],'D')
);

H+=card('L5',['考點：聽力對答與 astonishing comeback 語意推論','詞性需求：感嘆回應句'],'A',
  st('The other team made an astonishing comeback at the end. → [[L5|I know! I can’t believe they won!]]','另一隊在最後關頭上演了驚人的逆轉勝。 → 我知道！我真不敢相信他們贏了！')+
  clue('名詞搭配 <code>made an astonishing comeback</code> 意為「達成驚人的逆轉／反敗為勝」，既然後來居上逆轉成功，代表最後贏得比賽（they won），且 <code>I can’t believe</code> 呼應 <code>astonishing</code>（令人驚訝的）。')+
  ops([
    ['I know! I can’t believe they won!','我知道！我真不敢相信他們贏了！','正確：上演驚人逆轉（astonishing comeback）即表示最終獲勝且令人難以置信。'],
    ['Really? What time is the game?','真的嗎？比賽是幾點？','時態不符：動詞 <code>made</code> 為過去式，代表比賽已經結束，不能再問比賽幾點開始。<br><b>何時才對：</b>The championship game is going to be held tonight. → Really? What time is the game?'],
    ['Yeah. They didn’t stand a chance.','對啊。他們一點勝算都沒有。','語意矛盾：既然成功逆轉（made a comeback），就不是毫無勝算地慘敗。<br><b>何時才對：</b>The visiting team lost by thirty points. → Yeah. They didn’t stand a chance.'],
    ['Yes. They were doing well at first.','是啊。他們一開始表現得很好。','語意矛盾：<code>comeback</code>（逆轉）的前提是一開始落後、表現不佳，最後才反超前。<br><b>何時才對：</b>Our team led the game in the first half. → Yes. They were doing well at first.']
  ],'A')
);

H+=card('L6',['考點：聽力對答與動詞 sustain 語意推論','詞性需求：因果回應句'],'B',
  st('Milly and Pam worked hard to sustain their friendship. → [[L6|Yes. That’s why they’re still friends.]]','米莉和潘努力維繫她們的友誼。 → 是啊。這就是為什麼她們現在依然是朋友。')+
  clue('及物動詞 <code>sustain</code> 意為「維持、維繫（使長久持續）」。努力維持友誼的結果，自然是「現在依然是朋友（still friends）」。')+
  ops([
    ['I know. They have lost all contact.','我知道。她們已經完全失去聯絡了。','語意相反：努力維繫友誼不會導致斷絕聯絡（lost all contact）。<br><b>何時才對：</b>Milly and Pam moved to different countries and stopped texting. → I know. They have lost all contact.'],
    ['Yes. That’s why they’re still friends.','是啊。這就是為什麼她們現在依然是朋友。','正確：<code>still friends</code> 直接呼應 <code>sustain their friendship</code> 的成果。'],
    ['Yeah. They barely recognize each other.','對啊。她們幾乎認不出彼此了。','語意矛盾：一直維繫友誼的兩人不可能認不出彼此。<br><b>何時才對：</b>They haven’t seen each other since elementary school. → Yeah. They barely recognize each other.'],
    ['Right. They are on bad terms now.','沒錯。她們現在關係很差。','語意相反：片語 <code>be on bad terms</code> 指「關係惡劣、交惡」，與維持友誼矛盾。<br><b>何時才對：</b>Milly and Pam had a huge fight over money yesterday. → Right. They are on bad terms now.']
  ],'B')
);

H+=passage('三、簡短對話（第 L7 題聽力稿）',[
  [
    ['W: Where are you going? The game is about to start.','女：你要去哪裡？比賽快要開始了。'],
    ['M: I’m thirsty. I’m going to grab us some sodas.','男：我口渴了。我要去幫我們買幾瓶汽水。'],
    ['W: From where? There aren’t any food stalls in this area.','女：去哪買？這一區沒有任何食物攤位啊。'],
    ['M: I heard someone say there’s a beverage cart just up ahead.','男：我聽別人說就在前面不遠處有一台飲料推車。'],
    ['W: Are you sure? What if it’s really far away?','女：你確定嗎？萬一真的很遠怎麼辦？'],
    ['M: It’s not. It’s only one section over from ours.','男：不會啦。它離我們只有一個座位區的距離而已。']

function wfOps(ansChar,correctReason,wrongReasons){
